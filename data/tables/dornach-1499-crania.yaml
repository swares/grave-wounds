id: dornach-1499-crania
order: 12.7
name: "Dornach 1499 - the ossuary crania (bone evidence)"
label: "Bone evidence: the ossuary crania"
battle: "Swabian War"
context: "Skulls and thigh bones of men killed when the Swiss Confederates fell on the imperial camp below Dorneck on 22 July 1499, most of them the imperial dead, left out for a time and gathered into the ossuary. Killed only; skulls (no jaws) and femora."
variant: evidence
native: armed
weapon_bias: sourced
weapons: [sword, halberd, poleaxe, pike, spear, spiked_club, crossbow, handgun, matchlock_musket]
modifiers: [weapon_side, attacker_higher, attacker_lower, target_down, target_fleeing, flanked, target_warding]
confidence: historical
confidence_note: >
  From 417 perimortem injuries on 102 of 106 crania (315 cut, 69 point, 28 blunt, 5 gunshot) and
  6 on 4 of 33 femora (Cooper 2010). Skull wounds are shared between the left and right of the
  skull by the author's sides for each kind (Table 28), midline ones evenly; the face's share is
  our tally from her catalogue. Swords and halberds (and the poleaxe) roll on the cuts, pikes and
  spears on the point wounds (thrust, stab and crossbow bolt counted together), the war hammer
  (spiked club) on the blunt ones, the handgun (and the matchlock) on the gunshot ones; others on all together.
armor_note: >
  Armour is already in these numbers, and so is what was kept: the ossuary held only skulls and
  thigh bones, so this table can show nothing of the neck, the body or the arms. Few skulls show
  helmets, and at least 25 show men struck again after they were down. It is not a picture of
  where men were hit in the fight. For play, use the gameplay table.
sources:
  - "Cooper C., Forensisch-anthropologische und traumatologische Untersuchungen an den menschlichen Skeletten aus der spätmittelalterlichen Schlacht von Dornach (1499 n. Chr.), Dr. phil. dissertation, Universität Mainz (2010), https://openscience.ub.uni-mainz.de/handle/20.500.12030/981 : Tables 23-32 and the lesion catalogue."
  - "Cooper C., 'Kriegsverletzungen an historischen Skeletten aus der Schweiz', in Piek and Terberger (eds) (2008): a pilot of 12 skulls, 57 lesions."
  - "Tally: data/sources/dornach-1499-crania.csv (the region of each lesion is our tally from the catalogue)."
status: >
  Historical, from about 106 men, mostly of the imperial army, killed in the battle and the rout
  and partly struck again where they lay; skulls without jaws, so the face is under-counted.
