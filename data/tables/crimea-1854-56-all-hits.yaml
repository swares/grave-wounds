armor_note: >
  Use this table for play. No armour was worn, so leave it off. The wounded it is built on
  were mostly hit in the siege works, so it already leans to the head and face; for an open
  field fight (the Alma, Inkerman) it overstates them a little.
sources:
  - "Derived (tools/blend_tables.py): 81.7% crimea-1855-56-siege + 18.3% acw-1861-killed, location by location."
  - "Killed share: 2,598 British rank and file killed in action in the whole war (Medical and Surgical History of the British Army ... in the Crimea, 1858, vol. 2, Concluding Observations) against 11,595 treated for wounds received in action (Returns Nos. 1 and 3: 4,434 and 7,161)."
status: >
  Estimated. No count of the killed by region survives for the Crimea, so the Civil War
  killed-in-action table (also soft lead bullets from rifle-muskets) stands in for the dead.
  Edit the share in tools/blend_tables.py if you prefer another.
