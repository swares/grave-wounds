confidence_note: "Towton's gameplay weights for the body (the Dornach ossuary kept only skulls and thigh bones), with the skull's left and right from the Dornach crania; the corrections are design estimates."
armor_note: >
  These weights are where blows LAND. Resolve armour separately with the target's kit: a
  pikeman in breastplate and sallet, a halberdier in a padded jack, a knight in full harness.
sources:
  - "Derived from dornach-1499-crania (Cooper 2010, Tables 23-32 and the catalogue) for the head, and from towton-1461-all-hits for the rest of the body."
status: >
  The Dornach evidence is 99% skull, from an ossuary that kept only skulls and femora, so it says
  nothing of the body. Corrections: (1) The body below the head is Towton's gameplay table, the
  nearest battle of the kind with whole skeletons. (2) The head keeps Towton's share (27%, lowered
  from the bone evidence for blows struck on men already down: at least 25 Dornach skulls show
  them too). (3) Within the skull, left and right as the Dornach crania (about 204 to 186 wounds,
  midline ones shared). (4) The face keeps Towton's 6, as the Dornach skulls have no jaws. The
  result is close to Towton's: both are head-heavy evidence corrected the same way.
