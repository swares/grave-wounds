- id: dornach-woodcut
  file: dornach-woodcut.jpg
  caption: "The battle of Dornach, from an anonymous woodcut of the period (right half). Three copies survive, in Nuremberg, Basel and Zürich; Josef Zemp (1897) suggested the Basel master Rudolf Heri."
  credit: "Anonymous woodcut, perhaps by Rudolf Heri; scan from W. Meyer and H. D. Finck, Die Schweiz in der Geschichte 700-1700, vol. 1 (1995); Wikimedia Commons, File:Schlacht bei Dorneck.jpg"
  licence: "Public domain"
  source: "https://austria-forum.org/af/AustriaWiki/Schlacht_bei_Dornach"
  alt: "An early woodcut of the battle of Dornach, showing the fighting below the castle of Dorneck."
