# Replacing losses for medieval (gravewounds/replace.py). 1 Day = an archer's 6d (1415).
# assigned - the army's own way of filling a gap: regions (armies), careers (any, or a list),
#            terms (the experience he usually came with, or [low, high]), wait ([low, high] days
#            from the loss to his arrival), places (none: anywhere), what, source or approx.
# hire     - a man the team can engage: as above, with cost (Days, paid from a purse, for the
#            lowest terms) and per_term (Days more for each term past it), and places to find him.
# effects  - what becomes of a lost man's purse: share (his comrades divide it), heirs (it goes
#            home) or lost (given away or gone with him); default, and an army's own under regions.
id: medieval
assigned:
- id: next_indenture
  name: Kin and tenants at the next indenture
  regions:
  - england
  - france
  careers:
  - archer
  - spearman
  - man_at_arms
  - servant
  terms: 1
  wait:
  - 90
  - 365
  what: No one replaced a man during a campaign; a captain refilled his retinue from his family and tenants when he next indented, often a season or a year later.
  source:
    url: https://www.ihgs.ac.uk/was-your-ancestor-a-late-medieval-soldier-part-2-1812
    note: Standish retinue refilled in 1441 after Gerberoy, 1435
- id: besteiros_do_conto
  name: A new man enrolled by the anadel
  regions:
  - portugal
  careers:
  - crossbowman
  terms: 1
  wait:
  - 30
  - 180
  what: The towns' crossbowmen (besteiros do conto) were drawn by quota from each town; when one died or retired, the anadel struck him off and enrolled another, preferably a married craftsman.
  source:
    url: https://www.brown.edu/Departments/Portuguese_Brazilian_Studies/ejph/html/issue23/pdf/v12n1a03.pdf
    note: e-JPH 12:1, pp. 68-74; about 5,000 by 1421; the wait is a guess
  approx: true
- id: town_levy
  name: A man of the town's levy, armed by his wealth
  regions:
  - portugal
  - castile
  careers:
  - spearman
  - crossbowman
  - man_at_arms
  terms: 1
  wait:
  - 30
  - 120
  what: Every householder kept arms by his assessed wealth (a crossbow and three dozen bolts at 600-2,000 maravedís in Castile); after Aljubarrota the Cortes armed every man of 20 to 60 and called six musters a year.
  source:
    url: https://www.rehj.cl/index.php/rehj/article/download/380/357/1435
    note: Cortes of Valladolid, December 1385 (Pascual Sarria); the wait is a guess
  approx: true
- id: vasallo_lanza
  name: A king's vassal's lance
  regions:
  - castile
  careers:
  - man_at_arms
  - mounted_sergeant
  terms:
  - 1
  - 2
  wait:
  - 60
  - 365
  what: The king's vassals held a yearly retainer for each lance they kept (1,500 maravedís a lance in 1387), and lords had quotas; a lost lance was made good at the next muster.
  source:
    url: https://revistas.um.es/medievalismo/article/download/505001/316321/1787521
    note: Martín Vera, La lanza bajomedieval castellana (2021), table 3; the wait is a guess
  approx: true
- id: iqta_trooper
  name: A trooper from an amir's land grant
  regions:
  - ayyubid
  careers: any
  terms: 1
  wait:
  - 30
  - 180
  what: An amir held the revenue of land (iqta') and owed a set number of equipped horsemen for it; a mamluk was bought young, trained and freed into his master's regiment.
  source:
    url: https://en.wikipedia.org/wiki/Ayyubid_dynasty
    note: the iqta' and the jamakiyya; the wait is a guess
  approx: true
- id: swiss_auszug
  name: A man of his canton's next levy (Auszug)
  regions:
  - swiss
  careers: any
  terms: 1
  wait:
  - 1
  - 60
  what: Each canton sent out picked men under its banner or Fähnlein; contingents came up day by day (at Dornach Lucerne and Zug on the 22nd, Uri and Unterwalden on the 23rd, Schwyz on the 24th), and a fallen man's widow might name his replacement.
  source:
    url: https://scholarsarchive.byu.edu/cgi/viewcontent.cgi?article=1396&context=sahs_review
    note: Winkler 2020, pp. 26-29, after Elgger; the wait is a guess
  approx: true
hire:
- id: demobbed_soldier
  name: A demobilised soldier from the London pool
  careers:
  - archer
  - man_at_arms
  - mercenary
  terms:
  - 1
  - 3
  cost: 90
  per_term: 15
  places:
  - town
  - city
  what: Out-of-work soldiers waited in London for a captain; he paid a quarter's wages ahead, and citizens stood pledge that the man would not take it and go.
  source:
    url: https://deremilitari.org/?p=2246
    note: 'Strother, 1374: £40 a year for a man-at-arms and his archer; a quarter ahead for an archer is about 90 Days; the extra for a veteran is a guess'
- id: free_company_man
  name: A free company's man
  careers:
  - mercenary
  - crossbowman
  - mounted_sergeant
  terms:
  - 2
  - 3
  cost: 120
  per_term: 20
  places:
  - camp
  - frontier
  - road
  what: Free companies took on demobilised soldiers for a share of the gains of war; no rate a man is recorded.
  source:
    url: https://en.wikipedia.org/wiki/Free_company
    note: no per-man rate found
  approx: true
- id: landsknecht_muster
  name: A Landsknecht taken on at the muster place
  regions:
  - landsknecht
  careers:
  - spearman
  - archer
  - mercenary
  terms:
  - 1
  - 3
  cost: 30
  per_term: 10
  places:
  - town
  - camp
  what: A captain beat the drum for men, paid each his Handgeld, and swore them to the articles of war at the muster place; a month's pay was 4 gulden.
  source:
    url: https://www.dhm.de/archiv/ausstellungen/eisenkleider/burschel.htm
    note: Burschel; the cost (a month's pay) and the veteran's extra are guesses
  approx: true
- id: reislaeufer
  name: A Swiss free man (Reisläufer) for hire
  regions:
  - swiss
  careers:
  - spearman
  - man_at_arms
  - mercenary
  terms:
  - 1
  - 3
  cost: 30
  per_term: 10
  places:
  - town
  - camp
  what: Volunteers and free companions (Freiknechte) took service for pay and plunder and formed the front of the vanguard; in papal service in 1485 a Swiss foot soldier had 5 gulden a month.
  source:
    url: https://hvtg.ch/skin/frontend/PDF/publikationen/TextTB095.pdf
    note: Kolb, Thurgauer als Landsknechte, p. 10; the cost (a month's pay) is a guess
  approx: true
effects:
  default:
    practice: heirs
    what: A man going to war often made his will before he went, and his executors saw his goods to his family and church; his share of the gains of war was another matter, a third of it owed to his captain.
      The GM may let comrades divide what a poor man carried.
    source:
      url: https://archive.org/stream/historyofwarring00beam/historyofwarring00beam_djvu.txt
      note: William Mainwaring of Peover made his will on 4 October 1394, about to go to the wars in Guienne (Mainwaring papers)
    approx: true
    sources:
    - url: https://deremilitari.org/?p=2246
      note: the captain's third of his men's gains of war
