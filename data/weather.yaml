# Calendar, weather and their effects (Grave Wounds).
#
# Each travel map has a start date, a calendar (julian or gregorian), a latitude and a
# climate profile. Days on the map run on from the start date. Daylight comes from the
# latitude and the date; each day's weather is rolled from the climate's figures for the
# month, weighted towards the day before, and the GM can change it.
#
# Climate figures are rounded modern climate normals for a typical place in each region
# (monthly mean highs and lows, days with 1 mm or more of rain, days with fog). The
# medieval and early modern climate (the "Little Ice Age", roughly 1300-1850) ran somewhat
# cooler: a map's `climate_shift` (degrees C, e.g. -0.5) lowers its temperatures.

# ---------- daylight and the marching day ----------
daylight:
  start_after_sunrise: 1.0    # hours: breaking camp, eating, forming up
  stop_before_sunset: 1.0     # hours: halting in time to make camp in daylight
  min_hours: 2                # even a midwinter day gives this much marching
# Marching hours = the smaller of terrain.yaml hours_per_day and (sunset - stop) - (sunrise + start),
# both ends rounded inwards to the quarter hour. Camp work can still use evening_hours (works.yaml).

# ---------- making the day's weather ----------
persistence: 0.4              # how strongly a wet or dry day tends to follow another
anomaly_carry: 0.5            # share of yesterday's warmth or chill kept (rounded towards zero)
anomaly:                      # d100 -> degrees C added to the month's normal high and low
  - {upto: 5, deg: -4}
  - {upto: 15, deg: -2}
  - {upto: 35, deg: -1}
  - {upto: 65, deg: 0}
  - {upto: 85, deg: 1}
  - {upto: 95, deg: 2}
  - {upto: 100, deg: 4}
intensity:                    # on a wet day, d100 -> how hard it comes down
  - {upto: 60, rain: rain, snow: snow}
  - {upto: 90, rain: heavy_rain, snow: heavy_snow}
  - {upto: 100, rain: storm, snow: blizzard}
snow_at_or_below: 2           # the day's high, degrees C: wet days fall as snow
fair_upto: 50                 # on a dry day without fog, d100 at or under this is fair, else overcast
winds:                        # d100 -> wind; missile and firearm: % off missile attacks
  # reach: % added to a bow's, crossbow's or sling's range bands shooting with the wind (the
  # wind behind the shot, within 45 degrees), taken off shooting into it; into_wind: further %
  # off such a shot into the wind. Bullets and round shot are too heavy for either.
  - {id: calm,   upto: 50,  name: "Calm or light air", missile: 0,  firearm: 0,  reach: 0,  into_wind: 0}
  - {id: breeze, upto: 85,  name: "Breeze",            missile: 0,  firearm: 0,  reach: 10, into_wind: 0}
  - {id: strong, upto: 97,  name: "Strong wind",       missile: 10, firearm: 0,  reach: 20, into_wind: 10}
  - {id: gale,   upto: 100, name: "Gale",              missile: 20, firearm: 10, reach: 30, into_wind: 20}
# The wind's direction: where it blows FROM, one of eight points, rolled each day from the
# climate's prevailing winds (wind_from). A day keeps the day before's direction on a d100 of
# wind_keep or less. Rain or snow blowing into a shooter's face (shooting into the wind, not in
# a calm) cuts how far he can see to aim to driven_sight % of the condition's visibility.
wind_points: [N, NE, E, SE, S, SW, W, NW]
wind_keep: 50
driven_sight: 50

# Conditions. wet: 0-2, how wet bowstrings and powder get. visibility: hexes of the battle
# map (2 m) a man can see to aim; null for clear. min_wind: the wind is at least this.
# hardship: how hard a night out in it is (for rest). precip: rain, snow or none.
conditions:
  fair:       {name: "Fair",       precip: none, wet: 0, visibility: null, hardship: 0}
  overcast:   {name: "Overcast",   precip: none, wet: 0, visibility: null, hardship: 0}
  fog:        {name: "Fog",        precip: none, wet: 0, visibility: 25,   hardship: 0}
  rain:       {name: "Rain",       precip: rain, wet: 1, visibility: 150,  hardship: 1}
  heavy_rain: {name: "Heavy rain", precip: rain, wet: 2, visibility: 75,   hardship: 2}
  storm:      {name: "Storm",      precip: rain, wet: 2, visibility: 50,   hardship: 2, min_wind: strong}
  snow:       {name: "Snow",       precip: snow, wet: 1, visibility: 75,   hardship: 1}
  heavy_snow: {name: "Heavy snow", precip: snow, wet: 1, visibility: 40,   hardship: 2}
  blizzard:   {name: "Blizzard",   precip: snow, wet: 2, visibility: 15,   hardship: 3, min_wind: gale}

# ---------- light ----------
# The battle map's light (its weather's `light`; daylight if none). In the dark no one can be
# seen to aim at, or to call fire on, beyond `sight` battle hexes (2 m; with the weather's own
# visibility, the shorter counts), and aimed fire is `aim` % off, guns' too. A hex lit by a
# flare or an illumination round is seen as by day. A battle sent from the travel map takes
# the hour's light: dusk within `dusk_hours` of sunrise or sunset; at night, moonlit if the
# moon is up and at least `moon_from` lit (a simple model: it rises about 50 minutes later each
# day, at sunrise when new and at sunset when full, and is up 12 hours), in weather that
# shows it (`moon_shows`), else dark.
light:
  levels:
    day:     {name: "Daylight",      sight: null, aim: 0,  move: 0, lost: 0}
    dusk:    {name: "Dusk or dawn",  sight: 100,  aim: 5,  move: 0, lost: 0}
    moonlit: {name: "Moonlit night", sight: 50,   aim: 10, move: 1, lost: 10}
    night:   {name: "Dark night",    sight: 25,   aim: 20, move: 1, lost: 25}
  dusk_hours: 0.5
  moon_from: 0.5
  moon_shows: [fair]
  lasts: 2                  # exchanges a flare or illumination round lights its hexes
  flare: 10                 # field hexes round a flare the GM fires (hand or rifle flares, about 100 m)
  # Muzzle flashes: a unit that fired when the light limits sight to less than `flash` is seen,
  # where it fired from, out to `flash` battle hexes (2 m) through the next exchange.
  flash: 150
  # Night-vision devices: a unit that carries one (its `nv`) sees `sight` battle hexes in the
  # dark (if the light's own sight is shorter) and aims `aim` % off (if the light's is worse); a
  # thermal sight (`smoke`) also sees through smoke, by day or night. Men in `kits` carry the
  # `kit_device` unless the unit says otherwise (nv: none to go without). Design estimates:
  # the Starlight scope (AN/PVS-2, 1960s-70s) was one rifle in a squad and showed a dim green
  # picture to a few hundred metres in starlight; goggles of the 1990s on see further and let
  # every man aim; thermal sights came on tanks in the 1980s and on infantry teams' weapons in
  # the 2000s.
  night_vision:
    kits: [ranger_1993, interceptor, plate_carrier]
    kit_device: goggles
    devices:
      starlight: {name: "Starlight scope (1960s-70s)", sight: 100, aim: 15}
      goggles:   {name: "Night-vision goggles (1990s on)", sight: 150, aim: 5}
      thermal:   {name: "Thermal sight (tanks from the 1980s, teams from the 2000s)", sight: 300, aim: 0, smoke: true}
      ir_searchlight: {name: "Infrared searchlight and sights (tanks, 1950s-70s)", sight: 80, aim: 20}
    # Vehicles' sights by war (the wound table's `battle`): a vehicle unit with no device chosen
    # gets its war's (tanks and IFVs of that era carried them; design estimates).
    vehicles: {"Vietnam": ir_searchlight, "Late 20th century": thermal, "Iraq & Afghanistan": thermal}
  # A machine gun laid on a fixed line (in daylight or at dusk) fires blind down it in the dark,
  # at any enemy within `width` field hexes of the line from its front to the hex it is laid on:
  # no sight needed, `aim` % off in place of the light's.
  fixed_line: {width: 1, aim: 15}
  # move: added to each hex's movement in the dark. lost: % chance that a unit that moved in the
  # dark loses its direction (plus half of how far its quality's nerve is below 60, less half of
  # how far above): it ends turned one point off, and cannot move for `lost_for` exchanges
  # (it may still turn).
  lost_for: 2

# ---------- the ground ----------
# Mud and lying snow build up and wear off day by day; heavy rain floods fords.
ground:
  mud_add: {rain: 1, heavy_rain: 2, storm: 2}
  mud_max: 3
  mud_dry: 1                  # mud gone per day without rain
  mud_dry_warm: 2             # ... if the high is at or over warm_at
  warm_at: 25
  snow_add: {snow: 1, heavy_snow: 2, blizzard: 3}
  snow_max: 4
  snow_melt: 1                # snow gone per day with the high over snow_at_or_below
  snow_melt_mild: 2           # ... if the high is at or over mild_at
  mild_at: 8
  flood_from: [heavy_rain, storm]
  flood_days: 2               # fords stay too deep this many days, counting the day itself
  deep: 2                     # mud or snow at this level or more is deep going on the battle map

# Travel map: % of each terrain's time cost while muddy (mud >= 1) or snowy (snow >= 1);
# the larger applies. Unpaved roads and ploughed fields suffer most from mud.
march:
  mud:  {road: 150, open: 130, farmland: 150, heath: 120, forest: 110, hills: 120, mountains: 110, marsh: 120, ford: 100, bridge: 100, village: 110, town: 100}
  snow: {road: 150, open: 150, farmland: 150, heath: 150, forest: 150, hills: 175, mountains: 200, marsh: 150, ford: 150, bridge: 125, village: 125, town: 125}
  flooded: [ford]             # cannot be crossed while flooded

# Battle map: deep mud or snow costs +1 movement for every hex.
battle:
  deep_step: 1
  string_wet: [0, 10, 20]     # % off bows and crossbows by wet level (wet strings)
  misfire:                    # % chance a firearm fails to fire, by ignition and wet level
    match:      [0, 30, 60]
    wheel:      [0, 15, 30]
    flint:      [0, 15, 30]
    percussion: [0, 5, 10]
    cartridge:  [0, 0, 0]

# ---------- cold in battle ----------
# The field map's cold (its weather's `cold`; none if not set). A battle sent from the travel map
# takes it from the day's low: the coldest level whose `below` (degrees C) the low is at or under.
# In it, the automatic weapons in `jams` misfire `jam` % more (oil thickens, actions freeze), and
# every hex costs `move` more to cross (numb hands and feet, men bundled up). Frostbite itself is
# taken on the travel map (disease.yaml). Design estimates.
cold:
  levels:
    hard:   {name: "Hard frost", below: -15, jam: 10, move: 0}
    bitter: {name: "Bitter cold", below: -25, jam: 25, move: 1}
  jams: [machine_gun, pistol_smg, rifle_assault]

# ---------- rest and fatigue ----------
# A night's rest starts from the camp's rest (works.yaml; poor without a camp) and drops
# one step for every point of hardship beyond the camp's shelter. Cold adds hardship.
rest_levels: [bad, poor, fair, good]
shelter: {none: 0, bivouac: 0, watched: 1, staked: 1, fortified: 1, quartered: 3}
cold_hardship: [{low_at_or_below: 0, add: 1}, {low_at_or_below: -10, add: 2}]

fatigue:
  levels:                     # penalty: % off attack and defence; march: % of marching speed
    - {name: "Fresh",     penalty: 0,  march: 100}
    - {name: "Tired",     penalty: 5,  march: 100}
    - {name: "Weary",     penalty: 10, march: 90}
    - {name: "Exhausted", penalty: 20, march: 75}
    - {name: "Spent",     penalty: 30, march: 0}
  night: {bad: 1, poor: 0, fair: -1, good: -2}
  heat: [{high_at_or_over: 30, add: 1}, {high_at_or_over: 36, add: 2}]
  cold: [{high_at_or_below: -5, add: 1}]
  heat_cold_min_hours: 4      # only a day with this much marching tires men in heat or cold
  heavy_going_hours: 6        # this much marching in deep mud or snow adds 1

