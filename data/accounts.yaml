# Where the accounts disagree, as a choice on the field map: for each battlefield (data/fields), the questions
# its sources answer differently that the battle turns on (each period book's "Where the accounts disagree"
# for that battlefield). Each option may change the armies as drawn up: scale a side's men (side, scale), set
# or scale a unit's (unit, men or scale), or move a phase (phase, at). The first option of each question is
# the game's own and changes nothing; the enemy commander's benchmark is run on it. single: a single report.
# Kept apart from the battlefield files, which their generators (tools/maps) write.

wanat-2008:
    - id: fighters
      question: "How many fighters attacked?"
      options:
        - {label: "About 200", source: "the Army's narrative"}
        - {label: "More than 100", source: "Military Times", changes: [{side: 1, scale: 0.5}]}
        - {label: "400 to 500", source: "an Afghan defence official, as Wikipedia reports him", single: true, changes: [{side: 1, scale: 1.8}]}
    - id: apaches
      question: "When did the Apaches arrive?"
      options:
        - {label: "About an hour in (05:20)", source: "the game's reading of the timeline; a commenter on Small Wars Journal: within the hour"}
        - {label: "About 30 minutes in", source: "Wikipedia", changes: [{phase: "The Apaches arrive", at: 31}]}

