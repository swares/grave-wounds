# A season of service: the Peninsular War, 1808-1814 (gravewounds/service.py, templates/service.js).
# A named man serving with a line battalion passes a season (experience.yaml season_days) in one
# step: his sickness on the camp-disease track (disease.yaml), each named action of the season he
# is at and that is not played on its battlefield (a hit is sent to the roller, which rolls the
# wound), and the chance of a small fight. Design: project doc "between-battles-design".
#
# id, name, era (data/teams), regions (the armies whose men serve it), table (its weapon_mix
# picks the weapon a hit comes from), season_days.
# states   - what the battalion does in a season, for sickness: care (none, field, shelter: the
#            disease track's), marched (he marches: worse recovery), staying (the battalion stays in
#            one place: the disease track's "staying" factor, and "crowded" with poor hygiene).
# positions - where his company stands in an unplayed action: the army's share lost times `mult`
#            (ours), at most `cap` %. Calibrated on Albuera: the Anglo-Portuguese lost about 22%,
#            the 1/57th, in the thick of it, 66% (three times).
# small_war - the % chance a season that a small fight comes the team's way, by state (ours: the
#            memoirs describe outpost fights, foraging parties and patrols, but no one counted them);
#            the GM plays it on the roller, or rolls it: each man with the team is hit on `hit` %.
# seasons  - a generic line battalion's war, season by season (winter: December to February):
#            state, hygiene (fair, poor, good), factors (the disease track's hot, warm, cold_wet,
#            marsh or town, each with the weeks of the season it holds, spread through it: ours,
#            tuned so a man's deaths from disease over the war come near the records' totals, with
#            the worst seasons the accounts name worse), where and what (one line), actions (ids,
#            below), sources.
# actions  - each named battle, siege or storm: name, date (the main day, YYYY-MM-DD), field (a
#            modelled battlefield the GM can play instead), main (false: not the main army's: the
#            GM ticks it if his battalion was there), share (% of those engaged killed and
#            wounded, or lost where no split was found; null: not found, the GM sets it), engaged
#            and lost as the sources give them, alt (another source's share), units (a battalion's
#            own figure the GM may use instead), sources, single (one report only), note.
# Figures: project doc "between-battles-design" (historyofwar.org, britishbattles.com, Wikipedia
# mirrors and Smith via Fandom; Oman was not reached). Shares are our calculation from them.
id: peninsula
name: "The Peninsular War (1808-1814)"
era: horse_musket
regions: [british_pen]
table: peninsular-1808-14-officers
season_days: 91

states:
  quarters: {name: "In quarters", care: shelter, marched: false, staying: true}
  campaign: {name: "On campaign", care: field, marched: true, staying: false}
  march:    {name: "On the march", care: field, marched: true, staying: false}
  siege:    {name: "At a siege", care: field, marched: false, staying: true}

positions:
  reserve: {name: "In reserve", mult: 0.25}
  line:    {name: "In the line", mult: 1}
  thick:   {name: "In the thick of it", mult: 3}
cap: 90

small_war:
  chance: {quarters: 15, campaign: 40, march: 25, siege: 30}
  hit: 10

# The two sides of a small fight on the roller: the team's (its side on the team builder, else this)
# and the enemy's.
sides: {team: "British", foes: "French"}

# small_fights - ready-made fights for the roller when a season's small fight comes (rolled by weight
#   among those whose states include the season's; the GM may pick another): name, what (the accounts,
#   one line), states, weight (ours), where, time, ground (the roller's ground: open, road, farmland,
#   heath, forest, hills, mountains, marsh, ford, bridge, village, town), weather (optional), light
#   (optional: dusk, moonlit or night, weather.yaml's light levels, set on the roller; day if none), side (the
#   team's party, the team in it: name, men [low, high]), foes ([{name, men, kit, weapon}]: the roller
#   shows up to 8 a side and says the real odds), team_attacks (the team's party comes in from the edge
#   against the foes, who hold the middle), surprise (the defenders may be caught unawares: text and
#   a % chance, ours), aims (each side's, in words), ends (what ends it, in words), end (what of it the
#   roller counts and calls: rounds, wins: the side that wins when they are up, team, foes or none; down,
#   a side that loses once that share of its men, or that many, are down, taken or gone; holding a
#   place is the GM's call), sources, note. The sizes come from the instances in the sources, the weights, chances and
#   end conditions are ours. No source found counts how often such fights happened (Leach's Rough
#   Sketches and Simmons's journal, the likeliest, were not reached).
small_fights:
  - id: picket
    name: "A picket attacked at night"
    what: "French grenadiers and voltigeurs rush the bridge in the dark and rain; the sentries are overrun and the picket fights for half an hour until the supports come up (Barba del Puerco, 19-20 March 1810; the bridge of Vera, 1 September 1813, where the rain had wet the sentries' rifles)."
    states: [quarters, campaign]
    weight: 3
    where: "a bridge on the outpost line"
    time: "about midnight"
    light: night
    ground: bridge
    weather: rain
    side: {name: "The picket", men: [20, 53]}
    foes: [{name: "French grenadiers", men: [60, 600], weapon: musket_smoothbore}]
    surprise: {text: "The French come on in the dark and the noise of the river", chance: 40}
    aims: {team: "Hold the bridge until the supports come up.", foes: "Drive in the picket and get across."}
    ends: "The supports come up after 6 rounds (\"fought for half an hour\", Cope); the French fall back once a third of those here are down; the picket is beaten if it is driven off the bridge."
    end: {rounds: 6, wins: team, down: {foes: 0.33}}
    sources: ["Cope, History of the Rifle Brigade, ch. II: https://m.gutenberg.org/files/60048/60048-0.txt", "https://www.historyofwar.org/articles/skirmish_barba_del_puerco.html"]
    note: "Ferey's 600 grenadiers (Cope) against companies of the 1/95th; O'Hare's company of 53 is a living-history site's figure. Losses (Cope): 4 killed and 10 wounded against the French 9 killed and 6 taken left behind. Costello dates it 19 May."
  - id: patrol
    name: "A patrol meets French cavalry"
    what: "A company sent to see who holds a village finds French cavalry in it, skirmishes and falls back (Barba del Puerco, 27 February 1810); a French cavalry patrol draws off at a few shots from the pickets (Espeja, 8 May 1811)."
    states: [quarters, campaign, march]
    weight: 3
    where: "a village before the outposts"
    time: "by day"
    ground: village
    side: {name: "The patrol", men: [10, 40]}
    foes: [{name: "French chasseurs", men: [10, 40], weapon: saber}]
    aims: {team: "Find out who holds the village and bring word back.", foes: "Keep the village and drive the patrol off."}
    ends: "Either side falls back once two of those here are down or it has seen enough; the patrol wins if it gets back to its own edge with word."
    end: {down: {team: 2, foes: 2}}
    sources: ["Cope, ch. II: https://m.gutenberg.org/files/60048/60048-0.txt", "Kincaid, Adventures in the Rifle Brigade, ch. VI: https://m.gutenberg.org/files/28981/28981.txt"]
    note: "Neither account gives the French numbers or losses: the sizes are ours."
  - id: foragers
    name: "French foragers caught at dawn"
    what: "Light troops and dragoons fall on French grenadiers covering a foraging party in a cornfield; the grenadiers form square, beat off the dragoons and get away to the next village (Barquilla, 11 July 1810)."
    states: [campaign]
    weight: 2
    where: "a cornfield by a village"
    time: "about 4 in the morning"
    light: dusk
    ground: farmland
    team_attacks: true
    side: {name: "The light troops", men: [40, 120]}
    foes: [{name: "French grenadiers", men: [100, 200], weapon: musket_smoothbore}, {name: "French cavalry", men: [30, 40], weapon: saber}]
    aims: {team: "Take the foragers and their escort.", foes: "Form, hold together and get back to the next village."}
    ends: "The French win if they reach their own edge in order; they give up if half of those here are down."
    end: {down: {foes: 0.5}}
    sources: ["https://www.historyofwar.org/articles/combat_barquilla.html", "https://military-history.fandom.com/wiki/Combat_of_Barquilla_(1810)"]
    note: "About 200 grenadiers of the 22nd Line and 30-40 cavalry (Fandom, citing Oman and Beamish). British 9 killed and 23 wounded, French 31 taken (Rickard). Rickard dates it 10 July."
  - id: baggage
    name: "Dragoons at the baggage"
    what: "On the retreat, French dragoons ride into the oak woods and plunder a battalion's baggage until a company of riflemen drives them off (the Huebra, 17 November 1812)."
    states: [march, campaign]
    weight: 2
    where: "the baggage train in an oak wood"
    time: "in the morning"
    ground: forest
    weather: rain
    side: {name: "The baggage guard", men: [10, 40]}
    foes: [{name: "French dragoons", men: [10, 60], weapon: saber}]
    surprise: {text: "The dragoons come out of the trees on the baggage", chance: 40}
    aims: {team: "Save the baggage and the mules.", foes: "Plunder the baggage and get away with it."}
    ends: "The dragoons ride off once a third of those here are down, or with what they hold after 6 rounds; the guard is beaten if it is broken."
    end: {rounds: 6, wins: none, down: {foes: 0.33}}
    sources: ["Urban, Rifles, ch. 18: https://erenow.org/ww/rifles-six-years-with-wellingtons-legendary-sharpshooters/18.php"]
    note: "No numbers in the account: the sizes are ours. The rain of the retreat from Burgos is ours too."
  - id: sortie
    name: "A sortie on the trenches"
    what: "The garrison bursts out on the working parties in the trenches, drives them off and carries away their picks and shovels (Badajoz, 19 March 1812: 1,500 infantry and 40 cavalry; Burgos, 5 and 8 October 1812)."
    states: [siege]
    weight: 4
    where: "the parallel before the breach"
    time: "in the evening"
    light: dusk
    ground: open
    side: {name: "The working party and its guard", men: [50, 200]}
    foes: [{name: "The French sortie", men: [150, 1500], weapon: musket_smoothbore}]
    surprise: {text: "The sortie comes out on men digging", chance: 50}
    aims: {team: "Hold the trench and keep the tools.", foes: "Drive off the workers, take the tools and go back in."}
    ends: "The French go back in after 6 rounds or once a third of those here are down; the working party is beaten if it is driven from the trench."
    end: {rounds: 6, wins: team, down: {foes: 0.33}}
    sources: ["https://www.historyofwar.org/articles/siege_badajoz_3rd.html", "https://www.historyofwar.org/articles/siege_burgos_1812.html", "Kincaid, ch. IX: https://m.gutenberg.org/files/28981/28981.txt"]
    note: "Burgos, 5 October: 142 Allied casualties and 200 picks and shovels lost; 8-9 October: 184 against 33 French (Rickard). Trench duty was six hours by day and the same by night (Kincaid)."
  - id: rearguard
    name: "The rear-guard at a bridge"
    what: "The rear-guard holds a bridge and its defile while the column gets clear; French cavalry come at it four abreast and are broken by fire from both sides (Cacabelos, 3 January 1809)."
    states: [march]
    weight: 3
    where: "a bridge and defile on the line of retreat"
    time: "from the afternoon to dusk"
    ground: bridge
    side: {name: "The rear-guard", men: [50, 200]}
    foes: [{name: "French chasseurs", men: [50, 300], weapon: saber}]
    aims: {team: "Hold the bridge until the column is clear.", foes: "Break through and cut off the stragglers."}
    ends: "The rear-guard wins if it holds for 8 rounds; the French draw off once a third of those here are down; the rear-guard is beaten if it is broken."
    end: {rounds: 8, wins: team, down: {foes: 0.33}}
    sources: ["https://www.historyofwar.org/articles/action_cacabellos_defile.html"]
    note: "Both sides lost about 200, with 40-50 British taken, mostly riflemen; the strengths are not given (Rickard)."
  - id: redoubt
    name: "Storming a redoubt"
    what: "A party of volunteers storms an outlying redoubt by night and carries it, taking its guns and garrison (Fort San Francisco, Ciudad Rodrigo, 8 January 1812)."
    states: [siege]
    weight: 2
    where: "an outlying redoubt"
    time: "at night"
    light: night
    ground: hills
    team_attacks: true
    side: {name: "The volunteers", men: [100, 300]}
    foes: [{name: "The redoubt's garrison", men: [40, 60], weapon: musket_smoothbore}]
    aims: {team: "Carry the redoubt.", foes: "Hold it until relieved."}
    ends: "The volunteers win when the garrison is down or gives up; they fall back if a third of those here are down."
    end: {down: {team: 0.33}}
    sources: ["Cope, ch. III: https://m.gutenberg.org/files/60048/60048-0.txt", "Kincaid, ch. VIII: https://m.gutenberg.org/files/28981/28981.txt"]
    note: "About 300 volunteers, 100 from each regiment (Kincaid); 3 guns, 2 captains and 48 men taken; the Rifles lost 1 killed and 16 wounded (Cope)."
  - id: surprise
    name: "A French post surprised at dawn"
    what: "After a night march the column closes on French quarters in thick fog and charges down the village street; light companies make a column surrender (Arroyo dos Molinos, 28 October 1811, a division's attack, here a company's part of it)."
    states: [campaign, quarters]
    weight: 1
    where: "a village held by the French"
    time: "about 6 in the morning"
    light: dusk
    ground: village
    weather: fog
    team_attacks: true
    side: {name: "The light companies", men: [100, 200]}
    foes: [{name: "French infantry in the village", men: [100, 300], weapon: musket_smoothbore}]
    surprise: {text: "The French are in their quarters in the fog", chance: 60}
    aims: {team: "Take the village and its men.", foes: "Form and get out of the village."}
    ends: "The French give up once half of those here are down, or get away if they reach their own edge; the attack fails if a third of the light companies here are down."
    end: {down: {foes: 0.5, team: 0.33}}
    sources: ["https://britishbattles.com/peninsular-war/battle-of-arroyo-molinos"]
    note: "Blakeney's light companies, about 200, made a column of about 1,500 surrender; the Allies lost under 100 in all (britishbattles). The whole was a division's attack, not a small fight."

sources:
  how: &how "https://www.historyofwar.org/articles/wars_peninsular.html"
  dumas: &dumas "https://www.napoleon-series.org/research/abstract/military/army/britain/casualties/c_britcas.html"

seasons:
  - {id: 1808-summer, name: "Summer 1808", state: campaign, hygiene: fair, factors: {hot: 1}, actions: [rolica, vimeiro],
     what: "Landed at Mondego Bay in August; Roliça and Vimeiro; the Convention of Cintra.", sources: [*how]}
  - {id: 1808-autumn, name: "Autumn 1808", state: march, hygiene: good, factors: {}, actions: [],
     what: "Moore's army marches from Lisbon into Spain.", sources: [*how]}
  - {id: 1808-winter, name: "Winter 1808-09", state: march, hygiene: fair, factors: {cold_wet: 3}, actions: [corunna],
     what: "The retreat over the mountains to Corunna in snow and rain; the battle and the evacuation.", sources: [*how]}
  - {id: 1809-spring, name: "Spring 1809", state: campaign, hygiene: good, factors: {}, actions: [],
     what: "Wellesley lands at Lisbon; the passage of the Douro and Oporto (12 May).", sources: [*how]}
  - {id: 1809-summer, name: "Summer 1809", state: campaign, hygiene: fair, factors: {hot: 1}, actions: [talavera],
     what: "Into Spain with Cuesta: Talavera, then back toward Portugal, short of food.", sources: [*how]}
  - {id: 1809-autumn, name: "Autumn 1809", state: quarters, hygiene: fair, factors: {warm: 13, marsh: 13}, actions: [],
     what: "Quarters on the Guadiana about Badajoz, late August to Christmas: nearly a third of the men fell seriously ill, over ten thousand sick (Leith-Hay).",
     note: "The article calls it typhus; Leith-Hay, typhoid fever. The marsh is ours (the Guadiana's low ground).",
     sources: ["https://chdetrujillo.com/fiebre-y-sabanas-el-otono-de-wellington-en-badajoz-i/?pdf=9735"]}
  - {id: 1809-winter, name: "Winter 1809-10", state: quarters, hygiene: good, factors: {cold_wet: 3}, actions: [],
     what: "Winter quarters in Portugal.", sources: [*how]}
  - {id: 1810-spring, name: "Spring 1810", state: quarters, hygiene: good, factors: {}, actions: [],
     what: "On the frontier, outposts on the Côa and the Agueda.", sources: [*how]}
  - {id: 1810-summer, name: "Summer 1810", state: campaign, hygiene: good, factors: {hot: 1}, actions: [],
     what: "Masséna invades: Ciudad Rodrigo and Almeida fall; the Light Division's fight on the Côa (24 July).", sources: [*how]}
  - {id: 1810-autumn, name: "Autumn 1810", state: campaign, hygiene: good, factors: {}, actions: [busaco],
     what: "Busaco, then the retreat into the Lines of Torres Vedras.", sources: [*how]}
  - {id: 1810-winter, name: "Winter 1810-11", state: quarters, hygiene: good, factors: {cold_wet: 3}, actions: [],
     what: "Behind the Lines while Masséna's army starves before them.", sources: [*how]}
  - {id: 1811-spring, name: "Spring 1811", state: campaign, hygiene: good, factors: {}, actions: [fuentes, albuera],
     what: "The pursuit of Masséna; Sabugal; Fuentes de Oñoro in the north, Albuera in the south.", sources: [*how]}
  - {id: 1811-summer, name: "Summer 1811", state: siege, hygiene: fair, factors: {hot: 1, warm: 13, marsh: 6}, actions: [],
     what: "The second siege of Badajoz fails; fevers on the Guadiana.", sources: [*how]}
  - {id: 1811-autumn, name: "Autumn 1811", state: quarters, hygiene: good, factors: {}, actions: [],
     what: "Blockading Ciudad Rodrigo from the frontier; El Bodón (25 September).", sources: [*how]}
  - {id: 1811-winter, name: "Winter 1811-12", state: siege, hygiene: fair, factors: {cold_wet: 2}, actions: [ciudad_rodrigo],
     what: "The siege of Ciudad Rodrigo in the frost, and its storm (19 January).", sources: [*how]}
  - {id: 1812-spring, name: "Spring 1812", state: siege, hygiene: fair, factors: {cold_wet: 1}, actions: [badajoz],
     what: "The third siege of Badajoz in the rain, and its storm (6-7 April).", sources: [*how]}
  - {id: 1812-summer, name: "Summer 1812", state: campaign, hygiene: fair, factors: {hot: 1}, actions: [salamanca],
     what: "Salamanca; into Madrid in August.", sources: [*how]}
  - {id: 1812-autumn, name: "Autumn 1812", state: siege, hygiene: fair, factors: {cold_wet: 3}, actions: [burgos],
     what: "The failed siege of Burgos, then the retreat to Portugal in the rain, short of food.", sources: [*how]}
  - {id: 1812-winter, name: "Winter 1812-13", state: quarters, hygiene: good, factors: {cold_wet: 3}, actions: [],
     what: "Winter quarters in Portugal; the army refitted.", sources: [*how]}
  - {id: 1813-spring, name: "Spring 1813", state: march, hygiene: good, factors: {}, actions: [],
     what: "Quarters until May, then the advance across northern Spain.", sources: [*how]}
  - {id: 1813-summer, name: "Summer 1813", state: campaign, hygiene: fair, factors: {hot: 1}, actions: [vitoria, pyrenees, san_sebastian],
     what: "Vitoria; the battles of the Pyrenees; the sieges of San Sebastián and Pamplona.", sources: [*how]}
  - {id: 1813-autumn, name: "Autumn 1813", state: campaign, hygiene: good, factors: {cold_wet: 1}, actions: [nivelle],
     what: "Across the Bidassoa (7 October) into France; the Nivelle.", sources: [*how]}
  - {id: 1813-winter, name: "Winter 1813-14", state: campaign, hygiene: good, factors: {cold_wet: 1}, actions: [nive, orthez],
     what: "The Nive before Bayonne; Orthez (27 February).", sources: [*how]}
  - {id: 1814-spring, name: "Spring 1814", state: campaign, hygiene: good, factors: {}, actions: [toulouse],
     what: "Toulouse (10 April); the war ends with Napoleon's abdication.", sources: [*how]}

actions:
  rolica:
    name: "Roliça"
    date: 1808-08-17
    share: 3
    engaged: "about 14,000 British and 1,600 Portuguese"
    lost: "487 British (70 killed, 335 wounded, 82 missing; britishbattles); 474 (historyofwar)"
    sources: ["https://britishbattles.com/peninsular-war/battle-of-rolica", "https://www.historyofwar.org/articles/battles_rolica.html"]
  vimeiro:
    name: "Vimeiro"
    date: 1808-08-21
    share: 4
    engaged: "just under 17,000 British and 2,000 Portuguese"
    lost: "720 (135 killed)"
    sources: ["https://www.historyofwar.org/articles/battles_vimiero.html", "https://britishbattles.com/peninsular-war/battle-of-vimeiro"]
  corunna:
    name: "Corunna"
    date: 1809-01-16
    share: 6
    engaged: "15,000-16,000"
    lost: "about 900 killed and wounded and 300 missing (Wikipedia mirror); 800-900 (britishbattles)"
    sources: ["https://www.historyofwar.org/articles/battles_corunna.html", "https://britishbattles.com/peninsular-war/battle-of-corunna", "https://wikiwand.com/en/Battle_of_Corunna"]
  talavera:
    name: "Talavera"
    date: 1809-07-28
    share: 26
    alt: {share: 30, source: "Napier: 6,268 lost"}
    engaged: "20,641 British"
    lost: "5,363 (Oman, as quoted); 6,268 (Napier)"
    sources: ["https://www.historyofwar.org/articles/armies_talavera.html", "https://military-history.fandom.com/wiki/Battle_of_Talavera"]
    note: "The sources disagree: Oman's 26%, Napier's 30%."
  busaco:
    name: "Busaco"
    date: 1810-09-27
    share: 2
    engaged: "52,000 (27,000 British, 25,500 Portuguese)"
    lost: "1,252 (200 killed, 1,001 wounded, 51 missing)"
    sources: ["https://www.historyofwar.org/articles/battles_bussaco.html"]
  fuentes:
    name: "Fuentes de Oñoro"
    date: 1811-05-05
    share: 4
    engaged: "about 36,000 infantry and 1,850 cavalry"
    lost: "about 1,800 (241 killed, 1,247 wounded, 312 missing: Smith); about 1,700 (historyofwar)"
    sources: ["https://www.historyofwar.org/articles/battles_fuentes_de_onoro.html", "https://military-history.fandom.com/wiki/Battle_of_Fuentes_d%27Onor"]
  albuera:
    name: "Albuera"
    date: 1811-05-16
    field: albuera-1811
    main: false
    share: 22
    alt: {share: 35, source: "the British alone: 3,615 killed and wounded of 10,449"}
    engaged: "10,449 British, 10,201 Portuguese, about 14,500 Spanish"
    lost: "British 882 killed, 2,733 wounded, 544 missing; Portuguese 389"
    sources: ["https://www.historyofwar.org/articles/battles_albuera.html", "https://www.historyofwar.org/articles/armies_albuera.html"]
    units:
      - name: "1/57th Foot (Hoghton's brigade)"
        share: 66
        lost: "428 killed and wounded of 647 (2 officers and 87 men killed, 21 officers and 318 men wounded); NAM gives 75% of the men"
        sources: ["https://www.military-history.org/feature/napoleonic/the-diehards-profile.htm", "https://www.noonans.co.uk/auctions/archive/lot-archive/results/168690/", "https://www.nam.ac.uk/explore/57th-west-middlesex-regiment-foot"]
    note: "Beresford's corps in the south, not Wellington's army."
  ciudad_rodrigo:
    name: "Ciudad Rodrigo"
    date: 1812-01-19
    field: ciudad-rodrigo-1812
    share: 10
    engaged: "the storming divisions, about 10,700"
    lost: "1,121 in the siege (195 killed, 916 wounded, 10 missing), 562 of them in the storm"
    sources: ["https://www.historyofwar.org/articles/siege_ciudad_rodrigo_1812.html"]
    note: "The whole siege against the storming force; the storm alone was about 5%."
  badajoz:
    name: "Badajoz"
    date: 1812-04-06
    field: badajoz-1812
    share: 18
    engaged: "about 27,000 (Wikipedia mirror only)"
    lost: "4,760-4,924 killed and wounded in the siege; about 2,000 at the breaches in two hours"
    sources: ["https://www.historyofwar.org/articles/siege_badajoz_3rd.html", "https://mobileapps.wikiwand.com/en/Siege_of_Badajoz_(1812)"]
    single: true
  salamanca:
    name: "Salamanca"
    date: 1812-07-22
    share: 11
    engaged: "about 48,500"
    lost: "3,129 British, 2,037 Portuguese, 6 Spanish (Wellington's report)"
    sources: ["https://www.historyofwar.org/articles/battles_salamanca.html"]
  burgos:
    name: "Burgos"
    date: 1812-10-18
    field: burgos-1812
    share: null
    engaged: "not found"
