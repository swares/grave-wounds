# A season of service: the Wars of the Roses with Edward of March's men, 1459-1471 (format as
# data/service/peninsula.yaml). The calendar follows a man of Edward's household from Ludford
# Bridge to Tewkesbury: exile at Calais, Northampton, Mortimer's Cross, Ferrybridge and Towton, the
# winter sieges in Northumberland, the long quiet years at home, the flight to Burgundy and the
# return of 1471. Most seasons are quiet: armies were raised for weeks, not years.
# Losses are mostly chroniclers' numbers or modern guesses at them, and give the dead only: a
# battle's share is its dead times four (three wounded for each dead, ours, as for Henry V's war).
# No army-wide totals were found, so the sickness is kept low at home and raised where the
# accounts name hardship (the winter sieges of 1462, the plague years of 1464 and 1467).
# Measured (python3 -m gravewounds service roses_edward): about 0.7% dead of disease a season over
# the war, 0.1% in a season at home, 6.5% in the winter sieges of 1462 (the worst), about 1.6% on the
# winter campaigns of Mortimer's Cross and Towton. The short campaigns are set to good hygiene (ours):
# armies were raised for weeks and lodged in towns, and a whole season at the Peninsula's fair
# camp hygiene gave 5-10% a season, which no account suggests.
# Design and sources: project docs "between-battles-design" and "roses-seasons-research".
id: roses_edward
name: "The Wars of the Roses, with Edward of March (1459-1471)"
era: medieval
regions: [england]
table: towton-1461-all-hits
season_days: 91

# What wounded men in these wars is not counted. Ours, from the Towton grave (Holst and Sutherland
# 2014: of 180 wounds on bone, 131 by blades, 36 blunt, 13 penetrating), with arrows raised:
# an arrow mostly wounds soft tissue and leaves no mark on bone, and both sides' archers shot.
# Guns (Northampton, Barnet, the Burgundian handgunners of 1471) are not among the table's weapons.
weapon_mix:
  - {weapon: longbow, pct: 28}
  - {weapon: bill, pct: 20}
  - {weapon: sword, pct: 17}
  - {weapon: poleaxe, pct: 15}
  - {weapon: dagger, pct: 7}
  - {weapon: axe, pct: 5}
  - {weapon: spear, pct: 5}
  - {weapon: crossbow, pct: 3}

states:
  household: {name: "At home in the household", care: shelter, marched: false, staying: true}
  garrison:  {name: "In garrison at Calais", care: shelter, marched: false, staying: true}
  exile:     {name: "In exile", care: shelter, marched: false, staying: true}
  campaign:  {name: "On campaign", care: field, marched: true, staying: false}
  march:     {name: "On the march", care: field, marched: true, staying: false}
  siege:     {name: "At a siege", care: field, marched: false, staying: true}

positions:
  reserve: {name: "In the rearward", mult: 0.25}
  line:    {name: "In the battle", mult: 1}
  thick:   {name: "In the thick of it", mult: 3}
cap: 90

# No source counts the small fights. The Calais garrison fought Somerset's men from Guînes all
# winter 1459-60; at home a lord's men could be caught up in his neighbours' feuds (the Paston
# letters: Hellesdon 1465, Caister 1469). The chances a season are ours.
small_war:
  chance: {household: 5, garrison: 40, exile: 0, campaign: 40, march: 30, siege: 20}
  hit: 10

sides: {team: "Yorkists", foes: "Lancastrians"}

sources:
  calais: &calais "https://thewarsoftheroses.co.uk/calais"
  santiuste5: &santiuste5 "https://erenow.org/postclassical/edwardivandthewarsoftheroses/5.php"
  north: &north "https://erenow.org/postclassical/abriefhistoryofthewarsoftheroses/16.php"
  plague: &plague "https://thewarsoftheroses.co.uk/plague"
  paston: &paston "https://thisispaston.co.uk/warrosesbattleslist.html"
  hwtowton: &hwtowton "https://www.historyofwar.org/articles/battles_towton.html"
  hwferry: &hwferry "https://www.historyofwar.org/articles/battles_ferrybridge.html"
  tbarnet: &tbarnet "https://www.tewkesbury.org.uk/news/april-14th-1471-the-battle-of-barnet"
  tmarch: &tmarch "https://tewkesbury.org.uk/news/may-3rd-1471-a-forced-march-through-champion-country"

