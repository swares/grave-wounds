actions:
  northampton:
    name: "Northampton"
    date: 1460-07-10
    share: 2
    engaged: "between 20,000 and 40,000 by eyewitnesses, figures not to be taken seriously (historyofwar)"
    lost: "perhaps as few as 300 casualties on both sides; the Yorkists' losses slight"
    sources: ["https://www.historyofwar.org/articles/battles_northampton.html", *santiuste5]
    note: "The share is ours: barely half an hour, the king's guns drowned by the rain, and Grey's men letting the Yorkists over the rampart."
  mortimers_cross:
    name: "Mortimer's Cross"
    date: 1461-02-03
    share: 4
    engaged: "some 5,000 Yorkists against some 6,000 (britishbattles)"
    lost: "Yorkist losses light, no figure; about 2,000 Lancastrians (britishbattles), 4,000 Lancastrian dead (the English Chronicle)"
    sources: ["https://britishbattles.com/wars-of-the-roses/battle-of-mortimers-cross", *santiuste5]
    note: "No Yorkist figure: the share is ours, for losses called light."
  ferrybridge:
    name: "Ferrybridge"
    date: 1461-03-28
    main: false
    share: null
    engaged: "FitzWalter's men holding the bridge, then Edward's reinforcements; about 500 Lancastrians under Clifford (Wikipedia, through wikiwand)"
    lost: "not counted: FitzWalter and the Bastard of Salisbury killed"
    sources: [*hwferry, "https://wikiwand.com/en/articles/Battle_of_Towton"]
    note: "No count of the Yorkist losses: the GM sets the share, or plays it as the small fight The bridge at dawn (or the playtest packet's Ferrybridge)."
  towton:
    name: "Towton"
    date: 1461-03-29
    field: towton-1461
    share: 48
    engaged: "50,000-60,000 in both armies (modern estimates, via Wikipedia); the Lancastrians the larger, so about 25,000 Yorkists (ours)"
    lost: "Yorkist dead 3,000-4,500 (Wikipedia's infobox); 8,000 (Milanese letters); 800 (Bishops Coppini and O'Flanagan); 28,000 dead in all counted by the heralds"
    alt: {share: 13, source: "Coppini's 800 Yorkist dead"}
    sources: [*hwtowton, "https://wikiwand.com/en/articles/Battle_of_Towton"]
    note: "The share is ours: the infobox's lowest Yorkist dead, 3,000, times four, of about 25,000. The sources run from 800 to 8,000 dead."
  barnet:
    name: "Barnet"
    date: 1471-04-14
    share: 20
    engaged: "around 10,000 Yorkists (historic-uk); 7,000-15,000 (Wikipedia)"
    lost: "around 500 Yorkists (historic-uk); 1,000 (Wikipedia)"
    alt: {share: 40, source: "Wikipedia's 1,000 Yorkist casualties of about 10,000"}
    sources: ["https://www.historic-uk.com/HistoryMagazine/DestinationsUK/The-Battle-of-Barnet", "https://mobileapps.wikiwand.com/en/Battle_of_Barnet", *tbarnet]
    note: "Dead only: the share is the dead times four (ours). In the mist the lines overlapped and Oxford's men were taken for the enemy."
  tewkesbury:
    name: "Tewkesbury"
    date: 1471-05-04
    share: 40
    engaged: "some 5,000 Yorkists against some 6,000 (britishbattles); 5,000-6,000 (Wikipedia)"
    lost: "probably around 500 Yorkists killed (britishbattles); unknown (Wikipedia); about 2,000 Lancastrians"
    sources: ["https://britishbattles.com/wars-of-the-roses/battle-of-tewkesbury", "https://wikiwand.com/EN/Battle_of_Tewkesbury"]
    single: true
    note: "One estimate of the Yorkist dead, times four (ours)."

small_fights:
  - id: sandwich
    name: "A raid on a port at dawn"
    what: "Calais men cross the Channel by night and fall on Sandwich early in the morning: Lord Rivers is taken in his bed, with his son and his wife, and the king's new fleet is taken or burned (15 January 1460; Dinham with 800 men, the Paston letters)."
    states: [garrison]
    weight: 2
    where: "a port town's streets and quays"
    time: "early in the morning"
    light: dusk
    ground: town
    team_attacks: true
    side: {name: "The raiding party", men: [50, 800]}
    foes: [{name: "The garrison of the town", men: [30, 300], kit: jack_sallet, weapon: bill}]
    surprise: {text: "The garrison is abed", chance: 60}
    aims: {team: "Take the lords and the ships and get back to the boats.", foes: "Stand to and hold the town."}
    ends: "The raiders win once they hold the quay for 6 rounds; the townsmen give up once a third of those here are down; the raiders fail if a third of theirs are down first."
    sources: ["https://www.historyofwar.org/articles/raid_sandwich_1460.html", *calais]
    note: "The garrison's size is not given: ours."
  - id: newnham
    name: "Holding the bridge in the Pale"
    what: "Somerset's men from Guînes come against Newnham Bridge, on the way into Calais, and are beaten off by the Calais garrison (23 April 1460, St George's Day)."
    states: [garrison]
    weight: 3
    where: "a bridge over the dykes of the Calais marshes"
    time: "by day"
    ground: bridge
    side: {name: "The guard at the bridge", men: [20, 200]}
    foes: [{name: "Somerset's men from Guînes", men: [50, 400], kit: jack_sallet, weapon: bill}]
    aims: {team: "Hold the bridge.", foes: "Force the bridge and the way to Calais."}
    ends: "Somerset's men fall back once a third of those here are down or after 8 rounds; the guard is beaten if it is driven off the bridge."
    sources: [*calais, *santiuste5]
    note: "No numbers in the accounts: the sizes are ours."
  - id: bridge
    name: "The bridge at dawn"
    what: "Lord Clifford's horsemen, about 500, fall on the Yorkists who took the broken bridge the night before and slept by it; FitzWalter is killed coming out of his lodging, and the Lancastrians hold the narrow way against the reinforcements (Ferrybridge, 28 March 1461, as Hall tells it)."
    states: [march, campaign]
    weight: 2
    where: "a broken bridge over a river and its north bank"
    time: "at dawn"
    light: dusk
    ground: bridge
    weather: snow
    side: {name: "The men at the bridge", men: [100, 500]}
    foes: [{name: "Clifford's horsemen", men: [200, 500], kit: jack_sallet, weapon: spear}]
    surprise: {text: "The men at the bridge are asleep", chance: 60}
    aims: {team: "Hold the bridge until the army comes up.", foes: "Drive them off and hold the crossing."}
    ends: "The army's reinforcements come up after 8 rounds; Clifford's men fall back once a third of those here are down; the men at the bridge are beaten if they are driven over it."
    sources: [*hwferry, "https://wikiwand.com/en/articles/Battle_of_Towton"]
    note: "Accounts differ (Waurin has a fight between scouts south of the bridge). The Yorkist numbers are ours; the playtest packet (templates/playtest/packet.md) has a fuller Ferrybridge."
  - id: dale
    name: "Catching the rear-guard in a dale"
    what: "Fauconberg's men, over the Aire by the ford upstream, catch Clifford's men falling back north and kill them in Dinting Dale, Clifford by an arrow in the throat (28 March 1461)."
    states: [march, campaign]
    weight: 1
    where: "a small dale on the road north"
    time: "in the afternoon"
    ground: heath
    weather: snow
    team_attacks: true
    side: {name: "Fauconberg's men", men: [100, 500]}
    foes: [{name: "Clifford's rear-guard", men: [50, 300], kit: jack_sallet, weapon: spear}]
    aims: {team: "Catch them before they reach their army.", foes: "Get away north to the main army."}
    ends: "The rear-guard escapes if it holds together for 6 rounds; it is cut down once half of those here are down."
    sources: [*hwferry, "https://wikiwand.com/en/articles/Battle_of_Towton"]
    note: "Numbers are not given: ours."
  - id: scurriers
    name: "Scurriers in the town"
    what: "The king's fore-riders find the enemy's scurriers in a town at nightfall and chase them out of it, and the army lodges close before the enemy in the dark (Barnet, 13 April 1471, the Arrivall)."
    states: [march, campaign]
    weight: 3
    where: "a town's street at nightfall"
    time: "at nightfall"
    light: dusk
    ground: town
    team_attacks: true
    side: {name: "The fore-riders", men: [20, 100]}
    foes: [{name: "The enemy's scurriers", men: [20, 100], kit: jack_sallet, weapon: spear}]
    aims: {team: "Clear the town for the army.", foes: "See what is coming and get back."}
    ends: "The scurriers ride off once a third of those here are down or after 4 rounds; the fore-riders fall back if half of theirs are down."
    sources: [*tbarnet]
    note: "No numbers given: ours."
  - id: house
    name: "Holding the house"
    what: "A lord's men lay siege to a household's castle in a quarrel over land: about thirty men and four hired soldiers hold Caister for a month against the Duke of Norfolk's men (three hundred, or three thousand by William Worcester), with guns and crossbows on both sides; John Daubeney is killed by a bolt and two of the duke's men by gunshot, and the garrison yields for want of powder (21 August-September 1469)."
    states: [household]
    weight: 2
    where: "a house's walls and gatehouse"
    time: "by day"
    ground: town
    side: {name: "The garrison", men: [10, 34]}
    foes: [{name: "The duke's men", men: [100, 300], kit: jack_sallet, weapon: crossbow}]
    aims: {team: "Hold the house.", foes: "Take the house."}
    ends: "The attackers give up for the day after 8 rounds; the garrison yields once a third of those here are down."
    sources: ["https://thisispaston.co.uk/caistersiege.html"]
    note: "The roller has no castle ground: lay walls on town ground. The foes here are a Yorkist duke's men: the sides' names are the roller's, not the quarrel's."
  - id: raid
    name: "A night raid on a manor"
    what: "A neighbour's men come at midnight to sack a manor while its lord is away, pull down the house and lodge, and rob the church (Hellesdon, 15 October 1465: the Duke of Suffolk's men, against Margaret Paston's household)."
    states: [household]
    weight: 1
    where: "a manor house and its lodge"
    time: "at midnight"
    light: night
    ground: village
    side: {name: "The household", men: [5, 30]}
