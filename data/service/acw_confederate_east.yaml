small_fights:
  - id: picket_raid
    name: "Raiding the picket line"
    what: "Cavalry crosses the river in the snow, takes the vedettes and rolls up the picket line until the infantry pickets' fire and a counter-charge stop them (Hartwood Church, 25 February 1863: Fitzhugh Lee's about 400)."
    states: [quarters]
    weight: 2
    at: 1862-winter
    where: "the enemy's picket line across the river"
    time: "in the morning"
    ground: forest
    weather: snow
    team_attacks: true
    side: {name: "The raiders", men: [40, 400]}
    foes: [{name: "The Union pickets", men: [20, 60], weapon: rifle_musket}]
    surprise: {text: "The vedettes are taken before they can fire", chance: 40}
    aims: {team: "Roll up the pickets, take prisoners and get back over the river.", foes: "Hold the line until the reserve comes up."}
    ends: "The raiders go back over the river after 8 rounds or once a third of theirs are down; the pickets are beaten once a third of theirs are down or they lose the line."
    end: {rounds: 8, wins: team, down: {team: 0.33, foes: 0.33}, hold: foes}
    sources: ["https://civildiscourse-historyblog.com/blog/2015/8/3/a-challenge-issued-the-hartwood-church-raid"]
    note: "The other side of acw_union_east's The picket line rushed: the Union lost about 150 taken and 36 others, the Confederates 14 (a single account)."
  - id: foragers
    name: "Foragers meet foragers"
    what: "Both sides out foraging with their wagons meet on a road; the Confederates attack through the pine woods against a hill the Union holds, and draw off after two hours to cover their own wagons (Dranesville, 20 December 1861: Stuart's about 2,500 covering 200 wagons)."
    states: [quarters, campaign]
    weight: 2
    at: 1861-winter
    where: "the woods below a hill by a crossroads"
    time: "about noon"
    ground: hills
    team_attacks: true
    side: {name: "The covering party", men: [40, 200]}
    foes: [{name: "Union infantry", men: [40, 200], weapon: rifle_musket}]
    aims: {team: "Hold them off the road until the wagons are away.", foes: "Hold the hill."}
    ends: "The covering party has done enough after 10 rounds; it draws off once a third of theirs are down."
    end: {rounds: 10, wins: team, down: {team: 0.33, foes: 0.33}}
    sources: ["https://warfarehistorynetwork.com/article/battle-of-dranesville/"]
    note: "The Union lost 73, the Confederates 195. Here a company's part of it."
  - id: ford
    name: "Holding the ford"
    what: "Enemy troops cross a ford to see what holds the bank; the pickets and their supports fight them all day until they go back after dark (Morton's Ford, 6-7 February 1864)."
    states: [quarters]
    weight: 2
    at: 1863-winter
    where: "the south bank of a ford on the Rapidan"
    time: "by day"
    ground: ford
    side: {name: "The pickets and supports", men: [20, 80]}
    foes: [{name: "Union skirmishers", men: [40, 120], weapon: rifle_musket}]
    aims: {team: "Hold the bank.", foes: "Get over, find what holds the bank, and come back."}
    ends: "The skirmishers go back after 8 rounds or once a third of theirs are down; the pickets are beaten if they lose the bank."
    end: {rounds: 8, wins: team, down: {foes: 0.33}, hold: team}
    sources: ["https://hd.housedivided.dickinson.edu/node/41731"]
    note: "About 200 killed and wounded on the two sides together (a single account). The sizes are ours."
  - id: rifle_pits
    name: "Raiding the rifle pits before dawn"
    what: "Picked sharpshooters creep on the enemy's picket rifle pits at 4 in the morning, carry part of the line and are back by sunrise with blankets and food (Petersburg, 31 December 1864: 16 picked men of Scales's and McGowan's sharpshooters)."
    states: [siege]
    weight: 4
    at: 1864-winter
    where: "the enemy's picket rifle pits before his works"
    time: "about 4 in the morning"
    light: night
    ground: open
    team_attacks: true
    side: {name: "The sharpshooters", men: [16, 60]}
    foes: [{name: "The Union picket detail", men: [20, 60], weapon: rifle_musket}]
    surprise: {text: "The raiders are among the pits before the alarm", chance: 40}
    aims: {team: "Take the pits, prisoners and supplies, and get back before light.", foes: "Hold the pits and raise the alarm."}
    ends: "The raiders win if they take the pits; at sunrise, after 6 rounds, they must go back with what they have; they fall back once a third of theirs are down."
    end: {rounds: 6, wins: none, down: {team: 0.33}, hold: foes}
    sources: ["https://www.beyondthecrater.com/news-and-notes/siege-of-petersburg-sesquicentennial/150-years-ago-today/150-18641231-scales-mcgowan-ss-vs-6th-corps/"]
    note: "The Union lost 2 killed, 3 wounded and 37 missing, the raiders 1 wounded by his own gun."
  - id: stedman
    name: "Before dawn on the works"
    what: "Pioneers with axes cut through the obstacles before dawn, the storming party of sharpshooters behind them, and the columns take the fort and its batteries, until the next fort holds and the guns and reserves come up at first light (Fort Stedman, 25 March 1865: 50-man pioneer detachments and 100-300 sharpshooters at the head of each column)."
    states: [siege, campaign]
    weight: 1
    at: 1865-spring
    where: "the enemy's fort and the lines either side of it"
    time: "about 4 in the morning"
    light: night
    ground: open
    team_attacks: true
    side: {name: "The storming party", men: [100, 300]}
    foes: [{name: "The fort's garrison", men: [50, 200], weapon: rifle_musket}]
    surprise: {text: "The pickets are taken in the dark before they fire", chance: 50}
    aims: {team: "Take the fort and open the way for the columns.", foes: "Hold until the guns and reserves come up."}
    ends: "The storming party wins if it takes the fort; at first light, after 8 rounds, the reserves come up and it must go back; it falls back once a third of theirs are down."
    end: {rounds: 8, wins: foes, down: {team: 0.33}, hold: foes}
    sources: ["https://www.battlefields.org/learn/articles/americas-civil-war-pre-dawn-assault-fort-stedman"]
    note: "Over 2,600 Confederate losses, more than 1,000 of them taken. The roller has no works on open ground: lay them with Paint ground."
  - id: kearneysville
    name: "A skirmish in the lower Valley"
    what: "An enemy reconnaissance pushes up the railroad to see where the army lies; the regiment's companies meet it and fall back fighting (Kearneysville, 16 October 1862: the 4th Virginia 3 killed and 14 wounded, its colonel wounded)."
    states: [campaign]
    weight: 2
    at: 1862-autumn
    where: "fields and woods along a railroad"
    time: "by day"
    ground: farmland
    side: {name: "The regiment's companies", men: [50, 200]}
    foes: [{name: "Union infantry", men: [50, 300], weapon: rifle_musket}]
    aims: {team: "Hold them long enough to see what they are, then fall back in order.", foes: "Find where the army lies."}
    ends: "The companies have done enough after 6 rounds; they are beaten once a third of theirs are down; the enemy goes back once a third of theirs are down."
    end: {rounds: 6, wins: team, down: {team: 0.33, foes: 0.33}}
    sources: [*wp4va]
    note: "The sizes are ours."
  - id: mule_shoe
    name: "The salient rushed at dawn"
    what: "A whole corps comes out of the fog at first light on a salient whose guns were taken away the night before; it is over the works before most can fire, and most of a division is taken (the Mule Shoe at Spotsylvania, 12 May 1864: the 4th Virginia 7 killed, 6 wounded, 126 taken)."
    states: [campaign]
    weight: 1
    at: 1864-spring
    where: "the works of a salient in the woods"
    time: "about 4:30 in the morning"
    light: dusk
    ground: forest
    weather: fog
