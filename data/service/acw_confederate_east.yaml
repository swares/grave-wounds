# A season of service: a Confederate infantry regiment of the Army of Northern Virginia, 1861-1865
# (format as data/service/peninsula.yaml). The calendar follows the 4th Virginia Infantry of the
# Stonewall Brigade (Wikipedia's regimental history): First Manassas, Jackson's Valley campaign,
# the Seven Days, Second Manassas, Antietam, Fredericksburg, Chancellorsville, Culp's Hill, Mine
# Run, the Wilderness, the Mule Shoe, Early's Valley campaign of 1864, Petersburg and Appomattox.
# The other side of acw_union_east.yaml. Army losses are Livermore's (Numbers and Losses, 1900)
# and Fox's Confederate tables (Regimental Losses, 1889, ch. XV), via the acw_battle_data project's
# transcriptions, with strengths from the NPS's second battlefield survey (CWSAC II) where
# Livermore has none, and the American Battlefield Trust; shares are our calculation (killed and
# wounded of those engaged). The army-wide totals are the National Park Service's (94,000 killed in
# battle, 194,026 wounded, 164,000 dead of disease; Fry's incomplete rolls give 59,297 of disease,
# a minimum), against Livermore's mean strength on five dates, 1862-65 (about 420,000): about 2.4%
# dead of disease a season. Each season's hygiene and sickly weeks are ours, tuned toward that.
# Measured (python3 -m gravewounds service acw_confederate_east): about 2.45% dead of disease a
# season against the totals' 2.44%; the worst seasons are the Romney expedition in the snow (about
# 7%), the camps about Centreville in autumn 1861 (6%) and the Petersburg trenches (5%). Hits about
# 12.5% a season at every main action in the line, against the whole army's 4.3%.
# Design and sources: project docs "between-battles-design" and "acw-confederate-research".
id: acw_confederate_east
name: "The Civil War in the East: a Confederate regiment (1861-1865)"
era: civil_war
regions: [confederacy]
table: acw-1861-all-hits
season_days: 91

# As acw_union_east (the Medical and Surgical History's Union wounds by cause, ours for the
# Confederates: the same arms on both sides; no Confederate count was found).
weapon_mix:
  - {weapon: rifle_musket, pct: 89.53}
  - {weapon: artillery_acw, pct: 9.82}
  - {weapon: saber, pct: 0.32}
  - {weapon: bayonet, pct: 0.33}

states:
  quarters: {name: "In camp or winter quarters", care: shelter, marched: false, staying: true}
  campaign: {name: "On campaign", care: field, marched: true, staying: false}
  march:    {name: "On the march", care: field, marched: true, staying: false}
  siege:    {name: "In the siege lines", care: field, marched: false, staying: true}

positions:
  reserve: {name: "In reserve", mult: 0.25}
  line:    {name: "In the line", mult: 1}
  thick:   {name: "In the thick of it", mult: 4}
cap: 90

# As acw_union_east: no count of the small war on the Confederate side; the chances are ours.
small_war:
  chance: {quarters: 20, campaign: 40, march: 25, siege: 45}
  hit: 10

sides: {team: "Confederate", foes: "Union"}

# Followers through a season (team builder): each of the team's followers is rolled as a named man
# is (hit, sickness, taken), and then, if still with the team, d10000 against `desertion.share` x 100
# (the season's own `desertion` where it gives one). drafts - the states in which recruits come up to
# fill the followers lost (data/followers.yaml `drafts`). Project doc "follower-drift-research".
desertion:
  share: 1.1
  basis: "Lonn: about 103,400 enlisted men deserted (Livermore: 82,922). On the mean strength of 420,162 over 16 seasons that is 1.54% a season (ours); the winter of 1864-65 is set apart (its own share) and the rest tuned to keep the mean (ours)."
  sources: ["https://www.georgiaencyclopedia.org/articles/history-archaeology/desertion-during-the-civil-war/", "https://armyheritage.org/wp-content/uploads/ref-bibs/subjects/Military%20Service/Desertion/Desertion%20Statistics.pdf"]
drafts: [quarters]

sources:
  wp4va: &wp4va "https://en.wikipedia.org/wiki/4th_Virginia_Infantry_Regiment"
  livermore: &livermore "https://github.com/jrnold/acw_battle_data/blob/master/rawdata/livermore1900/livermore.csv"
  foxcs: &foxcs "https://github.com/jrnold/acw_battle_data/blob/master/rawdata/fox1898/fox_forces.csv"
  cws2: &cws2 "https://github.com/jrnold/acw_battle_data/blob/master/rawdata/cws2/cws2.json"
  fox15: &fox15 "https://wargame.ch/wc/acw/sub/vmi/AoA/Library/Fox/Chapter%20XV.htm"
  fox15r: &fox15r "https://wargame.ch/wc/acw/sub/vmi/AoA/Library/Fox/Chapter%20XV%20-%20ConfRegimentalLosses.htm"
  nps: &nps "https://nps.gov/civilwar/facts.htm"
  camps61: &camps61 "https://dclawyeronthecivilwar.blogspot.com/2012/01/winter-in-confederate-camps-around_23.html?m=1"

seasons:
  - {id: 1861-summer, name: "Summer 1861", state: campaign, hygiene: good, factors: {hot: 1}, actions: [first_manassas],
     what: "From Harpers Ferry to Manassas by rail; First Manassas (21 July), where the brigade stood on Henry Hill and Jackson got his name.", sources: [*wp4va]}
  - {id: 1861-autumn, name: "Autumn 1861", state: quarters, hygiene: fair, factors: {crowded: 4}, actions: [],
     what: "The camps about Centreville: measles, mumps, typhoid and pneumonia among men from the country who had never had them; many off on sick furlough.", sources: [*camps61]}
  - {id: 1861-winter, name: "Winter 1861-62", state: march, hygiene: fair, factors: {cold_wet: 3}, actions: [],
     what: "To Winchester with Jackson; the Romney expedition (1-24 January) in snow, sleet and ice, 'almost an uninterrupted sheet of ice'.", sources: ["https://en.wikipedia.org/wiki/Romney_Expedition", *wp4va]}
  - {id: 1862-spring, name: "Spring 1862", state: campaign, hygiene: good, factors: {}, actions: [kernstown, mcdowell, winchester],
     what: "Jackson's Valley campaign: Kernstown (23 March), at a third of its strength; McDowell, Front Royal and Winchester (25 May): 646 miles in 28 days.", sources: [*wp4va]}
  - {id: 1862-summer, name: "Summer 1862", state: campaign, hygiene: fair, factors: {hot: 1, warm: 6}, actions: [port_republic, seven_days, cedar_mountain, second_manassas],
     what: "Port Republic (9 June), then to Richmond for the Seven Days (Gaines's Mill, Malvern Hill); Cedar Mountain (9 August), where Winder fell; Second Manassas, the ranks under a hundred.", sources: [*wp4va]}
  - {id: 1862-autumn, name: "Autumn 1862", state: campaign, hygiene: good, factors: {}, actions: [antietam],
     what: "Harpers Ferry and Sharpsburg (17 September), the brigade 250 strong; the skirmish at Kearneysville (16 October).", sources: [*wp4va]}
  - {id: 1862-winter, name: "Winter 1862-63", state: quarters, hygiene: fair, factors: {cold_wet: 2, crowded: 2}, actions: [fredericksburg],
     what: "Fredericksburg (13 December), held in reserve; smallpox in the camps by December.", sources: [*wp4va]}
  - {id: 1863-spring, name: "Spring 1863", state: quarters, hygiene: good, factors: {}, actions: [chancellorsville],
     what: "Chancellorsville: the flank march and the attack of 3 May, where the brigade lost 160 of 355.", sources: [*wp4va, *fox15r]}
  - {id: 1863-summer, name: "Summer 1863", state: campaign, hygiene: good, factors: {hot: 1}, actions: [gettysburg],
     what: "North into Pennsylvania; Culp's Hill (2-3 July): 18 killed, 50 wounded, 69 taken, and the flag lost; 66 men recrossed the Potomac.", sources: [*wp4va]}
  - {id: 1863-autumn, name: "Autumn 1863", state: campaign, hygiene: good, factors: {}, actions: [mine_run],
     what: "The Bristoe campaign; Mine Run and Payne's Farm (27 November).", sources: [*wp4va]}
  - {id: 1863-winter, name: "Winter 1863-64", state: quarters, hygiene: fair, factors: {cold_wet: 2}, actions: [],
     what: "Winter camps on the Rapidan, short of shoes, socks and food; replacements bring the regiment back to about 200.", sources: [*wp4va]}
  - {id: 1864-spring, name: "Spring 1864", state: campaign, hygiene: good, factors: {}, actions: [wilderness, spotsylvania],
     what: "The Wilderness, then the Mule Shoe at Spotsylvania (12 May): 7 killed, 6 wounded and 126 taken, and the Stonewall Brigade ends as a brigade.", sources: [*wp4va]}
  - {id: 1864-summer, name: "Summer 1864", state: march, hygiene: good, factors: {hot: 2}, actions: [monocacy],
     what: "With Early to Lynchburg and down the Valley into Maryland: Monocacy (9 July) and the skirmish before Washington.", sources: [*wp4va, "https://www.battlefields.org/learn/civil-war/battles/monocacy"]}
  - {id: 1864-autumn, name: "Autumn 1864", state: campaign, hygiene: good, factors: {}, actions: [opequon, fishers_hill, cedar_creek],
     what: "Sheridan's Valley campaign: Third Winchester (19 September), Fisher's Hill, Cedar Creek (19 October).", sources: [*wp4va]}
  - {id: 1864-winter, name: "Winter 1864-65", state: siege, hygiene: fair, factors: {cold_wet: 3}, desertion: 8, desertion_note: "Lee: 1,094 deserted between 15 and 25 February 1865, 72 of them from Gordon's division; 'hundreds of men are deserting nightly' (OR I/46/2, pp. 1258, 1265). A season: ours.",
     actions: [],
     what: "Back to Lee at Petersburg: the trench lines in winter, on short rations.", sources: [*wp4va]}
  - {id: 1865-spring, name: "Spring 1865", state: campaign, hygiene: fair, factors: {}, actions: [fort_stedman, appomattox],
     what: "Fort Stedman (25 March), the fall of Petersburg and the retreat; Appomattox (9 April): 5 lieutenants and 38 men, 17 of them armed.", sources: [*wp4va]}

