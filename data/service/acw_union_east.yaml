# A season of service: a Union infantry regiment of the Army of the Potomac, 1861-1865 (format as
# data/service/peninsula.yaml). The calendar follows the 2nd Vermont Infantry's record (Dyer's
# Compendium), which served with the Army of the Potomac throughout but for the VI Corps in the
# Valley in 1864. Losses from Fox, Regimental Losses (1889), and the American Battlefield Trust;
# shares are our calculation (killed and wounded of those engaged). Each season's hygiene and sickly
# weeks are ours, tuned toward the records: about 1.1% dead of disease a season against the whole
# Union army's 0.72% (Fox, on a three-year basis), the most of it in summer 1862 on the Peninsula
# and at Harrison's Landing (about 4%; Letterman gives a fifth sick, but no deaths). "In the thick
# of it" is ×4 (ours): the army's share against the worst regiments' (Gettysburg 19% and the 1st
# Minnesota 82%; Antietam 13% and the 12th Massachusetts 64%). Design and sources: project doc
# "between-battles-design".
id: acw_union_east
name: "The Civil War in the East: a Union regiment (1861-1865)"
era: civil_war
regions: [union]
table: acw-1861-all-hits
season_days: 91

# Wounds by cause treated in the field hospitals (Medical and Surgical History, vol. II pt. III,
# p. 696, as quoted on CivilWarTalk): small arms 127,929, artillery 14,032, sabre and bayonet 922
# (split evenly between them: ours); 103,829 of unknown missile left out.
weapon_mix:
  - {weapon: rifle_musket, pct: 89.53}
  - {weapon: artillery_acw, pct: 9.82}
  - {weapon: saber, pct: 0.32}
  - {weapon: bayonet, pct: 0.33}

states:
  quarters: {name: "In camp or winter quarters", care: shelter, marched: false, staying: true}
  campaign: {name: "On campaign", care: field, marched: true, staying: false}
  march:    {name: "On the march", care: field, marched: true, staying: false}
  siege:    {name: "In the siege lines", care: field, marched: false, staying: true}

positions:
  reserve: {name: "In reserve", mult: 0.25}
  line:    {name: "In the line", mult: 1}
  thick:   {name: "In the thick of it", mult: 4}
cap: 90

# Small fights: Fox counts 1,882 engagements, battles, skirmishes and affairs in which at least one
# Union regiment was engaged, of which 112 were battles with over 500 killed and wounded on a side;
# the 2nd Vermont's record lists about 40 named actions in four years, 9 of them major battles, and
# leaves out the picket firing. The chances a season are ours.
small_war:
  chance: {quarters: 20, campaign: 40, march: 25, siege: 45}
  hit: 10

sides: {team: "Union", foes: "Confederate"}

sources:
  dyer: &dyer "https://generalstaff.org/WFA/Dyers/VT_Inf_US.htm"
  fox61: &fox61 "https://wargame.ch/wc/acw/sub/vmi/AoA/Library/Fox/Chapter%20XIV%20-%201861.htm"
  fox62: &fox62 "https://wargame.ch/wc/acw/sub/vmi/AoA/Library/Fox/Chapter%20XIV%20-%201862.htm"
  fox63: &fox63 "https://wargame.ch/wc/acw/sub/vmi/AoA/Library/Fox/Chapter%20XIV%20-%201863.htm"
  fox64: &fox64 "https://wargame.ch/wc/acw/sub/vmi/AoA/Library/Fox/Chapter%20XIV%20-%201864.htm"
  fox65: &fox65 "https://wargame.ch/wc/acw/sub/vmi/AoA/Library/Fox/Chapter%20XIV%20-%201865.htm"
  fox3: &fox3 "https://wargame.ch/wc/acw/sub/vmi/AoA/Library/Fox/Chapter%20III.htm"
  fox5: &fox5 "https://wargame.ch/wc/acw/sub/vmi/AoA/Library/Fox/Chapter%20V.htm"
  tripler61: &tripler61 "https://rebellionrecord61-65.blogspot.com/2012/01/january-4-1862-friday-health-of-army-of.html"
  letterman: &letterman "https://www.historyofwar.org/sources/acw/officialrecords/vol011chap023part1/00011_01.html"

seasons:
  - {id: 1861-summer, name: "Summer 1861", state: campaign, hygiene: good, factors: {hot: 1}, actions: [bull_run],
     what: "The advance on Manassas and Bull Run (21 July), then the defences of Washington.", sources: [*dyer]}
  - {id: 1861-autumn, name: "Autumn 1861", state: quarters, hygiene: fair, factors: {}, actions: [balls_bluff],
     what: "Camps about Washington, with picket duty and reconnaissances: typhoid and remittent fevers and measles; about 6% sick at each month's end, some 290 dead a month of 117,000-143,000 (Tripler).",
     sources: [*dyer, *tripler61]}
  - {id: 1861-winter, name: "Winter 1861-62", state: quarters, hygiene: good, factors: {cold_wet: 2}, actions: [],
     what: "Winter quarters in the defences of Washington.", sources: [*dyer, "https://battlefields.org/learn/articles/winter-encampments"]}
  - {id: 1862-spring, name: "Spring 1862", state: siege, hygiene: good, factors: {}, actions: [williamsburg, seven_pines],
     what: "By sea to the Peninsula: the siege of Yorktown (5 April-4 May; 2,000 sick there on 19 May), Williamsburg, up the Chickahominy, Seven Pines.",
     sources: [*dyer, "https://www.historyofwar.org/sources/acw/officialrecords/vol011chap023part1/00010_10.html"]}
  - {id: 1862-summer, name: "Summer 1862", state: campaign, hygiene: fair, factors: {hot: 1, warm: 13, marsh: 3}, actions: [seven_days, second_bull_run],
     what: "The Seven Days, then Harrison's Landing on the James to mid-August, where at least a fifth were sick with malaria and scurvy (Letterman); Second Bull Run.",
     sources: [*dyer, *letterman]}
  - {id: 1862-autumn, name: "Autumn 1862", state: campaign, hygiene: good, factors: {}, actions: [south_mountain, antietam],
     what: "South Mountain and Antietam; camp at Hagerstown; the march to Falmouth.", sources: [*dyer]}
  - {id: 1862-winter, name: "Winter 1862-63", state: quarters, hygiene: good, factors: {cold_wet: 3}, actions: [fredericksburg],
     what: "Fredericksburg (13 December), then the camps about Falmouth; the Mud March (20-24 January) and scurvy in the camps.",
     sources: [*dyer, "https://nps.gov/articles/000/mudmarch.htm", "https://discoverstafford.org/artifact/civil-war-reconstruction-2/civil-war/civil-war-overview/"]}
  - {id: 1863-spring, name: "Spring 1863", state: quarters, hygiene: good, factors: {}, actions: [chancellorsville],
     what: "The Falmouth camps (46 to 90 sick per 1,000 by corps at the end of March), then Chancellorsville.",
     sources: [*dyer, "https://civilwar.com/official-record/912-chancellorsville-part-ii/186458-240-series-i-volume-xxv-ii-serial-40-chancellorsville-part-ii.html"]}
  - {id: 1863-summer, name: "Summer 1863", state: campaign, hygiene: good, factors: {hot: 1}, actions: [gettysburg],
     what: "The march north and Gettysburg; then camps on the Rappahannock.", sources: [*dyer]}
  - {id: 1863-autumn, name: "Autumn 1863", state: campaign, hygiene: good, factors: {}, actions: [bristoe, mine_run],
     what: "The Bristoe campaign and the fight at Auburn; Rappahannock Station; Mine Run.", sources: [*dyer]}
  - {id: 1863-winter, name: "Winter 1863-64", state: quarters, hygiene: good, factors: {cold_wet: 2}, actions: [],
     what: "Winter quarters about Brandy Station and Culpeper, with pickets on the Rapidan; Morton's Ford (6-7 February).",
     sources: ["https://stonesentinels.com/less-known/brandy-station/historical-wayside-markers/army-potomac-brandy-station/"]}
  - {id: 1864-spring, name: "Spring 1864", state: campaign, hygiene: good, factors: {}, actions: [wilderness, spotsylvania],
     what: "The Overland campaign: the Wilderness, Spotsylvania, North Anna.", sources: [*dyer]}
  - {id: 1864-summer, name: "Summer 1864", state: siege, hygiene: good, factors: {hot: 1}, actions: [cold_harbor, petersburg, crater],
     what: "Cold Harbor, then the assaults on Petersburg and the siege lines, under 400 yards apart in places; the Crater (30 July).",
     sources: [*dyer, "https://encyclopediavirginia.org/entries/petersburg-campaign/"]}
  - {id: 1864-autumn, name: "Autumn 1864", state: siege, hygiene: good, factors: {}, actions: [],
     what: "The Petersburg lines and the battles on the flank; the Coggins Point cattle raid (16 September).",
     sources: ["https://npshistory.com/publications/civil_war_series/20/sec4.htm"]}
  - {id: 1864-winter, name: "Winter 1864-65", state: siege, hygiene: good, factors: {cold_wet: 2}, actions: [],
     what: "Winter camps in the Petersburg lines: the picket lines raided; Hatcher's Run (5-7 February).",
     sources: ["https://encyclopediavirginia.org/entries/petersburg-campaign/"]}
  - {id: 1865-spring, name: "Spring 1865", state: campaign, hygiene: good, factors: {}, actions: [fort_stedman, appomattox],
     what: "Fort Stedman (25 March), the breakthrough at Petersburg (2 April), Sailor's Creek and Appomattox (9 April).",
     sources: [*dyer, "https://home.nps.gov/pete/learn/historyculture/battle-of-fort-stedman.htm"]}

