small_fights:
  - id: picket
    name: "The picket line rushed"
    what: "Cavalry comes over the river in the snow, takes the vedettes and rolls up the picket line until the infantry pickets' fire and a counter-charge stop them (Hartwood Church, 25 February 1863)."
    states: [quarters, siege]
    weight: 3
    where: "the picket line on the Rappahannock"
    time: "in the morning"
    ground: forest
    weather: snow
    side: {name: "The pickets", men: [20, 60]}
    foes: [{name: "Virginia cavalry", men: [40, 400], weapon: saber}]
    surprise: {text: "The vedettes are taken before they can fire", chance: 40}
    aims: {team: "Hold the line until the reserve comes up.", foes: "Roll up the pickets and take prisoners."}
    ends: "The reserve comes up after 6 rounds; the raiders go back over the river once a third of those here are down or after 8 rounds; the pickets are beaten if they are broken."
    end: {rounds: 8, wins: team, down: {foes: 0.33}}
    sources: ["https://civildiscourse-historyblog.com/blog/2015/8/3/a-challenge-issued-the-hartwood-church-raid"]
    note: "Fitzhugh Lee's about 400 of the 1st, 2nd and 3rd Virginia Cavalry; the Union lost about 150 taken and 36 others, the Confederates 14 (a single account)."
  - id: wagons
    name: "Partisans on the wagon train"
    what: "At dawn as the train starts out, partisans with two guns hit its front, centre and rear; the guard, a company to every 20 wagons, is overpowered at the rear but drives them from the town (Berryville, 13 August 1864)."
    states: [campaign, march]
    weight: 3
    where: "the wagon train in a town street"
    time: "about 4 in the morning"
    light: dusk
    ground: town
    side: {name: "The train guard", men: [20, 80]}
    foes: [{name: "Mosby's partisans", men: [30, 200], weapon: revolver}]
    surprise: {text: "The partisans come in on the wagons as they start", chance: 50}
    aims: {team: "Save the wagons and drive the raiders off.", foes: "Burn the wagons and take the mules and prisoners."}
    ends: "The raiders ride off once a third of those here are down or after 6 rounds; the guard is beaten if it is broken."
    end: {rounds: 6, wins: team, down: {foes: 0.33}}
    sources: ["https://dan-masters-civil-war.blogspot.com/2020/07/lost-from-or-volume-i-berryville-wagon.html"]
    note: "About 200 partisans against the 144th Ohio, about 280 engaged; the Union lost 5 killed, 6 wounded and 60 taken or missing (Miller's report)."
  - id: foragers
    name: "Foragers meet foragers"
    what: "Both sides out foraging with their wagons meet on a road; the Union holds a hill and the Confederates attack through the pine woods, then draw off after two hours (Dranesville, 20 December 1861)."
    states: [quarters, campaign]
    weight: 2
    where: "a hill by a crossroads"
    time: "about noon"
    ground: hills
    side: {name: "The foraging party's guard", men: [40, 200]}
    foes: [{name: "Confederate infantry", men: [40, 200], weapon: rifle_musket}]
    aims: {team: "Hold the hill and get the wagons away.", foes: "Drive them off the road and cover their own wagons."}
    ends: "The Confederates draw off once a third of those here are down or after 10 rounds; the guard is beaten if it is driven off the hill."
    end: {rounds: 10, wins: team, down: {foes: 0.33}, hold: team}
    sources: ["https://warfarehistorynetwork.com/article/battle-of-dranesville/"]
    note: "Ord's about 4,500 with 40 wagons against Stuart's about 2,500 covering 200; the Union lost 73, the Confederates 195. Here a company's part of it."
  - id: reconnaissance
    name: "A reconnaissance over the river"
    what: "Troops cross a ford to see what holds the far bank, fight all day and come back after dark (Morton's Ford, 6-7 February 1864)."
    states: [quarters]
    weight: 2
    where: "a ford on the Rapidan"
    time: "by day"
    ground: ford
    team_attacks: true
    side: {name: "The skirmishers", men: [40, 120]}
    foes: [{name: "Confederate pickets", men: [20, 80], weapon: rifle_musket}]
    aims: {team: "Get over, find what holds the bank, and come back.", foes: "Hold the bank."}
    ends: "The skirmishers win if they reach the far edge and come back; they fall back once a third of those here are down."
    end: {down: {team: 0.33}}
    sources: ["https://hd.housedivided.dickinson.edu/node/41731"]
    note: "Elements of the II and III Corps; about 200 killed and wounded on the two sides together (a single account). The sizes are ours."
  - id: rifle_pits
    name: "The rifle pits raided before dawn"
    what: "Picked sharpshooters creep on the picket rifle pits at 4 in the morning, carry part of the line and are gone by sunrise with blankets and food (Petersburg, 31 December 1864; Fort Stedman's pickets, 25 March 1865)."
    states: [siege]
    weight: 4
    where: "the picket rifle pits before the works"
    time: "about 4 in the morning"
    light: night
    ground: open
    side: {name: "The picket detail", men: [20, 60]}
    foes: [{name: "Confederate sharpshooters", men: [16, 60], weapon: rifle_musket}]
    surprise: {text: "The raiders are among the pits before the alarm", chance: 40}
    aims: {team: "Hold the pits and raise the alarm.", foes: "Take the pits, prisoners and supplies, and get back before light."}
    ends: "The raiders go back after 6 rounds (sunrise) or once a third of those here are down; the pickets are beaten if they lose the pits."
    end: {rounds: 6, wins: team, down: {foes: 0.33}, hold: team}
    sources: ["https://www.beyondthecrater.com/news-and-notes/siege-of-petersburg-sesquicentennial/150-years-ago-today/150-18641231-scales-mcgowan-ss-vs-6th-corps/", "https://www.battlefields.org/learn/articles/americas-civil-war-pre-dawn-assault-fort-stedman"]
    note: "31 December: led by 16 picked men of Scales's and McGowan's sharpshooters; the Union lost 2 killed, 3 wounded and 37 missing, the raiders 1 wounded by his own gun. A deserter had warned the Union side."
  - id: post
    name: "Partisans on an outpost by night"
    what: "Partisans slip through a gap in the pickets in the rain with a deserter for a guide and take a general, his officers, men and horses without a shot (Fairfax Court House, 8-9 March 1863)."
    states: [quarters]
    weight: 1
    where: "a headquarters in a village behind the lines"
    time: "about 2 in the morning"
    light: night
    ground: village
    weather: rain
    side: {name: "The headquarters guard", men: [10, 40]}
    foes: [{name: "Mosby's partisans", men: [20, 40], weapon: revolver}]
