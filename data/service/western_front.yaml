# A season of service: a British Regular infantry battalion on the Western Front, 1914-1918 (format
# as data/service/peninsula.yaml). The calendar follows the 2nd Royal Welch Fusiliers (19th Brigade,
# then the 33rd and 38th Divisions), whose war Dunn's The War the Infantry Knew records and Graves
# and Sassoon served in; Dunn himself was not reached, so the battalion's record comes from the Long,
# Long Trail, the 33rd Division's history (1921), Graves and the battalion's memorial pages.
# The battles are counted by divisions, not men: a battle's share is its British loss against its
# divisions at 18,000 men each (ours, a division's establishment of all arms), so most shares are
# ours, and for the long battles they include the drafts that came up during them.
# No mean strength of the British Army in France was found, so there are no war totals for the
# calibration. The records give the shape: about 1.9 admissions sick or injured to each wounded man
# (1,837,613 wounded and 3,496,388 sick or injured, August 1914-December 1918, Mitchell and Smith, as
# quoted), and about five deaths from wounds to each from disease. Sickness is kept low, with the
# winters' trench foot and frost; hits come mostly from the named actions and the wastage in the line.
# Measured (python3 -m gravewounds service western_front): about 1.0% dead of disease a season, and
# about 20% hit a season for a man at every main action in the line (7% holding the line alone), so
# that a man who served the whole war was nearly always hit at least once; of the infantry sent to
# the Western Front about 20% died and 64% were wounded (Forces News, from the Statistics of the
# Military Effort).
# Design and sources: project doc "between-battles-design".
id: western_front
name: "The Western Front: a Regular battalion (1914-1918)"
era: wwi
regions: [british]
table: wwi-1914-18-wounds
season_days: 91

# Wounds by cause in one 24-hour sample of 10,789 (Macpherson, Medical Services General History,
# vol. 3, 1924, pp. 170-171, as quoted by Thom): high explosive 35.8%, shrapnel 19.9%, bullet 27.2%,
# hand grenade 0.7%, bayonet 0.2%, gas 1.9%, uncertain 14.3%. Gas and the uncertain are left out and
# the rest scaled to 100; the bullets are split evenly between rifle and machine gun (ours). The
# often-quoted 58% shell, 39% bullet, 2% bomb, 0.3% bayonet could not be traced to its source.
weapon_mix:
  - {weapon: mortar_artillery, pct: 66.47}
  - {weapon: rifle_service, pct: 16.23}
  - {weapon: machine_gun, pct: 16.22}
  - {weapon: hand_grenade, pct: 0.84}
  - {weapon: bayonet, pct: 0.24}

states:
  trenches: {name: "Holding the line", care: field, marched: false, staying: true}
  battle:   {name: "In a battle", care: field, marched: false, staying: false}
  march:    {name: "On the march", care: field, marched: true, staying: false}
  rest:     {name: "At rest and training", care: shelter, marched: false, staying: true}

positions:
  reserve: {name: "In support", mult: 0.25}
  line:    {name: "In the attack", mult: 1}
  thick:   {name: "In the thick of it", mult: 2}
cap: 90

# Wastage: the men lost in the line on the days between the named actions, shelled and sniped. The
# 1/5th Lincolns lost 13 killed and 74 wounded in about 40 days in the line in 1915 (about 9% of a
# battalion); "one fatality every day or two" in a quiet sector (a researcher, Great War Forum). A
# season holding the line, about half of it in the front and support lines by the usual rotation
# (four days in front, four in close reserve, four at rest; the Long, Long Trail), so 10% (ours).
wastage: {trenches: 10, battle: 5}
wastage_name: "Shelled or sniped in the line"

# Small fights: Haig's raid map lists 225 raids on the British sector in 1916, British and German
# (a single forum source); Third Army made nineteen significant raids in September 1917. The
# chances a season are ours.
small_war:
  chance: {trenches: 50, battle: 30, march: 30, rest: 5}
  hit: 15

sides: {team: "British", foes: "German"}

sources:
  llt: &llt "https://www.longlongtrail.co.uk/army/regiments-and-corps/the-british-infantry-regiments-of-1914-1918/royal-welsh-fusiliers/"
  div33: &div33 "https://www.electricscotland.com/History/scotreg/ThirtyThirdDivisionFrFl.pdf"
  graves: &graves "https://www.gutenberg.org/cache/epub/76911/pg76911.txt"
  mog: &mog "https://menonthegates.org.uk/men_front/bo-1914-2-bn-rwf-battle-of-the-marne-5-12-sept-1914-1-2/"
  div38: &div38 "https://wiki.riteme.site/wiki/38th_(Welsh)_Division"
  wfa: &wfa "https://www.westernfrontassociation.com/world-war-i-articles/trench-diseases-of-the-first-world-war/"

seasons:
  - {id: 1914-summer, name: "Summer 1914", state: march, hygiene: good, factors: {hot: 1}, actions: [mons, le_cateau],
     what: "Landed at Rouen (11 August), joined the 19th Brigade near Valenciennes, and the retreat from Mons to south-east of Paris in the heat, with rearguards.",
     sources: [*llt, "https://www.longlongtrail.co.uk/battles/battles-of-the-western-front-in-france-and-flanders/the-retreat-from-mons-and-the-battle-of-le-cateau"]}
  - {id: 1914-autumn, name: "Autumn 1914", state: battle, hygiene: good, factors: {cold_wet: 2}, actions: [aisne, first_ypres],
     what: "The Marne and the Aisne; attack and counter-attack about Armentières in October, short of ammunition; into the line at Frelinghien (25 November).",
     sources: [*mog, "https://wartimememoriesproject.com/greatwar/allied/battalion.php?pid=7367"]}
  - {id: 1914-winter, name: "Winter 1914-15", state: trenches, hygiene: good, factors: {cold_wet: 3}, actions: [],
     what: "In the line at Frelinghien and Houplines, in water; the Christmas truce. Over 20,000 cases of trench foot in the British army that winter (Payne).",
     sources: ["https://generalship.org/military-history-articles/royal-welch-fusiliers-christmas-truce.html", *wfa]}
  - {id: 1915-spring, name: "Spring 1915", state: trenches, hygiene: good, factors: {}, actions: [neuve_chapelle, second_ypres, aubers, festubert],
     what: "In the line about Armentières while the battles are fought to the south and at Ypres; gas first used by the Germans (22 April).",
     sources: ["https://wartimememoriesproject.com/greatwar/allied/battalion.php?pid=7367", *llt]}
  - {id: 1915-summer, name: "Summer 1915", state: trenches, hygiene: good, factors: {hot: 1}, actions: [],
     what: "Laventie, then the brickstacks at Cambrin and Cuinchy: mines, bombs and snipers.", sources: [*graves]}
  - {id: 1915-autumn, name: "Autumn 1915", state: battle, hygiene: good, factors: {cold_wet: 1}, actions: [loos],
     what: "Loos (25 September): the battalion in support of a subsidiary attack at Cambrin, the British using gas for the first time.",
     sources: [*graves, "https://royalwelchfusiliersmuseum.blogspot.com/2015/09"]}
  - {id: 1915-winter, name: "Winter 1915-16", state: rest, hygiene: good, factors: {cold_wet: 2}, actions: [],
     what: "Six weeks' training at Montagne, then the line at Cambrin, Cuinchy and Givenchy from late December.", sources: [*graves, *div33]}
  - {id: 1916-spring, name: "Spring 1916", state: trenches, hygiene: good, factors: {}, actions: [],
     what: "Givenchy and the La Bassée front: mines and raids.", sources: [*div33]}
  - {id: 1916-summer, name: "Summer 1916", state: battle, hygiene: good, factors: {hot: 1}, actions: [somme_first_day, somme],
     what: "The Red Dragon mine at Givenchy (22 June) and the raid that paid for it (5 July); then the Somme: Mametz Wood, High Wood (20 July) and High Wood again in August.",
     sources: ["https://www.tunnellersmemorial.com/eye-witness-account/", *graves, "https://somme-roll-of-honour.com/Units/british/2nd_royal_welsh_fusiliers.htm"]}
  - {id: 1916-autumn, name: "Autumn 1916", state: trenches, hygiene: good, factors: {cold_wet: 2}, actions: [],
     what: "Hannescamps and Foncquevillers, then the front line at Lesboeufs in the mud to November.", sources: ["https://somme-roll-of-honour.com/Units/british/2nd_royal_welsh_fusiliers.htm"]}
  - {id: 1916-winter, name: "Winter 1916-17", state: trenches, hygiene: good, factors: {cold_wet: 3}, actions: [],
     what: "The Cléry and Bouchavesnes front: \"15 to 20 degrees of frost\" into February, and \"a new plague ... Trench Feet\".", sources: [*div33]}
  - {id: 1917-spring, name: "Spring 1917", state: battle, hygiene: good, factors: {}, actions: [arras],
