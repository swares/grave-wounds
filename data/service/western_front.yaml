actions:
  mons:
    name: "Mons"
    date: 1914-08-23
    field: mons-1914
    share: 2
    engaged: "the four divisions of I and II Corps, the cavalry and the 19th Brigade, about 75,000 (a weak source)"
    lost: "just over 1,600 (the Long, Long Trail); 1,642; about half in the 4th Middlesex (about 400) and the 2nd Royal Irish (about 300)"
    sources: ["https://www.longlongtrail.co.uk/battles/battles-of-the-western-front-in-france-and-flanders/the-battle-of-mons/"]
    units:
      - name: "4th Middlesex"
        share: 40
        lost: "about 400 of a battalion of about 1,000 (ours, its strength)"
        sources: ["https://www.longlongtrail.co.uk/battles/battles-of-the-western-front-in-france-and-flanders/the-battle-of-mons/"]
  le_cateau:
    name: "Le Cateau"
    date: 1914-08-26
    main: false
    share: 13
    engaged: "II Corps: 23 battalions, 18 cavalry regiments and 162 guns; about 40,000 (ours)"
    lost: "7,812, of them about 700 killed and 2,600 taken (a Wikipedia mirror, its source not named)"
    sources: ["https://wikiwand.com/EN/Battle_of_Le_Cateau"]
    note: "Smith-Dorrien's II Corps; the share is the killed and wounded against about 40,000 (ours)."
    single: true
  aisne:
    name: "The Aisne"
    date: 1914-09-14
    share: 7
    engaged: "the BEF: six divisions and the cavalry (about 108,000 at 18,000 a division, ours)"
    lost: "about 13,500 (uncited, and perhaps not British alone)"
    sources: ["https://mobileapps.wikiwand.com/en/First_Battle_of_the_Aisne"]
    single: true
  first_ypres:
    name: "First Ypres and the fighting about Armentières"
    date: 1914-10-30
    share: 36
    engaged: "the BEF: about nine divisions with the Indians and the cavalry (about 160,000, ours)"
    lost: "58,155 killed, wounded and missing (Defence-in-Depth, warning the sources are too variable)"
    sources: ["https://defenceindepth.co/2014/09/23/the-first-battle-of-ypres-and-problem-of-counting-casualties/"]
    units:
      - name: "1st Queen's, to 31 October"
        share: 94
        lost: "9 officers and 624 other ranks of about 675; 2 officers and about 40 men left"
        sources: ["https://surreycc.gov.uk/culture-and-leisure/history-centre/marvels/heavy-losses-to-the-1st-queens"]
    note: "The 2nd Royal Welch Fusiliers fought about Armentières with III Corps, to the south of Ypres."
  neuve_chapelle:
    name: "Neuve Chapelle"
    date: 1915-03-10
    main: false
    share: 31
    engaged: "four divisions, 40,000 troops"
    lost: "about 7,000 British and 4,200 Indian (Edmonds and Wynne); 12,592 (Boff)"
    sources: ["https://www.nam.ac.uk/explore/1915-early-trench-battles"]
    note: "First Army's attack."
  second_ypres:
    name: "Second Ypres"
    date: 1915-04-24
    main: false
    share: 55
    engaged: "six British divisions (about 108,000, ours)"
    lost: "59,275 (the Official History, Edmonds and Wynne)"
    sources: ["https://wikiwand.com/en/articles/Battle_of_St._Julien"]
    note: "The salient under gas; the share counts the drafts that came up during the month."
  aubers:
    name: "Aubers Ridge"
    date: 1915-05-09
    main: false
    share: 15
    engaged: "the 1st, 7th, 8th, 47th and Meerut Divisions (about 72,000 for the four that attacked, ours)"
    lost: "more than 11,000 (the Long, Long Trail); 12,000 (NAM); the 8th Division 4,682, the 1st 3,968"
    sources: ["https://www.longlongtrail.co.uk/battles/battles-of-the-western-front-in-france-and-flanders/the-battle-of-aubers/"]
    units:
      - name: "2nd Rifle Brigade"
        share: 65
        lost: "654, 21 of them officers, of about 1,000 (ours, its strength)"
        sources: ["https://www.longlongtrail.co.uk/battles/battles-of-the-western-front-in-france-and-flanders/the-battle-of-aubers/"]
  festubert:
    name: "Festubert"
    date: 1915-05-16
    main: false
    share: 15
    engaged: "six divisions (about 108,000, ours)"
    lost: "16,648 (Edmonds 1928, p. 76)"
    sources: ["https://www.nam.ac.uk/explore/1915-early-trench-battles"]
  loos:
    name: "Loos"
    date: 1915-09-25
    share: 38
    engaged: "six divisions in the first attack, 75,000 infantry, and three more coming up (about 162,000, ours)"
    lost: "more than 61,000, of whom 7,766 died (the Long, Long Trail); 50,380"
    sources: ["https://www.longlongtrail.co.uk/battles/battles-of-the-western-front-in-france-and-flanders/the-battle-of-loos/"]
    units:
      - name: "2nd Royal Welch Fusiliers, in support at Cambrin"
        share: 12
        lost: "123 (the regiment's museum); Graves gives fifty in the ranks and three officers"
        sources: ["https://royalwelchfusiliersmuseum.blogspot.com/2015/09", *graves]
  somme_first_day:
    name: "The first day on the Somme"
    date: 1916-07-01
    field: beaumont-hamel-1916
    main: false
    share: 23
    engaged: "13-14 divisions (about 252,000, ours)"
    lost: "57,470, of whom 19,240 were killed"
    sources: ["https://www.nam.ac.uk/explore/battle-somme", "https://military-history.fandom.com/wiki/First_day_on_the_Somme"]
    units:
      - name: "1st Newfoundland Regiment at Beaumont-Hamel"
        share: 87
        lost: "684 (26 officers, 658 other ranks) of about 790 (Middlebrook); 68 answered the roll next day"
        sources: ["https://www.greatwarforum.org/topic/713-somme-units-decimated/", "https://www.veterans.gc.ca/en/node/450804"]
      - name: "11th East Lancashire (the Accrington Pals) at Serre"
        share: 81
        lost: "585 (235 killed, 350 wounded) of about 720"
        sources: ["https://en.wikipedia.org/wiki/Accrington_Pals"]
    note: "The 2nd Royal Welch Fusiliers were at Givenchy that day."
  somme:
    name: "The Somme (a division's tour)"
    date: 1916-07-20
    share: 45
    engaged: "about 50 British divisions in turn (ours)"
    lost: "419,654 for the whole battle (Edmonds and Miles); Prior and Wilson 432,000"
    sources: ["https://wikipedia.com/wiki/Draft:Battle_of_the_Somme_casualties_controversy"]
    note: "The whole battle's loss shared over about 50 divisions at 18,000 (ours), about one tour each; the 2nd Royal Welch Fusiliers' Somme roll of honour has 189 names, and High Wood on 20 July cost them 249 of a strength not found."
  arras:
    name: "Arras"
    date: 1917-04-23
    share: 38
    engaged: "14 divisions on the first day and 9 in reserve (about 414,000, ours)"
    lost: "158,000-160,000; 158,660"
    sources: ["https://www.wikiwand.com/en/Battle_of_Arleux"]
    note: "The 2nd Royal Welch Fusiliers at the Hindenburg Line, 23 April: 4 officers killed and 7 wounded, 32 men killed, 70 wounded and 5 missing, of a strength not given (Men on the Gates)."
  messines:
    name: "Messines"
    date: 1917-06-07
    main: false
    share: 11
    engaged: "twelve divisions of Second Army (about 216,000, ours)"
    lost: "24,562 (uncited)"
    sources: ["https://www.longlongtrail.co.uk/battles/battles-of-the-western-front-in-france-and-flanders/the-battle-of-messines-1917"]
    single: true
  third_ypres:
    name: "Third Ypres (Polygon Wood)"
    date: 1917-09-26
    share: 27
    alt: {share: 31, source: "Prior and Wilson's 275,000"}
    engaged: "about 50 divisions (about 900,000, ours)"
    lost: "244,897 (Edmonds); 240,000 (Falls); 275,000 (Prior and Wilson); 300,000 (Cruttwell)"
    sources: ["https://bafybeiemxf5abjwjbikoz4mc3a3dla6ual3jsgpdr4cjr3oz3evfyavhwq.ipfs.4everland.io/wiki/Third_Ypres.html"]
    note: "The 33rd Division lost about 5,000 men at Polygon Wood and the Menin Road, 25-27 September (its history)."
  cambrai:
    name: "Cambrai"
    date: 1917-11-20
    main: false
    share: 35
    alt: {share: 60, source: "75,681 lost (a Wikipedia mirror)"}
    engaged: "two corps and 476 tanks (about seven divisions, 126,000, ours)"
    lost: "44,207 (a tour company's fact file) or 75,681, 10,042 of them killed (a Wikipedia mirror)"
    sources: ["https://wikiwand.com/en/Cambrai_1917", "https://www.rayburntours.com/wp-content/uploads/2022/11/battle_fact_files.pdf"]
  spring_offensive:
    name: "The German offensive of March 1918"
    date: 1918-03-21
    share: 19
    engaged: "26 divisions and 3 of cavalry for Michael (about 468,000, ours)"
    lost: "177,739 (the Official History, 1937); Middlebrook about 160,000: 22,000 killed, 65,000 wounded, 75,000 taken"
    sources: ["https://www.nam.ac.uk/explore/1918-victory", "https://en.wikipedia.org/wiki/Operation_Michael"]
    note: "The share counts Middlebrook's killed and wounded only: the 75,000 taken are not hits."
  hundred_days:
    name: "The Hundred Days"
    date: 1918-08-21
    share: 38
    engaged: "about 60 divisions of the British Empire (about 1,080,000, ours)"
    lost: "411,636 for the British Empire (an uncited infobox)"
    sources: ["https://military-history.fandom.com/wiki/Hundred_Days_Offensive"]
    single: true

small_fights:
  - id: raid
    name: "A trench raid"
    what: "After a bombardment, with smoke on the flanks, raiders cross no man's land, get into the German trench, bomb the dugouts and bring back prisoners (Givenchy, 5 July 1916, the 2nd RWF, some with butchers' knives tied to broomsticks); or the Germans raise the alarm at their wire and the raid fails in a bombing fight (Kiel Trench, 25 May 1916, 37 of the 1st RWF)."
    states: [trenches]
    weight: 4
    where: "across no man's land to the German front trench"
    time: "at night"
    light: night
    ground: open
    team_attacks: true
    side: {name: "The raiding party", men: [20, 60]}
    foes: [{name: "The German trench garrison", men: [10, 40], weapon: rifle_service}]
    surprise: {text: "The raiders are at the wire before the alarm", chance: 40}
    aims: {team: "Get in, take prisoners, and get back.", foes: "Raise the alarm and drive them off the wire."}
    ends: "The raiders go back after 4 rounds with what they have; they fail if a third of those here are down first; the Germans hold if the raiders never get in."
    end: {rounds: 4, wins: team, down: {team: 0.33}, hold: foes}
    sources: [*graves, "https://roadstothegreatwar-ww1.blogspot.com/2016/06/100-years-ago-siegfried-sassoon.html?m=0"]
    note: "Kiel Trench: Lt Stansfield wounded and Cpl O'Brien killed; Sassoon brought in the wounded and won the MC. The Givenchy raid's numbers are not given."
  - id: german_raid
    name: "A German raid on the posts"
    what: "A barrage at dawn, then three officers and about 120 men come over, take a post and are gone in half an hour (Barnton Posts, Festubert, 7 March 1918: 6 killed, 31 wounded and 23 missing of a company of the 1/5th South Lancashire)."
    states: [trenches]
    weight: 3
    where: "the forward posts of the British line"
    time: "at dawn, after a barrage"
    light: dusk
    ground: open
    side: {name: "The company in the posts", men: [30, 120]}
    foes: [{name: "German raiders", men: [40, 123], weapon: hand_grenade}]
    surprise: {text: "The raiders come in behind their barrage", chance: 40}
    aims: {team: "Hold the posts and keep the men.", foes: "Take a post, prisoners and papers, and get back."}
    ends: "The raiders go back after 5 rounds (half an hour) or once a third of those here are down; the company is beaten if it loses a post."
    end: {rounds: 5, wins: team, down: {foes: 0.33}, hold: team}
    sources: ["https://www.longlongtrail.co.uk/?p=6279"]
  - id: patrol
    name: "A patrol in no man's land"
    what: "A patrol crawls out to the German wire; a flare goes up and the Germans open fire; an officer and a corporal are killed and one man gets back next morning (Rue du Bois, 13 January 1916, 10th Duke of Wellington's); at Cuinchy a 2nd RWF patrol held its fire thirty yards from a German covering party and called down shrapnel on it (Graves)."
    states: [trenches]
    weight: 3
    where: "no man's land, between the wires"
    time: "about half past midnight"
    light: night
    ground: open
    side: {name: "The patrol", men: [4, 8]}
    foes: [{name: "A German covering party", men: [4, 12], weapon: rifle_service}]
    aims: {team: "See what the Germans are doing and get back.", foes: "Catch the patrol in the open."}
    ends: "The patrol wins if it gets back to its own edge; either side breaks off once half of those here are down."
    end: {down: {team: 0.5, foes: 0.5}, away: {side: team, share: 0.5}}
    sources: ["https://tunstillsmen.blogspot.com/2016/01/thursday-13th-january-1916.html", *graves]
  - id: working_party
    name: "A working party caught by fire"
    what: "A patrol with a Lewis gun finds a German working party chattering behind its wire and opens fire, and several are seen to fall (14 July 1916); wiring parties often let each other be and \"as good as borrowed each other's mallets\" (Graves)."
    states: [trenches]
    weight: 2
    where: "the wire in front of the line"
    time: "at night"
    light: night
    ground: open
    team_attacks: true
    side: {name: "The patrol with a Lewis gun", men: [4, 10]}
    foes: [{name: "A German working party", men: [8, 30], weapon: rifle_service}]
    aims: {team: "Catch the working party and get back.", foes: "Get under cover and back to their trench."}
    ends: "The patrol goes back after 3 rounds; the working party is beaten if half of those here are down."
    end: {rounds: 3, wins: team, down: {foes: 0.5}}
    sources: ["https://www.tcd.ie/library/fitasfiddles/we-went-out-from-the-gap-into-no-mans-land-where-we-remained-over-two-hours/", *graves]
