# Languages (rules in gravewounds/languages.py, repeated in templates/ranks.js; research in the
# project doc "languages-research"). Each man has his own tongue at `native` (never ticked: Letters
# stays the separate skill of reading and writing) and any others as a percentage, read in bands
# (Mythras's). A tongue he does not have is known at a fraction of a related one he has (`related`,
# RuneQuest's rule). Pidgins and the Plains sign language rise no higher than their `cap`; any
# other learned tongue no higher than `max` (a learned tongue is never quite native).
#
# What it does:
#   - Talk in a tongue caps the talk skills (`talk_skills`): Persuade, Command and haggling in
#     French are at most his French.
#   - Words across tongues (an order to a man of another tongue, calling on a foe to surrender or
#     offering it, questioning a prisoner): d100 at the best tongue the two share (the lower of
#     their two figures). Critical, the full meaning; success, the meaning; failure, only the gist
#     (an order half done, a surrender not understood); fumble, a dangerous error (the Grattan fight
#     of 1854, "fire an illume" heard as "fire mortars"). A phrase book (the eras in `phrase_books`)
#     makes a yes-or-no, a number or a pointed direction Easy at no worse than `phrase_book`.
#   - Passing as a native: his tongue against the listener's Watch (opposed), the difficulty by
#     his grade (`passing`, after Operation Greif's grades of English speakers, 1944).
#   - Capture: asking for quarter in his captors' tongue is a circumstance (data/prisoners.yaml).
#     Escaping, his Fieldcraft to reach his own side gains `escape_home` by his grade in the
#     country's tongue.
#   - The travel map: foraging where no named man in the force gets by in the country's tongue
#     (`maps`) is Hard (`forage_without`).
# Learning: a tongue used well is ticked and rolls to rise at End of season like a skill (one at 0
# always rises); `among_days` nights on a map whose people speak it tick it; a season held prisoner
# ticks his captors' tongue; and the training masters teach one (data/training.yaml).
#
# Who speaks what (`armies`): each army's own tongues by share (d100), then for each other tongue
# a chance he has it and its range. These shares are estimates from the research's figures (about
# 216,000 German-born men in the Union armies; a quarter of the British in America were German; a
# 1:1 KATUSA company with almost no shared tongue; most Chechens Soviet-trained in Russian), not
# muster counts: approx throughout.
native: 90
max: 85
bands:
  - {from: 0, name: "none"}
  - {from: 1, name: "a few words"}
  - {from: 26, name: "getting by"}
  - {from: 51, name: "conversation"}
  - {from: 76, name: "fluent"}
talk_skills: [persuade, command]
phrase_book: 25
phrase_books: [crimea, wwi, wwii, korea, vietnam, modern]
passing:                      # his grade in the tongue -> the difficulty of passing as a native
  - {from: 90, diff: ordinary, name: "native"}
  - {from: 76, diff: hard, name: "fluent, without the idiom"}
  - {from: 51, diff: very_hard, name: "a good speaker"}
  - {from: 0, diff: null, name: "cannot pass"}
escape_home: [{from: 90, mod: 20}, {from: 51, mod: 10}, {from: 0, mod: 0}]
forage_without: -20
readings:                     # what words across tongues come to, by the roll
  full: "understood in full"
  meaning: "understood"
  gist: "only the gist: an order half done, a surrender not understood"
  error: "a dangerous error: the wrong thing understood"
getting_by: 26
among_days: 30
source: "https://en.wikipedia.org/wiki/Operation_Greif"

# A hired interpreter (the team builder): he speaks the team's own tongue and one other at
# `figure` (rolled), and is unreliable at `unreliable` % (a whistleblower said 28% of one firm's
# Afghan hires failed the language standard): an unreliable man's 90+ is a dangerous error. He is
# hired for a season at `wage` Days a day (his era's, else `default`: no pay figures were found
# before 1990; Iraqi interpreters began at $600 a month in 2005), and each End of season may be
# killed (`hazard` %: about 30 in 1,000 a year died in Iraq, 2005-07, some fifteen times a US
# soldier's rate; the Plains and later wars' interpreters were also killed).
interpreters:
  figure: [50, 85]
  unreliable: 28
  error_from: 90
  wage: {default: 1, modern: 0.4}
  hazard: {default: 0.5, modern: 1}
  source: "https://www.strategypage.com/htmw/htintel/20081012.aspx"
  approx: true

