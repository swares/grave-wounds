# The books the rule book is split into. The Rules (dist/rules.html) hold the core chapters
# (templates/rules) and, under Other periods, the figures of every era no book holds yet. Each
# period book holds its eras (data/teams), its battlefields (data/fields, in the order given) and
# its own page in dist/. A chapter's {{era:name}} table (rulebook.ERA_TABLES) shows each book's
# own eras' rows; the Rules point to it. Built by gravewounds/books.py.
books:
  medieval:
    title: "The Medieval Wars"
    dates: "c.1180–1500"
    file: book-medieval.html
    eras: [medieval]
    fields: [jacobsford-1179, sidon-1253, crecy-1346, visby-1361, aljubarrota-1385, agincourt-1415, towton-1461, dornach-1499]
    intro: >-
      Eight battles from the storm of a crusader castle in 1179 to the Swiss at Dornach in 1499:
      a siege and a raid in the Latin East, the longbow battles of the Hundred Years' War and the
      Wars of the Roses, Portugal against Castile, the Danes at the gate of Visby, and the
      Confederates against the Landsknechte. Every rule is in the Rules; this book holds the
      medieval armies' figures, the wound tables their battles roll on, and the battlefields.
    switched_on: >-
      No module: the core rules are written for blades, bows and armour. Wounds heal and fester as
      the Rules' Recovery says, with no antibiotics and the camp's leech the only help.
  black_powder:
    title: "The Black-Powder Wars"
    dates: "1618–1877"
    file: book-black-powder.html
    eras: [thirty_years, horse_musket, crimea, civil_war, plains_nations]
    fields: [lutzen-1632, cowpens-1781, albuera-1811, lundys-lane-1814, redan-1855-june, redan-1855, bull-run-1861, fetterman-1866, wagon-box-1867]
    intro: >-
      Nine battles from Gustavus Adolphus at Lützen in 1632 to the Wagon Box Fight in 1867: the
      Thirty Years' War, the American Revolution, the Peninsula and the War of 1812, the storming
      of the Great Redan before Sevastopol, the first battle of the American Civil War, and two
      fights on the Bozeman Trail against the Lakota, Cheyenne and Arapaho. Every rule is in the
      Rules; this book holds the armies' figures for five eras, the wound tables their battles
      roll on, the battlefields, and a British company at Albuera followed through the morning
      of the lancers.
    switched_on: >-
      The [Black-powder guns](rules.html#mod-black-powder) module: batteries, misfires in the
      wet, and storming works with the bayonet. From
      the [Modern fire](rules.html#fire) module, only the rule that [modern fire puts men
      down](rules.html#modern-down), and only for the breech-loaders: the soldiers' Springfields at the Wagon Box, and
      the carbines of Fetterman's cavalry and the civilians' repeating rifles. Muskets and rifle-muskets fight as the core
      rules say. Wounds heal and fester as the Rules' Recovery says, with no antibiotics.
  world_wars:
    title: "The World Wars"
    dates: "1914–1945"
    file: book-world-wars.html
    eras: [wwi, wwii]
    fields: [mons-1914, babuna-1915, topolcani-1915, mojkovac-1916, beaumont-hamel-1916, snipe-1942, cisterna-1944, cassino-monastery-1944, bougainville-1944, cassino-town-1944, cassino-poles-1944]
    intro: >-
      Eleven battles from the canal at Mons in 1914 to the Poles on Monte Cassino in 1944: the
      first British battle of the Great War, the Serbian stand at the Babuna pass and a rearguard
      in the snow by Topolčani, the Montenegrins at Mojkovac covering the Serbian retreat, the
      Newfoundlanders on the first day of the Somme, the anti-tank guns at Snipe in the desert,
      the Rangers at Cisterna, three battles for Cassino and the Japanese counter-offensive on
      Bougainville. Every rule is in the Rules; this book holds the armies' figures for both wars,
      the wound tables their battles roll on, the battlefields, and a Newfoundland section
      followed across no man's land on 1 July 1916.
    switched_on: >-
      [Modern fire](rules.html#fire), in full: machine guns, barrages, trenches, digging in, and
      more men put down. [Armour and mines](rules.html#vehicles), for the tanks, carriers and
      anti-tank guns at Snipe and the minefields of the desert. [Air and night devices](rules.html#air)
      for aircraft from 1944 (the page leaves the date to the GM); night vision and landing by air
      belong to later wars. The wounded go back by motor ambulance, as the Rules' After the battle
      says. Wounds heal and fester as the Rules' Recovery says: it does not yet count the sulpha
      drugs of the Second World War or the penicillin of 1944.
  korea_vietnam:
    title: "Korea and Vietnam"
    dates: "1950–1973"
    file: book-korea-vietnam.html
    eras: [korea, vietnam]
    fields: [osan-1950, foxhill-1950, chipyong-1951, kapyong-1951, heartbreak-1951, porkchop-1953, xray-1965, dakto-1967, khesanh-1968, hue-1968, hamburger-1969]
    intro: >-
      Eleven battles from Task Force Smith at Osan in 1950 to Hamburger Hill in 1969: the first
      American fight in Korea, the Marines at Fox Hill, the perimeter at Chipyong-ni, the
      Commonwealth brigade at Kapyong, the hills of Heartbreak Ridge and Pork Chop, the landing
      zone at X-Ray, Hill 875 at Dak To, Hill 861A at Khe Sanh, the street fighting in Hue and the
      A Shau valley. Every rule is in the Rules; this book holds the armies' figures for both wars,
      the wound tables their battles roll on, the battlefields, and a rifle squad in Vietnam
      followed through one night.
    switched_on: >-
      All four modules but the first: [Modern fire](rules.html#fire), [Armour and
      mines](rules.html#vehicles), and [Air and night devices](rules.html#air), with helicopters
      and landing by air from Vietnam on, and night vision (infrared searchlights) in Vietnam.
      The wounded go out by helicopter where a landing zone and a helicopter are left, as the
      Rules' After the battle says; else by motor ambulance. Wounds heal and fester as the Rules'
      Recovery says: it does not yet count the antibiotics of these wars.
  late_wars:
    title: "The Late Wars"
    dates: "1982–2014"
    file: book-late-wars.html
    eras: [modern]
    fields: [goosegreen-1982, tumbledown-1982, easting73-1991, mogadishu-1993, grozny-1995, debecka-2003, fallujah-2004, wanat-2008, keating-2009]
    intro: >-
      Nine battles from Goose Green in 1982 to Combat Outpost Keating in 2009: the paratroops at
      Darwin Hill and the Scots Guards on Mount Tumbledown in the Falklands, Eagle Troop at 73
      Easting in the Gulf, the crash sites in Mogadishu, the Russian assault on the railway station
      in Grozny, the Special Forces and the Peshmerga at the Debecka crossroads in northern Iraq,
      the Marines and soldiers in Fallujah, and two American outposts in the mountains of north-east Afghanistan, at Wanat and
      Keating. Every rule is in the Rules; this book holds the armies' figures, the wound tables
      their battles roll on, the battlefields, and a US section at Keating followed through the
      day of the attack.
    switched_on: >-
      All three modern modules: [Modern fire](rules.html#fire), [Armour and
      mines](rules.html#vehicles) and [Air and night devices](rules.html#air), with helicopters,
      landing by air and thermal sights. The wounded go out by helicopter where a landing zone and
      a helicopter are left, as the Rules' After the battle says. Wounds heal and fester as the
      Rules' Recovery says: it does not yet count the antibiotics, the tourniquets or the surgical
      teams of these wars.

