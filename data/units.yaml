# Unit combat (Grave Wounds): the rank and file fight as units on the field map.
#
# Named characters still fight one by one with the full rules (docs/combat.md). Units are
# resolved in bulk, once an exchange (about a minute, ten individual rounds): only the men
# actually striking roll. Each telling blow goes through the same attack, defence,
# hit-location, severity and armour rules as a single fighter's, so the battle's wound
# records still decide what kind of hurt a unit takes. All numbers are design estimates;
# `tempo` is tuned by simulation (python3 -m gravewounds units) to the paces below.

# ---------- the field map ----------
hex_m: 10                  # a field-map hex, metres across
range_scale: 5             # weapon ranges are in 2 m battle-map hexes: divide by this for field hexes
map: {cols: 60, rows: 40}  # the field map's default size (600 x 400 m)

# Formations. per_hex = abreast x ranks men to a hex. move: hexes an exchange on foot.
# missile_factor: shots at a unit in this order count this much (open order is harder to hit).
formations:
  close: {name: "Close order", abreast: 10, ranks: 4, per_hex: 40, move: 6, missile_factor: 1.0}
  open:  {name: "Open order", abreast: 10, ranks: 2, per_hex: 20, move: 8, missile_factor: 0.8}
  battery: {name: "Battery", abreast: 4, ranks: 5, per_hex: 20, move: 6, missile_factor: 0.8}   # two guns and their crews a hex (see artillery)
  extended: {name: "Extended order", abreast: 3, ranks: 1, per_hex: 3, move: 8, missile_factor: 0.5}   # modern infantry: a few yards between men
  armour: {name: "Armour", abreast: 1, ranks: 1, per_hex: 4, move: 12, missile_factor: 1.0}   # vehicles, one a hex (per_hex and move are the vehicle kind's: see vehicles)
  mg: {name: "Machine-gun team", abreast: 5, ranks: 1, per_hex: 5, move: 4, missile_factor: 0.5}      # a gun and its crew a hex (see machine_guns)
mounted_move: 15           # hexes an exchange for mounted units, in either order
charge_move: 2             # a unit that ends its move in contact may move this many times its allowance (a charge)
turn_per: 2                # turning the facing one step (60 degrees) costs 1 hex for every this many hexes of front (at least 1)
shoot_ranks: 2             # ranks of each front hex that can shoot
# Line of fire: a unit cannot shoot through another unit, friend or enemy, standing between it
# and its target, except from high ground over a unit on lower ground. Bows (`arcing`) can
# loose high over them instead, at `arc_penalty` % off. Guns: see artillery.
# Ground that screens (`screen`: woods, buildings, tall buildings) between the shooter's hex
# and the target's blocks aimed fire, direct gun fire and the sight for calling fire, unless it
# stands lower than the shooter (he sees over it). Rubble gives cover and hides men, but its
# heaps are low: it does not screen. Men see `see_into` hexes into
# cover: those next to either end of the line do not block (a shooter at a wood's edge fires
# out; a target just inside it is seen). Shell fire and a machine gun's fixed line need no sight.
line_of_fire:
  arcing: [bow, longbow, crossbow]
  arc_penalty: 20
  see_into: 1
exchange_rounds: 10        # individual 6-second rounds in one exchange (for fatigue, bleeding, states)

# The ground, painted per hex. move: movement to enter a hex of it (open ground 1); impassable:
# no unit can enter or stand in it (cross at a bridge: paint the bridge open ground). cover: %
# off shots at men standing in it. stops_shot: round shot does not bound on over it. height: how high it
# stands (high ground and tall buildings 10, a slope 5): a blow struck up at men on it from lower ground is
# that much % off less the striker's own height (as a bank's), it is high ground for shooting by the
# difference (high_ground), and from it a man sees and shoots over lower ground's cover and units. hides: men in it are hard to
# see (hidden). no_horse: horses cannot go into it. Works (ditches, banks,
# palisades, gates, walls, stakes, felled trees, wagons, pavises) are those of the battle
# map (works.yaml), with the same crossing costs, cover and height, along the 10 m hexes.
# key: the letter for the ground in a battlefield file's rows (data/fields).
ground:
  open:  {name: "Open ground",  key: ".", move: 1}
  rough: {name: "Rough ground", key: "r", move: 2, stops_shot: true}
  woods: {name: "Woods",        key: "F", move: 2, cover: 20, stops_shot: true, screen: true}
  marsh: {name: "Marsh",        key: "m", move: 3, no_horse: true, stops_shot: true}
  slope: {name: "Slope",        key: "s", move: 2, height: 5}                     # the side of a hill: half its height for shooting and close combat
  high:  {name: "High ground",  key: "h", move: 1, height: 10}
  buildings: {name: "Buildings", key: "T", move: 2, cover: 30, stops_shot: true, no_horse: true, hides: true, screen: true}   # houses, walls, yards
  tall:  {name: "Tall buildings", key: "B", move: 3, cover: 40, stops_shot: true, no_horse: true, hides: true, height: 10, screen: true}   # blocks of several storeys: high ground for shooting; the streets between are open ground
  rubble: {name: "Rubble", key: "x", move: 3, cover: 40, stops_shot: true, no_horse: true, hides: true}   # a town bombed or shelled to ruins: broken walls, craters, heaps of masonry
  water: {name: "Water",        key: "w", move: 1, impassable: true}                                # a canal or river: shots cross it, men do not
# Breaching: a unit ordered to breach puts this share of each front hex's front rank to
# hacking at the work in front of it, every round of the exchange. A work's breach figure
# (man-rounds, works.yaml) is for a 2 m hex side; a 10 m side takes five times as long.
breach_share: 0.5

# ---------- guns ----------
# A battery is a unit whose weapon is a gun (listed in `guns`), in the battery formation. Its
# men are the crews, `crew` to a gun: 120 men serve 12 guns, and as crews fall fewer guns are
# served. Each served gun fires `rounds` rounds an exchange at the nearest enemy unit in front
# of it within `range` field hexes and in sight: canister at `canister_to` hexes or less, round
# shot beyond. The GM can name a target instead (u.target, an enemy unit's id): the battery
# fires at it if it is in range, in sight and in front, or at the nearest if not. All numbers
# are design estimates, tuned by python3 -m gravewounds units.
# - Line of fire: a gun cannot fire through another unit, friend or enemy, between it and its
#   target, except round shot from high ground over a unit on lower ground (never canister),
#   and shell from howitzers, which goes over anything.
# - Round shot: each round strikes the target unit with the chance for its range (less its
#   cover and the weather, times its formation's missile_factor), then goes through its ranks:
#   each man in the ball's path (the formation's ranks times the unit's rows, at most
#   `path_max`) is hit at `file` %. Deep columns suffer most. A strike on a battery may also
#   knock a gun off its carriage (`dismount` %): it is out for the rest of the fight.
# - Ricochet: on firm ground round shot bounds on past its target. The first other unit, friend
#   or enemy, on the line within `ricochet.beyond` hexes past it is struck by each round with the
#   chance for how far past it stands (times its missile_factor) and the ball goes through its
#   ranks as above. Ground that `stops_shot`, or mud or snow at `ricochet.soft` or more, stops it.
# - Canister: each round throws `balls` chances to hit, each at the chance for its range (with
#   the same cover, weather and formation), on the front of the target.
#   On firm ground (as for ricochet) balls skip on into the target: `graze` % is added to the
#   chance beyond the first band.
# A battery's `guns` are smoothbore (the default), rifled or howitzer.
# - Shell: howitzers fire shell beyond canister range, in a high arc
#   over anything between. Each shell falls on the target unit with the chance for its range
#   (`howitzer.strike`, times its formation's missile_factor, less the weather), then its fuse is
#   rolled (`fuse`: d100 up to each figure): early (it bursts short, harmlessly), air (it bursts
#   over the men: each of `fragments` chances hits at `air_hit` %, cover counting half), ground
#   (it bursts as it lands: `fragment_hit` %, less the full cover), or blind (it never bursts).
#   A burst on a battery may knock out a gun as a round-shot strike does. Within canister range
#   howitzers fire canister.
# - Rifled guns (the Civil War's Parrotts and ordnance rifles) reach `rifled.range` and fire
#   percussion shell beyond canister range on a flat path (a clear line of fire, as round shot):
#   it falls on the target with the chance for its range (`rifled.strike`), its fuse rolled on
#   `rifled.fuse`, bursting as shell does; it does not bound on. Their canister throws only
#   `rifled.canister_balls` balls a round.
# Every man hit takes a wound roll at `attack` (no parry) with the gun's wound data.
# A battery is limbered (moves as its formation; cannot fire) or unlimbered (fires; can only be
# manhandled `pushed` hexes an exchange). Limbering or unlimbering takes an exchange, in which
# it neither moves nor fires. Hand to hand, the crews fight with `crew_weapon`. A battery that
# breaks abandons its guns: it never fires again, even if it rallies.
# Ammunition: each gun goes into action with `ammo` rounds (its limber chest and its share of the
# caissons; a play figure), spent as it fires; a battery that is out falls silent. Resupplying
# (the caissons coming up) takes an exchange out of contact, in which it neither moves nor fires.
artillery:
  guns: [artillery_smoothbore, artillery_acw]   # the weapons a battery fires (its wound data); its `guns` setting picks smoothbore, rifled or howitzer
  crew: 10
  rounds: 1
  range: 100                 # field hexes: 1,000 m
  canister_to: 30            # field hexes: 300 m
  round_shot:
    strike: [[50, 60], [75, 40], [100, 25]]    # [up to this many hexes, % a round strikes the unit]
    file: 40
    path_max: 12
  canister:
    balls: 8
    strike: [[10, 50], [20, 30], [30, 15]]
    graze: 5                 # % added beyond the first band on firm ground
  howitzer:
    strike: [[50, 45], [75, 30], [100, 20]]    # [up to this many hexes, % a shell falls on the unit]
    fuse: [[15, early], [40, air], [85, ground], [100, blind]]   # [d100 up to, what the fuse does]
    fragments: 12            # chances to hit for each burst
    fragment_hit: 25         # each, for a burst on the ground
    air_hit: 35              # each, for a burst over the men
  rifled:
    range: 160               # field hexes: 1,600 m
    strike: [[50, 60], [100, 45], [160, 30]]    # [up to this many hexes, % a shell falls on the unit]
    fuse: [[5, early], [10, air], [85, ground], [100, blind]]   # percussion: most burst as they strike
    canister_balls: 5        # a rifle's canister: fewer, smaller balls than a smoothbore's
  attack: 80
  crew_weapon: sword
  pushed: 2                  # hexes an unlimbered battery can be manhandled (or turned) in an exchange
  ammo: 50                   # rounds a gun carries into action
  dismount: 10               # % a round-shot strike on the battery fired at knocks out one of its guns
  ricochet:
    beyond: 30               # field hexes past the target a bounding ball can still strike a unit
    strike: [[10, 30], [20, 20], [30, 10]]     # [up to this many hexes past the target, % a round strikes]
    soft: 1                  # mud or snow at this level or more stops the bounce
  # Guns in full. The GM may order a battery's shot instead of leaving it to the range (canister
  # only within canister range); smoothbores fire round shot, shell (spherical case) or canister,
  # howitzers shell or canister, rifles shell, solid bolts (as round shot) or canister. A battery
  # can split off a section of its guns at a second target, with its own shot. Gunners cut their
  # fuses rather than leave them to chance: the air band of the fuse table grows by the crew's
  # `quality` figure, and by `ranged` when the battery fired at the same target last exchange at
  # much the same range (within `within` hexes). A battery charged in front fires `closing`
  # rounds of canister a gun at its first charger as it comes in, before the melee.
  shots:
    smoothbore: [round, shell, canister]
    howitzer: [shell, canister]
    rifled: [shell, round, canister]
  set_fuse:
    ranged: 15
    within: 2
    quality: {green: -10, regular: 0, veteran: 10}
  closing: 1

# ---------- quality ----------
# The unit's fighting quality: attack and defence (parry or dodge) % for its men, and the
# Nerve its morale checks use (the same ratings as individual fighters).
quality:
  green:   {attack: 40, defence: 25, nerve: 35}
  regular: {attack: 50, defence: 35, nerve: 50}
  veteran: {attack: 60, defence: 45, nerve: 65}

# ---------- melee ----------
# Fighting men: the front rank of each hex touching the enemy (the formation's `abreast` men),
# and one more rank for each hex of the weapon's reach past the first, up to the formation's
# ranks: spears and bills (reach 2) strike from two ranks, the pike (reach 3) from three.
# Each exchange, `tempo` of the fighting men land a telling blow's attempt; the rest of the
# minute is pressing, shoving and watching. Tuned so that two equal regular units with no
# armour hit about 3% of the men in contact a minute (the chosen pace: 2-4%); about a third
# of those are put out of the fight, the rest fight on wounded. Armour cuts it further.
melee:
  tempo: 0.09
  flank: {attack: 20, defence: -100}      # % to the attacker's chance, and to the defender's (-100: no defence)
  rear: {attack: 30, defence: -100}
  charge: {attack: 20, tempo: 2.0}        # the first exchange of a charge by mounted men: +attack, x tempo
  shaken: {attack: -10}                   # a shaken unit fights worse
  # A front of pikes against horse: a steady unit in one of `formations` armed with one of
  # `weapons`, struck by mounted men from its front, takes no charge from them (as stakes), and
  # its men strike mounted men to their front at +`attack` %. Design estimate.
  pikes: {weapons: [pike], formations: [close], attack: 20}

# ---------- missiles ----------
# Shooting men: those with a missile weapon and the target in range (the field map counts
# them: the front two ranks of a line). Each fires `rate` shots a minute; `tempo` of those
# are aimed at a man rather than at the mass, and roll to hit like an individual's shot at
# that range (combat.range bands; weather and cover as on the battle map). No parry; a
# shield counts through the hit-location tables. Tuned so 100 archers with longbows at
# medium range hit about 8 unarmoured men a minute.
missile:
  tempo: 0.033
  rate:                     # shots a minute, by weapon (design estimates)
    longbow: 8
    bow: 8
    crossbow: 2
    sling: 6
    matchlock_musket: 1
    musket_smoothbore: 2
    rifle_flintlock: 1
    rifle_musket: 2
    breechloader: 8           # Sharps, Spencer, Springfield 1866: about eight aimed rounds a minute
    rifle_service: 10         # bolt-action magazine rifles (1914-1953): about ten aimed rounds a minute
    rifle_assault: 15         # self-loading and assault rifles, aimed fire
    pistol_smg: 12            # pistols and submachine guns, aimed fire
    machine_gun: 300          # a gun, not a man: rounds a minute in bursts (see machine_guns)
  default_rate: 1

# ---------- machine guns ----------
# A machine-gun team is a unit whose weapon is listed in `weapons`, in the mg formation: a
# gun and its crew to a hex, `crew` men a gun, so 10 men serve 2 guns; as crews fall the guns
# go on until the last man (a gun is served while a man of its crew is up). Each served gun
# fires missile.rate rounds a minute at its target, and `tempo` of them are rolled as aimed
# shots (a rifleman's missile.tempo is far lower: the gun's cone of fire sweeps the target's
# depth, so many more of its rounds find a man); the formation's missile_factor counts as for
# any shot. Its beaten zone: the cone of fire falls on along the
# line of fire for `beaten.beyond` field hexes past the target; the first other unit there,
# friend or enemy, takes `beaten.share` % as many shots at that range (ground that stops shot
# stops it). Design estimates, tuned by python3 -m gravewounds units (the machine-gun lines).
machine_guns:
  weapons: [machine_gun]
  crew: 5
  tempo: 0.1
  beaten: {beyond: 20, share: 50}

# ---------- indirect fire ----------
# Modern artillery and mortars fire from off the map, on call. Each side lists its supporting
# batteries (field.support on the field map: a name, a kind below, tubes, rounds). On its own
# move the GM calls a battery's fire on a hex that one of the side's units can see (in sight
# in the weather, no woods between: see spotted), once or until stopped. The shells land
# `delay` exchanges later (mortars at once), each tube `rate` shells an exchange while rounds
# last. Each shell scatters: d6 for the direction and 0 to `scatter` hexes from the hex
# called. Where it bursts, every man in a hex within `radius` (of any unit, friend or foe) is
# struck at the % in `struck` for his distance in hexes (0 = the burst's own hex), times
# `prone` for a unit gone to ground and less the hex's ground cover. A struck man rolls a
# wound as a hit by the table's shell weapon (`weapon`, or `fallback` if the table lacks it)
# at `attack` %, as a battery's. Design estimates, tuned by python3 -m gravewounds units.
#
# tree_burst: a shell bursting in the branches over men in woods (`ground`) showers them from
#   above: the woods give no cover, the struck % is times `factor`, and going to ground cuts
#   it only to `prone` (not the usual `prone` above).
# smoke: a mission may fire smoke instead (the same rounds). Each burst fills its hex and
#   those within `radius` with smoke that hangs for `lasts` exchanges by the wind, counting
#   the one it lands in; since the shooting comes before the shells land, it screens the
#   next lasts - 1 exchanges (calm: 3; a gale blows it away at once). No one sees or shoots
#   into, out of or through smoke, and fire cannot be called on a hex behind it. It wounds
#   no one. At the end of each exchange it drifts `drift` hexes downwind (the hex side
#   nearest the way the wind blows; calm air leaves it where it is), and off the map is gone.
# illum: a mission may fire illumination instead (a kind with `illum`): one round a tube served
#   lights every hex within `illum` field hexes of its aim for weather.yaml light.lasts
#   exchanges after the one it is fired in (the shooting comes first). It needs no one to see
#   the hex, and wounds no one. A lit hex is seen as by day (weather.yaml light).
# counter_battery: a battery that has fired is located (flash and sound), and from then on the
#   other side may call fire on it instead of on a hex, with no one needing to see it. Each
#   shell lands among its guns at the kind's `counter` % (mortars cannot reach), knocking out
#   a tube and striking `among` of its crew; at `near` times that % it bursts close by and
#   strikes `near_struck`. Struck crewmen roll wounds as men struck by shellfire; those put
#   down are lost to the battery. A battery has `crew` men a tube and fires only the tubes it
#   has `serve` men each for. Ordered to displace, a battery is silent for `displace`
#   exchanges and then is no longer located: missions on it end (tanks never displace).
# range and place: a battery may be given a `place` (a hex, on the map or off it, where its guns
#   stand). Then it can fire only on hexes within its kind's `range` (field hexes: mortars 3.6 km,
#   field guns 11 km, heavy howitzers 14.5 km), and counter-battery fire reaches a placed battery
#   only from within range. A placed battery with an enemy unit within a hex of its place is
#   overrun: its tubes are lost. Ordered to displace, it can be given a new place (`to`), where
#   it stands once it has moved. A battery with no place fires from off the map, as before.
# knock: % that a shell bursting on a bunker's hex knocks the bunker out (its men lose its
#   cover, and it can be stormed). A bunker's men get its cover against shellfire too.
# direct: tanks firing over open sights, close behind the line: they land at once, do not
#   scatter, and are never located for counter-battery fire (small arms cannot hurt them).
# air: aircraft on call, called like a battery (a `tube` is an aircraft, `rounds` its bombs or
#   its rocket and gun passes, so fighter-bombers have two sorties an aircraft). They are
#   never located (counter-battery fire cannot find them) and have no crews to lose. They do
#   not fly in the weather `grounded` lists, and those without `by_night` do not fly in the
#   lights `night` lists (weather.yaml light); a mission waits until they can. `shot`: what the
#   log calls one (and many). Design estimates.
# creep: a mission that keeps firing may creep, its aim lifting that many hexes (1 to `max`)
#   in the direction chosen, ahead of an advance: by the fire plan, after `every` exchanges on
#   each line (1 to `every_max`), and over `lines` lines before it stops (0: until it leaves
#   the map).
indirect:
  weapon: mortar_artillery
  fallback: explosive_fragment
  attack: 70
  prone: 0.35
  kinds:
    mortar:   {name: "Mortars",          range: 360,  rate: 3, rounds: 60, delay: 0, scatter: 2, radius: 2, struck: [15, 5, 1],                counter: 0, crew: 4, serve: 2, displace: 1, illum: 15}
    field:    {name: "Field guns",       range: 1100, rate: 2, rounds: 80, delay: 1, scatter: 4, radius: 3, struck: [20, 8, 3, 1],             counter: 2, crew: 6, serve: 3, displace: 2, illum: 30}
    howitzer: {name: "Heavy howitzers",  range: 1450, rate: 1, rounds: 40, delay: 1, scatter: 5, radius: 5, struck: [30, 12, 5, 2, 1, 0.5], counter: 4, knock: 2, crew: 8, serve: 4, displace: 3, illum: 40}
    tank:     {name: "Tanks (direct fire)", rate: 2, rounds: 60, delay: 0, scatter: 0, radius: 1, struck: [25, 5],              counter: 0, knock: 8, direct: true, crew: 5, serve: 3, displace: 0}
    autocannon: {name: "Autocannon (direct fire)", rate: 3, rounds: 300, delay: 0, scatter: 0, radius: 0, struck: [20],              counter: 0, knock: 3, direct: true, crew: 3, serve: 2, displace: 0}
    fighter_bomber: {name: "Fighter-bombers (bombs, napalm)", rate: 2, rounds: 4, delay: 2, scatter: 3, radius: 4, struck: [45, 25, 12, 5, 2], counter: 0, knock: 15, air: true, by_night: false, shot: [bomb, bombs]}
    gunship:  {name: "Helicopter gunships (rockets, guns)", rate: 4, rounds: 24, delay: 0, scatter: 1, radius: 1, struck: [20, 6], counter: 0, knock: 4, air: true, by_night: true, shot: [rocket and gun pass, rocket and gun passes]}
  air: {grounded: [fog, storm, heavy_snow, blizzard], night: [moonlit, night]}
  tree_burst: {ground: [woods], factor: 1.5, prone: 0.7}
  smoke: {radius: 1, lasts: {calm: 4, breeze: 3, strong: 2, gale: 1}, drift: {calm: 0, breeze: 1, strong: 2, gale: 2}}
  counter_battery: {among: 2, near: 3, near_struck: 1}
  creep: {max: 3, every_max: 4}

# ---------- vehicles ----------
# A vehicle unit (`vehicle`: a kind below) is tanks, infantry fighting vehicles or armoured
# carriers on the field, one a hex: its men are their crews, `crew` a vehicle, in the armour
# formation, with the kind's `move`. Its machine guns fire as a machine-gun team's (its weapon is
# the machine gun). A kind with a `gun` also fires its main gun each exchange, `rate` rounds a
# vehicle whose gun still works, at the nearest enemy unit in range, in sight (as guns are) and
# in front of it, enemy vehicles first: at a vehicle each round hits at the `hit` % for its range
# in field hexes and then knocks it out at its armour's `gun` %; at men it bursts on the nearest
# of their hexes as the indirect-fire kind `he` does (no scatter).
# Armour: small arms cannot hurt a vehicle (men with them do not shoot at one), and no one
# strikes it, or is struck by it, hand to hand. Men with an `anti_armour` weapon fire its `rate`
# rounds a man at a vehicle (every one aimed); each that hits (as at men: range, cover, the
# weather) knocks a vehicle out at its armour's `row` % (rpg or atgm). A round into a vehicle's
# flank or rear (where the shooter stands, by the vehicle unit's facing) knocks it out at that %
# times `aspect` (to 100 at most). A hit that does not knock it out may still do harm (`damage`):
# at `immobilised` % it cannot move, at the next `gun` % its main gun is out. A unit with an
# immobilised vehicle cannot move until it abandons it (its crew leave the fight unhurt). A shell
# or bomb bursting in a vehicle's own hex knocks it out at the firing kind's `knock` % times its
# armour's `shell`. A knocked-out vehicle's crew are out of the fight: each is struck at
# `crew_struck` % and rolls a wound as one struck by shellfire.
# Riders: a carrier kind (`carry` men a vehicle) takes a foot unit of its side aboard (it
# mounts from within a hex of the carriers on its own move). Riders do not fight, shoot or check
# morale; they move with the carriers and get down beside them on the carriers' move (they can
# move the exchange after). When a carrier is knocked out, its share of the riders are each
# struck at `riders_struck` %; when the last is, the riders get down where it stood.
vehicles:
  kinds:
    tank: {name: "Tanks", crew: 4, move: 12, armour: heavy, gun: {range: 100, rate: 1, he: tank, hit: [[20, 75], [50, 50], [100, 25]]}}
    ifv:  {name: "Infantry fighting vehicles", crew: 3, move: 14, armour: light, carry: 7, gun: {range: 80, rate: 2, he: autocannon, hit: [[20, 70], [40, 45], [80, 20]]}}
    apc:  {name: "Armoured carriers", crew: 3, move: 14, armour: light, carry: 10}
  armour:
    heavy: {rpg: 15, atgm: 60, gun: 35, shell: 1}
    light: {rpg: 50, atgm: 90, gun: 75, shell: 3}
  aspect: {flank: 2.0, rear: 3.0}
  anti_armour:               # weapon: rate (rounds a man fires at a vehicle an exchange, every one aimed) and the armour row it hits on
    rpg:        {rate: 0.25, row: rpg}
    bazooka:    {rate: 0.25, row: rpg}
    recoilless: {rate: 0.25, row: rpg}
    atgm:       {rate: 0.1,  row: atgm}
  damage: {immobilised: 25, gun: 15}
  crew_struck: 50
  riders_struck: 30
  ground: {open: 1, rough: 2, woods: 3, slope: 2, high: 1}

# ---------- landing by air ----------
# A field can mark landing zones (field.lz, hexes). A unit can come on by air at one: it waits
# in field.lifts, and at the end of each exchange up to `lift` men land at each landing zone
# (lifts in the order called), filling the unit's front first; it can move the exchange after
# it first lands. A unit's first men come down on the zone's hex, or the nearest spot within
# `zone` hexes of it where they fit (another unit may have landed there first). No one lands while an enemy unit (not fled) stands within `blocked` hexes
# of the zone, or where the men would not fit. An enemy unit (not broken or fled) that could
# shoot at the zone's hex makes it hot: each man landing is struck at `hot` % and rolls a wound
# as a man struck by shellfire (indirect.attack). Design estimates.
heliborne: {lift: 80, blocked: 2, hot: 10, zone: 4}

# ---------- high ground ----------
# A shooter on higher ground (a ground kind's `height`) shooting at men on lower ground gets
# +`shoot` % and his range bands `reach` % longer for each 10 of height between them (a slope's
# 5: half, rounded down); shooting up costs `shoot` % for each 10 in the same way. Guns are left
# out: they have their own rule for firing over units from high ground.
high_ground: {shoot: 10, reach: 20}

# ---------- storming bunkers ----------
# Men in an intact bunker (a hex work in `works`) cannot be struck hand to hand, and do not
# strike out; they shoot out of it even with enemies next to it. A unit next to one, ordered
# to assault with one of `means` (on a table with the blast weapon: `weapon`, or `fallback`),
# rolls once an exchange for each such bunker across its front: d100 at or under the means'
# `knock` (+`pinned` if the bunker's men are pinned) knocks the bunker out. Then `struck` % of
# the men in its hex are hit: by blast as a hit by the blast weapon at `attack` %, or by flame
# (`flame: true`), which puts every man it reaches out of the fight with critical burns
# (burns are not on the hit-location tables), `flame_dead` % of them killed outright. A
# knocked-out bunker is a hex like any other. Design estimates.
assault:
  works: [bunker]
  weapon: hand_grenade
  fallback: explosive_fragment
  attack: 70
  pinned: 20
  flame_dead: 40
  means:
    grenades: {name: "Grenades", knock: 10, struck: 40}
    satchel:  {name: "Satchel charges", knock: 25, struck: 60}
    flame:    {name: "Flamethrowers", knock: 40, struck: 70, flame: true}

# ---------- suppression ----------
# Shellfire and machine-gun fire pin men down. A unit that a shell burst within reach of, or a
# machine gun fired on (or caught in its beaten zone), in an exchange checks at the end of it:
# d100 against its Nerve, + `prone` if gone to ground. A failure pins it for the next
# exchange: it cannot move, and it shoots at `fire` of its rate. A pinned unit hit again can
# be pinned again. Broken units do not check. Design estimates.
suppression:
  prone: 10
  fire: 0.5

# ---------- going to ground ----------
# Modern infantry (and anyone else) can go to ground: the men lie down, in folds of the
# ground, shell holes and ditches. The GM orders it for a unit on its side's move (Go to
# ground on the field map) and orders it up again the same way. A unit on the ground cannot
# move; shots at it lose `cover` % (on top of the ground's and the works' cover). It still
# shoots, and fights hand to hand as it stands. Design estimate.
to_ground:
  cover: 15

# ---------- hidden targets ----------
# Men gone to ground, in a bunker, or in ground that hides them (`hides`: buildings) show
# little of themselves: of the aimed shots fired at them, only `seen` % find a man to aim at
# (the rest go at where the fire came from), before cover and range. For every missile
# weapon and machine gun; men standing in the open are as easy to hit as ever. With the
# dug-in men's nerve (morale.mods.dug_in), tuned so a dug-in line, left alone, holds on the order
# of one and a half to two hours against five times its numbers (Osan, 1950).
# A machine gun's fire at hidden men finds a man at `mg_seen` % (it sprays where they are
# thought to be): it still pins them (suppression), but rarely kills them.
hidden:
  seen: 10
  mg_seen: 5

# ---------- wounds ----------
# Each blow that gets through rolls location, mechanism and severity from the margin, and
# armour, exactly as a single fighter's. Then:
#   light: the man fights on, wounded;
#   serious or critical: a stop check against the unit's Nerve (-10 for critical); a failure
#     takes him out of the fight (down); a pass leaves him fighting, wounded;
#   a wound whose untreated time to death is in `dead_if` kills him at once (counted dead,
#     and down).
# From a weapon in `modern_fire` (breech-loading rifles and carbines from the 1860s on, magazine
# rifles, machine guns, pistols and shell) a hit stops more men: a serious or critical wound always puts him down, and
# a light one calls for the stop check (a graze still leaves him fighting). Casualty returns
# from 1914 on count nearly every man hit as out of the line: he went back to the aid post.
# Named men (heroes) keep the roller's own rule.
dead_if: [instant, rounds]
modern_fire:
  weapons: [breechloader, rifle_service, rifle_assault, rifle_ap, machine_gun, pistol_smg, hand_grenade, mortar_artillery, rpg,
            mine_ied, explosive_fragment]

# ---------- unit morale ----------
# After each exchange a unit checks if it lost the exchange in contact (more of its men put
# down than it put down), or has lost `trigger` of its starting men in all, or `shock` of
# its present men in this exchange, or was struck in flank or rear: d100 against its Nerve
# with the modifiers below. A steady unit that fails is shaken (fights worse, cannot
# charge); one that fails by more than `shaken_by` while flanked or with half its men down
# breaks at once. A shaken unit that fails breaks. A shaken unit out of contact that passes
# a check rallies to steady. A broken unit runs.
morale:
  trigger: 0.25
  shock: 0.10
  shaken_by: 20
  mods:
    leader: 10                # a named leader with the unit, up and fighting
    leader_down: -20
    heavy: -20                # half or more of its starting men down
    flank: -20                # struck in flank or rear this exchange
    veteran_friends: 10       # a steady friendly unit next to it
    in_order: 20              # still steady: ranks closed, men backing each other
    losing_per_man: 5         # off for each man more it lost than it put down this exchange
    losing_cap: 30
    dug_in: 10                # gone to ground or in a bunker: men in holes stay put

# ---------- the rout ----------
# A broken unit flees. Every enemy man in reach of it strikes, not just the front rank (the
# ranks have dissolved), with no defence for the fleeing, at +attack and `tempo` times the
# melee tempo: most of a battle's dead fell in the rout. On the field map the pursuit lasts
# while pursuers keep contact; the simulation assumes `exchanges` of it.
rout:
  attack: 20
  tempo: 2.0
  exchanges: 3

# ---------- after the battle ----------
# Every wounded man is remembered by his wound's severity, its untreated time to death
# (lethal) and its infection risk. When the battle ends:
#   - a side with no unit still standing has lost the field: the men it had down there are
#     left behind and die (`left_behind`); the wounded who were still on their feet go with
#     their units;
#   - of the rest, a wound that kills in minutes kills before help comes, unless he is bound
#     in time (`saved.minutes`, %); one that kills in hours kills unless his camp can treat
#     it (`saved.hours`, % by the camp's care: no camp, a field camp, quarters);
#   - the survivors are carried to their force's camp and heal on the wound track (data/
#     disease.yaml `wounds`), where wound fever can still take them.
# Design estimates: the beaten side's dead at Towton and Agincourt were mostly men cut down
# in flight or left on the field.
aftermath:
  left_behind: true
  saved:
    minutes: 10
    hours: {none: 0, field: 40, shelter: 60}

# ---------- heroes ----------
# A named fighter from the wound roller can join a unit: in its front rank (a hand weapon),
# shooting with it (a missile weapon), or behind it (commanding). He is extra to the unit's
# men and uses his own attack, defence, Nerve, weapon and armour. Each exchange a front hero
# makes `tempo` times a ranker's telling attempts (he seeks the fight), and a ranged hero
# shoots `tempo` times a ranker's aimed shots. For the same reason a blow on his unit's
# front falls on him `exposure` times as often as on a ranker of its front rank; missiles
# fall on him as on any man of the unit, and in a rout as on any man of it. His wounds
# use the full rules, as in the roller: each wound's pain (and any he came with) takes
# combat.pain_step % a step off his attack and defence (to tracking.pain_cap steps), he bleeds
# each exchange (exchange_rounds rounds at tracking.bleed_per_round), and his Blood's
# thresholds cost him more and can put him down. A wound calls for the roller's stop check:
# defend only or stunned means no attempts in his next exchange (stunned: no parry either),
# out puts him down for the rest of the battle; pain above the cap calls for one at the end
# of each exchange. A wound fatal within rounds kills him. When two front heroes' units
# fight hand to hand the heroes duel: each makes `duel` attempts an exchange at the other
# instead of at the rankers (the first of one side with the first of the other). A leader
# hero adds his unit's leader modifier to its morale while he is up, and the leader-down
# modifier once he is down. His wounds go back to the roller after the battle.
heroes:
  tempo: 3.0
  exposure: 2.0
  duel: 3                 # telling attempts each hero makes at the other in a duel, an exchange
  first_aid: 60           # % a quiet exchange (his unit not in contact, not under fire, no losses) that his comrades stop his worst wound bleeding a step
