# Unit combat (Grave Wounds): the rank and file fight as units on the field map.
#
# Named characters still fight one by one with the full rules (docs/combat.md). Units are
# resolved in bulk, once an exchange (about a minute, ten individual rounds): only the men
# actually striking roll. Each telling blow goes through the same attack, defence,
# hit-location, severity and armour rules as a single fighter's, so the battle's wound
# records still decide what kind of hurt a unit takes. All numbers are design estimates;
# `tempo` is tuned by simulation (python3 -m gravewounds units) to the paces below.

# ---------- the field map ----------
hex_m: 10                  # a field-map hex, metres across
range_scale: 5             # weapon ranges are in 2 m battle-map hexes: divide by this for field hexes
map: {cols: 60, rows: 40}  # the field map's default size (600 x 400 m)

# Unit markers on the field map: a frame by side (a rectangle for the first side, a diamond for
# the second), a glyph by type, an optional size mark above it, and a label beside it. A unit's
# type comes from its arms and order unless it sets `type`; its size mark only if it sets `size`.
# labels: names, ids (the side's initial and a number: B3) or both; strength: men after the label;
# size: draw size marks. These are the defaults: a battlefield's `markers` overrides them, and
# the board can change them during play.
markers:
  labels: names
  strength: true
  size: false
  types:
    infantry: "Infantry"
    skirmishers: "Skirmishers (open order)"
    cavalry: "Cavalry"
    archers: "Archers"
    artillery: "Artillery"
    machine_guns: "Machine guns"
    anti_tank: "Anti-tank guns"
    armour: "Armour"
    mechanised: "Mechanised infantry"
    transport: "Transport"
  sizes: {section: "•", platoon: "•••", company: "I", battery: "I", battalion: "II", regiment: "III", brigade: "X", division: "XX"}

# Formations. per_hex = abreast x ranks men to a hex. move: hexes an exchange on foot.
# missile_factor: shots at a unit in this order count this much (open order is harder to hit).
formations:
  close: {name: "Close order", abreast: 10, ranks: 4, per_hex: 40, move: 6, missile_factor: 1.0}
  open:  {name: "Open order", abreast: 10, ranks: 2, per_hex: 20, move: 8, missile_factor: 0.8}
  battery: {name: "Battery", abreast: 4, ranks: 5, per_hex: 20, move: 6, missile_factor: 0.8}   # two guns and their crews a hex (see artillery)
  extended: {name: "Extended order", abreast: 3, ranks: 1, per_hex: 3, move: 8, missile_factor: 0.5}   # modern infantry: a few yards between men
  armour: {name: "Armour", abreast: 1, ranks: 1, per_hex: 4, move: 12, missile_factor: 1.0}   # vehicles, one a hex (per_hex and move are the vehicle kind's: see vehicles)
  mg: {name: "Machine-gun team", abreast: 5, ranks: 1, per_hex: 5, move: 4, missile_factor: 0.5}      # a gun and its crew a hex (see machine_guns)
  at_gun: {name: "Anti-tank guns", abreast: 1, ranks: 1, per_hex: 5, move: 2, missile_factor: 0.5}   # a towed gun and its crew a hex, manhandled (see anti_tank_guns)
mounted_move: 15           # hexes an exchange for mounted units, in either order
charge_move: 2             # a unit that ends its move in contact may move this many times its allowance (a charge)
turn_per: 2                # turning the facing one step (60 degrees) costs 1 hex for every this many hexes of front (at least 1)
shoot_ranks: 2             # ranks of each front hex that can shoot
# Line of fire: a unit cannot shoot through another unit, friend or enemy, standing between it
# and its target, except from high ground over a unit on lower ground. Bows (`arcing`) can
# loose high over them instead, at `arc_penalty` % off. Guns: see artillery.
# Ground that screens (`screen`: woods, buildings, tall buildings) between the shooter's hex
# and the target's blocks aimed fire, direct gun fire and the sight for calling fire, unless it
# stands lower than the shooter (he sees over it). Rubble gives cover and hides men, but its
# heaps are low: it does not screen. Men see `see_into` hexes into
# cover: those next to either end of the line do not block (a shooter at a wood's edge fires
# out; a target just inside it is seen). Shell fire and a machine gun's fixed line need no sight.
line_of_fire:
  arcing: [bow, longbow, crossbow]
  arc_penalty: 20
  see_into: 1
  # Dead ground: open ground on the line between two hexes that stands higher than both (a slope
  # or high ground, from units.ground height; tall buildings block sight as buildings do) hides
  # each from the other: no aimed fire, no guns laying, no calling fire, and the enemy commander
  # does not see past it. Crest hexes within `crest_clear` of either end do not count: a man (or
  # a tank, hull-down) just behind a crest sees over it, and is seen. A man on the top sees down
  # both slopes.
  crest_clear: 1
  # Light cover (ground marked `light`: scrub, brush, orchards, hedgerows, tall grass) thins
  # sight rather than blocking it: each hex of it on the line between a shooter and his target
  # (not the hexes they stand in), as high as he stands, costs aimed fire `per` %, and more than
  # `blind_past` such hexes block sight altogether (aimed fire, guns laying, spotting). Design
  # estimates.
  thin: {per: 10, blind_past: 3}
exchange_rounds: 10        # individual 6-second rounds in one exchange (for fatigue, bleeding, states)

# The ground, painted per hex. move: movement to enter a hex of it (open ground 1); impassable:
# no unit can enter or stand in it (cross at a bridge: paint the bridge open ground). cover: %
# off shots at men standing in it. stops_shot: round shot does not bound on over it. height: how high it
# stands (high ground and tall buildings 10, a slope 5): a blow struck up at men on it from lower ground is
# that much % off less the striker's own height (as a bank's), it is high ground for shooting by the
# difference (high_ground), and from it a man sees and shoots over lower ground's cover and units. hides: men in it are hard to
# see (hidden). screen: it blocks sight past its edge; light: it thins sight (line_of_fire.thin).
# no_horse: horses cannot go into it. Works (ditches, banks,
# palisades, gates, walls, stakes, felled trees, wagons, pavises) are those of the battle
# map (works.yaml), with the same crossing costs, cover and height, along the 10 m hexes.
# key: the letter for the ground in a battlefield file's rows (data/fields).
ground:
  open:  {name: "Open ground",  key: ".", move: 1}
  rough: {name: "Rough ground", key: "r", move: 2, stops_shot: true}
  woods: {name: "Woods",        key: "F", move: 2, cover: 20, stops_shot: true, screen: true}
  scrub: {name: "Scrub and orchard", key: "o", move: 2, cover: 10, light: true}   # brush, gorse, orchards, hedgerows, tall grass: thins sight (line_of_fire.thin) and slows as woods do
  marsh: {name: "Marsh",        key: "m", move: 3, no_horse: true, stops_shot: true}
  slope: {name: "Slope",        key: "s", move: 2, height: 5}                     # the side of a hill: half its height for shooting and close combat
  high:  {name: "High ground",  key: "h", move: 1, height: 10}
  buildings: {name: "Buildings", key: "T", move: 2, cover: 30, stops_shot: true, no_horse: true, hides: true, screen: true}   # houses, walls, yards
  tall:  {name: "Tall buildings", key: "B", move: 3, cover: 40, stops_shot: true, no_horse: true, hides: true, height: 10, screen: true}   # blocks of several storeys: high ground for shooting; the streets between are open ground
  rubble: {name: "Rubble", key: "x", move: 3, cover: 40, stops_shot: true, no_horse: true, hides: true}   # a town bombed or shelled to ruins: broken walls, craters, heaps of masonry
  water: {name: "Water",        key: "w", move: 1, impassable: true}                                # a canal or river: shots cross it, men do not
# Breaching: a unit ordered to breach puts this share of each front hex's front rank to
# hacking at the work in front of it, every round of the exchange. A work's breach figure
# (man-rounds, works.yaml) is for a 2 m hex side; a 10 m side takes five times as long.
breach_share: 0.5
# Escalade: a foot unit marked with ladders (by the GM, or `ladders: true` in a battlefield file)
# fights across a work that blocks hand-to-hand fighting (a palisade, a wall, a barred gate) and
# climbs over it. Across it only `share` of the front rank of each front hex fights (the men on
# the ladders, at least one a hex), at `penalty` % off their attack besides any climb up at men
# above; stepping over it costs `cross` hexes of movement (and, as any move, the hexes beyond
# must be clear of the enemy). Design estimates.
escalade: {share: 0.25, penalty: 20, cross: 4}

# ---------- guns ----------
# A battery is a unit whose weapon is a gun (listed in `guns`), in the battery formation. Its
# men are the crews, `crew` to a gun: 120 men serve 12 guns, and as crews fall fewer guns are
# served. Each served gun fires `rounds` rounds an exchange at the nearest enemy unit in front
# of it within `range` field hexes and in sight: canister at `canister_to` hexes or less, round
# shot beyond. The GM can name a target instead (u.target, an enemy unit's id): the battery
# fires at it if it is in range, in sight and in front, or at the nearest if not. All numbers
# are design estimates, tuned by python3 -m gravewounds units.
# - Line of fire: a gun cannot fire through another unit, friend or enemy, between it and its
#   target, except round shot from high ground over a unit on lower ground (never canister),
#   and shell from howitzers, which goes over anything.
# - Round shot: each round strikes the target unit with the chance for its range (less its
#   cover and the weather, times its formation's missile_factor), then goes through its ranks:
#   each man in the ball's path (the formation's ranks times the unit's rows, at most
#   `path_max`) is hit at `file` %. Deep columns suffer most. A strike on a battery may also
#   knock a gun off its carriage (`dismount` %): it is out for the rest of the fight.
# - Ricochet: on firm ground round shot bounds on past its target. The first other unit, friend
#   or enemy, on the line within `ricochet.beyond` hexes past it is struck by each round with the
#   chance for how far past it stands (times its missile_factor) and the ball goes through its
#   ranks as above. Ground that `stops_shot`, or mud or snow at `ricochet.soft` or more, stops it.
# - Canister: each round throws `balls` chances to hit, each at the chance for its range (with
#   the same cover, weather and formation), on the front of the target.
#   On firm ground (as for ricochet) balls skip on into the target: `graze` % is added to the
#   chance beyond the first band.
# A battery's `guns` are smoothbore (the default), rifled or howitzer.
# - Shell: howitzers fire shell beyond canister range, in a high arc
#   over anything between. Each shell falls on the target unit with the chance for its range
#   (`howitzer.strike`, times its formation's missile_factor, less the weather), then its fuse is
#   rolled (`fuse`: d100 up to each figure): early (it bursts short, harmlessly), air (it bursts
#   over the men: each of `fragments` chances hits at `air_hit` %, cover counting half), ground
#   (it bursts as it lands: `fragment_hit` %, less the full cover), or blind (it never bursts).
#   A burst on a battery may knock out a gun as a round-shot strike does. Within canister range
#   howitzers fire canister.
# - Rifled guns (the Civil War's Parrotts and ordnance rifles) reach `rifled.range` and fire
#   percussion shell beyond canister range on a flat path (a clear line of fire, as round shot):
#   it falls on the target with the chance for its range (`rifled.strike`), its fuse rolled on
#   `rifled.fuse`, bursting as shell does; it does not bound on. Their canister throws only
#   `rifled.canister_balls` balls a round.
# Every man hit takes a wound roll at `attack` (no parry) with the gun's wound data.
# A battery is limbered (moves as its formation; cannot fire) or unlimbered (fires; can only be
# manhandled `pushed` hexes an exchange). Limbering or unlimbering takes an exchange, in which
# it neither moves nor fires. Hand to hand, the crews fight with `crew_weapon`. A battery that
# breaks abandons its guns: it never fires again, even if it rallies.
# Ammunition: each gun goes into action with `ammo` rounds (its limber chest and its share of the
# caissons; a play figure), spent as it fires; a battery that is out falls silent. Resupplying
# (the caissons coming up) takes an exchange out of contact, in which it neither moves nor fires.
artillery:
  guns: [artillery_smoothbore, artillery_acw]   # the weapons a battery fires (its wound data); its `guns` setting picks smoothbore, rifled or howitzer
  crew: 10
  rounds: 1
  range: 100                 # field hexes: 1,000 m
  canister_to: 30            # field hexes: 300 m
  round_shot:
    strike: [[50, 60], [75, 40], [100, 25]]    # [up to this many hexes, % a round strikes the unit]
    file: 40
    path_max: 12
  canister:
    balls: 8
    strike: [[10, 50], [20, 30], [30, 15]]
    graze: 5                 # % added beyond the first band on firm ground
  howitzer:
    strike: [[50, 45], [75, 30], [100, 20]]    # [up to this many hexes, % a shell falls on the unit]
    fuse: [[15, early], [40, air], [85, ground], [100, blind]]   # [d100 up to, what the fuse does]
    fragments: 12            # chances to hit for each burst
    fragment_hit: 25         # each, for a burst on the ground
    air_hit: 35              # each, for a burst over the men
  rifled:
    range: 160               # field hexes: 1,600 m
    strike: [[50, 60], [100, 45], [160, 30]]    # [up to this many hexes, % a shell falls on the unit]
    fuse: [[5, early], [10, air], [85, ground], [100, blind]]   # percussion: most burst as they strike
    canister_balls: 5        # a rifle's canister: fewer, smaller balls than a smoothbore's
  attack: 80
  crew_weapon: sword
  pushed: 2                  # hexes an unlimbered battery can be manhandled (or turned) in an exchange
  ammo: 50                   # rounds a gun carries into action
  dismount: 10               # % a round-shot strike on the battery fired at knocks out one of its guns
  ricochet:
    beyond: 30               # field hexes past the target a bounding ball can still strike a unit
    strike: [[10, 30], [20, 20], [30, 10]]     # [up to this many hexes past the target, % a round strikes]
    soft: 1                  # mud or snow at this level or more stops the bounce
  # Guns in full. The GM may order a battery's shot instead of leaving it to the range (canister
  # only within canister range); smoothbores fire round shot, shell (spherical case) or canister,
  # howitzers shell or canister, rifles shell, solid bolts (as round shot) or canister. A battery
  # can split off a section of its guns at a second target, with its own shot. Gunners cut their
  # fuses rather than leave them to chance: the air band of the fuse table grows by the crew's
  # `quality` figure, and by `ranged` when the battery fired at the same target last exchange at
  # much the same range (within `within` hexes). A battery charged in front fires `closing`
  # rounds of canister a gun at its first charger as it comes in, before the melee.
  shots:
    smoothbore: [round, shell, canister]
    howitzer: [shell, canister]
    rifled: [shell, round, canister]
  set_fuse:
    ranged: 15
    within: 2
    quality: {green: -10, regular: 0, veteran: 10}
  closing: 1

# ---------- quality ----------
# The unit's fighting quality: attack and defence (parry or dodge) % for its men, and the
# Nerve its morale checks use (the same ratings as individual fighters).
quality:
  green:   {attack: 40, defence: 25, nerve: 35}
  regular: {attack: 50, defence: 35, nerve: 50}
  veteran: {attack: 60, defence: 45, nerve: 65}

# ---------- melee ----------
# Fighting men: the front rank of each hex touching the enemy (the formation's `abreast` men),
# and one more rank for each hex of the weapon's reach past the first, up to the formation's
# ranks: spears and bills (reach 2) strike from two ranks, the pike (reach 3) from three.
# Each exchange, `tempo` of the fighting men land a telling blow's attempt; the rest of the
# minute is pressing, shoving and watching. Tuned so that two equal regular units with no
# armour hit about 3% of the men in contact a minute (the chosen pace: 2-4%); about a third
# of those are put out of the fight, the rest fight on wounded. Armour cuts it further.
melee:
  tempo: 0.09
  flank: {attack: 20, defence: -100}      # % to the attacker's chance, and to the defender's (-100: no defence)
  rear: {attack: 30, defence: -100}
  charge: {attack: 20, tempo: 2.0}        # the first exchange of a charge by mounted men: +attack, x tempo
  shaken: {attack: -10}                   # a shaken unit fights worse
  # A front of pikes against horse: a steady unit in one of `formations` armed with one of
  # `weapons`, struck by mounted men from its front, takes no charge from them (as stakes), and
  # its men strike mounted men to their front at +`attack` %. Design estimate.
  pikes: {weapons: [pike], formations: [close], attack: 20}

# ---------- missiles ----------
# Shooting men: those with a missile weapon and the target in range (the field map counts
# them: the front two ranks of a line). Each fires `rate` shots a minute; `tempo` of those
# are aimed at a man rather than at the mass, and roll to hit like an individual's shot at
# that range (combat.range bands; weather and cover as on the battle map). No parry; a
# shield counts through the hit-location tables. Tuned so 100 archers with longbows at
# medium range hit about 8 unarmoured men a minute.
missile:
  tempo: 0.033
  rate:                     # shots a minute, by weapon (design estimates)
    aa_gun: 150
    longbow: 8
    bow: 8
    crossbow: 2
    sling: 6
    matchlock_musket: 1
    musket_smoothbore: 2
    rifle_flintlock: 1
    rifle_musket: 2
    breechloader: 8           # Sharps, Spencer, Springfield 1866: about eight aimed rounds a minute
    rifle_service: 10         # bolt-action magazine rifles (1914-1953): about ten aimed rounds a minute
    rifle_assault: 15         # self-loading and assault rifles, aimed fire
    pistol_smg: 12            # pistols and submachine guns, aimed fire
    machine_gun: 300          # a gun, not a man: rounds a minute in bursts (see machine_guns)
  default_rate: 1

# ---------- ammunition ----------
# A unit with a missile weapon (not vehicles, batteries or anti-tank guns, which count their
# own rounds) carries a load into action, counted in exchanges of fire: its weapon's `loads`
# (rounds, arrows or bolts a man carries; a machine gun's or anti-aircraft gun's, a gun)
# divided by its missile.rate times `burn`, rounded (at least 1). `burn` is the share of the
# full rate a unit really spends in an exchange it shoots: men do not fire every round they
# could (a design estimate, the one tuned figure here). Each exchange it shoots uses one.
# At or under `low` of a full load it fires at half rate; with none left it cannot shoot
# (it still fights hand to hand) and its morale is morale.mods.no_ammo. Resupply: an exchange
# out of contact, neither moving nor firing, within `reach` hexes of a source - its side's
# map edge (behind the way most of its men face), a supply vehicle of its side (`vehicles`:
# kinds, steady), or a supply dump (field dumps: placed in set-up, or by air drop from the
# battles in `air_drop.battles`, landing at the end of the exchange up to `air_drop.scatter`
# hexes off). Then it has a full load again.
# Loads: sourced figures where the regulations or accounts give one, else estimates (marked).
ammunition:
  burn: 0.3
  low: 0.25
  reach: 5
  vehicles: [lorry, apc, ifv]
  air_drop: {scatter: 2, battles: ["WWII", "Korea", "Vietnam", "Late 20th century", "Iraq & Afghanistan"]}
  loads:
    longbow: 48               # two sheaves of 24 (the usual figure; more were brought up)
    bow: 24                   # a sheaf (estimate)
    crossbow: 18              # a quiver of bolts (estimate)
    sling: 20                 # estimate
    matchlock_musket: 12      # the bandolier's twelve charges ("twelve apostles")
    wheellock_pistol: 12      # estimate
    musket_smoothbore: 60     # the British pouch of 60 rounds (French 50)
    rifle_flintlock: 60       # estimate, as the musket
    pistol_flintlock: 12      # estimate
    rifle_musket: 60          # 40 in the cartridge box and 20 more (Civil War)
    breechloader: 100         # 50 on the man and 50 in the saddlebags (US cavalry, 1870s)
    revolver: 24              # estimate
    rifle_service: 120        # 1914-53: 150 for the British in 1914, 80-136 for a US rifleman in 1944 (a middle figure)
    rifle_ap: 120             # as the service rifle
    rifle_assault: 300        # Vietnam: 300 or more in 20-round magazines (later wars about 210)
    pistol_smg: 160           # eight magazines of 20 (estimate)
    machine_gun: 2000         # a gun's belts with its team (estimate)
    aa_gun: 1000              # a gun's ready rounds (estimate)
    hand_grenade: 4           # estimate
    rpg: 3                    # a gunner's rockets (estimate)
    bazooka: 3                # estimate
    recoilless: 4             # estimate
    atgm: 3                   # estimate

# ---------- machine guns ----------
# A machine-gun team is a unit whose weapon is listed in `weapons`, in the mg formation: a
# gun and its crew to a hex, `crew` men a gun, so 10 men serve 2 guns; as crews fall the guns
# go on until the last man (a gun is served while a man of its crew is up). Each served gun
# fires missile.rate rounds a minute at its target, and `tempo` of them are rolled as aimed
# shots (a rifleman's missile.tempo is far lower: the gun's cone of fire sweeps the target's
# depth, so many more of its rounds find a man); the formation's missile_factor counts as for
# any shot. Its beaten zone: the cone of fire falls on along the
# line of fire for `beaten.beyond` field hexes past the target; the first other unit there,
# friend or enemy, takes `beaten.share` % as many shots at that range (ground that stops shot
# stops it). Design estimates, tuned by python3 -m gravewounds units (the machine-gun lines).
machine_guns:
  weapons: [machine_gun, aa_gun]
  crew: 5
  tempo: 0.1
  beaten: {beyond: 20, share: 50}

# ---------- indirect fire ----------
# Modern artillery and mortars fire from off the map, on call. Each side lists its supporting
# batteries (field.support on the field map: a name, a kind below, tubes, rounds). On its own
# move the GM calls a battery's fire on a hex that one of the side's units can see (in sight
# in the weather, no woods between: see spotted), once or until stopped. The shells land
# `delay` exchanges later (mortars at once), each tube `rate` shells an exchange while rounds
# last. Each shell scatters: d6 for the direction and 0 to `scatter` hexes from the hex
# called. Where it bursts, every man in a hex within `radius` (of any unit, friend or foe) is
# struck at the % in `struck` for his distance in hexes (0 = the burst's own hex), times
# `prone` for a unit gone to ground and less the hex's ground cover. A struck man rolls a
# wound as a hit by the table's shell weapon (`weapon`, or `fallback` if the table lacks it)
# at `attack` %, as a battery's. Design estimates, tuned by python3 -m gravewounds units.
#
# tree_burst: a shell bursting in the branches over men in woods (`ground`) showers them from
#   above: the woods give no cover, the struck % is times `factor`, and going to ground cuts
#   it only to `prone` (not the usual `prone` above).
# smoke: a mission may fire smoke instead (the same rounds). Each burst fills its hex and
#   those within `radius` with smoke that hangs for `lasts` exchanges by the wind, counting
#   the one it lands in; since the shooting comes before the shells land, it screens the
#   next lasts - 1 exchanges (calm: 3; a gale blows it away at once). No one sees or shoots
#   into, out of or through smoke, and fire cannot be called on a hex behind it. It wounds
#   no one. At the end of each exchange it drifts `drift` hexes downwind (the hex side
#   nearest the way the wind blows; calm air leaves it where it is), and off the map is gone.
# illum: a mission may fire illumination instead (a kind with `illum`): one round a tube served
#   lights every hex within `illum` field hexes of its aim for weather.yaml light.lasts
#   exchanges after the one it is fired in (the shooting comes first). It needs no one to see
#   the hex, and wounds no one. A lit hex is seen as by day (weather.yaml light).
# counter_battery: a battery that has fired is located (flash and sound), and from then on the
#   other side may call fire on it instead of on a hex, with no one needing to see it. Each
#   shell lands among its guns at the kind's `counter` % (mortars cannot reach), knocking out
#   a tube and striking `among` of its crew; at `near` times that % it bursts close by and
#   strikes `near_struck`. Struck crewmen roll wounds as men struck by shellfire; those put
#   down are lost to the battery. A battery has `crew` men a tube and fires only the tubes it
#   has `serve` men each for. Ordered to displace, a battery is silent for `displace`
#   exchanges and then is no longer located: missions on it end (tanks never displace).
# range and place: a battery may be given a `place` (a hex, on the map or off it, where its guns
#   stand). Then it can fire only on hexes within its kind's `range` (field hexes: mortars 3.6 km,
#   field guns 11 km, heavy howitzers 14.5 km), and counter-battery fire reaches a placed battery
#   only from within range. A placed battery with an enemy unit within a hex of its place is
#   overrun: its tubes are lost. Ordered to displace, it can be given a new place (`to`), where
#   it stands once it has moved. A battery with no place fires from off the map, as before.
#   The enemy commander moves a placed battery it displaces `displace_shift` hexes along its
#   map edge, away from the battery firing on it.
# knock: % that a shell bursting on a bunker's hex knocks the bunker out (its men lose its
#   cover, and it can be stormed). A bunker's men get its cover against shellfire too.
# direct: tanks firing over open sights, close behind the line: they land at once, do not
#   scatter, and are never located for counter-battery fire (small arms cannot hurt them).
# air: aircraft on call, called like a battery (a `tube` is an aircraft, `rounds` its bombs or
#   its rocket and gun passes, so fighter-bombers have two sorties an aircraft). They are
#   never located (counter-battery fire cannot find them) and have no crews to lose. They do
#   not fly in the weather `grounded` lists, and those without `by_night` do not fly in the
#   lights `night` lists (weather.yaml light); a mission waits until they can. `shot`: what the
#   log calls one (and many). Design estimates.
#   ground_fire: each attack run, every aircraft attacking is shot down at a chance (%): `mg` a
#   machine gun served, `rocket` a unit with an RPG or recoilless rifle, and `rifles` every 100
#   men with other firearms, of each enemy unit (not in vehicles, not broken) within `reach`
#   field hexes of the aim; times the kind's `exposed` (low, slow helicopters), at most `cap`.
#   A lost aircraft takes its share of the flight's remaining attacks with it.
#   fac: a forward air controller (a unit marked fac) of the aircraft's side who sees the aim
#   talks them on: their scatter is divided by `scatter` (rounded down). Without one, aircraft
#   hold off a target with friends within `danger` field hexes: the mission waits.
# creep: a mission that keeps firing may creep, its aim lifting that many hexes (1 to `max`)
#   in the direction chosen, ahead of an advance: by the fire plan, after `every` exchanges on
#   each line (1 to `every_max`), and over `lines` lines before it stops (0: until it leaves
#   the map).
indirect:
  displace_shift: 30
  weapon: mortar_artillery
  fallback: explosive_fragment
  attack: 70
  prone: 0.35
  kinds:
    mortar:   {name: "Mortars",          range: 360,  rate: 3, rounds: 60, delay: 0, scatter: 2, radius: 2, struck: [15, 5, 1],                counter: 0, crew: 4, serve: 2, displace: 1, illum: 15}
    field:    {name: "Field guns",       range: 1100, rate: 2, rounds: 80, delay: 1, scatter: 4, radius: 3, struck: [20, 8, 3, 1],             counter: 2, crew: 6, serve: 3, displace: 2, illum: 30}
    howitzer: {name: "Heavy howitzers",  range: 1450, rate: 1, rounds: 40, delay: 1, scatter: 5, radius: 5, struck: [30, 12, 5, 2, 1, 0.5], counter: 4, knock: 2, crew: 8, serve: 4, displace: 3, illum: 40}
    tank:     {name: "Tanks (direct fire)", rate: 2, rounds: 60, delay: 0, scatter: 0, radius: 1, struck: [25, 5],              counter: 0, knock: 8, direct: true, crew: 5, serve: 3, displace: 0}
    autocannon: {name: "Autocannon (direct fire)", rate: 3, rounds: 300, delay: 0, scatter: 0, radius: 0, struck: [20],              counter: 0, knock: 3, direct: true, crew: 3, serve: 2, displace: 0}
    fighter_bomber: {name: "Fighter-bombers (bombs, napalm)", rate: 2, rounds: 4, delay: 2, scatter: 3, radius: 4, struck: [45, 25, 12, 5, 2], counter: 0, knock: 15, air: true, by_night: false, exposed: 1, shot: [bomb, bombs]}
    gunship:  {name: "Helicopter gunships (rockets, guns)", rate: 4, rounds: 24, delay: 0, scatter: 1, radius: 1, struck: [20, 6], counter: 0, knock: 4, air: true, by_night: true, exposed: 2, shot: [rocket and gun pass, rocket and gun passes]}
  air:
    grounded: [fog, storm, heavy_snow, blizzard, sandstorm]
    night: [moonlit, night]
    ground_fire: {reach: 30, mg: 0.5, rocket: 1, rifles: 0.2, cap: 12, rockets: [rpg, recoilless], aa: 3, aa_reach: 100, aa_cap: 35, aa_weapons: [aa_gun], downed: 40}
    fac: {danger: 10, scatter: 2}
    # Attack runs: an air mission called as a strafing run or a napalm strip falls on a line of
    # `length` hexes through the aimed hex (after scatter), along the direction called (`dir`),
    # a pass an attack: every man in a hex of the line is struck at `struck` % (strafing: less the
    # ground's cover and for going to ground, as shellfire; napalm: neither helps), a vehicle in it
    # knocked out at `knock` % times its armour's `shell`. Strafing wounds as the table's machine
    # gun (else shell fragments); napalm puts a man struck down with critical burns, and kills
    # `dead` % of them outright. `kinds`: the aircraft that fly it; napalm only in `wars`.
    # Marking: an air attack whose aimed hex is in smoke (a mortar's or gun's smoke round laid on
    # it) scatters half as far, as with a forward air controller (not both).
    # Ground fire: an anti-aircraft gun unit (`aa_weapons`) adds `aa` % a gun it serves, within
    # `aa_reach` hexes of the aim, on top of the small arms' `cap` (the whole at most `aa_cap`,
    # both times the kind's `exposed`); of the aircraft hit, `downed` % are brought down and the rest
    # damaged: they drop their remaining attacks and turn for home (out of the mission either way).
    runs:
      strafe: {length: 5, struck: 12, knock: 3, kinds: [fighter_bomber, gunship]}
      napalm: {length: 3, struck: 45, knock: 15, dead: 35, kinds: [fighter_bomber], wars: [WWII, Korea, Vietnam, "Late 20th century", "Iraq & Afghanistan"]}
  tree_burst: {ground: [woods], factor: 1.5, prone: 0.7}
  smoke: {radius: 1, lasts: {calm: 4, breeze: 3, strong: 2, gale: 1}, drift: {calm: 0, breeze: 1, strong: 2, gale: 2}}
  counter_battery: {among: 2, near: 3, near_struck: 1}
  creep: {max: 3, every_max: 4}

# ---------- vehicles ----------
# A vehicle unit (`vehicle`: a kind below) is tanks, infantry fighting vehicles or armoured
# carriers on the field, one a hex: its men are their crews, `crew` a vehicle, in the armour
# formation, with the kind's `move`. Its machine guns fire as a machine-gun team's (its weapon is
# the machine gun). A kind with a `gun` also fires its main gun each exchange, `rate` rounds a
# vehicle whose gun still works, at the nearest enemy unit in range, in sight (as guns are) and
# in front of it, enemy vehicles first: at a vehicle each round hits at the `hit` % for its range
# in field hexes and then knocks it out at its armour's `gun` %; at men it bursts on the nearest
# of their hexes as the indirect-fire kind `he` does (no scatter).
# Armour: small arms cannot hurt a vehicle (men with them do not shoot at one), and no one
# strikes it, or is struck by it, hand to hand. Men with an `anti_armour` weapon fire its `rate`
# rounds a man at a vehicle (every one aimed); each that hits (as at men: range, cover, the
# weather) knocks a vehicle out at its armour's `row` % (rpg or atgm). A round into a vehicle's
# flank or rear (where the shooter stands, by the vehicle unit's facing) knocks it out at that %
# times `aspect` (to 100 at most). A hit that does not knock it out may still do harm (`damage`):
# each such hit is on the turret at `turret` %, else the hull, and does what that part's line
# says: at `immobilised` % it cannot move, at the next `gun` % its main gun is out (the turret
# more often puts the gun out, the hull more often stops it). A unit with an
# immobilised vehicle cannot move until it abandons it (its crew leave the fight unhurt). A shell
# or bomb bursting in a vehicle's own hex knocks it out at the firing kind's `knock` % times its
# armour's `shell`. A knocked-out vehicle's crew are out of the fight: each is struck at
# `crew_struck` % and rolls a wound as one struck by shellfire.
# Riders: a carrier kind (`carry` men a vehicle) takes a foot unit of its side aboard (it
# mounts from within a hex of the carriers on its own move). Riders do not fight, shoot or check
# morale; they move with the carriers and get down beside them on the carriers' move (they can
# move the exchange after). When a carrier is knocked out, its share of the riders are each
# struck at `riders_struck` %; when the last is, the riders get down where it stood.
vehicles:
  kinds:
    tank: {name: "Tanks", crew: 4, move: 12, armour: heavy, rides: 6, fc: true, gun: {range: 100, rate: 1, he: tank, hit: [[20, 75], [50, 50], [100, 25]]}}   # fc: its gun by its fire control (below)
    ifv:  {name: "Infantry fighting vehicles", crew: 3, move: 14, armour: light, carry: 7, ports: true, gun: {range: 80, rate: 2, he: autocannon, hit: [[20, 70], [40, 45], [80, 20]]}}
    apc:  {name: "Armoured carriers", crew: 3, move: 14, armour: light, carry: 10}
    tractor: {name: "Gun tractors and trucks", crew: 2, move: 12, armour: soft, tows: 1}
    lorry: {name: "Lorries", crew: 2, move: 14, armour: soft, carry: 20}
  # A tank's main gun hits by its fire control, by range in field hexes (first round, at a
  # stationary target), and reaches the last band: optical sights (the Second World War and
  # Korea: one sourced point, about 5% a round at 1,500 m, a 76 mm tank needing some 13 rounds for
  # an even chance; the nearer bands as before), a stadia reticle (the 1950s-60s: an M48's 90 mm),
  # a laser rangefinder (the 1970s-80s: the 125 mm of a T-64 or T-72), and a modern thermal fire
  # control (an M1A1: no published figure; the laser figures as a floor, since it did better than
  # the projections, reaching 3,000 m). Figures from Isby (Weapons and Tactics of the Soviet Army;
  # Armies of NATO's Central Front) and the GAO's Desert Storm assessment (NSIAD-92-94). A tank
  # unit takes its war's (by the wound table's battle, `by_war`) unless the battlefield gives
  # its own (`fc`).
  fire_control:
    optical: {name: "Optical sight", range: 150, hit: [[20, 75], [50, 50], [100, 25], [150, 5]]}
    stadia:  {name: "Stadia reticle", range: 200, hit: [[50, 98], [100, 35], [200, 4]]}
    laser:   {name: "Laser rangefinder", range: 300, hit: [[50, 98], [100, 94], [150, 75], [200, 55], [300, 35]]}
    thermal: {name: "Thermal fire control", range: 300, hit: [[50, 98], [100, 94], [150, 75], [200, 55], [300, 35]]}
    by_war: {"WWII": optical, "Korea": optical, "Vietnam": stadia, "Late 20th century": laser, "Iraq & Afghanistan": thermal}
  # A vehicle unit's morale checks count whole vehicles lost (knocked out or abandoned), not
  # crewmen hit in vehicles still fighting: its losses are its crews in vehicles gone. Design choice.
  # A battlefield may give a vehicle unit its own armour (`armour`). Composite armour (the M1A1
  # Abrams): as heavy, but a tank gun's round from its front does not knock one out (`front`):
  # the GAO found no T-72 round reported through an M1A1's front, even from 2,000 m, and no
  # Abrams destroyed by enemy fire in the Gulf War (NSIAD-92-94). Flank and rear as heavy.
  armour:
    composite: {rpg: 15, atgm: 60, gun: 35, shell: 1, mine: 25, front: {gun: 0}}
    heavy: {rpg: 15, atgm: 60, gun: 35, shell: 1, mine: 25}
    light: {rpg: 50, atgm: 90, gun: 75, shell: 3, mine: 60}
    # Soft-skinned (lorries and gun tractors): small arms shoot at them too, each aimed shot that
    # hits knocking one out at `small` % (no lesser damage, but a hit that does not knock one
    # out strikes one of the men riding in it, wounded by that weapon); everything else kills them easily.
    soft: {rpg: 80, atgm: 95, gun: 90, shell: 6, mine: 80, small: 5}
  # rides (a kind): men a vehicle carries on its hull, outside (tank riders, "desant"). Small arms
  # shoot at a unit with men on its hull; each hit that knocks no vehicle out strikes a rider.
  # Aimed shots a man fires at soft-skinned vehicles (or at men riding on a hull) an exchange: `rate` for rifles and the like,
  # `mg` for a machine gun's crewmen (design estimates).
  small_arms: {rate: 0.5, mg: 3}
  # Riders shooting from the vehicle (design estimates): through an IFV's firing ports
  # (`ports`), this share of them; from a tank's hull (`rides`), this share. Men inside
  # carriers and lorries do not shoot.
  rider_fire: {ports: 0.25, hull: 0.5}
  aspect: {flank: 2.0, rear: 3.0}
  anti_armour:               # weapon: rate (rounds a man fires at a vehicle an exchange, every one aimed) and the armour row it hits on
    rpg:        {rate: 0.25, row: rpg}
    bazooka:    {rate: 0.25, row: rpg}
    recoilless: {rate: 0.25, row: rpg}
    atgm:       {rate: 0.1,  row: atgm}
  damage:
    turret: 35
    turret_hit: {immobilised: 5, gun: 40}
    hull_hit: {immobilised: 35, gun: 5}
  crew_struck: 50
  riders_struck: 30
  ground: {open: 1, rough: 2, woods: 3, slope: 2, high: 1}

# ---------- anti-tank guns ----------
# A unit armed with an anti-tank gun (`weapons`; on the Second World War's and Korea's tables)
# is guns and their crews, `crew` men a gun, in the at_gun formation (a gun a hex, manhandled).
# It fires as a vehicle's main gun (`gun`, as vehicles.kinds): `rate` rounds a gun its crews
# still serve each exchange, at the nearest enemy in range, in sight and in front, vehicles first;
# at a vehicle a hit knocks it out at its armour's `gun` %, at men a round bursts as the
# indirect kind `he`. It does not shoot small arms. Its crews are men: rifles, machine guns and
# shells strike them; hand to hand they fight with `crew_weapon`. Design estimates, from the
# towed guns of 1939-53 (the British 6-pounder and the US 57 mm, the German Pak 38 and 40, the
# Soviet and North Korean 45 mm, the Japanese 47 mm).
anti_tank_guns:
  weapons: [at_gun]
  crew: 5
  rounds: 40
  crew_weapon: bayonet
  gun: {range: 100, rate: 1, he: tank, hit: [[20, 70], [50, 45], [100, 20]]}

# Towing: anti-tank guns hook up to gun tractors or trucks of their side beside them
# (vehicles.kinds `tows`: guns a vehicle tows), riding with them as riders do and neither
# firing nor fighting; unhooked, they get down beside the tractors and fire from the next
# exchange. Tractors are soft-skinned (vehicles.armour.soft). The enemy
# commander leaves tractors and the guns they tow to the GM. Design estimates.
# Each gun goes into action with `rounds` rounds, spent one a round fired; Resupply refills them
# (an exchange out of contact, neither moving nor firing), as a black-powder battery's caissons.

# ---------- gun shields and emplacements ----------
# Gun shields: the crews of the guns that carried one (`weapons`) get `cover` % against small
# arms (rifles, machine guns, pistols, bows: aimed fire) from their front only; none against
# shell, bombs, canister or fire from the flank or rear. Of the weapons in `optional` some had
# one and most did not (a Maxim on a wheeled Sokolov mount did; most machine guns did not):
# the GM marks a unit shielded in set-up, and it gets the same cover.
# Emplaced: before the battle the GM can dig a gun unit in (anti-tank guns, anti-aircraft guns,
# machine-gun teams, batteries: `units`). Its crews count as gone to ground (to_ground cover,
# hidden, less struck by shellfire, steadier) while it stands, and it cannot move all battle,
# though it can turn. A unit that breaks leaves its pits. Design estimates.
gun_shields:
  weapons: [at_gun, aa_gun]
  optional: [machine_gun]
  cover: 30

# ---------- minefields ----------
# The GM paints minefields on hexes before the battle (field.mines: {hex: {kind, hidden}}),
# on a table that has mine wounds (`weapon`, 1939 on). A marked field shows on the map; a
# hidden one only once something has gone into it. A unit that moves into minefield hexes (its
# ground crossed: its footprint along a straight line from where it stood when the exchange's
# moves began, less where it was) sets them off when the exchange is resolved, before the
# shooting: for each such hex, each man of a hex's worth (its formation's men a hex) is struck at
# the kind's `men` %, and rolls a wound as one struck by a mine at `attack` %; a vehicle that goes
# into it is struck at its `vehicles` %, and then knocked out at its armour's `mine` %, else
# immobilised (a track blown off). Design estimates.
mines:
  weapon: mine_ied
  attack: 70
  kinds:
    ap:    {name: "Anti-personnel mines", men: 10, vehicles: 0}
    at:    {name: "Anti-tank mines", men: 0, vehicles: 30}
    mixed: {name: "Mixed minefield", men: 8, vehicles: 25}
  # Sappers (a foot unit marked sappers) can lay or lift mines during the battle, on their side's
  # move, standing and out of contact: they neither move nor shoot while they work. After `lay`
  # exchanges the row of hexes just ahead of their front (as wide as it) is a hidden minefield of
  # the kind chosen; after `clear` exchanges the known minefield hexes in that row are lifted
  # (a lane). Moving, turning, breaking or coming into contact stops the work. Design estimates.
  sappers: {lay: 3, clear: 2}

# ---------- landing by air ----------
# A field can mark landing zones (field.lz, hexes). Each side has helicopters (field.helos, else
# these defaults, X-Ray's: `aircraft` Hueys of `carry` men each, back for the next load
# `turnaround` exchanges after they land). A unit can come on by air at a zone: it waits in
# field.lifts, and at the end of each exchange the side's free helicopters fly the lifts in the
# order called, at most `at_once` landing at a zone in an exchange; each takes `carry` men. A
# unit's first men come down on the zone's hex, or the nearest spot within `zone` hexes of it
# where they fit; later loads fill it out. No one lands while an enemy unit (not fled) stands
# within `blocked` hexes of the zone, or where the men would not fit. An enemy unit (not
# broken or fled) that could shoot at the zone's hex makes it hot: each man landing is struck
# at `hot` % and rolls a wound as a man struck by shellfire (indirect.attack), and each
# helicopter landing there is hit at `hit` %: of those `downed` % come down on the zone (a
# wreck, its crew out of the fight), the rest go home damaged; either way it is lost for the
# battle. A helicopter can also bring a supply dump to a zone (the wars in `supply_battles`),
# or lift a unit out from within `zone` hexes of one (out of contact; it does not move while
# it boards; its men flown out are safe). Design estimates.
heliborne: {aircraft: 16, carry: 5, turnaround: 30, at_once: 8, hit: 10, downed: 20, blocked: 2, hot: 10, zone: 4,
            supply_battles: ["Vietnam", "Late 20th century", "Iraq & Afghanistan"]}

# ---------- high ground ----------
# A shooter on higher ground (a ground kind's `height`) shooting at men on lower ground gets
# +`shoot` % and his range bands `reach` % longer for each 10 of height between them (a slope's
# 5: half, rounded down); shooting up costs `shoot` % for each 10 in the same way. Guns are left
# out: they have their own rule for firing over units from high ground.
high_ground: {shoot: 10, reach: 20}

# ---------- storming bunkers ----------
# Men in an intact bunker (a hex work in `works`) cannot be struck hand to hand, and do not
# strike out; they shoot out of it even with enemies next to it. A unit next to one, ordered
# to assault with one of `means` (on a table with the blast weapon: `weapon`, or `fallback`),
# rolls once an exchange for each such bunker across its front: d100 at or under the means'
# `knock` (+`pinned` if the bunker's men are pinned) knocks the bunker out. Then `struck` % of
# the men in its hex are hit: by blast as a hit by the blast weapon at `attack` %, or by flame
# (`flame: true`), which puts every man it reaches out of the fight with critical burns
# (burns are not on the hit-location tables), `flame_dead` % of them killed outright. A
# knocked-out bunker is a hex like any other. Design estimates.
assault:
  works: [bunker]
  weapon: hand_grenade
  fallback: explosive_fragment
  attack: 70
  pinned: 20
  flame_dead: 40
  means:
    grenades: {name: "Grenades", knock: 10, struck: 40}
    satchel:  {name: "Satchel charges", knock: 25, struck: 60}
    flame:    {name: "Flamethrowers", knock: 40, struck: 70, flame: true}

# ---------- suppression ----------
# Shellfire and machine-gun fire pin men down. A unit that a shell burst within reach of, or a
# machine gun fired on (or caught in its beaten zone), in an exchange checks at the end of it:
# d100 against its Nerve, + `prone` if gone to ground. A failure pins it for the next
# exchange: it cannot move, and it shoots at `fire` of its rate. A pinned unit hit again can
# be pinned again. Broken units do not check. Design estimates.
suppression:
  prone: 10
  fire: 0.5

# ---------- going to ground ----------
# Modern infantry (and anyone else) can go to ground: the men lie down, in folds of the
# ground, shell holes and ditches. The GM orders it for a unit on its side's move (Go to
# ground on the field map) and orders it up again the same way. A unit on the ground cannot
# move; shots at it lose `cover` % (on top of the ground's and the works' cover). It still
# shoots, and fights hand to hand as it stands. Design estimate.
to_ground:
  cover: 15

# Digging in during the battle: a foot unit with a modern weapon (commander.ground_with), out of
# contact, that neither moves nor fires for `exchanges` exchanges (shell scrapes and foxholes)
# is dug in where it stands: as emplaced (to_ground cover, hidden, less struck by shellfire,
# steadier) while it stays there. It can still move, leaving its holes. Design estimate.
dig_in:
  exchanges: 3

# ---------- hidden targets ----------
# Men gone to ground, in a bunker, or in ground that hides them (`hides`: buildings) show
# little of themselves: of the aimed shots fired at them, only `seen` % find a man to aim at
# (the rest go at where the fire came from), before cover and range. For every missile
# weapon and machine gun; men standing in the open are as easy to hit as ever. With the
# dug-in men's nerve (morale.mods.dug_in), tuned so a dug-in line, left alone, holds on the order
# of one and a half to two hours against five times its numbers (Osan, 1950).
# A machine gun's fire at hidden men finds a man at `mg_seen` % (it sprays where they are
# thought to be): it still pins them (suppression), but rarely kills them.
hidden:
  seen: 10
  mg_seen: 5

# ---------- wounds ----------
# Each blow that gets through rolls location, mechanism and severity from the margin, and
# armour, exactly as a single fighter's. Then:
#   light: the man fights on, wounded;
#   serious or critical: a stop check against the unit's Nerve (-10 for critical); a failure
#     takes him out of the fight (down); a pass leaves him fighting, wounded;
#   a wound whose untreated time to death is in `dead_if` kills him at once (counted dead,
#     and down).
# From a weapon in `modern_fire` (breech-loading rifles and carbines from the 1860s on, magazine
# rifles, machine guns, pistols and shell) a hit stops more men: a serious or critical wound always puts him down, and
# a light one calls for the stop check (a graze still leaves him fighting). Casualty returns
# from 1914 on count nearly every man hit as out of the line: he went back to the aid post.
# Named men (heroes) keep the roller's own rule.
dead_if: [instant, rounds]
modern_fire:
  weapons: [breechloader, rifle_service, rifle_assault, rifle_ap, machine_gun, pistol_smg, hand_grenade, mortar_artillery, rpg,
            mine_ied, explosive_fragment]

# ---------- unit morale ----------
# After each exchange a unit checks if it lost the exchange in contact (more of its men put
# down than it put down), or has lost `trigger` of its starting men in all, or `shock` of
# its present men in this exchange, or was struck in flank or rear: d100 against its Nerve
# with the modifiers below. A steady unit that fails is shaken (fights worse, cannot
# charge); one that fails by more than `shaken_by` while flanked or with half its men down
# breaks at once. A shaken unit that fails breaks. A shaken unit out of contact that passes
# a check rallies to steady. A broken unit runs.
morale:
  trigger: 0.25
  shock: 0.10
  shaken_by: 20
  mods:
    leader: 10                # a named leader with the unit, up and fighting
    leader_down: -20
    heavy: -20                # half or more of its starting men down
    flank: -20                # struck in flank or rear this exchange
    veteran_friends: 10       # a steady friendly unit next to it
    in_order: 20              # still steady: ranks closed, men backing each other
    losing_per_man: 5         # off for each man more it lost than it put down this exchange
    losing_cap: 30
    dug_in: 10                # gone to ground or in a bunker: men in holes stay put
    no_ammo: -10              # out of ammunition (ammunition, below)

# ---------- the rout ----------
# A broken unit flees. Every enemy man in reach of it strikes, not just the front rank (the
# ranks have dissolved), with no defence for the fleeing, at +attack and `tempo` times the
# melee tempo: most of a battle's dead fell in the rout. On the field map the pursuit lasts
# while pursuers keep contact; the simulation assumes `exchanges` of it.
# On the field map a broken unit runs straight back as far as its move. Running into its own
# side's units, it runs on through them to the first free ground beyond (up to `through` times
# its move in all; if there is none in that, it stops where it last stood clear). Each friendly
# unit it runs through is jostled: that exchange its move is cut by `jostle` (rounded down).
# Design estimates.
rout:
  attack: 20
  tempo: 2.0
  exchanges: 3
  through: 3
  jostle: 0.5

# ---------- after the battle ----------
# Every wounded man is remembered by his wound's severity, its untreated time to death
# (lethal) and its infection risk. When the battle ends:
#   - a side with no unit still standing has lost the field: the men it had down there are
#     left behind and die (`left_behind`); the wounded who were still on their feet go with
#     their units;
#   - of the rest, a wound that kills in minutes kills before help comes, unless he is bound
#     in time (`saved.minutes`, %); one that kills in hours kills unless his camp can treat
#     it (`saved.hours`, % by the camp's care: no camp, a field camp, quarters);
#   - the survivors are carried to their force's camp and heal on the wound track (data/
#     disease.yaml `wounds`), where wound fever can still take them.
# Design estimates: the beaten side's dead at Towton and Agincourt were mostly men cut down
# in flight or left on the field.
aftermath:
  left_behind: true
  saved:
    minutes: 10
    hours: {none: 0, field: 40, shelter: 60}
  # Medevac: a side's wounded carried off by ambulance or helicopter reach care sooner. A wound
  # that kills in hours is survived at the better of his camp's % and the medevac's `hours`; one
  # that kills in minutes at the medevac's `minutes` (else saved.minutes). The kind comes from
  # the war (`battles`, by the wound table's battle); helicopters need a landing zone on the
  # field and a helicopter of the side not lost, else they fall back to `fallback`. The GM can
  # untick a side that had none. Design estimates, following the eras' died-of-wounds share of
  # the wounded as commonly cited (about 14% in the Civil War, 8% in WWI, 4.5% in WWII, 2.5% in
  # Korea and Vietnam).
  medevac:
    battles: {"American Civil War": wagon, "American Indian Wars": wagon, "WWI": motor, "WWII": motor, "Korea": helicopter,
              "Vietnam": helicopter, "Late 20th century": helicopter, "Iraq & Afghanistan": helicopter}
    kinds:
      wagon: {name: "Ambulance wagons", hours: 50, minutes: 10}
      motor: {name: "Motor ambulances", hours: 65, minutes: 10}
      helicopter: {name: "Medevac helicopters", hours: 85, minutes: 20, fallback: motor}

# ---------- heroes ----------
# A named fighter from the wound roller can join a unit: in its front rank (a hand weapon),
# shooting with it (a missile weapon), or behind it (commanding). He is extra to the unit's
# men and uses his own attack, defence, Nerve, weapon and armour. Each exchange a front hero
# makes `tempo` times a ranker's telling attempts (he seeks the fight), and a ranged hero
# shoots `tempo` times a ranker's aimed shots. For the same reason a blow on his unit's
# front falls on him `exposure` times as often as on a ranker of its front rank; missiles
# fall on him as on any man of the unit, and in a rout as on any man of it. His wounds
# use the full rules, as in the roller: each wound's pain (and any he came with) takes
# combat.pain_step % a step off his attack and defence (to tracking.pain_cap steps), he bleeds
# each exchange (exchange_rounds rounds at tracking.bleed_per_round), and his Blood's
# thresholds cost him more and can put him down. A wound calls for the roller's stop check:
# defend only or stunned means no attempts in his next exchange (stunned: no parry either),
# out puts him down for the rest of the battle; pain above the cap calls for one at the end
# of each exchange. A wound fatal within rounds kills him. When two front heroes' units
# fight hand to hand the heroes duel: each makes `duel` attempts an exchange at the other
# instead of at the rankers (the first of one side with the first of the other). A leader
# hero adds his unit's leader modifier to its morale while he is up, and the leader-down
# modifier once he is down. His wounds go back to the roller after the battle.
heroes:
  tempo: 3.0
  exposure: 2.0
  duel: 3                 # telling attempts each hero makes at the other in a duel, an exchange
  # First aid, each quiet exchange (his unit not in contact, not under fire, no losses), on his
  # worst-bleeding wound (from this battle or one he came with): the best Leechcraft among his
  # unit's heroes still up rolls d100 (as the roller's first aid), binding wounds.yaml
  # combat.first_aid.bind steps of bleeding; with no Leechcraft in the unit, his comrades bind
  # one step at `first_aid` %. An arm or leg bleeding `tourniquet_from` or more is tourniqueted
  # instead on a success: it stops.
  first_aid: 60
  tourniquet_from: 2
  # A hero lamed (any of these impairments, from this battle or one he came with) or down
  # (carried by his comrades) slows his unit: its move is multiplied by `carried` (at least 1
  # hex), unless he is left behind (out of the battle).
  lamed: [leg, stand, collapse, move]
  carried: 0.5
  # Carry him back: a lamed or down hero whose unit is standing and moving can be carried to
  # the rear by `bearers` of its men. He leaves the battle, safe (no blows, no slowing), and
  # his wounds go back to the roller as they were. The bearers come back after `back_after`
  # exchanges, unless the unit has broken or been destroyed by then (then they stay at the
  # rear, alive). Design estimates.
  bearers: 2
  back_after: 3
  # Medics: a unit's medics (followers of a healing career, which the team builder adds to the
  # team's biggest unit; the GM can give any unit medics) give first aid at `medic` % by their
  # quality, as a hero's Leechcraft. Design estimates.
  medic: {green: 30, regular: 45, veteran: 60}
  # Cautery: where a tourniquet cannot go (head, neck, body), a wound bleeding `from_bleed` or
  # more is cauterised on a successful first aid in the wars listed (before the world wars):
  # the bleeding stops, at `pain` more pain unless a healer (Leechcraft or medics) did it.
  cautery:
    from_bleed: 2
    pain: 1
    battles: [Crusades, "Visby 1361", "Wars of the Roses", "Thirty Years' War", "American Revolution", "Napoleonic Wars", "War of 1812", "Crimean War", "American Civil War", "American Indian Wars"]
  # A hero left on the field when the battle ends (left behind, or down with a unit that broke,
  # fled or was destroyed): found by his own side if it holds the field (has a unit still
  # standing); if only the enemy holds it, d100 at or under `quarter` % for the war (by the wound
  # table's war) and he is taken prisoner, else killed. Design estimates: medieval armies spared
  # those worth a ransom and few others; the horse-and-musket wars mostly took prisoners; the
  # wars of the twentieth century and after vary with the enemy.
  quarter:
    default: 50
    Crusades: 30
    "Visby 1361": 20
    "Wars of the Roses": 30
    "Thirty Years' War": 40
    "American Revolution": 70
    "Napoleonic Wars": 80
    "War of 1812": 80
    "Crimean War": 75
    "American Civil War": 85
    "American Indian Wars": 20
    WWI: 70
    WWII: 60
    Korea: 50
    Vietnam: 50
    "Late 20th century": 70
    "Iraq & Afghanistan": 50
  # Aid posts: the GM can mark one hex for each side. With one, bearers carry a hero there,
  # and a wounded hero who can still walk (not lamed or down) can go back to it alone; with
  # none, bearers carry him off the map as before, and a walking hero makes for the map edge
  # behind his unit. A party (the hero and his bearers) goes `pace` hexes an exchange on a
  # straight line (about half a man's move), and shell bursts strike its men as men in the
  # open. Bearers struck down are lost to their unit; with no bearers left, a hero who cannot
  # walk lies where he is. At the post he gets first aid every exchange at `first_aid` %
  # (as a skilled healer), and his wounds go back to the roller treated, off the death clock.
  # An enemy unit standing within `overrun` hexes of the post overruns it: the men there are
  # taken or killed by the war's quarter. Bearers come back to their unit after as many
  # exchanges as the carry took. A hero left behind lies on his unit's hex: a friendly unit
  # standing on it picks him up, an enemy one takes or kills him by quarter. Design estimates.
  aid_post:
    first_aid: 75
    pace: 3
    overrun: 1

# ---------- the enemy commander ----------
# A scripted commander can play one side on the field map ("Enemy commander"). At the start
# of its side's move it orders each of its units in turn, as a GM would by rule of thumb,
# and the page logs each order; Undo puts the move back for the player to make by hand. It
# knows only what its units see; its guns, fire support, riders, sappers and fixed lines are
# set out below and in docs/units.md. Each unit:
# - What it knows: an enemy unit one of the side's units can see now (sight, light, woods,
#   smoke, as calling fire) at its middle hex or either end of its front is known where it
#   stands; one seen before is remembered where it was last seen for `remember` exchanges,
#   then forgotten. It never targets an enemy it does not know of; with none, a unit holds.
# - Its target, among those it knows of: `closing` points off a hex away; and, times its
#   quality's `sense` (green men take the nearest), `hurt` points per % of the enemy's men
#   down, `shaken` if the enemy is shaken, and `threat` if the enemy is a danger to it
#   (shooters, for men without missiles; men without missiles within a charge of it, for
#   shooters). A remembered enemy is gone for where it was last seen.
# - Its reserve: at its first move, unless the GM has marked reserves for the side, it holds
#   back its rearmost units (furthest from the nearest enemy) up to `reserve` % of the side's
#   men, by the quality most of its men have (green sides hold none). A reserve unit holds (it
#   goes to ground under fire as the rule below). It commits one reserve unit a move, the one
#   nearest the enemy, when one of its own units has broken or fled since its last move (then
#   the one nearest where that unit stood, sent to plug the gap), when an enemy it knows of
#   comes within `gap` hexes of a reserve unit, (veterans only) when an enemy unit has
#   broken: to exploit it, or (attacking) when `stall.moves` of its moves in a row have
#   neither put down `stall.down` % of the enemy's starting men nor brought one of its units
#   nearer an enemy it knows of.
# - Shooters give way: attacking, a formed unit (close order, no missile weapon) that did not
#   move, held up by its own open-order shooters within `give_way` hexes and nearer its target,
#   that would move nearer with them gone: those on the ground it would cross step aside to
#   their best spot off it, and it is ordered again.
# - Known minefields (marked, or found by setting them off): each hex of one on the straight
#   way to a hex costs `mines` points by quality (green men may still blunder in).
# - Guns: its batteries and anti-tank guns on the map turn to face the nearest enemy it knows
#   of; its off-map batteries (not tanks or aircraft) with no mission are called on the enemy
#   unit it can see now that scores best as a target (as its units choose), unless its own men
#   are within the burst and scatter of the aim. It also moves, limbers, tows, pulls back and
#   displaces its guns, and calls aircraft, smoke, illumination and counter-battery fire (see
#   docs/units.md, The enemy commander).
# - A unit not steady holds; shaken and under fire (an enemy's missile weapon reaches it),
#   it goes to ground.
# - A steady unit first rolls d100: at or under `hesitate` % (by quality) it does nothing
#   this move (orders misread, nerves).
# - Otherwise it scores every hex it can reach, facing the target, and takes the best:
#   `closing` points a hex nearer the target, `cover` per % of cover from the target's
#   shots there (green men ignore cover), less a point a hex of movement. A shooter scores
#   `in_range` for a hex the target is in range from (it then stops rather than closing),
#   and loses `too_close` within `keep_off` hexes of it. A shooter never charges. Men
#   without missiles charge only if their men times attack % is at least `charge_odds` %
#   of the target's, by stance and quality (attacking, regulars take on a somewhat stronger
#   enemy; holding, they come out only with the odds in their favour), and veterans score
#   `flank` more for a hex off the target's front.
# - A unit with a modern weapon (`ground_with`: breech-loaders on) staying where it is under
#   fire goes to ground (veterans and regulars); older armies stand, and vehicles never do.
# `tries`: the best-scoring hexes it tries in turn until one is a legal move.
commander:
  # objective: a hex the GM marks for the commander's side. Attacking, units at it (within
  # radius) hold it and units with no enemy to go for advance on it; holding, units further
  # than `hold` fall back to it. Enemies within `guard` of it score `bonus` more as targets.
  # Who holds it is logged each exchange. Design estimates.
  objective: {radius: 1, hold: 3, guard: 4, bonus: 30}
  # self_play: the commander on both sides (the GM watching). A run stops after `limit`
  # exchanges, or when one side has held the (first) objective `held` exchanges running (once all
  # the battlefield's phases have begun), or when
  # a side has no unit left standing (and none still to come); then the battle ends. A battlefield
  # with phases runs at least `after_phases` exchanges past its last phase's start, but never more
  # than `most` (enough for every battlefield's last phase now, Chipyong-ni's at 1,156 the latest;
  # a battle that goes on for days past its last phase is still cut short). A battlefield's `ends`
  # (how long its account says the fight went on) makes a run at least that long, within `most`. On a
  # battlefield, the side its objective names attacks and the other holds (else its `stances`, as
  # fought); on open ground both attack. Design choices.
  # The objective counts as taken only with no standing enemy within `secure` hexes of it.
  self_play: {limit: 60, held: 5, after_phases: 30, most: 1200, secure: 10}
  # route: a battlefield can give a unit waypoints (via, from the accounts: a march round a
  # flank). Its commander moves it on to each in turn, dropping one once its middle hex is within
  # `reach` hexes; it turns aside only for an enemy in contact or one it knows of across its way
  # within its move, and then fights as any other unit. Design choice.
  route: {reach: 3}
  # sappers (units marked sappers: mines.sappers): holding, or at the objective, out of contact
  # and with no enemy it knows of within `clear_of` hexes, they lay mines in the
  # row ahead (mixed if the enemy it knows of has vehicles, else anti-personnel), where it is
  # not mined yet. Attacking, they lift the known mines in the row ahead when the straight way
  # to their target (or the objective) crosses known mines, closing up along that way to the
  # belt first (row by row through it). Design estimates.
  sappers: {clear_of: 8}
  # creep: attacking, when one of its units moves or charges on a known enemy it can see within
  # `near` hexes, one free battery (the soonest to land, none of its men within the burst and
  # scatter) puts a creeping barrage on that enemy, lifting `step` hexes after each `every`
  # exchanges along the unit's facing, for `lines` lines. One creeping barrage at a time.
  # Its aircraft fly a strafing run or a napalm strip instead of a plain attack on a target
  # whose front is as wide as the run, along that front (napalm where the war allows it and
  # the aircraft carry it), when none of its men are within the scatter of the run's line.
  # Design estimates.
  creep: {near: 20, step: 1, every: 1, lines: 3}
  # spot: attacking, a forward air controller (fac) with no fight of its own (no enemy touching
  # it, none it sees within its weapon's reach, not pinned and no men lost last exchange),
  # when its aircraft can fly and none of its side's controllers sees an enemy it knows of, goes
  # to see one: to a spot within `moves` moves' worth of going from which, facing it, it sees one.
  # It prefers a spot out of the reach of the enemies it knows of, if one costs no more than the
  # cheapest by `safe` moves. A spot beyond this move it heads for a move at a time, choosing
  # again each move. Design choices.
  spot: {moves: 3, safe: 1}
  # storm: attacking, a unit armed with one of these whose target holds works (dug in or
  # emplaced where it stands, behind works that give it cover toward the attacker, or in ground
  # that hides men: buildings, tall buildings, rubble) does not stop to fire at range: it closes
  # and charges it, with its quality's attack odds (charge_odds), as men without missiles do. It
  # still fires as it goes. Black powder with the bayonet; and modern infantry rifles and
  # sub-machine guns, which took trenches, bunkers and houses by closing in with grenades and
  # the bayonet (fire alone rarely shifted men under cover: self-play showed attacks stalled
  # trading fire at range). Design choice.
  storm: [musket_smoothbore, rifle_musket, breechloader, rifle_service, rifle_assault, pistol_smg]
  hesitate: {green: 30, regular: 10, veteran: 0}
  charge_odds:
    attack: {green: 100, regular: 80, veteran: 60}
    hold: {green: 150, regular: 120, veteran: 100}
  cover: {green: 0, regular: 1, veteran: 2}
  flank: {green: 0, regular: 0, veteran: 30}
  closing: 10
  in_range: 1000
  too_close: 500
  keep_off: 2
  # A unit with a main gun (a vehicle's, or anti-tank guns) counts a target in range when the
  # gun reaches it and the weather and light let it see it there; a vehicle with a main gun also
  # likes (`stand_off`) a spot where it can so hit the target but the target can neither reach
  # it with its own weapon or main gun nor see it there (thermal sights in a sandstorm, a longer
  # gun). Design choice: self-play showed tanks closing to their machine guns' reach.
  stand_off: 500
  tries: 30
  remember: 3
  reserve: {green: 0, regular: 25, veteran: 33}
  gap: 12
  narrow: true                # attacking, a formed unit out of contact that cannot move nearer its target closes in a quarter at a time, deeper, to the widest front that lets it (Agincourt's funnel)
  pursuit: {rally: 2}         # a broken enemy: horse within a charge of them, foot within their move (nearer than any standing enemy), go after it; veterans give it up after `rally` moves with a standing enemy in reach
  give_way: 4                 # a formed unit held up by its own open-order shooters within this many hexes: they step aside
  stall: {moves: 5, down: 1}  # attacking: this many moves without putting down this % of the enemy or closing: commit a reserve
  mines: {green: 5, regular: 40, veteran: 80}
  sense: {green: 0, regular: 1, veteran: 2}
  hurt: 1
  shaken: 20
  threat: 20
  ground_with: [breechloader, rifle_service, rifle_assault, rifle_ap, machine_gun, pistol_smg, rpg, bazooka, recoilless, atgm]

# narrator: an optional language model, called from the field page with the player's own key,
# retells each turning point (a phase beginning, units breaking or fleeing, a reserve committed,
# the objective taken or lost, the battle's end) in a short passage. `voices`: how it writes, by
# the wound table's war (`battles`; `default` for the rest); original prose in the manner of the
# period, imitating no real writer or document. `words`: the most a passage runs to; `max_tokens`:
# the reply's cap; `context`: earlier passages sent with each for continuity. The GM can pick any
# voice for a battle on the page (kept with the battle); each has a `name` for that list and a
# `style` the model is told to write as. `providers`: where
# each kind of service is called, and its default model (none for OpenAI-compatible services:
# the player names one). It may use only the facts it is given. Design choices.
narrator:
  voices:
    chronicle: {name: "A chronicle", style: "a chronicler's account of the day, as a clerk or herald might set it down soon after from those who were there: plain and formal, in modern English"}
    dispatch: {name: "A dispatch", style: "a commanding officer's dispatch to his superiors, in the measured, formal manner of the seventeenth to nineteenth centuries"}
    war_diary: {name: "A war diary", style: "a unit's war diary or after-action report, in the terse, factual manner of the twentieth century"}
    sitrep: {name: "A situation report", style: "a modern situation report: terse, plain military English, the facts first"}
    soldier: {name: "A soldier's account", style: "a soldier's own account in the first person, from an unnamed man in the ranks, in the plain, concrete manner of the battle's era; he gives no name and claims no deed or sight the facts do not state"}
    plain: {name: "Plain and neutral", style: "a plain, modern summary in the third person, with no period flavour"}
  battles: {"Crusades": chronicle, "Visby 1361": chronicle, "Wars of the Roses": chronicle, "Thirty Years' War": dispatch,
            "American Revolution": dispatch, "Napoleonic Wars": dispatch, "War of 1812": dispatch, "Crimean War": dispatch,
            "American Civil War": dispatch, "American Indian Wars": dispatch, "WWI": war_diary, "WWII": war_diary,
            "Korea": war_diary, "Vietnam": war_diary, "Late 20th century": sitrep, "Iraq & Afghanistan": sitrep}
  default: war_diary
  words: 70
  max_tokens: 400
  context: 2
  providers:
    anthropic: {url: "https://api.anthropic.com/v1/messages", model: "claude-haiku-5-5"}
    openai: {url: "https://api.openai.com/v1/chat/completions", model: ""}
