# Ageing (rules in gravewounds/ageing.py, repeated in templates/team.js). Research notes: the
# project doc "ageing-research" (figures tagged sourced, estimate or gap).
#
# Every `step` years of his age (at creation, for the years of his terms; in play, for each term
# served) a man rolls the decline of his age band (by the middle of those years, plus
# `wear.add_years` for each `wear.per` Wear) and gains a step of maturity, and his Wear rises.
# Declines and gains go into his characteristics' changes, as a lasting hurt does, so his skills
# that rest on them fall too; no characteristic goes below the era's least.
#
# The bands follow the physiology: aerobic capacity (Endurance) falls from about 25 at roughly
# 10% a decade, faster later; sprint speed and reaction (Agility) about 5-6% a decade from the
# 30s; grip and leg strength hold until about 40-50 and then fall about 1% a year; processing
# speed (Wits) falls from about 50, though knowledge holds (Fleg 2005; Korhonen 2003; Fozard
# 1994; Dodds 2014; Kemmler 2018; Hartshorne and Germine 2015). The dice are design choices
# scaled to the 15-95 characteristics.
step: 4
decline:                      # [dice, sides] lost by each characteristic, by the band the step falls in
  - {from: 0}
  - {from: 30, agi: [1, 3], end: [1, 2]}
  - {from: 40, str: [1, 3], agi: [1, 4], end: [1, 4]}
  - {from: 50, str: [1, 4], agi: [1, 6], end: [1, 6], wits: [1, 2]}
  - {from: 60, str: [1, 6], agi: [2, 4], end: [2, 4], wits: [1, 2]}
decline_approx: true

# Maturity: a point a step from `from` to each characteristic's `to`, at most `cap` in all (steadier
# and surer between 20 and 40: Roberts et al. 2006; judgement and knowledge to about 45). The WWII
# studies found breakdown followed days in combat, not age, so Nerve's rise is small.
maturity:
  from: 20
  pres: {to: 40, cap: 5}
  wits: {to: 45, cap: 5}
  nerve: {to: 40, cap: 5}
  approx: true

# Wear: service and hardship. Each step of service adds `per_step`; a hard season (a month or more
# of hard nights on the travel map - hungry, sick or wounded, or colder and wetter than his
# shelter - or the GM's tick) adds `hard_season`. Each `per` Wear makes him `add_years` older for
# his decline, and from `end_twice` Wear his Endurance rolls twice and takes the worse.
# (Civil War: men enlisting at about 39 had 1.8 times the odds of dying of disease of men of 20 in
# their first year and 2.4 after: service wore the older men faster. Smith, NY regiments.)
wear:
  per_step: 1
  hard_season: 1
  hard_nights: 30
  per: 4
  add_years: 2
  end_twice: 6
  approx: true

# Worn out: for each term he serves from `age` (or with `wear` Wear or more), d100 at or under
# (Wear x per_wear + (age - age) x per_year - (Endurance - 50) / end_per) x the term's years / 4,
# and he is worn out; so too, at once, from `end_age`, with Endurance under `end_below` or any of
# Strength, Agility and Endurance under `any_below` (a man who was always weak is not worn out by it). The GM may discharge him (sent home, with a
# pension where his army gave one) or keep him on. Tuned so a long-service ranker is worn out
# about 40-44 after 20-24 years, as the British "worn out" discharges were (Chelsea records): a
# simulated line private enlisting at 16 is worn out by 40 half the time, by 44 three times in four.
worn_out:
  age: 35
  wear: 8
  per_wear: 3
  per_year: 2
  end_per: 2
  end_below: 30
  end_age: 40
  any_below: 25
  approx: true

# Enlistment ages (project doc "ages-women-fords-research"). A man enlists at his era's start age,
# raised to his army's legal least (`min`); then d100: at or under `under` he is a boy under age
# (the least less 1 to `under_years`, a drummer or a boy who lied), over 100 - `older` an older
# recruit (from `older_from` to the army's most plus `over_years`: over the most, he lied about it).
# A man under age or over it is found out at `found_out` % each End of season and sent home, until
# he reaches the least (a boy) or serves out his first term (an older man). A recruit who enlisted
# at `older_from` or more takes `older_wear` times the Wear for each step of service (Civil War,
# NY regiments: men enlisting at about 39 had 1.8 times the odds of dying of disease of men of 20 in
# their first year, 2.4 after; the US let men of 38 or more go in 1943 as "less physically fit").
# An army with no limits found (the Plains nations' young men went to war when they could) rolls
# none. Shares are estimates but for the Union (about a tenth under 18) and British boys of WWI
# (some 250,000 under 19, about 4% of those who served; Historyanswers, unsourced there).
enlist:
  under_years: 3
  over_years: 6
  older_from: 38
  older_wear: 2
  found_out: 10
  found_out_approx: true
  shares: {default: {under: 2, older: 2}, civil_war: {under: 10, older: 1}, wwi: {under: 4, older: 2}, wwii: {under: 2, older: 1}}
  shares_approx: true
  eras:
    medieval: {min: 15, max: 60, source: "Statute of Winchester, 1285: men of 15 to 60 liable (Militia (England), Wikipedia)", regions: {castile: {min: 20, max: 60, source: "Cortes of Valladolid, 1 December 1385: every man of 20 to 60 to keep arms (Pascual Sarria)"}, portugal: {min: 18, max: 60, source: "No law of 1385 found: the besteiros do monte of 1468 were enrolled at 18 to 45 and retired at 60 (Costa)"}, swiss: {min: 16, max: 60, source: "Swiss service from 16, 14 in an emergency; older men served too (Winkler 2020, after Delbrück and Elgger)"}}}
    thirty_years: {min: 16, max: 50, approx: true, source: "No muster age rules found: the British limits of the early 1700s, less a year"}
    horse_musket: {min: 17, max: 50, source: "British recruits of 17 to 50 in the early 1700s (Recruitment in the British Army)", regions: {french: {min: 18, max: 30, source: "Jourdan law, 1798: volunteers 18 to 30, conscripts 20 to 25"}}}
    crimea: {min: 17, max: 25, source: "Victorian recruits 17 to 25 (reubique.com, Physical requirements)"}
    civil_war: {min: 18, max: 45, max_approx: true, source: "Union enlistment papers certified 18 or more; no legal most found (some 15,000 up to 44 served)"}
    wwi: {min: 18, max: 40, source: "British: 18 to enlist, 19 to serve overseas; 40 under the Military Service Act 1916 (later 51)", regions: {newfoundland: {min: 19, max: 35, source: "Recruiting asked for 19 to 35 (The Rooms); volunteers only, and some lied about their age"}, us: {min: 21, max: 30, source: "Selective Service Act 1917: 21 to 30 (later 45)"}, russia: {min: 21, max: 43, source: "Called up at 21; the opolchenie's ratniki to 43 (Tarasov 2021)"}, serbia: {min: 18, max: 50, source: "The three bans 21-45 and the last defence 18-21 and 45-50 (Denda)"}, austria_hungary: {min: 21, max: 42, source: "Liable from the year he turned 21; the Landsturm to 42 (Vienna statistics; Rauchensteiner)"}, bulgaria: {min: 20, max: 48, source: "Liable from 20; the national militia to 48 (Bulgaria during World War I, Wikipedia)"}}}
    wwii: {min: 18, max: 41, source: "British: 18 to 41 in 1939 (51 by 1942)", regions: {us: {min: 18, max: 37}, us_pacific: {min: 18, max: 37}}}
    korea: {min: 18, max: 26, source: "US draft, 1948 act and 1951 amendment: 18 (18½) to 26"}
    vietnam: {min: 18, max: 26, approx: true, source: "The 1951 framework stayed in force (inference)"}
    modern: {min: 17, max: 42, source: "US Army: 35 until January 2006, 42 from June 2006 (Army News, 2006)"}
