      - {to: 100, text: "Nothing worse than mud and grumbling.", quiet: true}
  crimea:
    rates:
      desert:   {camp: 0.0001, march: 0.0001, withdraw: 0.0005, approx: true, note: "no counted rate for the field army; low, as the men had nowhere to go"}
      straggle: {camp: 0, march: 0.001, withdraw: 0.003, approx: true, note: "no counted rate; as the horse-and-musket march, halved"}
