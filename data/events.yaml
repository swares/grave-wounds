      - {to: 32, text: "Marauders caught plundering: an example is made.", hook: "Davout hanged seventy at Wilna in 1812."}
      - {to: 42, text: "A river crossing: men drown swimming the horses over.", types: [mounted], lose: [1, 5], hook: "The ford was deeper than the guide said."}
      - {to: 52, text: "Men go off to drink and loot a wine store.", lose: [0, 6], min_men: 100, hook: "As on the road to Corunna: some never come back."}
      - {to: 62, text: "A storm: the camp is flattened, horses die of cold.", fatigue: 1, hook: "Early July 1812: a quarter of one battery's horses dead in a night."}
      - {to: 72, text: "A small party loses the road in the dark.", max_men: 20, fatigue: 1}
