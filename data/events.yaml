      straggle: {camp: 0, march: 0.001, withdraw: 0.004, approx: true, note: "no counted rate; set between Agincourt and 1812"}
      injury:   {camp: 0.0002, march: 0.0002, withdraw: 0.0004, approx: true, note: "no rate found; the 1860 garrison accident rate"}
      horses:   {camp: 0.0005, march: 0.0016, withdraw: 0.003, approx: true, note: "no counted rate; as the medieval"}
    incident: 6
    incidents:
      - {to: 15, text: "Peasants in the woods kill or take foragers.", lose: [1, 6], min_men: 40, hook: "The peasants trade them back for the village's cattle (Simplicissimus)."}
      - {to: 25, text: "Men run off with the regiment's pay rumour, or a rival recruiter's money.", lose: [2, 10], min_men: 100, hook: "A captain of another army is recruiting in the next town."}
      - {to: 35, text: "Marauders caught plundering: the provost wants them hanged.", hook: "One is a sergeant's brother."}
      - {to: 45, text: "The baggage train falls behind; the women and sutlers are cut off.", min_men: 100, hook: "The enemy's horse are between the train and the column."}
      - {to: 55, text: "A small party is taken by enemy horse.", lose: [1, 3], max_men: 20, hook: "They will be offered a place in the enemy's ranks."}
      - {to: 65, text: "A village has plague: the column must go round or go through.", fatigue: 1, hook: "Going round costs a day; going through costs more."}
      - {to: 75, text: "A storm floods the camp or the road.", fatigue: 1}
      - {to: 85, text: "A sutler or a Jewish trader offers bread, beer and news, at famine prices.", hook: "He has heard where the enemy's winter quarters are."}
      - {to: 100, text: "Nothing worse than mud and grumbling.", quiet: true}
  horse_musket:
    rates:
      desert:   {camp: 0.0003, march: 0.0005, withdraw: 0.002, source: {url: "https://armyheritage.org/wp-content/uploads/ref-bibs/subjects/Military Service/Desertion/Desertion%20Statistics.pdf", note: "Valley Forge 1777-78: 1,334 of 23,539 in six months, 3.1e-4 a man a day; on the march and in retreat estimates"}}
      straggle: {camp: 0, march: 0.002, withdraw: 0.006, source: {url: "https://journals.sagepub.com/doi/reader/10.1177/014107689108400517", note: "the retreat to Corunna lost about 1e-2 a man a day in all (sickness, capture and straggling; sickness is rolled apart); 1812's advance about 6e-3 before battle"}}
      injury:   {camp: 0.0002, march: 0.0002, withdraw: 0.0004, source: {url: "https://maltaramc.com/regsurg/rs1860_1869/rmo1860.html", note: "Malta garrison 1860: 410 accidents among 5,950 men in a year, 1.9e-4 a man a day; doubled in retreat, an estimate"}}
      horses:   {camp: 0.001, march: 0.004, withdraw: 0.008, source: {url: "https://en.wikipedia.org/wiki/French_invasion_of_Russia", note: "more than 5,000 of 150,000 horses dead from the Niemen to Vilnius in four days of 1812, 8e-3 a horse a day; ordinary marching half that, an estimate"}}
