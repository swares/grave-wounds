      - {to: 45, text: "Men found drunk on sutlers' spirits; the provost marshal flogs them.", hook: "One of them has stolen from the sutler, too."}
      - {to: 55, text: "A Tatar offers to guide the column, or to sell what he has.", hook: "He has seen Russian horse in the next valley."}
      - {to: 65, text: "Cholera breaks out in a village on the road.", fatigue: 1}
      - {to: 100, text: "Nothing worse than mud and grumbling.", quiet: true}
