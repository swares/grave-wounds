# Events on the march and in camp (gravewounds/events.py, templates/events.js): what happens to a
# force on the travel map each day besides the weather and camp disease, by era.
#
# periods   - each map's period, as the era whose rates it rolls (a force may name its own `era`).
# injury    - the step an injured man starts at on the force's wound track, on d100.
# eras      - for each era:
#   rates     - chances per man per day, in what the force did that day: camp (it did not march),
#               march, or withdraw (the GM ticks Withdrawing). Each is rolled for every man (horses:
#               for every man of a mounted force or a wagon train) and is rolled 1 in 1,000,000.
#                 desert   - he leaves for good (off the force's men)
#                 straggle - he falls out and is lost to the force (off its men)
#                 injury   - a fall, a kick, an accident: he joins the force's wound track
#                 horses   - a horse or draught animal dies or is lamed: rolled for each of the force's
#                            horses (one a man unless the GM sets the count), off its horses
#               source {url, note}, or approx: true with the reasoning in note.
#   incident  - % chance each day that something happens to the force; then d100 on `incidents`
#               (to: the top of each row's range). A row may apply only to some force types
#               (`types`), or to small or large forces (`max_men`, `min_men`); otherwise nothing
#               happens. `lose: [low, high]` men lost, `fatigue: n` steps more tired. `hook` is for
#               the GM. Incidents are described in the sources but rarely counted: their chances
#               and rows are design estimates.
# The research behind the rates is in the project doc "travel-events-research".

periods:
  "Crusades": medieval
  "Visby 1361": medieval
  "Hundred Years' War": medieval
  "Wars of the Roses": medieval
  "Thirty Years' War": thirty_years
  "American Revolution": horse_musket
  "Napoleonic Wars": horse_musket
  "War of 1812": horse_musket
  "Crimean War": crimea
  "American Civil War": civil_war
  "American Indian Wars": civil_war
  "WWI": wwi
  "WWII": wwii
  "Korea": korea
  "Vietnam": vietnam
  "Late 20th century": modern
  "Iraq & Afghanistan": modern

injury:
  - {to: 85, step: mending}
  - {to: 100, step: serious}

# conditions - what the GM ticks on a force's health panel, multiplying its chances: hungry (short
#              of food) and unpaid (pay in arrears). They do not stack: the largest applies (a
#              starving army is seldom paid, so Nuremberg's figure already holds both); never above 1.
conditions:
  hungry: {desert: 15, straggle: 5, source: {url: "https://en.wikipedia.org/wiki/Siege_of_Nuremberg", note: "the starving Swedish camp at Nuremberg, 1632, lost about 5e-3 a man a day to desertion, against the Army of Flanders' usual 2.5-3.3e-4 (about 15 times); Lee's hungry, barefoot army straggled at 1.8e-2 in Maryland, 1862, against about 2e-3 (Maryland campaign page), so straggling about 5 times, an estimate"}}
  unpaid: {desert: 3, source: {url: "https://www.oocities.org/ao1617/life.html", note: "Army of Flanders (after Parker): foreign units, often in arrears, lost 2-7% a month against 0.7-2% for the tercios, about 3 times"}, approx: true}

# horses_march - how a mounted force or a wagon train marches when it has lost horses: below
#                `below` of a horse a man, it keeps `pct` of its speed (the highest band that applies).
horses_march:
  mounted:
    - {below: 0.5, pct: 67, note: "most men on foot: the column goes at foot pace (4 km/h of 6)"}
  wagons:
    - {below: 0.75, pct: 75, note: "teams short: wagons double-teamed or left behind, an estimate"}
    - {below: 0.5, pct: 50, note: "half the teams gone, an estimate"}

eras:
  medieval:
    rates:
      desert:   {camp: 0.0003, march: 0.0003, withdraw: 0.001, approx: true, note: "no medieval rate found; set at the Army of Flanders' desertion share (about 2.5-3.3e-4)"}
      straggle: {camp: 0, march: 0.001, withdraw: 0.002, source: {url: "https://en.wikipedia.org/wiki/Battle_of_Agincourt", note: "about 160 stragglers taken on the march from Harfleur, 1415: about 1e-3 a man a day; withdrawing doubled, an estimate"}}
      injury:   {camp: 0.0002, march: 0.0002, withdraw: 0.0004, approx: true, note: "no medieval rate found; set at the Malta garrison's accident rate of 1860 (1.9e-4)"}
      horses:   {camp: 0.0005, march: 0.0016, withdraw: 0.003, source: {url: "https://www.medievalists.net/2024/12/how-medieval-armies-cared-for-their-warhorses/", note: "Edward I's 1301 campaign lost about a third of his suite's horses: about 1.6e-3 a horse a day"}}
    incident: 5
    incidents:
      - {to: 15, text: "Foragers are set on by peasants: some do not come back.", lose: [1, 6], min_men: 40, hook: "The village that did it is a mile off, and the men want it burned."}
      - {to: 25, text: "A bridge is broken or held; the column must find a ford.", fatigue: 1, hook: "As at Ferrybridge in 1461, someone has pulled the planks."}
      - {to: 35, text: "A storm or hail strikes the column in the open.", fatigue: 1, hook: "Black Monday, 1360: men and horses die of the cold in an hour."}
      - {to: 45, text: "Men caught plundering a church; the captain wants an example.", hook: "Hang one, or have the whole retinue on the wrong side of God and the king."}
      - {to: 55, text: "A small party is taken by enemy scouts.", lose: [1, 3], max_men: 20, hook: "They will be ransomed, if anyone pays."}
      - {to: 65, text: "A crossing goes wrong: a man and a horse are swept away.", lose: [1, 2], hook: "The ford was deeper than the guide said."}
      - {to: 75, text: "A merchant or sutler joins the march with wine and bread, at a price.", hook: "He knows the roads, and someone else's business."}
      - {to: 85, text: "Pilgrims, beggars or refugees on the road beg for protection.", hook: "Among them is a man who is not what he says."}
      - {to: 100, text: "Nothing worse than mud and grumbling.", quiet: true}
