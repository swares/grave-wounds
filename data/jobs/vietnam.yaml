# Jobs between fights for the Vietnam War (1965-1973). Format as data/jobs/medieval.yaml.
# Pay is in Days of the army most likely to take the job: US Days ($3.80) for work paid in
# dollars or MPC, ARVN Days (100 piastres) for work paid in piastres; the wage line says whose.
id: vietnam

sources:
  time: &time "https://time.com/archive/6628649/construction-giant-venture-in-viet-nam/"
  mike: &mike "https://mail.arsof-history.org/articles/pdf/v5n2_mike_force.pdf"
  bonus: &bonus "https://www.law.cornell.edu/supremecourt/text/431/864"

jobs:
  # Lawful work
  - {id: air_america, name: "Air America crew", what: "Flying or kicking cargo in Laos and Vietnam for a CIA airline.", skill: craft, min: 50, pay: 20, term: contract, days: [365, 365], places: [frontier, city], who: [officer, radioman], risk: 25,
     hook: "Rumour says $1,500 a rescue; one pilot said they got nothing but ulcers.", wage: "no salary found; 100 Air America staff died in Laos (US)", source: "https://biotech.law.lsu.edu/cases/nat-sec/Vietnam/air-america.htm", approx: true}
  - {id: rmk_brj_american, name: "RMK-BRJ construction hand", what: "Building ports, airfields and bridges on an 18-month contract, up to 70 hours a week.", skill: craft, min: 40, pay: 12, term: contract, days: [540, 540], board: true, places: [camp, city, sea], who: [sapper, nco], risk: 5,
     hook: "The 13% completion bonus is forfeit if you leave early, and the site is near Da Nang.", wage: "tax-free pay about 25% above US rates (US; the dollar figure is an estimate)", source: *time, approx: true}
  - {id: rmk_brj_local, name: "Skilled Vietnamese construction worker", what: "A skilled trade on a US contract site, after a security check.", skill: craft, min: 30, pay: 9, term: day, places: [camp, city], who: any, risk: 5,
     hook: "The VC tax collector wants a cut of your wages.", wage: "up to 93 piastres an hour, 1965 (ARVN)", source: *time}
  - {id: press_fixer, name: "Journalist's fixer", what: "Guiding, translating and driving for the foreign press.", skill: persuade, min: 40, pay: 4, term: day, places: [city, road, frontier], who: any, risk: 25,
     hook: "The reporter wants to reach a VC-held village.", wage: "no figure found (ARVN)", approx: true}
  - {id: pae_vinnell, name: "Base contractor's worker", what: "Utilities, repairs and port labour for PA&E or Vinnell; many were Korean or Filipino.", skill: craft, min: 30, pay: 3, term: contract, days: [365, 365], board: true, places: [camp, sea], who: any, risk: 10,
     hook: "Two thousand Korean workers at Cam Ranh are close to rioting over the food.", wage: "no wage found (US)", source: "https://libcom.org/library/korean-workers-riot-vietnam-1967", approx: true}
  - {id: advisor_interpreter, name: "Advisor's interpreter", what: "Translating between a US advisor and an ARVN unit.", skill: letters, min: 50, pay: 3, term: month, places: [camp, village, frontier], who: any, risk: 20,
     hook: "What the ARVN major orders and what he says he ordered differ.", wage: "no figure found (ARVN)", approx: true}
  - {id: crash_salvage, name: "Crash salvage", what: "Stripping downed aircraft for parts, metal or their cargo.", skill: craft, min: 30, pay: 3, term: week, places: [frontier, village], who: any, risk: 25,
     hook: "The wreck is classified, and someone is coming for it.", wage: "no figure found (ARVN)", approx: true}
  - {id: base_service, name: "Base mess or laundry worker", what: "Waiting tables, washing clothes or cleaning hooches on a US base.", min: 0, pay: 2.75, term: month, places: [camp], who: any, risk: 5,
     hook: "The staff are asked to pace out the base for someone outside.", wage: "a Long Binh waitress 8,000 piastres a month, 1970, nearly twice an unmarried ARVN private (ARVN)", source: "https://digital.bentley.umich.edu/midaily/mdp.39015071754423/100"}
  - {id: mine_clearer, name: "Mine and dud clearer", what: "Clearing road mines and duds for a reward or a district chief.", skill: fieldcraft, min: 40, pay: 2, term: day, places: [road, village], who: [sapper, tunnel], risk: 35,
     hook: "The same road is mined again every night.", wage: "no figure found (ARVN)", approx: true}
  - {id: bar_trade, name: "Bar and R&R trade", what: "Running, staffing or touting for a GI bar, tailor or taxi.", skill: persuade, min: 30, pay: 5, term: week, places: [city, town], who: any, risk: 10,
     hook: "The owner has a back room the Saigon police want.", wage: "some GI service workers out-earned a cabinet minister (ARVN)", source: "https://core-cms.cambridgecore.org/core/services/aop-cambridge-core/content/view/D577DFD4BC2DD9D44991FFB41C51A4F5/9781107105102c24_472-492.pdf/the-south-vietnamese-homefront.pdf", approx: true}
  # Soldiering
  - {id: laos_contract, name: "Contract fighter in Laos or Cambodia", what: "Training or leading irregulars across the border, off the books.", skill: command, min: 60, pay: 10, term: contract, days: [180, 180], board: true, places: [frontier], who: [officer, nco, scout], risk: 45,
     hook: "If you're captured, you never existed.", wage: "no figure found (US)", approx: true}
  - {id: mike_force, name: "Mike Force mercenary", what: "An elite reaction company of Nung under Special Forces officers.", skill: rifle, min: 50, pay: 2.25, term: contract, days: [180, 180], board: true, places: [frontier], who: [rifleman, machine_gunner, scout, nco], risk: 35,
     hook: "A camp is about to be overrun, and you are the only relief.", wage: "6,600 piastres (about $55) a month (ARVN)", source: *mike}
  - {id: kit_carson_scout, name: "Kit Carson Scout", what: "An ex-VC defector guiding US units.", skill: fieldcraft, min: 50, pay: 2, term: month, board: true, places: [frontier, village], who: [scout, rifleman], risk: 35,
     hook: "Your old cadre knows your face.", wage: "paid as a staff sergeant; the amount not found (ARVN)", source: "https://en.wikipedia.org/wiki/Kit_Carson_Scouts", approx: true}
  - {id: cidg_striker, name: "CIDG striker", what: "Montagnard camp-defence militia paid through US Special Forces.", skill: rifle, min: 40, pay: 0.5, term: month, board: true, places: [frontier, village, camp], who: any, risk: 30,
     hook: "The LLDB commander is skimming the strikers' pay.", wage: "1,500 piastres (about $12) a month (ARVN)", source: *mike}
  - {id: reenlist_extend, name: "Re-enlist or extend", what: "Re-upping for the bonus, or extending six months in country.", min: 0, pay: 200, term: contract, days: [1, 1], lump: true, board: true, places: [camp], who: any, risk: 0,
     hook: "Extending gets you an early out, if you live.", wage: "monthly pay times years signed, up to four times that for scarce skills from 1965 (US)", source: *bonus, approx: true}
  # Illegal
  - {id: heroin_runner, name: "Heroin runner", what: "Carrying Golden Triangle heroin to the bases or home.", skill: stealth, min: 40, pay: 15, term: week, places: [city, camp, sea], who: any, risk: 40, illegal: true,
     hook: "A vial sells for $1.80 in Saigon and $40-50 in the States.", wage: "prices from a 1971 account (US)", source: "https://digital.bentley.umich.edu/midaily/mdp.39015071754597/558", approx: true}
  - {id: mpc_dealer, name: "MPC and PX black marketeer", what: "Buying PX goods for locals, swapping MPC for piastres, buying money orders.", skill: persuade, min: 40, pay: 3, term: week, places: [city, camp], who: any, risk: 20, illegal: true,
     hook: "Big money orders bring the CID: bribe the post-office clerk.", wage: "113 piastres to the dollar officially against 157-180 on the street (US)", source: "https://sleuthsayers.org/2014/07/black-market-money.html"}

trouble:
  - {roll: 1, text: "A CID inquiry into currency or PX goods."}
  - {roll: 2, text: "A surprise MPC conversion day: locals holding old MPC beg him to swap it."}
  - {roll: 3, text: "A rocket or sapper attack on the site."}
  - {roll: 4, text: "The VC tax collector demands a share, or else."}
  - {roll: 5, text: "A road mine or booby trap on the way to work."}
  - {roll: 6, text: "His pay is skimmed by a camp commander or a boss."}
  - {roll: 7, text: "Heroin or a bad bar fight costs a week and his name."}
  - {roll: 8, text: "Inflation: wages buy a fifth less this month."}
  - {roll: 9, text: "The aircraft is shot up: walk out through hostile ground."}
  - {roll: 10, text: "A co-worker is VC, and he knows that he knows."}
