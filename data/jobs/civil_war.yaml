# Jobs between fights for the Civil War and frontier (1861-1867). Format as data/jobs/medieval.yaml.
# Pay is in Union Days (1 Day = 43¢, a private's $13 a month).
id: civil_war

sources:
  horse: &horse "https://www.historynet.com/behind-horsepower-civil-war-armies.htm"

jobs:
  # Lawful work
  - {id: meat_hunter, name: "Contract buffalo hunter", what: "Killing buffalo to feed railroad crews, about a dozen a day.", skill: rifle, min: 60, pay: 38.75, term: month, places: [frontier], who: [scout, sharpshooter], risk: 20,
     hook: "A rival hunter challenges you to a match.", wage: "$500 a month from the Kansas Pacific's contractors, 1867-68 (Cody)", source: "https://kancoll.org/books/cody/bbchap16.htm"}
  - {id: chief_guide, name: "Chief guide", what: "Guiding columns through Indian country.", skill: fieldcraft, min: 60, pay: 23.25, term: day, places: [frontier], who: [scout], risk: 25,
     hook: "The colonel ignores your warning.", wage: "Jim Bridger, chief guide at Fort Laramie, $10 a day", source: "https://www.wyohistory.org/encyclopedia/jim-bridger"}
  - {id: railroad_labour, name: "Union Pacific labourer", what: "Grading and laying track across Nebraska and Wyoming, 1866-69.", min: 0, pay: 8, term: day, places: [frontier, camp], who: any, risk: 10,
     hook: "Accidents and killings in the hell-on-wheels towns outnumber Indian attacks.", wage: "$3-4 a day (one article; check it)", source: "https://www.historynet.com/union-pacific-gandy-dancers-railroad-men-myths/"}
  - {id: wagon_master, name: "Wagon master", what: "Running a quartermaster's wagon train.", skill: command, min: 50, pay: 5.75, term: month, board: true, places: [road, camp], who: [teamster, sergeant], risk: 15,
     hook: "A sutler pays $10-25 a load on the side, which can get you fired.", wage: "$75 a month and up", source: *horse}
  - {id: freighter, name: "Bullwhacker or mule-skinner", what: "Hauling freight west by ox or mule train, up the Bozeman Trail and to Denver.", skill: ride, min: 30, pay: 5, term: month, board: true, places: [road, frontier], who: any, risk: 25,
     hook: "No party under thirty men may pass the Big Blue.", wage: "bullwhackers $65 a month, mule-skinners $75, 1865", source: "https://history.nebraska.gov/publications_section/overland-freighting-by-george-marvin/"}
  - {id: placer_miner, name: "Placer miner, Montana", what: "Working a claim at Alder Gulch or Last Chance.", skill: craft, min: 0, pay: 4.75, term: day, places: [frontier, town], who: any, risk: 15,
     hook: "Flour hits $100 a sack, and Plummer's men watch the gold shipments.", wage: "most miners made a couple of dollars in gold a day", source: "https://mhs.mt.gov/education/Textbook/Chapter6/chapter6.pdf"}
  - {id: trail_drive, name: "Trail drive hand", what: "Driving Texas cattle north, from 1866.", skill: ride, min: 30, pay: 2.25, term: contract, days: [60, 90], board: true, places: [frontier, road], who: any, risk: 15,
     hook: "A stampede at a river crossing.", wage: "cowboys about $30 a month; trail boss $100, cook $50", source: "https://www.nps.gov/grko/learn/historyculture/traildrives.htm"}
  - {id: army_teamster, name: "Army teamster", what: "Driving a six-mule supply wagon as a civilian.", skill: ride, min: 30, pay: 2, term: month, board: true, places: [road, camp], who: any, risk: 15,
     hook: "Mosby took 150 wagons in 1864, and guerrillas shoot teamsters who surrender.", wage: "white teamsters $25-30 a month, Black teamsters $10-20", source: *horse}
  - {id: deckhand, name: "Steamboat deckhand", what: "Loading freight and wood on river packets.", min: 0, pay: 2, term: contract, days: [7, 21], board: true, places: [sea, town], who: any, risk: 10,
     hook: "You sleep on cargo that is not what the manifest says.", wage: "about $25 a month (an 1880s figure)", source: "https://kmalexander.com/2017/05/03/a-riverboats-roustabouts/", approx: true}
  - {id: telegraph_lineman, name: "Military telegraph lineman", what: "Stringing and mending wire behind the army, as a civilian.", skill: craft, min: 30, pay: 3, term: month, board: true, places: [road, camp], who: any, risk: 20,
     hook: "The operators take orders from Stanton, not the general, who hates it.", wage: "no pay figure found", source: "https://en.wikipedia.org/wiki/U.S._Military_Telegraph_Corps", approx: true}
  - {id: sutler_clerk, name: "Sutler's clerk", what: "Keeping the accounts and guarding a regimental store.", skill: letters, min: 30, pay: 2, term: month, places: [camp], who: any, risk: 15,
     hook: "Soldiers angry at 300% markups cut the tent ropes.", wage: "no clerk's wage found", source: "https://essentialcivilwarcurriculum.com/sutlers.html", approx: true}
  - {id: photographer_assistant, name: "Photographer's assistant", what: "Hauling and mixing chemicals for a field photographer.", skill: craft, min: 30, pay: 2, term: month, places: [camp, road], who: any, risk: 10,
     hook: "One plate shows something it shouldn't.", wage: "no figure found", source: "https://www.nps.gov/people/mathew-brady.htm", approx: true}
  - {id: army_nurse, name: "Army nurse", what: "Ward work in a general hospital.", skill: leechcraft, min: 30, pay: 1.5, term: month, board: true, places: [city, camp], who: any, risk: 10,
     hook: "Miss Dix turns away nurses under 35, or too pretty.", wage: "men $20.50 a month; women 40¢ a day", source: "https://www.civilwarmed.org/dorothea-dix/"}
  - {id: extra_duty, name: "Extra-duty man", what: "A soldier detailed as a mechanic or labourer for the quartermaster, paid on top.", skill: craft, min: 0, pay: 0.75, term: day, board: true, places: [camp], who: [infantry, trooper, gunner], risk: 0,
     hook: "The quartermaster sergeant sells the lumber you cut.", wage: "from 1866: mechanics 35¢ a day extra, labourers 20¢", source: "https://npshistory.com/publications/foun/hrs/chap8n.htm"}
  - {id: embalmer, name: "Embalmer", what: "Preserving dead officers for shipment home, at a fee for each.", skill: leechcraft, min: 50, pay: 233, term: contract, days: [1, 1], lump: true, per: "a body", places: [camp, town], who: any, risk: 5,
     hook: "A family paid for a body that is not their son's.", wage: "Thomas Holmes charged $100 a body", source: "https://en.wikipedia.org/wiki/Thomas_Holmes_(mortician)"}
  - {id: substitute, name: "Substitute or bounty volunteer", what: "Enlisting in a drafted man's place, or for the combined bounties.", min: 0, pay: 698, term: contract, days: [365, 1095], lump: true, board: true, places: [town, city], who: any, risk: 40,
     hook: "The man you replace wants proof you reached the front.", wage: "$300 commutation and federal bounty; up to $1,000 with state and local bounties", source: "https://en.wikipedia.org/wiki/Enrollment_Act"}
  # Illegal
  - {id: bounty_jumper, name: "Bounty jumper", what: "Enlisting for the bounty, deserting, and doing it again.", skill: stealth, min: 30, pay: 2326, term: contract, days: [7, 7], lump: true, per: "a jump", places: [town, city], who: any, risk: 40, illegal: true,
     hook: "Five jumpers were shot at Beverly Ford in 1863.", wage: "combined bounties about $1,000; one man collected 32", source: "https://en.wikipedia.org/wiki/Bounty_jumper"}
  - {id: blockade_runner, name: "Blockade runner seaman", what: "Running a steamer into Wilmington, paid in gold.", min: 0, pay: 581, term: contract, days: [14, 21], lump: true, per: "a round trip", board: true, places: [sea], who: any, risk: 35, illegal: true,
     hook: "The pilot earns $3,500 a trip, and the Union navy knows his face.", wage: "sailors $250 a round trip; captains $5,000", source: "https://www.newsargus.com/brunswick_beacon/news/the-vesta-blockade-runners-in-the-civil-war/article_d8d51725-51ab-515d-b061-9ac3ddf5006c.html"}
  - {id: cotton_smuggler, name: "Contraband cotton trader", what: "Buying cotton behind the lines for Northern buyers.", skill: persuade, min: 40, pay: 20, term: contract, days: [7, 21], lump: true, per: "a run", places: [town, road], who: any, risk: 30, illegal: true,
     hook: "A provost marshal wants a cut.", wage: "no figure found", approx: true}
  - {id: horse_thief, name: "Horse thief", what: "Lifting army or farm horses to sell.", skill: stealth, min: 40, pay: 15, term: contract, days: [1, 3], lump: true, per: "a horse", places: [frontier, road], who: any, risk: 40, illegal: true,
     hook: "Vigilantes are out.", wage: "no figure found", approx: true}

trouble:
  - {roll: 1, text: "Guerrillas raid the train or the store."}
  - {roll: 2, text: "The provost guard asks for his papers."}
  - {roll: 3, text: "Fever or dysentery."}
  - {roll: 4, text: "The employer skips town owing wages."}
  - {roll: 5, text: "A stampede or a wagon wreck."}
  - {roll: 6, text: "Swindled at cards."}
  - {roll: 7, text: "Mistaken for a deserter."}
  - {roll: 8, text: "A war party on the trail."}
  - {roll: 9, text: "A brawl with soldiers."}
  - {roll: 10, text: "Conscripted on the spot."}
