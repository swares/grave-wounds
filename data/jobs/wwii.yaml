# Jobs between fights for the Second World War (1939-1945). Format as data/jobs/medieval.yaml.
# Pay is in Days of the army most likely to take the job (1 Day = $1.67 American, 3s British,
# 1 RM German); the wage line says whose.
id: wwii

sources:
  avg: &avg "https://historynet.com/american-volunteer-group-claire-l-chennault-and-the-flying-tigers/"

jobs:
  # Lawful work
  - {id: shipyard_worker, name: "Liberty-ship yard worker", what: "Welding or riveting hulls on a shift in a private shipyard.", skill: craft, min: 30, pay: 6, term: week, places: [city], who: any, risk: 5,
     hook: "A sabotage scare: someone left a seam half-welded.", wage: "all shipyard workers $62.23 a week, December 1943 (American)", source: "https://fraser.stlouisfed.org/title/wartime-employment-production-conditions-work-shipyards-4297/fulltext"}
  - {id: ship_repair_labourer, name: "Dock and ship-repair labourer", what: "Hauling, scraping and rigging in a repair yard or on the docks.", min: 0, pay: 3.75, term: week, places: [city, sea], who: any, risk: 5,
     hook: "A crate of PX whisky goes missing on your shift.", wage: "labourers about 77¢ an hour on the Atlantic coast, 1943 (American)", source: "https://fraser.stlouisfed.org/title/hourly-earnings-private-ship-repair-yards-spring-1943-4247/fulltext"}
  - {id: shell_loader, name: "Ammunition loader", what: "Filling shells and bombs on a 48-hour week.", min: 0, pay: 3.5, term: week, places: [town], who: any, risk: 10,
     hook: "Someone on the line is lighting cigarettes in the toilet block.", wage: "77¢ an hour average, June 1944 (American)", source: "https://fraser.stlouisfed.org/title/hourly-earnings-ammunition-loading-industry-1944-4300/fulltext"}
  - {id: aircraft_riveter, name: "War-plant riveter", what: "Riveting aircraft skins on the line.", skill: craft, min: 0, pay: 3, term: week, places: [city], who: any, risk: 5,
     hook: "Seniority rules mean you're first out when the contract ends.", wage: "women about $31.50 a week, men $54.65 (American; a historian's blog)", source: "https://www.lawyersgunsmoneyblog.com/2014/05/day-labor-history-may-29-1943"}
  - {id: german_war_plant, name: "Arms factory worker", what: "Running a lathe on a 60-hour week in a German arms factory.", skill: craft, min: 30, pay: 7, term: week, places: [city], who: any, risk: 20,
     hook: "Night raids, and forced labourers at the next bench.", wage: "about 7 RM a day (German, an estimate)", approx: true}
  - {id: merchant_seaman, name: "Merchant seaman", what: "Shipping out on a convoy freighter.", min: 0, pay: 4, term: contract, days: [21, 90], places: [sea], who: any, risk: 30,
     hook: "A run to Archangel: 13 of 40 ships lost before the White Sea.", wage: "$87-100 a month plus $100 war-zone bonus (American)", source: "https://www.nationalww2museum.org/war/articles/brotherhood-sea-organized-labor-us-merchant-marine"}
  - {id: ccc_enrollee, name: "CCC enrollee (before the war)", what: "Planting trees and cutting fire roads from a forest camp.", skill: fieldcraft, min: 0, pay: 0.5, term: month, places: [camp, frontier], who: any, risk: 5,
     hook: "The camp's reserve officer is recruiting for something bigger.", wage: "$30 a month, $25 of it sent home (American)", source: "https://www.nps.gov/fone/learn/historyculture/civilian-conservation-corps.htm"}
  - {id: pacific_contractor, name: "Island base contractor", what: "Building airstrips and barracks for a civilian contractor.", skill: craft, min: 30, pay: 6, term: contract, days: [270, 365], places: [frontier, sea], who: any, risk: 15,
     hook: "It's December 1941, and Wake has about 1,100 Morrison-Knudsen men.", wage: "no figure found; well above army pay", approx: true}
  - {id: amg_interpreter, name: "Military government interpreter", what: "Translating for an Allied Military Government town major.", skill: letters, min: 50, pay: 2, term: month, places: [town, city], who: any, risk: 5,
     hook: "Every candidate for mayor swears he was never a Fascist.", wage: "no figure found", approx: true}
  # Soldiering and contract war
  - {id: avg_pilot, name: "Flying Tiger pilot", what: "Flying P-40s as a contract volunteer over Burma and China, with a bonus for each kill.", skill: gunnery, min: 60, pay: 12, term: contract, days: [365, 365], places: [frontier], who: [officer], risk: 40,
     hook: "A Japanese plane destroyed pays $500, about 300 Days; the claims board is strict.", wage: "wingman $600 a month, $500 a plane (American)", source: *avg}
  - {id: avg_ground_crew, name: "Flying Tiger ground crew", what: "Keeping the P-40s flying for Chennault.", skill: craft, min: 40, pay: 5, term: contract, days: [365, 365], places: [camp, frontier], who: [sapper, tanker, radioman], risk: 15,
     hook: "A Japanese raid catches the field at dawn.", wage: "$150-350 a month by trade (American)", source: *avg}
  - {id: bomb_disposal, name: "Bomb disposal volunteer", what: "Digging out and defusing unexploded bombs.", skill: trench, min: 50, pay: 1.5, term: contract, days: [90, 90], places: [city, town], who: [sapper], risk: 35,
     hook: "A new type of fuze; the last man who tried one was killed.", wage: "sapper's pay and small extras (an estimate)", approx: true}
  - {id: salvage_diver, name: "Salvage diver", what: "Clearing wrecks from harbours such as Naples and Cherbourg.", skill: craft, min: 50, pay: 4, term: contract, days: [30, 60], places: [sea], who: [sapper], risk: 30,
     hook: "The wreck is booby-trapped and holds a paymaster's safe.", wage: "no figure found", approx: true}
  - {id: exile_forces, name: "Free French or Polish volunteer", what: "Enlisting with an exile army in Britain or North Africa.", skill: rifle, min: 40, pay: 1, term: contract, days: [180, 730], places: [camp], who: any, risk: 30,
     hook: "Your sergeant is sure you're a Vichy plant.", wage: "no figure found", approx: true}
  # Shady and illegal work
  - {id: berlin_black_market, name: "Tiergarten black-marketeer", what: "Trading PX cigarettes and goods for marks, cameras and watches.", skill: persuade, min: 30, pay: 15, term: week, places: [city], who: any, risk: 25, illegal: true,
     hook: "A Russian major wants 200 watches by Friday.", wage: "a 5¢ PX pack fetched about 300 RM ($30) in Berlin, July 1945 (American)", source: "https://www.coinworld.com/voices/gerald-tebben/purchasing_powerin.html"}
  - {id: naples_fixer, name: "Naples fixer", what: "Moving tyres, penicillin and cigarettes out of Allied depots.", skill: persuade, min: 40, pay: 8, term: week, places: [city, sea], who: any, risk: 30, illegal: true,
     hook: "The Camorra wants a whole truck, not cartons.", wage: "no figure found", approx: true}
  - {id: smuggler, name: "Smuggler", what: "Running goods across a frontier or through a cordon.", skill: stealth, min: 40, pay: 6, term: contract, days: [7, 14], places: [frontier, sea, road], who: any, risk: 35, illegal: true,
     hook: "The cargo isn't what you were told.", wage: "no figure found", approx: true}
  - {id: card_sharp, name: "Barracks card sharp", what: "Running poker and blackjack games on payday.", skill: persuade, min: 40, pay: 2, term: week, places: [camp], who: any, risk: 20, illegal: true,
     hook: "The big loser is the first sergeant.", wage: "no figure found", approx: true}
  - {id: escape_line_guide, name: "Escape-line guide", what: "Leading downed airmen over the Pyrenees into Spain.", skill: fieldcraft, min: 50, pay: 3, term: contract, days: [2, 4], places: [frontier], who: any, risk: 45, illegal: true,
     hook: "One 'airman' speaks English a little too carefully.", wage: "guides were usually paid; no sum given", source: "https://en.wikipedia.org/wiki/Escape_and_evasion_lines_(World_War_II)", approx: true}
  - {id: resistance_courier, name: "Resistance courier", what: "Cycling messages and money between cells.", skill: stealth, min: 40, pay: 0.5, term: week, places: [town, village, road], who: any, risk: 35, illegal: true,
     hook: "The Milice have set up a new checkpoint on your route.", wage: "no figure found", approx: true}

trouble:
  - {roll: 1, text: "An industrial accident: 1d6 days of work lost."}
  - {roll: 2, text: "An air raid or a torpedo: a Dodge check, or a wound."}
  - {roll: 3, text: "Military police, Feldgendarmerie or Kempeitai check papers."}
  - {roll: 4, text: "A black-market sting: the stake is lost, or he is arrested."}
  - {roll: 5, text: "A strike or a layoff: the term ends on half pay."}
  - {roll: 6, text: "An informer sells his name."}
  - {roll: 7, text: "Recalled or drafted early."}
  - {roll: 8, text: "A fight with a rival gang, crew or shift."}
  - {roll: 9, text: "Illness (malaria, typhus, VD): a Leechcraft check."}
  - {roll: 10, text: "The ship is sunk, the cell blown or the warehouse raided: a fight."}
