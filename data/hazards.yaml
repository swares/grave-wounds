# Character-scale hazards (rules in gravewounds/hazards.py, repeated in templates/ranks.js):
# swimming and drowning, cold water, fords, climbing, falls and chases. Research notes: the project
# doc "hazards-research" (figures tagged sourced, estimate or gap). Every number here is a design
# calibration of those figures; the sourced anchors are named beside them.

# Who can swim. No era has a sound count: a 1947 writer guessed a fifth to a third of British
# servicemen had never swum, a WWII Navy instructor that more than half of his cadets could not.
# Each man is rolled at creation: d100 at or under `none` a non-swimmer, over 100 - `strong` a strong
# swimmer, else basic; Seamanship `seamanship_strong` or more makes him strong, `seamanship_basic`
# at least basic.
swimmers:
  medieval: {none: 80, strong: 5}
  thirty_years: {none: 75, strong: 5}
  horse_musket: {none: 70, strong: 5}
  crimea: {none: 65, strong: 5}
  civil_war: {none: 60, strong: 10}
  plains_nations: {none: 30, strong: 30}
  wwi: {none: 50, strong: 10}
  wwii: {none: 40, strong: 15}
  korea: {none: 30, strong: 20}
  vietnam: {none: 25, strong: 25}
  modern: {none: 15, strong: 30}
swimmers_approx: true
seamanship_basic: 20
seamanship_strong: 40

# Swimming: each minute in deep water, d100 at or under Endurance + his ability + the modifiers.
# A success holds him (a critical lifts him a step), a failure takes him a step down (a fumble two):
# afloat, struggling, going under, drowning, drowned. Reaching the shore, or rescue, ends it; a man
# who came to drowning is near-drowned (two steps of fatigue). Armour in the water is worse than its
# weight on land; plate cannot be shed, a pack can (a band lighter, one minute).
swim:
  ability: {none: -50, basic: 0, strong: 20}
  load: [0, -10, -25, -60, -90, -100]          # by load band, Unburdened to Immobile
  armour: {light: 0, medium: -15, heavy: -30}
  current: {slow: 0, moderate: -10, fast: -20, spate: -30}
  flotation: 30
  steps: ["afloat", "struggling", "going under", "drowning", "drowned"]

# Cold water (the 1-10-1 rule; Tipton 1999: half of competent swimmers in 10 C water failed within
# 22-61 minutes): the first minute, a Nerve check (`shock`; failing it takes him a step down); after
# `fail_after` minutes his swimming falls by 10 for every further 10 minutes.
cold:
  - {name: "Warm (over 20 C)", shock: 0, fail_after: 999}
  - {name: "Cool (15-20 C)", shock: 0, fail_after: 90}
  - {name: "Cold (10-15 C)", shock: -20, fail_after: 45}
  - {name: "Very cold (5-10 C)", shock: -20, fail_after: 20}
  - {name: "Icy (5 C or under)", shock: -40, fail_after: 10}

# Fords (project docs "hazards-research" and "ages-women-fords-research"). Each ford on the travel
# map has its own depth and current, fixed by its place on the map within its water's span (an
# ordinary ford, or one in flood after heavy rain). Men wade to `wade` feet (Galton 1855 and the
# British field data: infantry 3 ft, cavalry 4 ft; guns 2 ft 4 in, which stops baggage wagons on
# the travel map; a map's place on a ford may set its own `depth` and `current`): within it only a man whose load
# band is `from_band` or heavier is at risk; deeper, every man. The current's band (FM 90-13: under
# 1.5 m/s is wanted; a float timed over 100 ft) sets the difficulty of his Agility check (Ride for a
# mounted man) and how many minutes he swims for the bank if swept off. It is the current, not the
# depth, that sweeps men away: the 10th Hussars' ford on the Kabul River in 1879 was about 3 ft deep
# with a current of about 4 m/s, and 46 men drowned with 13 horses. A mounted man swept off loses
# his horse at the current's `horse` % (a horse swims a short river well, but a laden rider much
# worse). The water is as cold as the week: the day's mean air temperature picks its row of `cold`
# (a flood one row colder: snowmelt and storm water).
fords:
  water:
    normal: {depth: [1, 3], current: [0.3, 1.8], name: "an ordinary ford"}
    flooded: {depth: [3, 5], current: [1.5, 4], name: "a flooded ford"}
  wade: {foot: 3, mounted: 4, wheels: 2.33, wheels_before: 1914}   # wheels: horse-drawn wagons and guns cannot cross a ford deeper, on maps that start before wheels_before (later, the wagons type is tanks and lorries)
  from_band: 3
  currents:
    - {upto: 0.5, id: slow, difficulty: easy, rounds: 1, horse: 0}
    - {upto: 1.5, id: moderate, difficulty: ordinary, rounds: 2, horse: 2}
    - {upto: 3, id: fast, difficulty: hard, rounds: 3, horse: 10}
    - {upto: 99, id: spate, difficulty: very_hard, rounds: 4, horse: 25}
  horse_approx: true
  cold_at: [20, 15, 10, 5]       # mean air temperature (C) above which the water is warm, cool, cold, very cold; else icy

# Climbing: d100 at or under Agility + Fieldcraft / 2 + the surface's modifier + his load's, for each
# `step_m` of height (a rope or ladder 10 m a step, a free climb 3 m). Failure: no progress this
# round; a fumble, he falls from where he is. A rope or ladder may fail once on the way (`anchor`
# %: a grapnel pulls out, a ladder is pushed off). Pointe du Hoc: 26-30 m cliffs, the first men up
# within about 10 minutes and nearly all 190 within 30; one man slid 9 m when his grapnel pulled out.
climb:
  surfaces:
    slope: {name: "A steep slope or scramble", mod: 20, step_m: 3}
    ladder: {name: "A ladder", mod: 20, step_m: 10, anchor: 15}
    rope: {name: "A knotted rope", mod: 0, step_m: 10, anchor: 15}
    wet_rope: {name: "A plain wet rope", mod: -20, step_m: 10, anchor: 15}
    wall: {name: "A rough wall or cliff, free", mod: -20, step_m: 3}
    sheer: {name: "A sheer face, free", mod: -40, step_m: 3}
  load: [0, -5, -15, -30, -100, -100]
  armour: {light: 0, medium: -5, heavy: -15}

# Falls (Lapostolle 2005: the dead fell a median 15 m, survivors 6 m; head-first landings about
# 17 times the odds of death; Hsieh 2020 for where the injuries fall). d100 on his height's row:
# none, light, moderate, serious, grave, dead (a moderate injury is a light wound, a grave one a
# critical, and death a critical wound to the head or neck). Shifts: a deliberate feet-first jump
# (an Agility check) or soft ground one row lighter; head-first or rock one heavier; a heavy load or
# armour one heavier. Then d100 on the landing for where.
falls:
  heights:
    - {upto: 1, name: "a stumble (up to 1 m)", bands: [70, 95, 100, 100, 100]}
    - {upto: 3, name: "a storey, or thrown from a horse (1-3 m)", bands: [0, 40, 85, 98, 100]}
    - {upto: 6, name: "two storeys, or from a galloping horse (3-6 m)", bands: [0, 15, 55, 90, 98]}
    - {upto: 12, name: "6-12 m", bands: [0, 0, 20, 55, 85]}
    - {upto: 20, name: "12-20 m", bands: [0, 0, 0, 15, 50]}
    - {upto: 9999, name: "over 20 m", bands: [0, 0, 0, 0, 10]}
  severities: [none, light, moderate, serious, grave, dead]
  wound: {light: light, moderate: light, serious: serious, grave: critical, dead: critical}
  landings:
    feet: {name: "Feet first", zones: [[55, legs], [75, lower_back], [85, torso], [93, arms], [100, head]]}
    thrown: {name: "Thrown or uncontrolled (and from a horse)", zones: [[25, legs], [40, lower_back], [60, torso], [80, arms], [100, head]]}
    head: {name: "Head first", zones: [[5, legs], [15, lower_back], [35, torso], [50, arms], [100, head]]}

# Chases: rounds of about 10 seconds, the gap in bands (close, near, far, distant, lost). Each round
# pursuer and quarry roll opposed (Agility, or Ride mounted; + Stealth for a quarry in cover, + Watch
# for the pursuer to keep him in sight): the winner moves the gap a band (two on a critical); a tie
# goes to the faster. On open ground a horse gains a band every second round on a man on foot
# whatever the dice; in cover the quarry gets +20 against a horseman. Every `sprint_tire` rounds a
# man on foot tires a step; a horse galloped `blown` rounds is blown (a trot). Speeds (m/s): men by
# load band (sprinting, about 1% worse for each kg: Knapik), horses by gait (gallop 40-48 km/h for
# 1.5-3 km).
chase:
  gaps: [close, near, far, distant, lost]
  start: 1
  foot_speed: [8, 7, 6, 4.5, 3, 1.3]
  horse_speed: 12
  cover: 20
  open_horse: 20
  sprint_tire: 3
  blown: 15
