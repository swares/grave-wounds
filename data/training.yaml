# Training (rules in gravewounds/training.py, repeated in templates/ranks.js). A week of training
# ticks the pupil's skill, as using it well does, so that it rolls to rise at End of season
# (data/experience.yaml) - if the teacher's check succeeds; a failed check wastes the week.
#
# Teachers:
#   - a master for hire (`masters`): his skill counts as `master_skill`; a fee in Days a week, in
#     the places listed; a master is offered in an era that has his skill;
#   - a teammate whose skill is at least `teammate_gap` above the pupil's: no fee, but the week
#     is his as well as the pupil's;
#   - drill (`drill`): on the travel map, a week in which a force its army feeds spent at least
#     `camped_days` days not marching drills its named men: the best Command among them (or
#     `nco`, the army's own sergeants, when none has more) rolls, and on a success each named
#     man's weapon skill is ticked.
# The pupil pays his keep for the week where the place does not feed him (as a job without board).
#
# Fees are in Days (a common soldier's day's pay). One anchor: in London in 1879 two dozen riding
# lessons cost 7 guineas at the school (Dickens's Dictionary of London), about six days of a
# private's shilling a lesson; three lessons a week is then some 18 Days. The rest are estimates.
master_skill: 60
teammate_gap: 20
lessons_source: "https://www.victorianlondon.org/entertainment/dickens-riding.htm"

masters:
  - {skill: ride, name: "Riding master", fee: 18, places: [town, city]}
  - {skill: blade, name: "Master of defence (fencing)", fee: 18, places: [town, city], approx: true}
  - {skill: letters, name: "Schoolmaster or clerk", fee: 1, places: [town, city, village], approx: true}
  - {skill: leechcraft, name: "Surgeon or physician", fee: 6, places: [town, city, camp], approx: true}
  - {skill: craft, name: "Master craftsman", fee: 2, places: [town, city, village], approx: true}
  - {skill: seamanship, name: "Boatman or mate", fee: 3, places: [town, city, sea], approx: true}
  - {skill: drive, name: "Driving instructor", fee: 6, places: [town, city], approx: true}
  - {skill: signals, name: "Signals instructor", fee: 6, places: [city, camp], approx: true}
  # Tongues ("tongue": any tongue). The army's own courses ran 12-week terms (the ASTP, 1943-44)
  # and today 26-64 weeks (DLI); after about three months the better students could order a meal
  # or rent a room (ASTP Moroccan Arabic). A week's lessons tick the tongue like any skill.
  - {skill: tongue, name: "Language master", fee: 6, places: [town, city], approx: true}
  - {skill: tongue, name: "Army language course", fee: 0, places: [camp, city], eras: [wwii, korea, vietnam, modern],
     source: "https://en.wikipedia.org/wiki/Army_Specialized_Training_Program"}

drill:
  camped_days: 4
  nco: 50
  difficulty: ordinary
  approx: true

# Courses (`courses`): weeks away at a school, a camp, a master's or a knight's, for a fee (Days,
# from his purse; 0 where board is found), then set gains to his skills; the weeks count as
# service where `served`; an officer's course (`rank`) makes him eligible for that rank at the
# next vacancy without the years or the rank below (rkEligible). Course lengths from the project
# doc "skills-uses-research"; the gains and the fees are design estimates (approx).
courses:
  - {id: apprentice, name: "A year as an apprentice", eras: [medieval, thirty_years, horse_musket, crimea, civil_war], weeks: 52, fee: 0,
     gains: {craft: 10, letters: 2}, places: [town, city], note: "Craft apprenticeships ran seven years (17th-century London); this is one of them", approx: true}
  - {id: squire, name: "A year in a knight's household (page or squire)", eras: [medieval], weeks: 52, fee: 0,
     gains: {blade: 5, ride: 5, command: 3, letters: 2}, note: "From page to knight took eight to fourteen years", approx: true}
  - {id: sandhurst, name: "Royal Military College, Sandhurst (about 18 months)", eras: [horse_musket, crimea], regions: [british_pen, british_rev, british], weeks: 78, fee: 100,
     gains: {command: 10, letters: 5, gunnery: 3}, rank: ensign, served: true, places: [town, city], note: "The fee is an estimate; no figure was found", approx: true,
     source: "https://en.wikipedia.org/wiki/Royal_Military_College,_Sandhurst"}
  - {id: camp_instruction, name: "A camp of instruction (about two weeks of drill)", eras: [civil_war], weeks: 2, fee: 0,
     gains: {rifle: 5, bayonet: 3}, served: true, places: [camp], approx: true}
  - {id: cadet_battalion, name: "An officer cadet battalion (4½ months, from 1916)", eras: [wwi], regions: [british], weeks: 19, fee: 0,
     gains: {command: 10, letters: 3, signals: 2}, rank: lieutenant, served: true, places: [camp, city],
     source: "https://en.wikipedia.org/wiki/Temporary_gentlemen"}
  - {id: ocs_wwii, name: "Officer Candidate School (17 weeks)", eras: [wwii], regions: [us, us_pacific], weeks: 17, fee: 0,
     gains: {command: 10, letters: 3, signals: 2}, rank: lieutenant, served: true, places: [camp, city],
     source: "https://en.wikipedia.org/wiki/Officer_Candidate_School_(United_States_Army)"}
  - {id: ocs_korea, name: "Officer Candidate School (22 weeks)", eras: [korea], regions: [us_1950, us_1952], weeks: 22, fee: 0,
     gains: {command: 10, letters: 3, signals: 2}, rank: lieutenant, served: true, places: [camp, city],
     source: "https://en.wikipedia.org/wiki/Officer_Candidate_School_(United_States_Army)"}
  - {id: ocs_vietnam, name: "Officer Candidate School (23 weeks)", eras: [vietnam], regions: [us_army, us_marines], weeks: 23, fee: 0,
     gains: {command: 10, letters: 3, signals: 2}, rank: lieutenant, served: true, places: [camp, city],
     source: "https://en.wikipedia.org/wiki/Officer_Candidate_School_(United_States_Army)"}
  - {id: ocs_modern, name: "Officer Candidate School (12 weeks)", eras: [modern], regions: [us_1991, us_1993, us_2005], weeks: 12, fee: 0,
     gains: {command: 10, letters: 3, signals: 2}, rank: lieutenant, served: true, places: [camp, city],
     source: "https://en.wikipedia.org/wiki/Officer_Candidate_School_(United_States_Army)"}
  - {id: rmas, name: "Royal Military Academy Sandhurst (44 weeks)", eras: [modern], regions: [uk_1982, uk_2005], weeks: 44, fee: 0,
     gains: {command: 12, letters: 3, signals: 2}, rank: lieutenant, served: true, places: [camp, city],
     source: "https://www.army.mod.uk/support-and-training/our-schools-and-colleges/rma-sandhurst/officer-training"}
  - {id: ranger, name: "Ranger School (about 9 weeks)", eras: [korea, vietnam, modern], regions: [us_1950, us_1952, us_army, us_marines, us_1991, us_1993, us_2005], weeks: 9, fee: 0,
     gains: {fieldcraft: 8, stealth: 5, command: 3}, served: true, places: [camp], source: "https://taskandpurpose.com/military-life/army-ranger-school/"}
  - {id: sfqc, name: "Special Forces Qualification Course (a year or more)", eras: [vietnam, modern], regions: [us_army, us_1991, us_1993, us_2005], weeks: 56, fee: 0,
     gains: {fieldcraft: 8, signals: 8, leechcraft: 5, stealth: 5}, served: true, places: [camp],
     source: "https://en.wikipedia.org/wiki/United_States_Army_Special_Forces_selection_and_training"}
