# The Rangers short of Cisterna at first light, 30 January 1944, at 10 m a hex: 150 x 120 hexes, about 1500 m
# east to west and 1040 m north to south, north at the top: the southern edge of Cisterna along
# the top, the railroad station top left, the Conca road coming up from the bottom left, the
# Pantano ditch from the bottom right, and open, treeless fields with farmhouses and haystacks.
# Generated by tools/maps/make_cisterna_field.mjs: edit that file and re-run it rather than this one.
# The fields, the ditch, the road, the farmhouses and the town's edge are drawn by hand to the
# shape the account gives, not traced from any map; the deployment is first light, in our own
# words, with round numbers for play. A cold, still January dawn; the reclaimed ground soft.
# There are no vehicle rules: the self-propelled guns and tanks are on call as direct fire (Fire
# support), and the Rangers' bazookas and sticky grenades are left to the GM. The Germans in
# houses, haystacks and dugouts start gone to ground; houses are buildings (cover).
#
# What happened, briefly: the Rangers had come four miles up the ditch in the dark, past German
# posts, and were short of the town at dawn; the 3rd Reconnaissance Troop platoon following them
# up the road had been caught on a German road block before dawn, and one man got back. Three
# self-propelled guns opened on the Rangers at first light; the
# Rangers knocked them out, but machine guns, mortars and snipers pinned them in the open, and
# the Germans closed in from all sides. A few reached the buildings by the station. Around noon
# tanks drove through them and split them into small groups; the last radio message came at
# 12:30. Of 767 Rangers six got back; most of the rest were taken prisoner.
id: cisterna-1944
name: "The Rangers at Cisterna, 30 January 1944"
sides: ["Americans", "Germans"]
table: owens-wwii
# On the travel map: a fight within `within` hexes of this place offers this field. `sides` are
# the travel-map sides that stand where each army stands here (Americans first).
travel: {map: anzio-1944, place: "Cisterna", within: 2, sides: ["Americans", "Germans"]}
size: [150, 120]
weather: {cond: fair, wind: calm, dir: N, ground: {mud: 1, snow: 0}}
# The place the battle was fought for (side: the army that attacked it; radius: the hexes round it that count): the enemy commander's objective.
objective: {at: [80, 7], side: 0, name: "the edge of Cisterna", radius: 3}
# Phases: each begins at an exchange (about a minute each, the first 1); the units it lists wait off the map until then,
# then come on where they are drawn, or at their side's entry edge if that is taken.
phases:
  - {name: "Caught at first light", at: 1, note: "About 06:10, short of the town: three self-propelled guns open on the column."}
  - {name: "A hasty defence", at: 61, note: "By about 07:10 the battalions are in a crescent-shaped hasty defence; at 07:30 the 1st Battalion breaks radio silence."}
  - {name: "The tanks", at: 351, note: "About noon tanks come down from Highway 7 and drive through the Rangers.", arrive: ["Tanks (later in the morning)"]}
  - {name: "The last message", at: 366, note: "12:15 to 12:30: the last radio messages; the line is rolled up."}
