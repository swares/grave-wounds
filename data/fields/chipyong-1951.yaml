# The perimeter at Chipyong-ni on the night of 14-15 February 1951, at 10 m a hex: 200 x 170 hexes, about 2000 m
# east to west and 1470 m north to south, north at the top: the village in the middle, the
# railroad through its south, the road north and south, and the ring of low hills the 23rd
# Infantry dug in on, about a mile across.
# Generated by tools/maps/make_chipyong_field.mjs: edit that file and re-run it rather than this one.
# The hills, the village, the railroad and the paddies are drawn by hand to the shape the
# accounts give, not traced from any map; the deployment is the second night's attack, in our
# own words, with round numbers for play. A clear, bitter night with snow on the ground and the
# paddies frozen hard (open ground). It is dark: fire the illumination (the transports' flares)
# or flares from the line to see what is coming. The fighter-bombers fly only by day.
#
# What happened, briefly: the Chinese came at the perimeter on the night of 13 February, from
# the north-west, north and south-east, and again all round after dark on the 14th, after a
# day in which fighter-bombers and an airdrop of ammunition kept them off. In the early hours
# of the 15th they broke into the southern perimeter at G Company's hill; counterattacks by the
# reserve, the Rangers and B Company could not retake all of it. That afternoon Task Force
# Crombez's tanks arrived from Yoju and the Chinese drew off. The 23rd lost about 50 killed,
# 250 wounded and 40 missing; the Chinese, by US estimates, some 2,000 killed.
id: chipyong-1951
name: "The perimeter at Chipyong-ni, 14-15 February 1951"
sides: ["United Nations", "Chinese"]
table: korea-1950-53-hospitalized
# On the travel map: a fight within `within` hexes of this place offers this field. `sides` are
# the travel-map sides that stand where each army stands here (United Nations first).
travel: {map: chipyong-1951, place: "Chipyong-ni", within: 2, sides: ["United Nations", "Chinese"]}
size: [200, 170]
weather: {cond: fair, wind: breeze, dir: NW, light: night, ground: {mud: 0, snow: 1}}
# The place the battle was fought for (side: the army that attacked it; radius: the hexes round it that count): the enemy commander's objective.
objective: {at: [94, 142], side: 1, name: "G Company's hill on the southern perimeter", radius: 3}
# Phases: each begins at an exchange (about a minute each, the first 1); the units it lists wait off the map until then,
# then come on where they are drawn, or at their side's entry edge if that is taken.
phases:
  - {name: "The attack on G Company", at: 1, note: "Soon after 22:00 on 14 February the Chinese regiment from Hill 397 breaks into G Company's line."}
  - {name: "G Company's hill falls; first reserves", at: 331, note: "About 03:00 G Company gives up the rest of its hill; a Ranger platoon and an F Company platoon reach it and counter-attack in the dark.", arrive: ["1st Ranger Company (reserve)"]}
  - {name: "The dawn counter-attack fails", at: 496, note: "06:15: the counter-attack by the Rangers, F Company's platoon and G Company's survivors is driven back."}
  - {name: "B Company counter-attacks", at: 721, note: "10:00: behind a mortar barrage and tank fire, B Company attacks G Company's hill; it is kept off the crest for hours (Mossman).", arrive: ["B Company, 23rd Infantry (reserve)"]}
  - {name: "The hill retaken; the Chinese run", at: 1111, note: "About 16:30 B Company regains the rest of the hill as tanks appear on Route 24A; the Chinese on Hill 397 begin to run."}
  - {name: "Task Force Crombez", at: 1156, note: "About 17:15: Crombez leads his tanks inside the perimeter (Mossman).", arrive: ["Task Force Crombez (tanks, up Route 24A)"]}
