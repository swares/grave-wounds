# The Wagon Box Fight, west of Fort Phil Kearny, 2 August 1867, at 10 m a hex: 100 x 80 hexes, about 1000 m
# east to west and 690 m north to south, north at the top: the plateau between the Big Piney
# (top) and the Little Piney (bottom), pine woods to the west, a ravine to the east, and the
# corral of wagon boxes in the middle.
# Generated by tools/maps/make_wagon_box_field.mjs: edit that file and re-run it rather than this one.
# The plateau, the creeks, the woods and the ravine are drawn by hand to the shape the accounts
# give, not traced from any map; the corral's exact place was never agreed, and it is drawn as a
# ring of wagon hexes round two hexes, larger than the real one. The deployment is the first
# charge, in our own words, with round numbers for play. A hot summer day.
#
# What happened, briefly: warriors struck the woodcutters' camps and ran off the herd, and the
# men who could reached the corral. Through the morning mounted and foot attacks came at it from
# several sides; the soldiers' breech-loaders, fired as fast as they could be loaded, held them
# off. Lieutenant Jenness and two soldiers were killed. In the early afternoon a relief column
# came out from the fort with a mountain howitzer (not on this map: the GM can bring it on),
# and the warriors drew off. Estimates of their losses run from a handful to sixty.
id: wagon-box-1867
name: "The Wagon Box Fight, 2 August 1867"
sides: ["US Army", "Lakota, Cheyenne and Arapaho"]
table: indian-wars-1865-71-arrows
# On the travel map: a fight within `within` hexes of this place offers this field. `sides` are
# the travel-map sides that stand where each army stands here (US Army first).
travel: {map: phil-kearny-1866, place: "Wagon Box corral", within: 2, sides: ["US Army", "Lakota, Cheyenne and Arapaho"]}
size: [100, 80]
weather: {cond: fair, wind: breeze, dir: W, ground: {mud: 0, snow: 0}}
# The place the battle was fought for (side: the army that attacked it): the enemy commander's objective.
objective: {at: [49, 40], side: 1, name: "the wagon-box corral"}
