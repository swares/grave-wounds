# Snakeshead Ridge, Point 593 and the abbey of Monte Cassino on the night of 17-18 February 1944, at 10 m a hex: 200 x 150
# hexes, about 2000 m east to west and 1300 m north to south, north at the top: Point 593 at the
# upper left, Snakeshead Ridge running down to the south-east past Point 444 to the abbey's
# ruins at the lower right, Phantom Ridge off to the west, steep scrubby slopes and gullies.
# Generated by tools/maps/make_cassino_monastery_field.mjs (the ground is cassino_massif.mjs):
# Light cover (scrub, key o): the thorn scrub on the steep slopes among the broken rock.
# edit them and re-run it rather than this file.
# The ground is drawn by hand to the shape the accounts give, not traced from any map; the
# deployment is the attack going in, in our own words, with round numbers for play. A dark night
# on the mountain: no one sees beyond 55 yards (50 m) without illumination. The abbey is rubble.
#
# What happened, briefly: after the abbey was bombed on 15 February, the 4th Indian Division
# attacked along the narrow ridge from the north. The Royal Sussex had already failed against
# Point 593 on the two nights before; at midnight on the 17th the Rajputana Rifles, with three
# Sussex companies, went for it, and two hours later the Gurkhas down the slopes for the abbey
# (by Point 445, says The Tiger Triumphs; Point 444 in other accounts), into minefields, thorn scrub and
# machine-gun fire from the paratroops on the tops. By dawn on the 18th the attack had failed
# with heavy loss, and it was called off.
