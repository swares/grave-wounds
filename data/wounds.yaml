# System-agnostic wound effects.
# A wound = location class x severity, then modified by the wound mechanism.
# All effects describe an UNTREATED wound.

severity:
  # Pick severity from your own system's damage, or roll d100 on this table.
  tiers:
    - {id: light,    name: "Light",    d100: [1, 55],   guide: "Damage well under what your system treats as a serious hit (e.g. < 1/3 of a wound level / HP threshold)."}
    - {id: serious,  name: "Serious",  d100: [56, 85],  guide: "A solid hit: about 1/3 to 2/3 of a threshold, or a hit that beat armour by a clear margin."}
    - {id: critical, name: "Critical", d100: [86, 100], guide: "A crippling or killing blow: over 2/3 of a threshold, or a critical success."}

  # Mechanism-specific severity tables, used when you roll severity (not when your
  # system decides it). Chosen by the hit's body zone.
  by_mechanism:
    ballistic:
      note: >
        Used for every hit from a firearm or explosive (any weapon with a threat level),
        including a blast's crush wounds. Calibrated to Bougainville 1944, where 38-42% of head, chest and abdomen hits
        killed but only 0.3% of arm and 3.4% of leg hits did. If your own system sets
        severity, give gunshots to the head and trunk its harshest damage.
      tables:
        - zones: [head, torso]
          tiers:
            - {id: light,    d100: [1, 25]}
            - {id: serious,  d100: [26, 62]}
            - {id: critical, d100: [63, 100]}
        - zones: [arms, legs]
          tiers:
            - {id: light,    d100: [1, 55]}
            - {id: serious,  d100: [56, 90]}
            - {id: critical, d100: [91, 100]}

vocabulary:
  bleed:
    0: "None"
    1: "Slow - seeping; lose 1 Blood per minute"
    2: "Heavy - lose 1 Blood per round; bind within minutes"
    3: "Arterial - lose 3 Blood per round; tourniquet or pressure now"
  pain:
    0: "None"
    1: "-10% to all actions"
    2: "-20% to all actions"
    3: "-30% to all actions"
  lethal:  # untreated time to death, ordered from least to most dangerous
    order: [none, days, hours, minutes, rounds, instant]
    none: "Not life-threatening by itself"
    days: "Fatal in days without care (infection, internal damage)"
    hours: "Fatal in hours without care"
    minutes: "Fatal in minutes without care"
    rounds: "Fatal within a few rounds"
    instant: "Killed outright"
  infection:
    order: [low, medium, high]
  impair:
    dazed:         "Stunned: lose next action, then -20% for 1d6 rounds"
    unconscious:   "Knocked out (check each minute to wake)"
    vision:        "Vision impaired: -30% to sight-based actions; blinded if both eyes"
    speech:        "Cannot speak clearly"
    breath:        "Winded: no sustained exertion; fatigue doubled"
    collapse:      "Collapses; can only crawl or crouch"
    grip:          "Drops anything held in that hand; cannot grip with it"
    arm:           "That arm -20%; no two-handed use"
    arm_useless:   "That arm useless"
    hand_useless:  "That hand useless"
    leg:           "Movement halved; -20% to footwork and dodging"
    stand:         "Falls and cannot stand unaided"
    move:          "Movement halved"
  flags:
    shock:    "Stop check: d100 against Nerve, or defend only, stunned or out of the fight"
    fracture: "Bone broken: no use of the part until set; pain +1 when used"
    severed:  "Part severed: arterial bleeding until cauterised or tourniqueted"

# Mechanism modifiers, applied after the class profile.
mechanisms:
  cut:
    name: "Cut"
    desc: "Edge blow: opens soft tissue; can sever limbs."
    rules:
      - {when: {severity: [serious, critical]}, bleed: +1}
      - {when: {severity: [critical], severable: true}, severed: true, bleed_min: 3}
  pierce:
    name: "Pierce"
    desc: "Point or spike: small entry, deep track; internal damage and infection."
    rules:
      - {when: {severity: [serious, critical], zone: [torso, head]}, lethal: +1}
      - {when: {severity: [critical], zone: [torso]}, lethal: +1}
      - {when: {zone: [arms]}, lethal_max: hours}
      - {infection: +1}
  crush:
    name: "Crush"
    desc: "Blunt impact: fractures and shock; less external bleeding."
    rules:
      - {bleed: -1}
      - {when: {severity: [serious, critical], bony: true}, fracture: true}
      - {when: {severity: [serious, critical]}, shock: true}
      - {when: {severity: [critical], zone: [head]}, pain: +1}

  ballistic:
    name: "Ballistic"
    desc: "Bullet, ball or shell fragment: shatters bone, carries cloth and dirt deep into the wound."
    rules:
      - {when: {severity: [serious, critical]}, bleed: +1}
      - {when: {severity: [serious, critical], bony: true}, fracture: true}
      - {when: {severity: [serious, critical]}, shock: true}
      - {when: {severity: [serious, critical], zone: [torso, head]}, lethal: +1}
      - {when: {severity: [critical], zone: [torso]}, lethal: +1}
      - {when: {zone: [arms]}, lethal_max: hours}
      - {infection: +1}

# Location class profiles: light / serious / critical.
# severable: a critical cut can take the part off.  bony: a crush can fracture it.
classes:
  skull:
    bony: true
    infection: medium
    light:    {bleed: 1, pain: 1}
    serious:  {bleed: 1, pain: 2, shock: true, impair: [dazed]}
    critical: {bleed: 2, pain: 3, shock: true, impair: [unconscious], lethal: hours}
  face:
    bony: true
    infection: medium
    light:    {bleed: 1, pain: 1}
    serious:  {bleed: 2, pain: 2, impair: [vision]}
    critical: {bleed: 2, pain: 3, shock: true, impair: [vision, speech], lethal: days}
  neck:
    bony: false
    infection: medium
    light:    {bleed: 1, pain: 1}
    serious:  {bleed: 2, pain: 2, shock: true, lethal: hours}
    critical: {bleed: 3, pain: 3, shock: true, impair: [breath], lethal: rounds}
  chest:
    bony: true
    infection: medium
    light:    {bleed: 1, pain: 1}
    serious:  {bleed: 2, pain: 2, shock: true, impair: [breath], lethal: days}
    critical: {bleed: 3, pain: 3, shock: true, impair: [breath, collapse], lethal: minutes}
  abdomen:
    bony: false
    infection: high
    light:    {bleed: 1, pain: 1}
    serious:  {bleed: 1, pain: 2, lethal: days}
    critical: {bleed: 2, pain: 3, shock: true, impair: [collapse], lethal: hours}
  groin:
    bony: true
    infection: high
    light:    {bleed: 1, pain: 2}
    serious:  {bleed: 2, pain: 3, shock: true, impair: [leg]}
    critical: {bleed: 3, pain: 3, shock: true, impair: [stand], lethal: minutes}
  back_upper:
    bony: true
    infection: medium
    light:    {bleed: 1, pain: 1}
    serious:  {bleed: 1, pain: 2, impair: [arm]}
    critical: {bleed: 2, pain: 3, shock: true, impair: [breath, collapse], lethal: hours}
  back_lower:
    bony: true
    infection: medium
    light:    {bleed: 1, pain: 1}
    serious:  {bleed: 1, pain: 2, impair: [move]}
    critical: {bleed: 2, pain: 3, shock: true, impair: [stand], lethal: days}
  shoulder:
    bony: true
    infection: low
    light:    {bleed: 1, pain: 1}
    serious:  {bleed: 1, pain: 2, impair: [arm]}
    critical: {bleed: 2, pain: 3, shock: true, impair: [arm_useless], lethal: days}
  upper_arm:
    bony: true
    severable: true
    infection: low
    light:    {bleed: 1, pain: 1}
    serious:  {bleed: 1, pain: 2, impair: [arm]}
    critical: {bleed: 3, pain: 3, shock: true, impair: [arm_useless], lethal: minutes}
  forearm:
    bony: true
    severable: true
    infection: low
    light:    {bleed: 1, pain: 1}
    serious:  {bleed: 1, pain: 2, impair: [grip]}
    critical: {bleed: 2, pain: 3, shock: true, impair: [arm_useless], lethal: hours}
  hand:
    bony: true
    severable: true
    infection: low
    light:    {bleed: 0, pain: 1}
    serious:  {bleed: 1, pain: 2, impair: [grip]}
    critical: {bleed: 2, pain: 3, impair: [hand_useless]}
  thigh:
    bony: true
    severable: true
    infection: medium
    light:    {bleed: 1, pain: 1}
    serious:  {bleed: 2, pain: 2, impair: [leg]}
    critical: {bleed: 3, pain: 3, shock: true, impair: [stand], lethal: minutes}
  knee:
    bony: true
    infection: medium
    light:    {bleed: 0, pain: 1}
    serious:  {bleed: 1, pain: 2, impair: [leg]}
    critical: {bleed: 1, pain: 3, shock: true, impair: [stand]}
  lower_leg:
    bony: true
    severable: true
    infection: medium
    light:    {bleed: 1, pain: 1}
    serious:  {bleed: 1, pain: 2, impair: [leg]}
    critical: {bleed: 2, pain: 3, shock: true, impair: [stand], lethal: hours}
  foot:
    bony: true
    severable: true
    infection: medium
    light:    {bleed: 0, pain: 1}
    serious:  {bleed: 1, pain: 2, impair: [leg]}
    critical: {bleed: 1, pain: 3, impair: [stand]}

# Survival tracking (used by the web roller; optional at the table).
tracking:
  blood_pool: 20          # Blood points; scale to your system
  thresholds:
    - {at: 0.75, penalty: 10, effect: "Pale and weak: -10% to all actions"}
    - {at: 0.50, penalty: 20, effect: "Faint check each minute; -20% to all actions"}
    - {at: 0.25, penalty: 40, down: true, effect: "Barely conscious: -40% to all actions, can only crawl"}
    - {at: 0.0,  incapacitated: true, effect: "Unconscious and dying"}
  treatment:
    bind:       {bleed: -1, note: "Bandage / pressure: reduce bleed by 1 (min 0)"}
    tourniquet: {bleed_to: 0, limbs_only: true, note: "Limb only: stops bleeding; limb lost if left on for hours"}
    cauterise:  {bleed_to: 0, pain: +1, note: "Stops bleeding; pain +1"}
  pain_cap: 3             # total pain penalty steps cap (-30%); above it, a stop check each round

# Fighting while wounded. Used when the roller (or CLI) makes the attack roll, and to
# show each casualty's net penalties for your own system.
#   attack  - subtracted from the attacker's attack chance (%)
#   defence - subtracted from the defender's parry / dodge chance (%)
# An impairment on an arm location counts against the WEAPON arm (the side of the
# fighter's weapon hand, default right) or the SHIELD arm (the other side). A wound
# not on an arm (e.g. upper back) counts against the weapon arm.
# The same impairment counts once however many wounds cause it.
combat:
  cap: 60                    # total attack and total defence penalty are each capped here
  pain_step: 10              # % per pain step (pain itself is capped at tracking.pain_cap)
  critical_fraction: 0.1     # a roll at or under 10% of the effective chance is a critical: it cannot be defended
  impair:
    dazed:       {attack: 20, defence: 20}
    vision:      {attack: 30, defence: 30}
    breath:      {attack: 10, defence: 10}
    collapse:    {attack: 20, defence: 30, down: true}
    stand:       {attack: 20, defence: 30, down: true}
    leg:         {defence: 20}
    move:        {defence: 10}
    unconscious: {incapacitated: true}
    speech:      {}
    arm:         {weapon_arm: {attack: 20}, shield_arm: {defence: 10}}
    grip:        {weapon_arm: {attack: 30, off_hand: true}, shield_arm: {no_shield: true}}
    hand_useless: {weapon_arm: {attack: 30, off_hand: true}, shield_arm: {no_shield: true}}
    arm_useless: {weapon_arm: {attack: 40, off_hand: true}, shield_arm: {defence: 10, no_shield: true}}
  # Situations switched on automatically by wounds (if the table offers them).
  auto_situations:
    defender_down: target_down      # defender cannot stand
    defender_no_shield: no_shield   # defender's shield arm cannot hold a shield
    attacker_down: attacker_lower   # attacker fights from the ground
    attacker_higher: attacker_higher  # battle map: attacker a level or more above the defender
    defender_higher: attacker_lower   # battle map: defender a level or more above the attacker
    behind_cover: behind_cover        # battle map: target behind works, low cover, or taking cover
    in_cover: target_down             # battle map: a man taking cover, where the tables have no cover situation, or struck hand to hand
  # Margin of success (effective chance minus the roll) sets severity when the attack is
  # rolled here. A critical is always Critical. Firearm bands match the calibrated
  # (Bougainville) firearm severity table for an attack chance of about 60%; better shots
  # wound worse, poor shots lighter.
  margin_bands:
    default: {serious: 20, critical: 50}
    ballistic:
      - {zones: [head, torso], serious: 10, critical: 35}
      - {zones: [arms, legs], serious: 30, critical: 60}
  # Graze: a hit by this margin of success or less (not a critical) only grazes. The wound
  # is rolled as usual, then its bleed and pain drop one step each and it causes no shock.
  graze_margin: 2
  # Stop check (Grave Wounds): a serious or critical wound that carries the `shock` flag
  # (most do; some limb wounds do not) calls for d100 against the fighter's Nerve, minus pain and blood-loss penalties, minus `critical_penalty` for a
  # critical wound. Equal or under: he fights on. Over: how far over (fail_by) picks the
  # result, and the result lasts `rounds` rounds (out lasts until cleared).
  stop_check:
    severities: [serious, critical]
    # Pain above tracking.pain_cap calls for a stop check every round, made as for a
    # wound of this severity.
    pain_round_as: serious
    critical_penalty: 10        # on top of the wound's own pain, which already counts
    ratings: {green: 35, regular: 50, veteran: 65}
    default_rating: regular
    results:
      - {upto: 20, state: defend_only, rounds: 2}
      - {upto: 40, state: stunned, rounds: 2}
      - {state: out}
  # What each result does. no_attack: cannot attack; defence: extra defence penalty (%);
  # out: out of the fight (skipped in the turn order, cannot attack or defend).
  states:
    defend_only: {name: "Defend only", no_attack: true}
    stunned: {name: "Stunned", no_attack: true, defence: 50}
    out: {name: "Out of the fight", no_attack: true, out: true}
  # Team morale (Grave Wounds): at the end of each round, a side with at least `trigger`
  # of its fighters down checks d100 against the best Nerve among its fighters still up
  # (its leader's, if he is up). +leader_present if a leader is up; -leader_down if a
  # leader is down; -heavy_losses once `heavy` of the side is down. Over: the side breaks.
  morale:
    trigger: 0.25
    heavy: 0.5
    leader_present: 10
    leader_down: 20
    heavy_losses: 20
  # Battle map (Grave Wounds): a hex grid, pointy-top, odd rows shifted right. A round is
  # 6 seconds. On his turn a fighter may stay, advance up to `advance` hexes and still
  # attack, or run up to `run` hexes and not attack. Wounds cut movement: any impairment in
  # `halved_by` halves both (rounded down); one in `crawl_by` leaves only a crawl of
  # `crawl` hexes; one in `no_run_by` stops him running. A fighter in a state listed in
  # `no_move_states` cannot move. He may pass through friends but not stop on them, and
  # cannot enter an enemy's hex.
  # Leaving contact: if he moves more than `careful_step` hexes, every enemy next to him
  # where he started, and not next to him where he ends, may make one free attack on him
  # (if that enemy is up and able to attack).
  move:
    hex_m: 2
    advance: 4
    run: 12
    halved_by: [leg, move]
    crawl_by: [collapse, stand]
    crawl: 1
    no_run_by: [breath]
    no_move_states: [stunned, out]
    careful_step: 1
    map: {cols: 24, rows: 16}
  # Missile range bands: weapons.yaml `range` gives each band's outer edge in hexes.
  # Line of fire on the battle map: each fighter standing on the line between a shooter and his
  # target costs the shot `per_man` % (at most `max`). A miss may strike the first man in the way
  # instead (`stray` %), rolled on him with no attack roll; bows and crossbows (`arcing`) loose
  # high over the men in the way and never strike them.
  line_of_fire: {per_man: 10, max: 30, stray: 50, arcing: [bow, longbow, crossbow]}
  # The battle map's ground and height, painted per hex. move: extra movement to enter a hex
  # of it; cover: % off missiles at a man in it; low: low cover (rocks, rubble) that hides his
  # lower body, as works do ("Target behind cover"). Each hex has a height level, 0 to
  # max_level: climbing a level costs `climb` more; a close-combat blow up at a man a level
  # higher costs `uphill` % a level (at most two levels); a missile shot down from higher
  # ground reaches `downhill_reach` % further a level; higher ground between shooter and
  # target blocks the shot, and from higher ground a man shoots over men on lower ground.
  # Fighting from a level up or down brings in the tables' "Attacker higher" or "Attacker
  # lower". A man who takes cover (his turn) is `take_cover` % harder to hit with missiles and
  # shows only head, shoulders and arms ("Target behind cover"; "Target down" where the tables
  # have no cover situation, and to a blow in close combat) until he moves or strikes.
  ground:
    kinds:
      open:  {name: "Open ground", move: 0}
      rough: {name: "Rocks and rubble", move: 1, cover: 10, low: true}
      brush: {name: "Woods and brush", move: 1, cover: 20}
      marsh: {name: "Marsh or deep mud", move: 2}
      water: {name: "Deep water", move: 99, deep: true}    # no one enters or stands in it; shots pass over
      road:  {name: "Road", move: 0}                       # clear going, drawn; no faster than open ground at this scale
      bridge: {name: "Bridge", move: 0}                    # a road over deep water
    max_level: 3
    climb: 1
    uphill: 10
    downhill_reach: 10
    take_cover: 20
    # Laying out a battle map's ground from the travel map's terrain (or the roller's "Ground
    # like" picker): for each travel terrain, the share of hexes in rocks, woods and marsh,
    # laid as irregular clumps of 3 to 12 hexes, and how many rises stand on the map and how
    # high they may go (each a cone, one level lost every 3 to 6 hexes from its top). Design
    # estimates for a patch of ground about 50 to 160 yd (45 to 150 m) across, not data from
    # any battlefield. Terrain not listed (river, lake) lays out as open ground. Inside a camp's
    # works the ground is cleared and levelled to the camp's middle.
    seed:
      open:      {brush: 0.03, rough: 0.02, rises: 1, top: 1}
      road:      {brush: 0.02, rough: 0.01, rises: 1, top: 1}
      farmland:  {brush: 0.07, rough: 0.01, rises: 1, top: 1}
      heath:     {brush: 0.10, rough: 0.06, rises: 1, top: 1}
      forest:    {brush: 0.55, rough: 0.04, marsh: 0.02, rises: 1, top: 1}
      hills:     {brush: 0.06, rough: 0.10, rises: 2, top: 3}
      mountains: {brush: 0.04, rough: 0.30, rises: 3, top: 3}
      marsh:     {brush: 0.10, marsh: 0.35}
      ford:      {brush: 0.04, marsh: 0.12}
      bridge:    {brush: 0.03, rough: 0.03}
      village:   {brush: 0.05, rough: 0.10}
      town:      {rough: 0.20}
    # The neighbouring travel hexes: the fight stands at a repeatable spot in the defenders'
    # hex (its travel hex is hex_km across, flat side to flat side). Where the battle map
    # reaches past a side of that hex, the ground beyond the side is laid out like the
    # neighbour's terrain: a lake is deep water, a river is a band of deep water river_width
    # hexes wide (open ground on the far bank), with a ford ford_width hexes wide (marsh to
    # wade) within ford_shift hexes of the middle of the map's side when a ford or bridge is
    # next to the defenders' hex. Design estimates.
    edges:
      river_width: [8, 25]
      ford_width: [3, 6]
      ford_shift: 10
    # A road or river through the defenders' own travel hex: a force on a road, or at a ford or
    # bridge, is on it, so it runs through the middle of the battle map toward each
    # neighbouring hex it links to (a junction where there are more than two). A river is
    # river_width hexes wide (above); at a ford hex the road crosses it by a ford (marsh to wade,
    # ford_width hexes wide, or across the middle when no road comes), at a bridge hex by a
    # bridge as wide as the road. Design estimates.
    through:
      road:  {hexes: [road, bridge, ford, village, town], links: [road, bridge, ford, village, town], width: [2, 3]}
      river: {hexes: [ford, bridge], links: [river, ford, bridge, lake]}
    # A camp with works at a ford or bridge stands on one bank, gap hexes back from the river,
    # on the bank away from the way the attackers came (either bank, fixed for the fight, when
    # they came along the river or from the same hex). The battle map grows to make room, up to
    # its cap; if the river still does not fit with far hexes of its far bank showing, it is
    # narrowed, to the least river width at most, and the rest runs off the map.
    camp_bank: {gap: 3, far: 2}
  range:
    - {band: short, penalty: 0}
    - {band: medium, penalty: 20}
    - {band: long, penalty: 40}
