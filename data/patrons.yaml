# Standing with patrons (rules in gravewounds/patrons.py, repeated in templates/ranks.js; research
# in the project doc "patrons-research"). A patron is a lord, a colonel, a governor, a band chief, a
# commanding officer: a man who can do things for his clients and expects service. The team builder
# keeps the team's patrons and each man's Standing with each (d100), read in bands.
#
#   - Asking a favour: d100 at Standing (+ Persuade ÷ 10, his asking well) at the favour's
#     difficulty. Granted, it spends `cost` Standing (he expects it repaid); a critical costs
#     nothing; refused, nothing changes; a fumble offends him (`offended`).
#   - Standing moves on events (`events`): a deed he noticed, a season in his service, gifts and
#     loot shares given him, a refused order, a failed errand, being caught looting, changing sides
#     (to 0, and he becomes an enemy).
#   - Two clients wanting one favour or one vacancy: opposed Standing.
#   - A promotion favour adds `promotion_bonus` to his Command for the next vacancy.
#   - The patron's fate, each End of season, by era (`fate`): he dies, falls, changes sides, or
#     goes (sells out, disbands, is posted away). Then each client by his outcome (`clients`).
#
# Gaunt kept 85 knights and 85 squires in 1379-83, and 30 of his 125 knights sat in Parliament;
# of Hastings' 67 indentures only two paid a fee; after Wallenstein's murder (1634) seven generals
# who had signed for him were demoted and imprisoned, and those who betrayed him took the estates;
# a US company commander under a high-performing battalion commander was about 29% more likely to
# be picked early for major. The fate chances and the moves are design estimates (approx).
start: 30                     # a new client: sworn, indentured, taken on
max: 95
bands:
  - {from: 0, name: "a stranger to him"}
  - {from: 1, name: "known to him"}
  - {from: 26, name: "his client"}
  - {from: 51, name: "trusted"}
  - {from: 76, name: "his right hand"}
persuade_div: 10
promotion_bonus: 20
offended: -10
critical_free: true

favours:
  - {id: word, name: "A word for him: a letter, a recommendation, a meal and a bed", difficulty: easy, cost: 2}
  - {id: promotion, name: "His word for the next vacancy", difficulty: ordinary, cost: 10, promotion: true}
  - {id: money, name: "Money: a fee, or pay advanced", difficulty: ordinary, cost: 10, days: 30}
  - {id: kit, name: "A horse or arms", difficulty: ordinary, cost: 10, days: 40}
  - {id: work, name: "Work: a month in his service", difficulty: ordinary, cost: 5, days: 30, served: 30}
  - {id: kin, name: "A place for his kin", difficulty: hard, cost: 15}
  - {id: commission, name: "A commission: a free vacancy, or the loan of its price", difficulty: hard, cost: 20, promotion: true}
  - {id: ransom, name: "His ransom paid", difficulty: hard, cost: 20, ransom: true}
  - {id: shield, name: "Spared a punishment or a debt", difficulty: hard, cost: 15}
  - {id: hanging, name: "Saved from the gallows or a court-martial", difficulty: very_hard, cost: 30}

events:
  deed: {name: "A deed he noticed", dice: [1, 10]}
  season: {name: "A season in his service", add: 2}
  gift: {name: "A gift or his share of the loot", per_days: 5}
  horses: {name: "Horses given away (the Plains nations)", per: 4}
  refused: {name: "Refused his order or his call", add: -10}
  failed: {name: "Failed on his errand", add: -5}
  caught: {name: "Caught looting or disgraced", add: -5}
  sides: {name: "Changed sides", to: 0, enemy: true}

rivals: true                  # opposed Standing between two clients

# The patron's fate each End of season: d100, in order (at or under the running total). The rest:
# he stays. An approx design figure for each era from the research's cases.
fate:
  medieval: [{id: dies, chance: 3}, {id: falls, chance: 2}, {id: sides, chance: 1}]
  thirty_years: [{id: dies, chance: 4}, {id: falls, chance: 2}, {id: sides, chance: 3}, {id: goes, chance: 4, name: "disbands his regiment"}]
  horse_musket: [{id: dies, chance: 3}, {id: falls, chance: 1}, {id: goes, chance: 4, name: "sells out or is posted"}]
  crimea: [{id: dies, chance: 5}, {id: falls, chance: 1}, {id: goes, chance: 3, name: "sells out or goes home"}]
  civil_war: [{id: dies, chance: 4}, {id: falls, chance: 6, name: "is dismissed by the examining board or resigns"}, {id: goes, chance: 4, name: "is promoted away"}]
  plains_nations: [{id: dies, chance: 3}, {id: falls, chance: 3, name: "loses his following"}]
  wwi: [{id: dies, chance: 6}, {id: falls, chance: 2, name: "is sent home (stellenbosched)"}, {id: goes, chance: 10, name: "is posted away"}]
  wwii: [{id: dies, chance: 4}, {id: falls, chance: 2, name: "is relieved"}, {id: goes, chance: 10, name: "is posted away"}]
  korea: [{id: dies, chance: 3}, {id: falls, chance: 2, name: "is relieved"}, {id: goes, chance: 20, name: "rotates home"}]
  vietnam: [{id: dies, chance: 3}, {id: falls, chance: 2, name: "is relieved"}, {id: goes, chance: 40, name: "ends his six months in command"}]
  modern: [{id: dies, chance: 2}, {id: falls, chance: 2, name: "is relieved"}, {id: goes, chance: 25, name: "is posted away"}]

fates:
  dies: {name: "dies", clients: heir}
  falls: {name: "falls from favour", clients: ruin}
  sides: {name: "changes sides", clients: choose}
  goes: {name: "goes", clients: half}
# What his clients come to:
#   heir   - his heir or successor takes them on at half Standing
#   half   - he is gone; a client may take what he had to a new patron at half Standing
#   ruin   - each client rolls d100: at or under his Standing he shares the fall (Standing gone,
#            and the GM's ruin: a rank lost, prison, worse), else he gets clear at half
#   choose - each client follows him to the other side (Standing kept) or stays (Standing gone)

kinds:                        # what a patron is called in each era (the team builder's default)
  medieval: "his lord"
  thirty_years: "his colonel"
  horse_musket: "his colonel"
  crimea: "his colonel"
  civil_war: "his colonel or governor"
  plains_nations: "his band chief or society headman"
  wwi: "his commanding officer"
  wwii: "his commanding officer"
  korea: "his commanding officer"
  vietnam: "his commanding officer"
  modern: "his commanding officer or mentor"
