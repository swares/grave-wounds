# The defenders' orders, from the accounts, for the enemy commander in self-play.
# Researched 18 October 2026 (the project's hold-or-give-way.md, with each unit's source and how far
# it can be trusted). Per battlefield:
#   hold: units the sources say held their ground to the end of the fight the set-up covers. Holding,
#     they fight where they stand rather than fall back to the objective.
#   fight_on: the sides (0, 1) the accounts show fighting to the end: their cornered units do not
#     surrender (rout.surrender) but are struck as before. From the sourced ratios of killed to
#     prisoners (the project's surrender notes); sides with no figure are left out.
#   withdraw: units that gave way on orders at a known time: from exchange `at` (a minute each, from the
#     field's first) they fall back to `to`, a hex (then hold it) or a map edge (N, S, E, W: they leave
#     the field there).
# A unit the sources say was driven off, or that the sources do not cover, has no entry: the fight
# decides. Zayas's Spanish at Albuera held and then drew back when relieved: no entry.

