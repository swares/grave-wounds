# Terrain and marching for the travel map (Grave Wounds).
#
# A travel map is a hex grid (pointy-top, odd rows shifted right), usually 1 km a hex.
# A force marches at its type's road speed, for `hours_per_day` marching hours a day.
# Crossing a hex takes  hex_km / kmh x the average of the two hexes' `cost`  hours,
# so a step from road into forest is charged half road, half forest.
#
# terrain fields:
#   key      - the one character that paints this terrain in a map file
#   cost     - time multiplier against marching on a road (1.0); null: impassable
#   colour   - [light theme, dark theme] fill on the map
#   cover    - none | light | heavy: concealment for ambush and skirmish (for later rules)
#   forage   - none | poor | fair | good: what a force can find to eat (for later rules)
#   wet      - true where standing water and damp raise the risk of fevers (for later rules)
# The costs are design estimates for men on foot, from the usual rule of thumb that
# cross-country going takes about half as long again as a road, woods and hills about
# twice as long and marsh or mountains far longer.

hours_per_day: 8
day_starts: 8          # hour of the morning the march starts (for the clock shown)
# A fight can be set up only between forces that have marched to within this many hexes
# of each other (1 = the same or the next hex: about a kilometre).
fight_within: 1

forces:
  foot:    {name: "On foot", kmh: 4}
  mounted: {name: "Mounted", kmh: 6}
  wagons:  {name: "Baggage wagons", kmh: 3, cannot_enter: [forest, marsh, mountains, heath]}
# Road speeds for a small, fit band. A large army's column, with its halts and its
# stragglers, typically made less ground a day; cut its marching hours or speed to suit.

terrain:
  - {id: road,      key: "=", name: "Road",           cost: 1.0,  colour: ["#9f8b66", "#8f7d58"], cover: none,  forage: poor}
  - {id: open,      key: ".", name: "Open ground",    cost: 1.5,  colour: ["#dfe6c4", "#3d4632"], cover: none,  forage: fair}
  - {id: farmland,  key: "f", name: "Farmland",       cost: 1.5,  colour: ["#e9dfa8", "#4f4a2c"], cover: light, forage: good}
  - {id: heath,     key: ",", name: "Heath",          cost: 1.75, colour: ["#d4c3cf", "#4a3d47"], cover: none,  forage: poor}
  - {id: forest,    key: "F", name: "Forest",         cost: 2.5,  colour: ["#8fb487", "#24402a"], cover: heavy, forage: fair}
  - {id: hills,     key: "h", name: "Hills",          cost: 2.0,  colour: ["#c9b28a", "#5a4b33"], cover: light, forage: fair}
  - {id: mountains, key: "M", name: "Mountains",      cost: 4.0,  colour: ["#a39a92", "#4d4844"], cover: heavy, forage: none}
  - {id: marsh,     key: "m", name: "Marsh",          cost: 3.0,  colour: ["#a9c7b8", "#2d4842"], cover: light, forage: poor, wet: true}
  - {id: river,     key: "~", name: "River",          cost: null, colour: ["#8db7d6", "#25445c"], cover: none,  forage: poor, wet: true}
  - {id: ford,      key: "d", name: "Ford",           cost: 2.0,  colour: ["#b4d0e0", "#35566b"], cover: none,  forage: poor, wet: true}
  - {id: bridge,    key: "b", name: "Bridge",         cost: 1.0,  colour: ["#7a6545", "#a08a5e"], cover: none,  forage: none}
  - {id: lake,      key: "w", name: "Lake or sea",    cost: null, colour: ["#7fa9cc", "#1f3a52"], cover: none,  forage: poor, wet: true}
  - {id: village,   key: "v", name: "Village",        cost: 1.0,  colour: ["#d9a68a", "#6e4836"], cover: light, forage: good}
  - {id: town,      key: "T", name: "Town",           cost: 1.0,  colour: ["#c98b74", "#7a4535"], cover: heavy, forage: good}

# Places on a map: kind sets the marker.
place_kinds:
  camp:      {name: "Camp"}
  objective: {name: "Objective"}
  village:   {name: "Village"}
  town:      {name: "Town"}
  landmark:  {name: "Landmark"}

# Fog of war on the travel map: how far a side's forces see the enemy's (a player online sees what
# his side sees). In km, not hexes (a map's hexes run from 0.25 to 5 km). Calibrated from period
# sources and judgment: docs/fog-of-war-research.md (the project's claude/fog-of-war-research.md).
#   km: how far a force sees a body of enemy troops on a clear day, by its own type (a mounted force
#     has its vedettes and patrols out; men on foot see from the ground, the horizon about 4.7 km).
#   weather_mass: in rain, snow or fog a body of troops is seen this many times as far as a man can
#     see to aim (weather.yaml visibility, in 2 m battle hexes): fog 250 m, rain 1.5 km.
#   dusk: sight times this; moonlit_km, night_km: sight by moonlight and on a dark night.
#   contact_km: within this, outposts and pickets find an enemy in any weather, light or cover.
#   hidden_in: an enemy force in these is seen only within contact_km.
#   air_weather: by day in these conditions, a side a map lists with aircraft up (the map's
#     sight.air) sees every enemy force on the map not hidden_in cover, however far: observers
#     flew over a whole campaign map in a few hours from 1914 (the project's
#     claude/fog-of-war-period-research.md: Tannenberg, the Marne, Normandy, Korea). In any other
#     weather, at dusk or in the dark, they are grounded or see nothing. Which conditions ground
#     aircraft is a judgment.
#   Night sights: a side a map gives a device (its sight.night, a weather.yaml night_vision
#     device) sees at dusk, by moonlight and on a dark night weather_mass times as far as the
#     device lets a man see to aim, if that is further: a thermal sight 3 km, goggles 1.5 km, a
#     Starlight scope 1 km. Field glasses are left out: by day the horizon and folds of ground,
#     not the eye, limit how far a body of troops is seen.
# Sieges (docs/travel.md, Sieges; the project's claude/siege-phase-research.md). A place's
# `fortress` gives the side holding it, its breach_days and workers, and stores (days of food for
# its garrison while invested). terms: the % that a garrison summoned to surrender accepts, when
# its answer is rolled: `before` the breach is practicable, once it is (`breach`), and `hungry`
# added if it has gone hungry. Garrisons that gave up once the breach was practicable marched out
# with the honours of war; one that refused and was stormed could by custom be sacked. The
# figures are design estimates (no source gives a rate).
# sortie_cost: days of siege work a successful sortie undoes (Burgos, 8-9 October 1812: a sortie "undid
# most of their limited progress" on the saps; 5 October: 142 Allied losses and 200 picks and shovels
# taken; Badajoz, 19 March 1812: 1,500 foot and 40 horse, about 150 British losses). repair: days of
# siege work its garrison (with tools) takes back each day the fortress is not invested (relief, or
# the besiegers gone). Design estimates.
# lines_hygiene: the hygiene of a besieging force's siege lines when it has made no camp (filth,
# crowding, latrines in the trenches); a force investing a fortress, and its garrison, count as
# camped there from the day the investment began (disease.yaml staying and crowded).
siege:
  lines_hygiene: poor
  terms: {before: 5, breach: 50, hungry: 25}
  sortie_cost: 1
  repair: 1
  # mine: for a fortress broken `by: mine` (its breach_days the mine's digging): fired, d100 at or under
  # `success` brings the wall down, else it fell short and `redig` days (the fortress's, else this) must
  # be dug again. A garrison countermining finds the gallery `countermine` % of the days it is dug,
  # and the fight underground costs `found_cost` days. Jacob's Ford 1179: the first mine's fire
  # failed, the second, dug deeper, brought the wall down; Burgos 1812: of three mines the first fell
  # short, the other two went off as meant. Countermines: listening with water in buckets or barrels,
  # counter-tunnels, fights underground (Grant at Constantinople, 1453). No source gives a rate: design
  # estimates.
  mine: {success: 50, redig: 2, countermine: 15, found_cost: 1}
  # sack_days: a storm won where the era allows a sack (data/ranks.yaml loot: sack allowed), the stormers
  # sack the place this many days unless the GM calls it off sooner: Badajoz and San Sebastian were
  # each sacked for about three days. Meanwhile they do not march, desertion and straggling are
  # doubled (events.yaml conditions: sacking), and their named men may roll the sack's loot in the
  # roller ("A town stormed: the sack"); after it, plunder is the provost's ("after the sack").
  sack_days: 3

sight:
  km: {foot: 3, mounted: 8, wagons: 2}
  weather_mass: 5
  dusk: 0.5
  moonlit_km: 0.5
  night_km: 0.2
  contact_km: 1
  hidden_in: [forest, village, town]
  air_weather: [fair, overcast]
