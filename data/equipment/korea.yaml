# Prices for the Korean War (1950-1953). Format as data/equipment/medieval.yaml.
# US prices in cents (US troops were paid in Military Payment Certificates, Series 481, swapped
# one for one with dollars); British in farthings; Korean in won. Most item prices are estimates:
# the Army supply catalogue that priced every item could not be read.
id: korea

currencies:
  usd:
    name: "Dollars and cents (Military Payment Certificates)"
    coin: usd
    base: cent
    decimal: {sym: "$", per: 100, small: "¢"}
    day: 285
    day_note: "a US private's $85.80 a month base pay (1952)"
  gbp:
    name: "Pounds, shillings and pence"
    coin: gbp
    base: farthing
    units: [{sym: "£", of: 960, pre: true}, {sym: "s", of: 48}, {sym: "d", of: 4}]
    day: 192
    day_note: "a British private's 28s a week (1948)"
  won:
    name: "South Korean won (4,000 to the dollar in 1950, 6,000 from April 1951; hwan from 1953)"
    coin: won
    base: won
    units: [{sym: " won", of: 1}]
    day: 100
    day_note: "an ROK private's 3,000 won a month (1950; secondary source)"
  yuan:
    name: "Chinese yuan (about 35,000 old yuan to the dollar)"
    coin: yuan
    base: yuan
    units: [{sym: " yuan", of: 1}]
    day_note: "no Chinese soldier's pay found"
  kpw:
    name: "North Korean won"
    coin: kpw
    base: won
    units: [{sym: " won", of: 1}]
    day_note: "no North Korean soldier's pay found"

currency: {default: usd, commonwealth: gbp, rok: won, chinese: yuan, north_korea: kpw}

sources:
  ls1951: &ls1951 "https://archive.org/stream/sim_leather-and-shoes_1951-01-20_121_3/sim_leather-and-shoes_1951-01-20_121_3_djvu.txt"
  ls1950: &ls1950 "https://archive.org/stream/sim_leather-and-shoes_1950-10-07_120_15/sim_leather-and-shoes_1950-10-07_120_15_djvu.txt"

items:
  # Arms and armour
  - {id: bar, name: "Browning automatic rifle (civilian price)", cat: weapon, price: 30000, source: {url: "https://en.wikipedia.org/wiki/M1918_Browning_Automatic_Rifle", note: "Wikipedia, 1931 Colt price"}}
  - {id: garand, name: "M1 Garand rifle", cat: weapon, price: 8500, weapon: rifle_service, regions: [us_1950, us_1952, rok], source: {url: "https://en.wikipedia.org/wiki/M1_Garand", note: "Wikipedia, WWII cost"}}
  - {id: armoured_vest, name: "Armoured vest (M1951)", cat: armour, price: 5000, kit: vietnam_army, regions: [us_1952], approx: true}
  - {id: carbine, name: "M1 or M2 carbine", cat: weapon, price: 4500, source: {url: "https://en.wikipedia.org/wiki/M1_carbine", note: "Wikipedia, WWII cost"}}
  - {id: m1911, name: "M1911A1 pistol", cat: weapon, price: 2638, weapon: pistol_smg, regions: [us_1950, us_1952], source: {url: "https://en.wikipedia.org/wiki/M1911_pistol", note: "Wikipedia, 1938 cost"}}
  - {id: helmet, name: "M1 helmet and liner", cat: armour, price: 600, kit: [ww2_rifleman, vietnam_army], regions: [us_1950, us_1952, rok], approx: true}
  - {id: knife, name: "Fighting knife", cat: weapon, price: 300, approx: true}
  - {id: grenade, name: "Fragmentation grenade", cat: weapon, price: 150, approx: true}
