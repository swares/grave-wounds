# Prices for the First World War (1914-1918). Format as data/equipment/medieval.yaml.
# British prices in farthings; American (the 1917 Sears military catalogue) in cents; German in
# pfennigs; French in centimes.
id: wwi

currencies:
  gbp:
    name: "Pounds, shillings and pence (10s and £1 Treasury notes from 1914)"
    coin: gbp
    base: farthing
    units: [{sym: "£", of: 960, pre: true}, {sym: "s", of: 48}, {sym: "d", of: 4}]
    day: 48
    day_note: "a British private's 1s a day (1914)"
  usd:
    name: "Dollars and cents"
    coin: usd
    base: cent
    decimal: {sym: "$", per: 100, small: "¢"}
    day: 100
    day_note: "a US private's $30 a month (1917-18)"
  mark:
    name: "Marks (100 pfennigs)"
    coin: mark
    base: pfennig
    decimal: {sym: "", suf: " M", per: 100, small: " Pf"}
    day: 50
    day_note: "about 50 pfennigs a day: an estimate, no source found"
  nfd:
    name: "Newfoundland dollars and cents"
    coin: nfd
    base: cent
    decimal: {sym: "$", per: 100, small: "¢"}
    day: 100
    day_note: "a Newfoundland Regiment private's $1.00 a day and his rations (The Rooms), about four times a British private's 1s"
  frf:
    name: "Francs (100 centimes)"
    coin: frf
    base: centime
    decimal: {sym: "", suf: " fr", per: 100, small: " c."}
    day: 25
    day_note: "a poilu's 5 sous a day (the usual figure; raised with a combat allowance in 1917)"
    day_approx: true

  rub:
    name: "Roubles (100 kopecks)"
    coin: rub
    base: polushka
    units: [{sym: " rub.", of: 400}, {sym: " kop.", of: 4}]
    day: 7
    day_note: "a Russian private's 6 roubles a year, about 1¾ kopecks a day (Podpryatov and Poperechnaya 2019); a farm labourer earned about 75 kopecks a day (1910). In quarter-kopecks (polushki)"
  dinar:
    name: "Dinars (100 para)"
    coin: dinar
    base: para
    decimal: {sym: "", suf: " din.", per: 100, small: " para"}
    day: 25
    day_note: "no Serbian private's pay found: the French poilu's 5 sous, the dinar at par with the franc; an unskilled worker earned about 1.2 dinars a day (1910)"
    day_approx: true
  krone:
    name: "Kronen (100 Heller)"
    coin: krone
    base: heller
    decimal: {sym: "", suf: " K", per: 100, small: " h"}
    day: 36
    day_note: "a private's 36 Heller a day in wartime (Hautmann 2008, a secondary source); an unskilled builder in Vienna earned 3.50 K a day in 1914"
  lev:
    name: "Leva (100 stotinki)"
    coin: lev
    base: stotinka
    decimal: {sym: "", suf: " lv", per: 100, small: " st."}
    day: 25
    day_note: "no Bulgarian private's pay found: the French poilu's 5 sous, the lev at par with the franc before the war (an estimate)"
    day_approx: true
currency: {default: gbp, newfoundland: nfd, us: usd, germany: mark, france: frf, russia: rub, serbia: dinar, austria_hungary: krone, bulgaria: lev}

sources:
  sears: &sears "https://www.gutenberg.org/ebooks/54213.txt.utf-8"
  gwf: &gwf "https://www.greatwarforum.org/topic/120780-price-of-loaf-of-bread-1914-18/"
  hull: &hull "https://ww1hull.com/?p=44926"
  nzef: &nzef "https://rnzaoc.com/wp-content/uploads/2018/08/instructions-regarding-care-issue-and-accounting-for-ordnance-stores-nzef-in-the-uk.pdf"

# keep - a day's food and a night's bed for a man his army does not feed (money.keep_days):
#        price rows below, `times` for a per-meal row; an army may have its own under regions.
keep:
  food: {row: club_food}
  bed: {row: club_bed}
  regions:
    us: {food: {row: us_food_day}, bed: {row: us_bed}}

items:
  # Vehicles, horses
