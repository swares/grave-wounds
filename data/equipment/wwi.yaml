  - {id: meat_at, name: "Meat, a kilo, Vienna", cat: food, in: krone, price: 222, when: "1914 (845 h in 1917)", source: {url: "https://www.geschichtewiki.wien.gv.at/Krone_(W%C3%A4hrungseinheit)/Kaufkraft", note: "Wien Geschichte Wiki, Kaufkraft"}}
  - {id: wine_at, name: "Wine, a litre, Vienna", cat: food, in: krone, price: 124, when: "1914 (900 h in 1918)", source: {url: "https://www.geschichtewiki.wien.gv.at/Krone_(W%C3%A4hrungseinheit)/Kaufkraft", note: "Wien Geschichte Wiki, Kaufkraft"}}
