  - {id: ground_sheet, name: "Polyethylene ground sheet", cat: shelter, price: 360, when: "1965", source: {url: *hh, note: "H&H Surplus catalogue"}}
  - {id: shelter_half, name: "Shelter half, surplus", cat: shelter, price: 299, when: "1965", source: {url: *hh, note: "H&H Surplus catalogue"}}
  - {id: poncho_liner, name: "Poncho and liner", cat: shelter, price: 600, approx: true}
  - {id: rolex, name: "Rolex Submariner or GMT-Master, base exchange", cat: navigation, price: [13100, 24000], when: "1969-70", source: {url: *ww, note: "Worn & Wound"}}
  - {id: seiko, name: "Seiko 6105 diver's watch, PX", cat: navigation, price: [2700, 10000], source: {url: *ww, note: "Worn & Wound: under $100, veteran's memory"}}
  - {id: compass, name: "Lensatic compass", cat: navigation, price: 600, approx: true}
  - {id: map_case, name: "Map case", cat: navigation, price: 100, approx: true}
  - {id: zippo, name: "Zippo lighter (PX)", cat: fire, price: 300, approx: true}
  - {id: matchbox, name: "Waterproof match box", cat: fire, price: 25, approx: true}
  - {id: heat_tab, name: "Heat tab (trioxane)", cat: fire, price: 5, approx: true}
  - {id: rappel_rope, name: "Nylon rappelling rope, 120 ft", cat: rope, price: 1500, approx: true}
  - {id: para_cord, name: "550 parachute cord, 100 ft", cat: rope, price: 200, approx: true}
  - {id: medic_bag, name: "Medic's aid bag, stocked", cat: first_aid, price: [1500, 3000], approx: true}
  - {id: field_dressing, name: "Field dressing", cat: first_aid, price: [15, 25], approx: true}
  - {id: syrette, name: "Morphine syrette", cat: first_aid, price: 50, approx: true}
  - {id: purification, name: "Water-purification tablets, bottle", cat: first_aid, price: [25, 50], approx: true}
  - {id: malaria_pill, name: "Weekly malaria pill", cat: first_aid, price: 5, approx: true}
  # Clothing
  - {id: whole_kit, name: "A soldier's whole kit with M16, to the Army", cat: clothing, price: 111200, source: {url: "https://www.globeatwar.com/blog-entry/wwii-vs-today-cost-equipping-gi", note: "Globe at War, citing CSBA"}}
