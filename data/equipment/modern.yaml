# Prices for the late wars (1982-2009). Format as data/equipment/medieval.yaml.
# Three anchors with their own coins: Britain 1982 (decimal pence), the US 1991-95 and the US
# 2004-09 (cents). Dollars of 1991 and of 2008 are kept apart (they are not the same money after
# inflation). Black-market prices for fighters are in 2008 dollars, with a Day of $10, the
# reported daily pay of a Taliban fighter.
id: modern

currencies:
  gbp_1982:
    name: "Pounds and new pence (1982)"
    coin: gbp_1982
    base: penny
    decimal: {sym: "£", per: 100, small: "p"}
    day: 1440
    day_note: "a British private's pay, about £14.40 a day: an estimate, no source found"
  ars_1982:
    name: "Argentine pesos (about 12,000-14,000 to the dollar, May 1982)"
    coin: ars_1982
    base: peso
    units: [{sym: " pesos", of: 1}]
    day_note: "no Argentine conscript's pay found"
  usd_1991:
    name: "Dollars and cents (1991-95)"
    coin: usd_1991
    base: cent
    decimal: {sym: "$", per: 100, small: "¢"}
    day: 2930
    day_note: "a US private first class's $878 a month base pay (1991)"
  rub_1995:
    name: "Russian rubles (about 4,000 to the dollar, 1995)"
    coin: rub_1995
    base: ruble
    units: [{sym: " rubles", of: 1}]
    day_note: "no Russian conscript's pay found"
  usd_2008:
    name: "Dollars and cents (2004-09)"
    coin: usd_2008
    base: cent
    decimal: {sym: "$", per: 100, small: "¢"}
    day: 5300
    day_note: "a US private first class's $1,588 a month base pay (2008)"
  usd_fighter:
    name: "Dollars and cents (2004-09), as a fighter is paid"
    coin: usd_2008
    base: cent
    decimal: {sym: "$", per: 100, small: "¢"}
    day: 1000
    day_note: "a Taliban fighter's reported $10 a day (2007-09)"
  gbp_2005:
    name: "Pounds and pence (2005)"
    coin: gbp_2005
    base: penny
    decimal: {sym: "£", per: 100, small: "p"}
    day_note: "no British soldier's pay found for 2005"
  iqd:
    name: "New Iraqi dinars (about 1,400 to the dollar)"
    coin: iqd
    base: dinar
    units: [{sym: " dinars", of: 1}]
    day_note: "no Iraqi pay found"
  pkr:
    name: "Pakistani rupees"
    coin: pkr
    base: rupee
    units: [{sym: " rupees", of: 1}]
    day_note: "no pay found"

currency: {default: usd_2008, uk_1982: gbp_1982, argentina_1982: ars_1982, us_1991: usd_1991, us_1993: usd_1991, russia_1995: rub_1995, chechen: rub_1995, uk_2005: gbp_2005, insurgent: usd_fighter}

sources:
  ndo: &ndo "https://archives.nd.edu/Observer/1991-01-31_v23_083.pdf"
  sp04: &sp04 "https://www.strategypage.com/htmw/htweap/articles/20041202.aspx"
  swj: &swj "https://archive.smallwarsjournal.com/node/6525"
  gao: &gao "https://www.gao.gov/assets/a96771.html"

# keep - a day's food and a night's bed for a man his army does not feed (money.keep_days):
#        price rows below, `times` for a per-meal row; an army may have its own under regions.
keep:
  food: {row: us_meals}
  bed: {row: us_lodging}
  regions:
    uk_1982: {food: {row: uk_food_1982}, bed: {row: uk_bnb_1982}}
    insurgent: {food: {row: local_food}, bed: {row: local_guesthouse}}

