# Prices for the horse-and-musket era (1775-1815). Format as data/equipment/medieval.yaml.
# British prices in farthings; American prices in cents (the Spanish dollar, then the US dollar
# from 1792); French in centimes (81 livres made 80 francs, so livres are taken as francs).
id: horse_musket

currencies:
  gbp:
    name: "Pounds, shillings and pence (guinea 21s)"
    coin: gbp
    base: farthing
    units: [{sym: "£", of: 960, pre: true}, {sym: "s", of: 48}, {sym: "d", of: 4}]
    day: 48
    day_note: "a British private's 1s a day (1812-15)"
  usd:
    name: "Dollars and cents"
    coin: usd
    base: cent
    decimal: {sym: "$", per: 100, small: "¢"}
    day: 27
    day_note: "a US private's $8 a month (1812)"
  usd_continental:
    name: "Dollars in hard money (Continental paper fell to 100 for 1 by 1780)"
    coin: usd
    base: cent
    decimal: {sym: "$", per: 100, small: "¢"}
    day: 20
    day_note: "a Continental private's $6 a month (1776)"
  frf:
    name: "Francs (100 centimes); livres before 1795"
    coin: frf
    base: centime
    decimal: {sym: "", suf: " fr", per: 100, small: " c."}
    day: 37
    day_note: "a French private's 3½d a day in English money (reported 1857); no Napoleonic scale confirmed"
    day_approx: true

currency: {default: gbp, continental: usd_continental, us_1812: usd, french: frf}

sources:
  ob: &ob "https://www.oldbaileyonline.org/static/Coinage.jsp"
  wd: &wd "https://wardepartmentpapers.org/document/41494/"
  lc26: &lc26 "https://lewis-clark.org/day-by-day/26-may-1803/"
  lc: &lc "https://lewis-clark.org/?p=39852"

# keep - a day's food and a night's bed for a man his army does not feed (money.keep_days):
#        price rows below, `times` for a per-meal row; an army may have its own under regions.
keep:
  food: {row: soldier_diet}
  bed: {row: shared_bed}
  regions:
    continental: {food: {row: us_board_day}, bed: {row: us_tavern_bed}}
    us_1812: {food: {row: us_board_day}, bed: {row: us_tavern_bed}}

items:
  # Arms
  - {id: rifle_1776, name: "Rifle bought by the British Army", cat: weapon, price: 3024, when: "1776", weapon: rifle_flintlock, regions: [british_rev], source: {url: "https://95th-rifles.co.uk/equipment/baker-rifle", note: "3 guineas"}}
  - {id: pennsylvania_rifle, name: "Pennsylvania rifle", cat: weapon, price: [2880, 4800], weapon: rifle_flintlock, regions: [continental, us_1812], approx: true}
  - {id: baker_rifle, name: "Baker rifle", cat: weapon, price: 1728, when: "1800", weapon: rifle_flintlock, regions: [british_pen], source: {url: "https://95th-rifles.co.uk/equipment/baker-rifle", note: "95th Rifles"}}
  - {id: brown_bess, name: "Brown Bess musket", cat: weapon, price: 884, when: "1795-1815", weapon: musket_smoothbore, regions: [british_rev, british_pen], source: {url: "https://www.martellotowers.co.uk/assets/fileman/Uploads/Documents/Brown_Bess_Musket.pdf", note: "Ordnance average"}}
  - {id: us_musket, name: "US musket", cat: weapon, in: usd, price: 1233, when: "1796", weapon: musket_smoothbore, regions: [continental, us_1812], source: {url: "https://wardepartmentpapers.org/document/52709/", note: "War Department"}}
  - {id: charleville, name: "Charleville musket", cat: weapon, in: frf, price: [1500, 2000], weapon: musket_smoothbore, regions: [french], approx: true}
