# Prices for the medieval era (c.1250-1500), anchored on England c.1415-1461 (Agincourt,
# Towton). Read by gravewounds/money.py; the team builder prices each character's issued kit
# and gives him a purse from these.
#
# currencies - each army's coin. Prices are whole numbers of the coin's smallest unit (`base`):
#              units (largest first, `of` = how many base units) or a decimal coin. `day` is a
#              common soldier's day's pay in base units (none where no pay figure is known);
#              `coin` groups coins that are the same money. `day_approx`: the Day is a stand-in
#              (another year's scale, a labourer's wage; the project doc "coin-days-research").
# currency   - which coin each army (region) was paid in; default for any not listed.
# items      - id, name, cat (category), price (base units, or [low, high]), in (a coin other
#              than the default), per (the unit: lb, yard), when (the year or years), kit / weapon
#              (the armor.yaml kits or weapons.yaml weapons the row prices: a kit or weapon may
#              be several rows), regions (only these armies), source {url, note}, approx: true
#              (no source found: an estimate).
# The prices, their sources and the gaps are set out in the project doc "Grave Wounds: money
# and price lists by period book".
id: medieval

currencies:
  gbp:
    name: "English pounds, shillings and pence"
    coin: gbp
    base: farthing
    units: [{sym: "£", of: 960, pre: true}, {sym: "s", of: 48}, {sym: "d", of: 4}]
    day: 24
    day_note: "an archer's 6d a day (1415)"
  livre_t:
    name: "French livres tournois (20 sous, 240 deniers)"
    coin: livre_t
    base: denier
    units: [{sym: " l.", of: 240}, {sym: " s.", of: 12}, {sym: " d.", of: 1}]
    day: 32
    day_note: "an archer's 48 livres a year (the 1434 scale, near enough to 1415)"
    day_approx: true
  bezant:
    name: "Saracen bezants of Acre (24 quarrobles)"
    coin: bezant
    base: quarroble
    units: [{sym: " bezants", of: 24}, {sym: " q.", of: 1}]
    day: 8
    day_note: "a crossbowman at Acre, about 10½ bezants a month (1266)"
  gotland:
    name: "Gotland marks (8 öre, 24 örtugar, 288 penningar)"
    coin: gotland
    base: penning
    units: [{sym: " marks", of: 288}, {sym: " örtugar", of: 12}, {sym: " pen.", of: 1}]
    day: 36
    day_note: "a labourer's 1 öre a day at Nyköping (1365), standing in for a soldier's"
    day_approx: true

  libra_pt:
    name: "Portuguese libras (20 soldos, 240 dinheiros), in the money of 1380"
    coin: libra_pt
    base: dinheiro
    units: [{sym: " libras", of: 240}, {sym: " soldos", of: 12}, {sym: " d.", of: 1}]
    day: 240
    day_note: "a blacksmith's 20 soldos a day (1380), standing in for a soldier's: no Portuguese pay for 1383-85 was found. The libra lost two-thirds of its silver in 1384-85 (66 to the mark in 1385, 22 in 1380): prices from other years are turned into 1380 money by the mark"
    day_approx: true
  maravedi:
    name: "Castilian maravedís of the old money (10 dineros)"
    coin: maravedi
    base: dinero
    units: [{sym: " mrs", of: 10}, {sym: " d.", of: 1}]
    day: 13
    day_note: "a crossbowman's 13 dineros a day (Cortes of Burgos, 1338; a lancer 1 maravedí), the nearest found to 1385"
    day_approx: true

  gulden_ch:
    name: "Swiss gulden (Bern, 1492: 15 Batzen, 60 Kreuzer, 2 Pfund, 480 Pfennig)"
    coin: gulden_ch
    base: pfennig
    units: [{sym: " gl.", of: 480}, {sym: " bz.", of: 32}, {sym: " kr.", of: 8}, {sym: " pf.", of: 1}]
    day: 80
    day_note: "a Swiss foot soldier's 5 Rhenish gulden a month in papal service (1485), the gulden taken as the Swiss one: no Swiss pay for 1499 was found"
    day_approx: true
  rh_gulden:
    name: "Rhenish gulden (60 Kreuzer)"
    coin: rh_gulden
    base: kreuzer
    units: [{sym: " fl.", of: 60}, {sym: " kr.", of: 1}]
    day: 8
    day_note: "a Landsknecht's 4 gulden a month (the German standard from the late 15th century), often late or partial"

currency: {default: gbp, france: livre_t, latin_east: bezant, baltic: gotland, portugal: libra_pt, castile: maravedi, swiss: gulden_ch, landsknecht: rh_gulden}

sources:
  rogers: &rogers "https://archive.org/details/historyofagricul04rogeuoft"
  ucdavis: &ucdavis "http://medieval.ucdavis.edu/120D/Money.html"
  howard: &howard "https://www.tota.world/article/2137/"
  vch: &vch "https://prod.british-history.ac.uk/node/15304"
  bvm: &bvm "https://bowvsmusket.com/2015/07/01/16th-century-prices-of-weapons/"
  lum: &lum "https://luminarium.org/medlit/medprice.htm"
  mseffie: &mseffie "https://mseffie.com/assignments/canterbury_tales/medieval_prices.html"

# keep - a day's food and a night's bed for a man his army does not feed (money.keep_days):
#        price rows below, `times` for a per-meal row; an army may have its own under regions.
keep:
  food: {row: food_day}
  bed: {row: inn_bed}

