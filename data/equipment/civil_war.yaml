  - {id: springfield, name: "Springfield 1861 rifle-musket (to make)", cat: weapon, price: 1493, when: "1861", weapon: rifle_musket, regions: [union, frontier], source: {url: "https://historynet.com/61-springfield-rifle-musket/", note: "HistoryNet"}}
