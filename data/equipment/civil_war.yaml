# Prices for the Civil War and frontier (1861-1867). Format as data/equipment/medieval.yaml.
# Prices in cents. Union prices are in greenbacks; Confederate prices are in Confederate dollars,
# which inflated a hundredfold by 1865, so they have no Day.
id: civil_war

currencies:
  usd:
    name: "Dollars and cents (greenbacks)"
    coin: usd
    base: cent
    decimal: {sym: "$", per: 100, small: "¢"}
    day: 43
    day_note: "a Union private's $13 a month (1861-64)"
  csd:
    name: "Confederate dollars"
    coin: csd
    base: cent
    decimal: {sym: "$", suf: " CS", per: 100, small: "¢ CS"}
    day: 37
    day_note: "a Confederate private's $11 a month (1861; $18 from June 1864), worth a cent a day in gold by 1865"

currency: {default: usd, confederacy: csd}

sources:
  qm: &qm "https://homepages.rootsweb.com/~27thiowa/companyK/priceListForClothing.htm"
  ecwc: &ecwc "https://essentialcivilwarcurriculum.com/soldiers-pay.html"
  cwm: &cwm "https://www.civilwarmonitor.com/article/the-army-horse/"
  sh: &sh "https://archives.sharlothallmuseum.org/articles/days-past-articles/1/sutler-store-records-tell-only-little-of-life-back-then"
  fosc: &fosc "https://www.nps.gov/fosc/learn/education/sutler9.htm"

# keep - a day's food and a night's bed for a man his army does not feed (money.keep_days):
#        price rows below, `times` for a per-meal row; an army may have its own under regions.
keep:
  food: {row: board_day}
  bed: {row: cheap_bed}
  regions:
    frontier: {food: {row: frontier_board}, bed: {row: frontier_bed}}

items:
  # Arms
  - {id: henry_private, name: "Henry rifle, bought privately", cat: weapon, price: 6500, when: "c.1863", source: {url: "https://en.wikipedia.org/wiki/Henry_rifle", note: "Wikipedia"}}
  - {id: spencer_rifle, name: "Spencer rifle", cat: weapon, price: 4000, when: "1861", source: {url: "https://en.wikipedia.org/wiki/Spencer_repeating_rifle", note: "Wikipedia"}}
  - {id: sharps_carbine, name: "Sharps carbine", cat: weapon, price: 2700, when: "1861-66", weapon: breechloader, source: {url: "https://www.civilwarmonitor.com/?p=14075", note: "Civil War Monitor, from contract totals"}}
  - {id: colt, name: "Colt revolver", cat: weapon, price: 2500, when: "1861", weapon: revolver, source: {url: "https://authentic-campaigner.com/forum/military-forums/the-sinks/14682-cost-of-colt-revolver-1862-1865", note: "forum, citing a contract list"}}
  - {id: spencer_carbine, name: "Spencer carbine", cat: weapon, price: 2500, when: "1863", source: {url: "https://www.americanrifleman.org/articles/2013/7/23/excels-all-others-the-spencer-carbine/", note: "American Rifleman"}}
  - {id: enfield, name: "Enfield rifle-musket", cat: weapon, price: 2000, when: "1861", weapon: rifle_musket, regions: [confederacy], source: {url: "https://en.wikipedia.org/wiki/Pattern_1853_Enfield", note: "Wikipedia"}}
