# Prices for the Second World War (1939-1945). Format as data/equipment/medieval.yaml.
# US prices in cents, most from the Quartermaster price list AR 30-3000 of 16 October 1944
# (average costs to the Army, used to charge a soldier for lost kit; page numbers are the scan's).
# British prices in farthings; German in pfennigs (German weapon prices given in dollars are
# converted at the official 2.50 Reichsmarks to the dollar); Japanese in sen; Allied Military
# lire whole.
id: wwii

currencies:
  usd:
    name: "Dollars and cents"
    coin: usd
    base: cent
    decimal: {sym: "$", per: 100, small: "¢"}
    day: 167
    day_note: "a US private's $50 a month (from June 1942)"
  gbp:
    name: "Pounds, shillings and pence ($4.03 to the pound)"
    coin: gbp
    base: farthing
    units: [{sym: "£", of: 960, pre: true}, {sym: "s", of: 48}, {sym: "d", of: 4}]
    day: 144
    day_note: "a British private's 3s a day (May 1944)"
  reichsmark:
    name: "Reichsmarks (100 pfennigs)"
    coin: reichsmark
    base: pfennig
    decimal: {sym: "", suf: " RM", per: 100, small: " Pf"}
    day: 100
    day_note: "a German Soldat's 30 RM a month (Wehrsold)"
  yen:
    name: "Yen (100 sen)"
    coin: yen
    base: sen
    decimal: {sym: "¥", per: 100, small: " sen"}
    day: 25
    day_note: "a Japanese private's 6-9 yen a month"
  am_lire:
    name: "Allied Military lire (100 to the dollar)"
    coin: am_lire
    base: lira
    units: [{sym: " lire", of: 1}]
    day_note: "no Day: paid out by the Allies"
  lira:
    name: "Lire (100 centesimi)"
    coin: lira
    base: centesimo
    decimal: {sym: "", suf: " lire", per: 100, small: " cent."}
    day: 96
    day_note: "an Italian private's $1.51 a month (US Intelligence Bulletin, December 1942) at 5.26 US cents to the lira: about 0.96 lira a day, our arithmetic; any war or overseas supplement not found"
    day_approx: true
  rub:
    name: "Rubles (100 kopecks)"
    coin: rub
    base: kopeck
    decimal: {sym: "", suf: " rub.", per: 100, small: " kop."}
    day: 57
    day_note: "a Red Army private's 17 rubles a month in wartime (about a ruble a day with allowances)"

currency: {default: usd, commonwealth: gbp, germany: reichsmark, italy: lira, japan: yen, soviet: rub}

sources:
  ar: &ar "https://www.usww2uniforms.com/bib_AR30-3000_16oct44.html"
  who: &who "https://www.warhistoryonline.com/featured/rough-guide-costs-of-wwii_guns.html"
  ecu: &ecu "https://digital.lib.ecu.edu/pearlharbor/secondwave/rown/"

# keep - a day's food and a night's bed for a man his army does not feed (money.keep_days):
#        price rows below, `times` for a per-meal row; an army may have its own under regions.
keep:
  food: {row: us_food_day}
  bed: {row: service_bed}
  regions:
    commonwealth: {food: {row: british_restaurant, times: 3}, bed: {row: uk_bed}}

