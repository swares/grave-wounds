# Character generation for the later wars, the Falklands to Afghanistan (1982-2014): the team
# builder (dist/team.html, python3 -m gravewounds team --era modern). Made exactly as the
# medieval era's (see medieval.yaml for the five steps); only the tables differ. Each region
# takes its war's wound table. The Falklands armies and the Russians in Chechnya wear a steel
# helmet only; the Americans of 1991 the PASGT vest, the Rangers of 1993 the Ranger Body Armor;
# the Americans and British of 2003-14 plate armour (the British Osprey is drawn as the
# Interceptor, its American match); the Chechens and the insurgents no armour. RPGs are fought
# with Grenade, missiles, mortars and vehicle guns with Gunnery.
# Women (docs/team.md): a share is the women among that army's soldiers in the year the source
# gives, and is rolled only for the careers open to them then (ground close combat opened to
# women in the US in 2016 and in Britain in 2016-18, after this era's wars).
# All of it is written for this game: the tables, events and names are ours (names are common
# names, plain fact).
id: modern
name: "The Falklands to Afghanistan (1982-2014)"

characteristics:
  - {id: str, name: Strength}
  - {id: agi, name: Agility}
  - {id: end, name: Endurance}
  - {id: wits, name: Wits}
  - {id: nerve, name: Nerve}
  - {id: pres, name: Presence}
array: [70, 60, 55, 50, 45, 35]
stat_range: [15, 95]
age: {start: 18, per_term: 1}

skill_max: 90
first_term: 15
term_main: 10
term_second: 5
gain: 15
skills:
  - {id: rifle, name: Rifle, of: agi, div: 2, combat: true}
  - {id: pistol, name: Pistol, of: agi, div: 2, combat: true}
  - {id: mg, name: Machine gun, of: wits, div: 2, combat: true}
  - {id: grenade, name: Grenade and rocket, of: str, div: 2, combat: true}
  - {id: gunnery, name: Gunnery, of: wits, div: 2, combat: true}
  - {id: bayonet, name: Bayonet, of: str, div: 2, combat: true}
  - {id: trench, name: Close combat, of: str, div: 2, combat: true}
  - {id: brawl, name: Brawl, of: str, div: 2, combat: true}
  - {id: parry, name: Parry, of: agi, div: 2, combat: true}
  - {id: dodge, name: Dodge, of: agi, div: 3, combat: true}
  - {id: fieldcraft, name: Fieldcraft, of: wits, div: 3}
  - {id: watch, name: Watch, of: wits, div: 2}
  - {id: stealth, name: Stealth, of: agi, div: 3}
  - {id: leechcraft, name: Leechcraft, of: wits, div: 4}
  - {id: craft, name: Craft, of: wits, div: 3}
  - {id: signals, name: Signals, of: wits, div: 3}
  - {id: drive, name: Drive, of: agi, div: 3}
  - {id: letters, name: Letters, of: wits, div: 5}
  - {id: persuade, name: Persuade, of: pres, div: 2}
  - {id: command, name: Command, of: pres, div: 3}

weapon_skill:
  rifle_assault: rifle
  rifle_ap: rifle
  pistol_smg: pistol
  machine_gun: mg
  hand_grenade: grenade
  rpg: grenade
  atgm: gunnery
  mortar_artillery: gunnery
  explosive_fragment: gunnery
  bayonet: bayonet
  dagger: trench
  punch: brawl
  kick: brawl
  elbow_knee: brawl
defence: [parry, dodge]

