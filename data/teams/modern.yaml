careers:
  - id: rifleman
    name: "Rifleman"
    main: rifle
    second: grenade
    prefers: [end, agi, nerve, str, wits, pres]
    wound: 25
    wound_weapon: rifle_assault
    kit: &kit {default: ww2_rifleman, us_1991: pasgt, us_1993: ranger_1993, chechen: none, us_2005: interceptor, uk_2005: interceptor, insurgent: none, peshmerga_2003: none}
    weapon: {default: rifle_assault}
    terms:
      - {to: 20, skill: watch, text: "Stood sentry on a wall through a long night."}
      - {to: 40, skill: fieldcraft, text: "Patrolled on foot through villages and fields."}
      - {to: 55, skill: dodge, text: "Went to ground as a burst cracked overhead."}
      - {to: 70, skill: stealth, text: "Moved into an overwatch position before dawn."}
      - {to: 85, skill: grenade, text: "Cleared rooms in a street fight.", wound: true}
      - {to: 100, skill: rifle, text: "Held a position through a long firefight.", wound: true}
  - id: machine_gunner
    name: "Machine gunner"
    main: mg
    second: craft
    prefers: [wits, end, str, nerve, agi, pres]
    wound: 25
    wound_weapon: rifle_assault
    kit: *kit
    weapon: {default: machine_gun}
    terms:
      - {to: 20, skill: craft, text: "Kept the gun running in dust or mud."}
      - {to: 40, skill: fieldcraft, text: "Carried the gun and its belts on a long march."}
      - {to: 55, skill: watch, text: "Covered a road from a rooftop."}
      - {to: 70, skill: dodge, text: "Moved the gun as rounds found its position.", wound: true}
      - {to: 85, skill: stealth, text: "Sited the gun to cover the team's move."}
      - {to: 100, skill: mg, text: "Kept an enemy position down while the assault went in.", wound: true}
  - id: grenadier
    name: "Grenadier or anti-tank gunner"
    main: grenade
    second: rifle
    prefers: [str, agi, nerve, end, wits, pres]
    wound: 30
    wound_weapon: mortar_artillery
    kit: *kit
    weapon: {default: rifle_assault, chechen: rpg, insurgent: rpg}
    terms:
      - {to: 20, skill: craft, text: "Trained on the grenade launcher and the rocket launcher."}
      - {to: 40, skill: stealth, text: "Crept forward to a firing point."}
      - {to: 55, skill: fieldcraft, text: "Carried the rockets on a night march."}
      - {to: 70, skill: dodge, text: "Was caught in the open by return fire.", wound: true}
      - {to: 85, skill: grenade, text: "Knocked out a bunker or a vehicle.", wound: true}
      - {to: 100, skill: trench, text: "Fought hand to hand in a trench or a room."}
  - id: marksman
