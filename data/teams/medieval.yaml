      - {to: 40, skill: leechcraft, text: "Kept the infirmary of a religious house."}
      - {to: 55, skill: command, text: "Kept the accounts of a garrison."}
      - {to: 70, skill: watch, text: "Took down the testimony of witnesses."}
      - {to: 85, skill: ride, text: "Travelled as an envoy."}
      - {to: 100, skill: fieldcraft, text: "Went on pilgrimage on foot.", wound: true}
  - id: barber_surgeon
    name: "Barber-surgeon"
    main: leechcraft
    second: craft
    prefers: [wits, agi, nerve, end, pres, str]
    wound: 5
    wound_weapon: dagger
    kit: {default: none, england: jack_sallet}
    weapon: {default: dagger}
    terms:
      - {to: 20, skill: craft, text: "Pulled teeth and let blood in a market town."}
      - {to: 40, skill: letters, text: "Studied an anatomy with a master."}
      - {to: 55, skill: watch, text: "Worked through a pestilence."}
      - {to: 70, skill: persuade, text: "Was paid by a captain to follow the army."}
      - {to: 85, skill: leechcraft, text: "Cut arrows out of men after a battle."}
