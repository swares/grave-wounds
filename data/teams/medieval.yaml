      - {to: 55, skill: ride, text: "Travelled the fairs with a pack train."}
      - {to: 70, skill: command, text: "Hired and paid guards for a caravan."}
      - {to: 85, skill: watch, text: "Was cheated once and learned from it."}
      - {to: 100, skill: blade, text: "Fought off robbers on the road.", wound: true}

# Old wounds: d100 up to `to`: a healed mark, or a lasting hurt (lasting: points off the
# characteristic its location's zone names).
old_wound:
  - {to: 70, kind: mark, text: "a healed scar"}
  - {to: 100, kind: lasting, text: "a lasting hurt"}
lasting: 5
lasting_from: {head: wits, face: pres, arms: str, legs: agi, torso: end}

# Team templates: a team of four to six. Each slot: a career and terms (the first slot leads).
templates:
  - id: retinue
    name: "A lord's retinue"
    slots: [[man_at_arms, 3], [archer, 2], [archer, 1], [spearman, 1], [barber_surgeon, 1], [servant, 1]]
  - id: free_company
    name: "A free company"
    slots: [[mercenary, 3], [mercenary, 2], [crossbowman, 2], [archer, 1], [spearman, 1]]
  - id: garrison
    name: "A garrison patrol"
    slots: [[mounted_sergeant, 3], [crossbowman, 2], [crossbowman, 1], [spearman, 1], [clerk, 1]]
  - id: muster
    name: "A farmers' muster"
    slots: [[spearman, 3], [spearman, 1], [spearman, 1], [archer, 1], [forester, 1]]
  - id: escort
    name: "A pilgrims' escort"
    slots: [[man_at_arms, 3], [mounted_sergeant, 2], [crossbowman, 1], [clerk, 1], [barber_surgeon, 1]]
  - id: traders
    name: "A merchant's company"
    slots: [[merchant, 3], [sailor, 2], [crossbowman, 1], [servant, 1]]
