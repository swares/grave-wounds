# Character generation for the First World War (1914-1918): the team builder (dist/team.html,
# python3 -m gravewounds team --era wwi). Made exactly as the medieval era's (see medieval.yaml
# for the five steps); only the tables differ. Every region takes the First World War wound
# table. Steel helmets came into general use in 1915-16, so everyone wears one; a raid's
# clubs, knives and entrenching tools are fought with Trench weapons, the Mills bomb and the
# stick grenade with Bombing.
# All of it is written for this game: the tables, events and names are ours (names are common
# period names, plain fact).
id: wwi
name: "First World War (1914-1918)"

characteristics:
  - {id: str, name: Strength}
  - {id: agi, name: Agility}
  - {id: end, name: Endurance}
  - {id: wits, name: Wits}
  - {id: nerve, name: Nerve}
  - {id: pres, name: Presence}
array: [70, 60, 55, 50, 45, 35]
stat_range: [15, 95]
age: {start: 18, per_term: 1}

skill_max: 90
first_term: 15
term_main: 10
term_second: 5
gain: 15
skills:
  - {id: rifle, name: Rifle, of: agi, div: 2, combat: true}
  - {id: pistol, name: Pistol, of: agi, div: 2, combat: true}
  - {id: mg, name: Machine gun, of: wits, div: 2, combat: true}
  - {id: grenade, name: Bombing, of: str, div: 2, combat: true}
  - {id: gunnery, name: Gunnery, of: wits, div: 2, combat: true}
  - {id: bayonet, name: Bayonet, of: str, div: 2, combat: true}
  - {id: trench, name: Trench weapons, of: str, div: 2, combat: true}
  - {id: brawl, name: Brawl, of: str, div: 2, combat: true}
  - {id: parry, name: Parry, of: agi, div: 2, combat: true}
  - {id: dodge, name: Dodge, of: agi, div: 3, combat: true}
  - {id: fieldcraft, name: Fieldcraft, of: wits, div: 3}
  - {id: watch, name: Watch, of: wits, div: 2}
  - {id: stealth, name: Stealth, of: agi, div: 3}
  - {id: leechcraft, name: Leechcraft, of: wits, div: 4}
  - {id: craft, name: Craft, of: wits, div: 3}
  - {id: signals, name: Signals, of: wits, div: 3}
  - {id: letters, name: Letters, of: wits, div: 5}
  - {id: persuade, name: Persuade, of: pres, div: 2}
  - {id: command, name: Command, of: pres, div: 3}

weapon_skill:
  rifle_service: rifle
  pistol_smg: pistol
  machine_gun: mg
  hand_grenade: grenade
  mortar_artillery: gunnery
  bayonet: bayonet
  entrenching_tool: trench
  dagger: trench
  spiked_club: trench
  axe: trench
  punch: brawl
  kick: brawl
  elbow_knee: brawl
defence: [parry, dodge]

