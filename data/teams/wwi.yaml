      names: [Maria, Anna, Olga, Yekaterina, Yelena, Natalya, Tatyana, Vera, Nadezhda, Aleksandra, Praskovya, Yevdokia]
      bynames: [Ivanova, Smirnova, Kuznetsova, Popova, Vasilieva, Petrova, Sokolova, Mikhailova, Fyodorova, Morozova, Volkova, Shevchenko]
      closed: "Before 1917 a woman served in the ranks only by the Tsar's leave (Bochkareva) or disguised; the women's battalions of 1917 had riflemen, machine gunners, signallers and their own NCOs and officers."
      source: "Stoff, Women's mobilization for war (Russian Empire), 1914-1918-online: about 5,000 women in the units of 1917, 1,500 in the 1st Petrograd battalion, some 300 of Bochkareva's left after training, who reached the third German line at Smorgon on 9 July 1917; over 31,000 Sisters of Mercy nursed in the war. No share of all soldiers."
