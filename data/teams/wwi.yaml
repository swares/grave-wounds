      names: [Mary, Florence, Edith, Elsie, Dorothy, Annie, Ethel, Gladys, Alice, Winifred]
      closed: "British women served as nurses and auxiliaries, not in the fighting careers."
      source: "Nurses who died in WWI (Wikipedia): under 300 QAIMNS nurses in 1914, over 10,000 by 1918, about 150 British nurses killed; National Army Museum, QMAAC: about 50,000 auxiliaries, 81 killed, 9 at Abbeville on 29-30 May 1918."
