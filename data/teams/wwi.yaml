  - id: russia
    name: "Imperial Russia (1914-1917)"
    short: "Russian"
    table: wwi-1914-18-wounds
    colours: ["#6f6a4e", "#5f5b42", "#8a6a3a", "#e6e0d2"]
    names: [Ivan, Vasily, Pyotr, Nikolai, Fyodor, Mikhail, Aleksei, Grigory, Semyon, Stepan, Yegor, Andrei, Pavel, Dmitry, Timofei, Mykola]
    bynames: [Ivanov, Smirnov, Kuznetsov, Popov, Vasiliev, Petrov, Sokolov, Mikhailov, Fyodorov, Morozov, Volkov, Shevchenko]
    women:
      share: null
      careers: [rifleman, machine_gunner, signaller, nco, officer, nurse]
