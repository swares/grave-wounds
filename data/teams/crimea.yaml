careers:
  - id: line
    name: "Line infantryman"
    main: musket
    second: bayonet
    prefers: [end, agi, nerve, str, wits, pres]
    wound: 20
    wound_weapon: rifle_musket
    kit: {default: none}
    weapon: {default: rifle_musket, russian: musket_smoothbore}
    terms:
      - {to: 20, skill: watch, text: "Stood in the trenches through a winter night."}
      - {to: 40, skill: fieldcraft, text: "Lived through the winter on the heights with no proper shelter."}
      - {to: 55, skill: craft, text: "Dug and revetted a parallel under fire."}
      - {to: 70, skill: dodge, text: "Lay in a trench under a bombardment."}
      - {to: 85, skill: bayonet, text: "Fought hand to hand in fog and brushwood.", wound: true}
      - {to: 100, skill: musket, text: "Held a line of works against a night attack.", wound: true}
  - id: rifleman
    name: "Rifleman, chasseur or Zouave"
    main: musket
    second: stealth
    prefers: [agi, wits, end, nerve, str, pres]
    wound: 20
    wound_weapon: rifle_musket
    kit: {default: none}
    weapon: {default: rifle_musket}
    terms:
      - {to: 20, skill: watch, text: "Lay out in a rifle pit, watching the enemy's embrasures."}
      - {to: 40, skill: fieldcraft, text: "Skirmished ahead of a column across broken ground."}
      - {to: 55, skill: stealth, text: "Crept out at night to take an enemy rifle pit."}
      - {to: 70, skill: dodge, text: "Ran from cover to cover across open ground under fire."}
      - {to: 85, skill: bayonet, text: "Went into an enemy work at the run.", wound: true}
      - {to: 100, skill: musket, text: "Picked off the gunners at an embrasure all day.", wound: true}
  - id: trooper
    name: "Light cavalryman (hussar, lancer, Cossack)"
    main: blade
    second: ride
    prefers: [agi, end, nerve, str, wits, pres]
    wound: 20
    wound_weapon: saber
    kit: {default: none}
    weapon: {default: saber}
    mounted: true
    terms:
      - {to: 20, skill: fieldcraft, text: "Foraged for the horses through a hard winter."}
      - {to: 40, skill: watch, text: "Rode outpost duty along a valley."}
      - {to: 55, skill: ride, text: "Kept his horse alive on half rations."}
      - {to: 70, skill: parry, text: "Fought a skirmish with enemy horse.", wound: true}
      - {to: 85, skill: stealth, text: "Scouted an enemy camp at night."}
      - {to: 100, skill: blade, text: "Rode in a charge against guns and cavalry.", wound: true}
  - id: gunner
    name: "Artilleryman"
    main: gunnery
    second: craft
    prefers: [wits, str, end, nerve, agi, pres]
    wound: 20
    wound_weapon: artillery_smoothbore
    kit: {default: none}
    weapon: {default: artillery_smoothbore}
    terms:
      - {to: 20, skill: craft, text: "Rebuilt a battery's parapet by night."}
      - {to: 40, skill: letters, text: "Kept the battery's range book."}
      - {to: 55, skill: ride, text: "Drove a gun team through deep mud."}
      - {to: 70, skill: watch, text: "Spotted the fall of shot from the parapet."}
      - {to: 85, skill: brawl, text: "Defended the guns hand to hand.", wound: true}
      - {to: 100, skill: gunnery, text: "Fought his gun through a day-long bombardment.", wound: true}
  - id: sailor
    name: "Sailor serving guns ashore"
    main: gunnery
    second: seamanship
    prefers: [agi, str, end, nerve, wits, pres]
    wound: 20
    wound_weapon: artillery_smoothbore
    kit: {default: none}
    weapon: {default: artillery_smoothbore}
    terms:
      - {to: 20, skill: craft, text: "Hauled a ship's gun up to the heights with tackle."}
      - {to: 40, skill: seamanship, text: "Rode out a storm at anchor."}
      - {to: 55, skill: watch, text: "Kept lookout from a battery for enemy mortar shells."}
      - {to: 70, skill: brawl, text: "Fought a sortie off in the dark.", wound: true}
      - {to: 85, skill: musket, text: "Stood in the works with a borrowed musket."}
      - {to: 100, skill: gunnery, text: "Served a heavy gun until it burst or was dismounted.", wound: true}
  - id: sapper
    name: "Sapper or miner"
    main: craft
    second: musket
    prefers: [end, str, wits, nerve, agi, pres]
    wound: 20
    wound_weapon: rifle_musket
    kit: {default: none}
    weapon: {default: rifle_musket, russian: musket_smoothbore}
    terms:
      - {to: 20, skill: letters, text: "Laid out a new parallel by compass and tape at night."}
      - {to: 40, skill: craft, text: "Made gabions and fascines by the hundred."}
      - {to: 55, skill: watch, text: "Listened underground for the enemy's miners."}
      - {to: 70, skill: stealth, text: "Pushed a sap forward under a covering party."}
      - {to: 85, skill: brawl, text: "Broke into an enemy gallery and fought in the dark.", wound: true}
      - {to: 100, skill: craft, text: "Laid and fired a mine under an enemy work.", wound: true}
  - id: sergeant
    name: "Sergeant or corporal"
    main: command
    second: musket
    prefers: [pres, nerve, end, str, agi, wits]
    wound: 20
    wound_weapon: rifle_musket
    kit: {default: none}
    weapon: {default: rifle_musket, russian: musket_smoothbore}
    terms:
      - {to: 20, skill: letters, text: "Kept the company's rolls through a sickly winter."}
      - {to: 40, skill: persuade, text: "Kept his men at work in the trenches."}
      - {to: 55, skill: bayonet, text: "Drilled a draft of new recruits."}
      - {to: 70, skill: watch, text: "Set the sentries in an advanced trench."}
      - {to: 85, skill: parry, text: "Carried the colours when the bearer fell.", wound: true}
      - {to: 100, skill: musket, text: "Kept the line steady under a storm of grape.", wound: true}
  - id: officer
    name: "Officer"
    main: command
    second: pistol
    prefers: [pres, nerve, wits, agi, end, str]
    wound: 25
    wound_weapon: rifle_musket
    kit: {default: none}
    weapon: {default: revolver}
    terms:
      - {to: 20, skill: letters, text: "Wrote the regiment's returns."}
      - {to: 40, skill: ride, text: "Carried orders along the lines."}
      - {to: 55, skill: blade, text: "Led a sortie, sword in hand.", wound: true}
      - {to: 70, skill: persuade, text: "Begged stores for his men from the commissariat."}
      - {to: 85, skill: pistol, text: "Fought at the head of his men in an enemy work."}
      - {to: 100, skill: command, text: "Took command of the trenches when his senior fell.", wound: true}
  - id: surgeon
    name: "Surgeon or orderly"
    main: leechcraft
    second: craft
    prefers: [wits, agi, nerve, end, pres, str]
    wound: 5
    wound_weapon: rifle_musket
    kit: {default: none}
    weapon: {default: revolver}
    terms:
      - {to: 20, skill: craft, text: "Operated by lamplight in a hut hospital."}
      - {to: 40, skill: letters, text: "Kept the regiment's sick book through the cholera."}
      - {to: 55, skill: leechcraft, text: "Nursed a camp through fever and scurvy."}
      - {to: 70, skill: ride, text: "Brought the sick down to the harbour in carts."}
      - {to: 85, skill: persuade, text: "Begged chloroform from another regiment."}
      - {to: 100, skill: watch, text: "Dressed wounds in the trenches under fire.", wound: true}
  - id: cantiniere
    name: "Cantinière or canteen-keeper"
    main: persuade
    second: leechcraft
    prefers: [pres, end, nerve, wits, agi, str]
    wound: 10
    wound_weapon: rifle_musket
    kit: {default: none}
    weapon: {default: dagger}
    terms:
      - {to: 20, skill: craft, text: "Kept the canteen going through a winter in the camps."}
      - {to: 40, skill: letters, text: "Kept accounts of what the soldiers owed."}
      - {to: 55, skill: ride, text: "Drove the canteen cart up from the harbour."}
      - {to: 70, skill: fieldcraft, text: "Found food and drink where there was none."}
      - {to: 85, skill: leechcraft, text: "Tended the wounded after an assault."}
      - {to: 100, skill: dodge, text: "Carried drink to the men in the front line under fire.", wound: true}
  - id: nurse
    name: "Nurse at Scutari or Balaklava"
    main: leechcraft
    second: letters
    prefers: [wits, end, nerve, pres, agi, str]
    wound: 3
    wound_weapon: rifle_musket
    kit: {default: none}
    weapon: {default: punch}
    terms:
      - {to: 20, skill: craft, text: "Scrubbed a ward and boiled its linen."}
      - {to: 40, skill: letters, text: "Wrote letters home for the dying."}
      - {to: 55, skill: leechcraft, text: "Nursed a ward through the cholera."}
      - {to: 70, skill: persuade, text: "Got stores out of the purveyor against the regulations."}
      - {to: 85, skill: watch, text: "Walked the wards by lamplight."}
      - {to: 100, skill: leechcraft, text: "Nursed in the huts at Balaklava within range of the siege.", wound: true}

old_wound:
  - {to: 70, kind: mark, text: "a healed scar"}
  - {to: 100, kind: lasting, text: "a lasting hurt"}
lasting: 5
lasting_from: {head: wits, face: pres, arms: str, legs: agi, torso: end}

followers:
  quality:
    default:  [{to: 30, quality: green}, {to: 80, quality: regular}, {to: 100, quality: veteran}]
    hardened: [{to: 15, quality: green}, {to: 60, quality: regular}, {to: 100, quality: veteran}]
    raw:      [{to: 55, quality: green}, {to: 90, quality: regular}, {to: 100, quality: veteran}]

templates:
  - id: trench
    name: "A company in the trenches"
    slots: [[sergeant, 3], [line, 2], [line, 1], [line, 1], [surgeon, 1]]
    followers: [[line, 12]]
  - id: riflemen
    name: "Riflemen in the pits"
    slots: [[officer, 3], [rifleman, 2], [rifleman, 2], [sapper, 1]]
    followers: [[rifleman, 8]]
