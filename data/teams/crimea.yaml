# Character generation for the Crimean War (1854-1856): the team builder (dist/team.html,
# python3 -m gravewounds team --era crimea). Made exactly as the medieval era's (see
# medieval.yaml for the five steps); only the tables differ. Every region takes the Crimean
# all-hits table (the British siege returns, blended).
# All of it is written for this game: the tables, events and names are ours (names are common
# period names, plain fact). The infantry's Musket skill covers both the smoothbore musket
# most Russian infantry still carried and the British and French rifle-musket (the Minié and
# the Enfield): both were fired by the same drill. Gunnery is the artillerymen's skill (and
# the sailors', who served guns ashore in the siege). Lancers' lances are fought with Blade.
id: crimea
name: "Crimean War (1854-1856)"

characteristics:
  - {id: str, name: Strength}
  - {id: agi, name: Agility}
  - {id: end, name: Endurance}
  - {id: wits, name: Wits}
  - {id: nerve, name: Nerve}
  - {id: pres, name: Presence}
array: [70, 60, 55, 50, 45, 35]
stat_range: [15, 95]
age: {start: 16, per_term: 4}

skill_max: 90
first_term: 15
term_main: 10
term_second: 5
gain: 15
skills:
  - {id: musket, name: Musket, of: agi, div: 2, combat: true}
  - {id: pistol, name: Pistol, of: agi, div: 2, combat: true}
  - {id: blade, name: Blade, of: agi, div: 2, combat: true}
  - {id: bayonet, name: Bayonet, of: str, div: 2, combat: true}
  - {id: gunnery, name: Gunnery, of: wits, div: 2, combat: true}
  - {id: brawl, name: Brawl, of: str, div: 2, combat: true}
  - {id: parry, name: Parry, of: agi, div: 2, combat: true}
  - {id: dodge, name: Dodge, of: agi, div: 3, combat: true}
  - {id: ride, name: Ride, of: agi, div: 3}
  - {id: fieldcraft, name: Fieldcraft, of: wits, div: 3}
  - {id: watch, name: Watch, of: wits, div: 2}
  - {id: stealth, name: Stealth, of: agi, div: 3}
  - {id: leechcraft, name: Leechcraft, of: wits, div: 4}
  - {id: seamanship, name: Seamanship, of: wits, div: 4}
  - {id: craft, name: Craft, of: wits, div: 3}
  - {id: letters, name: Letters, of: wits, div: 5}
  - {id: persuade, name: Persuade, of: pres, div: 2}
  - {id: command, name: Command, of: pres, div: 3}

weapon_skill:
  rifle_musket: musket
  musket_smoothbore: musket
  revolver: pistol
  saber: blade
  lance: blade
  dagger: blade
  bayonet: bayonet
  artillery_smoothbore: gunnery
  punch: brawl
  kick: brawl
  elbow_knee: brawl
defence: [parry, dodge]

regions:
  - id: british
    name: "The British Army in the Crimea"
    short: "British"
    table: crimea-1854-56-all-hits
    colours: ["#a33a2e", "#2f3f6e", "#e6e0d2", "#3a3a3a"]
    names: [John, William, Thomas, James, George, Henry, Charles, Patrick, Michael, Edward, Robert, Joseph, Richard, Daniel, Alexander, Samuel]
    bynames: [Smith, Jones, Williams, Brown, Taylor, Murphy, Kelly, Campbell, MacDonald, Evans, Walker, Wright]
    women:
      share: null
      careers: [nurse]
      shares: {nurse: 100}
      names: [Mary, Elizabeth, Anne, Margaret, Sarah, Jane, Catherine, Ellen, Hannah, Martha, Susan, Alice]
      closed: "British women in the Crimea were nurses and soldiers' wives, not in the fighting careers."
      source: "The National Archives, Florence Nightingale: 38 nurses arrived at Scutari on 4 November 1854. No count of nurses' deaths found."
  - id: french
    name: "The French Army of the East"
    short: "French"
    table: crimea-1854-56-all-hits
    colours: ["#2b4a8a", "#a33a2e", "#e6e0d2", "#3b4a6a"]
    names: [Jean, Pierre, Louis, Joseph, François, Jacques, Antoine, Charles, Auguste, Henri, Victor, Jules, Étienne, Nicolas, Ahmed, Mohamed]
    bynames: [Martin, Bernard, Dubois, Durand, Moreau, Laurent, Simon, Michel, Lefebvre, Leroy, Roux, Girard]
    women:
      share: null
      careers: [cantiniere]
      names: [Marie, Jeanne, Louise, Marguerite, Catherine, Anne, Joséphine, Françoise, Madeleine, Rose, Victorine, Julie]
      closed: "French women served with their regiments as cantinières, not in its other careers."
      source: "Vivandière (Military Wiki): Napoleon III doubled the cantinières' numbers in 1854; attached to regiments, they served with their units in every campaign of the Second Empire, the Crimea included, selling food and drink and tending the wounded. No count of their share."
  - id: russian
    name: "The Russian Army at Sevastopol"
    short: "Russian"
    table: crimea-1854-56-all-hits
    colours: ["#3f4a3a", "#7a7468", "#2e3a2e", "#e6e0d2"]
    names: [Ivan, Pyotr, Nikolai, Fyodor, Vasily, Mikhail, Alexei, Grigory, Semyon, Stepan, Yegor, Andrei, Pavel, Dmitri, Timofei, Kuzma]
    bynames: [Ivanov, Petrov, Smirnov, Kuznetsov, Popov, Sokolov, Lebedev, Kozlov, Novikov, Morozov, Volkov, Fyodorov]
    no_women: "The women of Sevastopol nursed the wounded in the siege, outside these careers."

