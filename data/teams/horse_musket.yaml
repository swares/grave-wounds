careers:
  - id: line
    name: "Line infantryman"
    main: musket
    second: bayonet
    prefers: [end, agi, nerve, str, wits, pres]
    wound: 20
    wound_weapon: musket_smoothbore
    kit: {default: none}
    weapon: {default: musket_smoothbore}
    terms:
      - {to: 20, skill: watch, text: "Stood picket on a cold night before a battle."}
      - {to: 40, skill: fieldcraft, text: "Marched barefoot through a hard winter."}
      - {to: 55, skill: craft, text: "Dug trenches before a fortress."}
      - {to: 70, skill: bayonet, text: "Went in with the bayonet at the end of a long fight.", wound: true}
      - {to: 85, skill: dodge, text: "Stood in line under cannon fire."}
      - {to: 100, skill: musket, text: "Fired volleys at forty paces until the enemy broke.", wound: true}
  - id: rifleman
    name: "Rifleman or light infantryman"
    main: rifle
    second: dodge
    prefers: [wits, agi, end, nerve, str, pres]
    wound: 15
    wound_weapon: musket_smoothbore
    kit: {default: none}
    weapon: {default: rifle_flintlock}
    terms:
      - {to: 20, skill: stealth, text: "Skirmished in front of the army."}
      - {to: 40, skill: fieldcraft, text: "Lived off the land on outpost duty."}
      - {to: 55, skill: watch, text: "Picked off officers from a hedge."}
      - {to: 70, skill: musket, text: "Covered a retreat from rock to rock."}
      - {to: 85, skill: bayonet, text: "Was caught in the open by cavalry.", wound: true}
      - {to: 100, skill: rifle, text: "Shot it out with enemy skirmishers in a wood.", wound: true}
  - id: dragoon
    name: "Dragoon or hussar"
    main: blade
    second: ride
    prefers: [agi, str, nerve, end, pres, wits]
    wound: 20
    wound_weapon: saber
    kit: {default: dragoon_helmet, french: cuirassier}
    weapon: {default: saber}
    mounted: true
    terms:
      - {to: 20, skill: fieldcraft, text: "Foraged for horses in a stripped country."}
      - {to: 40, skill: pistol, text: "Fought dismounted at a ford."}
      - {to: 55, skill: watch, text: "Patrolled the roads between two armies."}
      - {to: 70, skill: parry, text: "Fought a running fight with enemy horse.", wound: true}
      - {to: 85, skill: command, text: "Led a vedette that brought back news of the enemy."}
      - {to: 100, skill: blade, text: "Rode in a charge that broke a square.", wound: true}
  - id: gunner
    name: "Artilleryman"
    main: gunnery
    second: craft
    prefers: [wits, str, end, nerve, agi, pres]
    wound: 15
    wound_weapon: artillery_smoothbore
    kit: {default: none}
    weapon: {default: artillery_smoothbore}
    terms:
      - {to: 20, skill: craft, text: "Made cartridges in a siege train."}
      - {to: 40, skill: ride, text: "Drove a gun team through the mud."}
      - {to: 55, skill: letters, text: "Learned the ranges from a printed table."}
      - {to: 70, skill: watch, text: "Laid a gun on enemy batteries for a day."}
      - {to: 85, skill: brawl, text: "Defended the guns with a rammer when they were overrun.", wound: true}
      - {to: 100, skill: gunnery, text: "Fired canister into a column at close range.", wound: true}
  - id: sergeant
    name: "Sergeant or corporal"
    main: command
    second: musket
    prefers: [pres, nerve, end, str, agi, wits]
    wound: 20
    wound_weapon: musket_smoothbore
    kit: {default: none}
    weapon: {default: musket_smoothbore}
    terms:
      - {to: 20, skill: letters, text: "Kept the company's books."}
      - {to: 40, skill: persuade, text: "Recruited at country fairs."}
      - {to: 55, skill: bayonet, text: "Drilled recruits until they moved as one."}
      - {to: 70, skill: watch, text: "Set the guard on the line of march."}
      - {to: 85, skill: parry, text: "Defended the colours when the line wavered.", wound: true}
      - {to: 100, skill: musket, text: "Closed up the ranks under fire.", wound: true}
  - id: officer
    name: "Officer"
    main: blade
    second: command
    prefers: [pres, nerve, agi, wits, end, str]
    wound: 25
    wound_weapon: musket_smoothbore
    kit: {default: none}
    weapon: {default: saber}
    terms:
      - {to: 20, skill: letters, text: "Wrote reports for the colonel."}
      - {to: 40, skill: ride, text: "Carried orders across a battlefield."}
      - {to: 55, skill: persuade, text: "Negotiated an exchange of prisoners."}
      - {to: 70, skill: pistol, text: "Fought a duel over an insult."}
      - {to: 85, skill: command, text: "Led the company when its captain fell."}
      - {to: 100, skill: parry, text: "Led a storming party into a breach.", wound: true}
  - id: surgeon
    name: "Surgeon's mate"
    main: leechcraft
    second: craft
    prefers: [wits, agi, nerve, end, pres, str]
    wound: 5
    wound_weapon: musket_smoothbore
    kit: {default: none}
    weapon: {default: pistol_flintlock}
    terms:
      - {to: 20, skill: craft, text: "Took off limbs at a field hospital all night."}
      - {to: 40, skill: letters, text: "Studied anatomy in a hospital in town."}
      - {to: 55, skill: leechcraft, text: "Nursed a regiment through fever."}
      - {to: 70, skill: ride, text: "Followed the army with the ambulance wagons."}
      - {to: 85, skill: persuade, text: "Bargained for quinine and bark."}
      - {to: 100, skill: watch, text: "Worked under fire at a dressing station.", wound: true}
  - id: scout
    name: "Scout or ranger"
    main: fieldcraft
    second: rifle
    prefers: [wits, agi, end, nerve, str, pres]
    wound: 15
    wound_weapon: musket_smoothbore
    kit: {default: none}
    weapon: {default: rifle_flintlock}
    terms:
      - {to: 20, skill: stealth, text: "Watched an enemy camp from a hill for three days."}
      - {to: 40, skill: persuade, text: "Bought news from the country people."}
      - {to: 55, skill: ride, text: "Carried a message through enemy country."}
      - {to: 70, skill: watch, text: "Found the ford the army needed."}
      - {to: 85, skill: brawl, text: "Was caught by a patrol and fought his way out.", wound: true}
      - {to: 100, skill: fieldcraft, text: "Guided a column by night."}
  - id: marine
    name: "Sailor or marine"
    main: seamanship
    second: musket
    prefers: [agi, str, end, nerve, wits, pres]
    wound: 15
    wound_weapon: musket_smoothbore
    kit: {default: none}
    weapon: {default: musket_smoothbore}
    terms:
      - {to: 20, skill: craft, text: "Rigged and mended sails at sea."}
      - {to: 40, skill: gunnery, text: "Served a gun in a sea fight."}
      - {to: 55, skill: brawl, text: "Fought in a tavern brawl in port."}
      - {to: 70, skill: watch, text: "Kept lookout from the masthead."}
      - {to: 85, skill: blade, text: "Boarded an enemy ship with a cutlass.", wound: true}
      - {to: 100, skill: musket, text: "Fired from the tops into the enemy deck.", wound: true}
  - id: sutler
    name: "Sutler or camp follower"
    main: persuade
    second: watch
    prefers: [pres, wits, end, agi, nerve, str]
    wound: 5
    wound_weapon: musket_smoothbore
    kit: {default: none}
    weapon: {default: pistol_flintlock}
    terms:
      - {to: 20, skill: craft, text: "Cooked for a regiment."}
      - {to: 40, skill: ride, text: "Drove a cart in the baggage."}
      - {to: 55, skill: fieldcraft, text: "Bought food where there was none."}
      - {to: 70, skill: letters, text: "Kept accounts of what the soldiers owed."}
      - {to: 85, skill: leechcraft, text: "Nursed the wounded after a battle."}
      - {to: 100, skill: dodge, text: "Was caught in the baggage when the enemy broke through.", wound: true}

old_wound:
  - {to: 70, kind: mark, text: "a healed scar"}
  - {to: 100, kind: lasting, text: "a lasting hurt"}
lasting: 5
lasting_from: {head: wits, face: pres, arms: str, legs: agi, torso: end}

followers:
  quality:
    default:  [{to: 30, quality: green}, {to: 80, quality: regular}, {to: 100, quality: veteran}]
    hardened: [{to: 15, quality: green}, {to: 60, quality: regular}, {to: 100, quality: veteran}]
    raw:      [{to: 55, quality: green}, {to: 90, quality: regular}, {to: 100, quality: veteran}]

