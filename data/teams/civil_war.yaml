# Character generation for the Civil War and the frontier (1861-1876): the team builder
# (dist/team.html, python3 -m gravewounds team --era civil_war). Made exactly as the medieval
# era's (see medieval.yaml for the five steps); only the tables differ. Every region takes the
# Civil War table: the frontier army's gunshot wounds roll there too (the arrow-wound records
# have no gunshots). Frontier infantry carry the Springfield breech-loader of 1866.
# All of it is written for this game: the tables, events and names are ours (names are common
# period names, plain fact). Gunnery is the artillerymen's skill.
id: civil_war
name: "Civil War and frontier (1861-1876)"

characteristics:
  - {id: str, name: Strength}
  - {id: agi, name: Agility}
  - {id: end, name: Endurance}
  - {id: wits, name: Wits}
  - {id: nerve, name: Nerve}
  - {id: pres, name: Presence}
array: [70, 60, 55, 50, 45, 35]
stat_range: [15, 95]
age: {start: 16, per_term: 4}

skill_max: 90
first_term: 15
term_main: 10
term_second: 5
gain: 15
skills:
  - {id: rifle, name: Rifle, of: agi, div: 2, combat: true}
  - {id: pistol, name: Pistol, of: agi, div: 2, combat: true}
  - {id: blade, name: Blade, of: agi, div: 2, combat: true}
  - {id: bayonet, name: Bayonet, of: str, div: 2, combat: true}
  - {id: gunnery, name: Gunnery, of: wits, div: 2, combat: true}
  - {id: brawl, name: Brawl, of: str, div: 2, combat: true}
  - {id: parry, name: Parry, of: agi, div: 2, combat: true}
  - {id: dodge, name: Dodge, of: agi, div: 3, combat: true}
  - {id: ride, name: Ride, of: agi, div: 3}
  - {id: fieldcraft, name: Fieldcraft, of: wits, div: 3}
  - {id: watch, name: Watch, of: wits, div: 2}
  - {id: stealth, name: Stealth, of: agi, div: 3}
  - {id: leechcraft, name: Leechcraft, of: wits, div: 4}
  - {id: craft, name: Craft, of: wits, div: 3}
  - {id: letters, name: Letters, of: wits, div: 5}
  - {id: persuade, name: Persuade, of: pres, div: 2}
  - {id: command, name: Command, of: pres, div: 3}

weapon_skill:
  rifle_musket: rifle
  breechloader: rifle
  revolver: pistol
  saber: blade
  dagger: blade
  bayonet: bayonet
  artillery_acw: gunnery
  punch: brawl
  kick: brawl
  elbow_knee: brawl
defence: [parry, dodge]

regions:
  - id: union
    name: "The Union (1861-1865)"
    table: acw-1861-all-hits
    colours: ["#2e4f8a", "#3a4a6a", "#7d5530", "#e6e0d2"]
    names: [John, William, James, George, Charles, Henry, Thomas, Patrick, Michael, Frederick, August, Jacob, Samuel, David, Edward, Robert]
    bynames: [Smith, Miller, Brown, Wilson, Murphy, Schmidt, Becker, Larsen, Taylor, Moore, Kelly, Johnson]
    women:
      share: 0.02
      disguised: true
      careers: [infantry, sharpshooter, trooper, gunner, scout, teamster]
      closed: "A woman in the ranks had enlisted disguised as a man, as a private: none is known to have held these careers' ranks openly."
      source: "DeAnne Blanton, Women Soldiers of the Civil War, Prologue (National Archives, 1993): roughly 750 women enlisted disguised as men, as many as 250 of them Confederates; the share is our arithmetic on armies of some two million and some 900,000."
  - id: confederacy
    name: "The Confederacy (1861-1865)"
    table: acw-1861-all-hits
    colours: ["#8a8a7a", "#7d5530", "#5c6b3a", "#e6e0d2"]
    names: [John, William, James, Thomas, Robert, Joseph, Benjamin, Jesse, Elijah, Hiram, Nathaniel, Wade, Lewis, Samuel, Henry, George]
    bynames: [Smith, Jones, Davis, Walker, Harris, Lee, Mitchell, Carter, Turner, Hill, Price, Barrett]
    women:
      share: 0.03
      disguised: true
      careers: [infantry, sharpshooter, trooper, gunner, scout, teamster]
      closed: "A woman in the ranks had enlisted disguised as a man, as a private: none is known to have held these careers' ranks openly."
      source: "DeAnne Blanton, Women Soldiers of the Civil War, Prologue (National Archives, 1993): roughly 750 women enlisted disguised as men, as many as 250 of them Confederates; the share is our arithmetic on armies of some two million and some 900,000."
  - id: frontier
    name: "The US Army on the frontier (1866-1876)"
    table: acw-1861-all-hits
    colours: ["#2e4f8a", "#7d5530", "#9a7347", "#e6e0d2"]
    names: [John, William, James, Patrick, Michael, Thomas, Charles, George, Henry, Frank, Joseph, Daniel, Peter, Edward, Isaiah, Moses]
    bynames: [Smith, Murphy, O'Brien, Schultz, Jackson, Williams, Wilson, Clark, Ryan, Walsh, Green, Young]
    no_women: "These tables have no record of women in the frontier army's ranks."

origins:
  - {name: "Farm boy", who: m, gain: fieldcraft, trait: {text: "Strong back", str: 10}, drawback: {text: "Never been far from home", persuade: -15}}
  - {name: "Mill hand", gain: craft, trait: {text: "Used to long hours", end: 10}, drawback: {text: "Never slept rough", fieldcraft: -15}}
  - {name: "Clerk in a store", gain: letters, trait: {text: "Good at sums", wits: 10}, drawback: {text: "Soft hands", str: -10}}
  - {name: "Immigrant fresh off the boat", gain: craft, trait: {text: "Served in an army back home", rifle: 15}, drawback: {text: "Speaks little English", persuade: -15}}
  - {name: "Hunter's son", who: m, gain: rifle, trait: {text: "A steady aim", rifle: 15}, drawback: {text: "Hates drill", pres: -10}}
  - {name: "Teamster", gain: ride, trait: {text: "Knows every road", fieldcraft: 15}, drawback: {text: "Bad back", agi: -10}}
  - {name: "Schoolteacher", gain: letters, trait: {text: "Well read", letters: 15}, drawback: {text: "Faints at the sight of blood", nerve: -10}}
  - {name: "Druggist's boy", who: m, gain: leechcraft, trait: {text: "Knows his remedies", leechcraft: 15}, drawback: {text: "Never stops talking", stealth: -15}}
  - {name: "Son of a planter or a mill owner", who: m, gain: ride, trait: {text: "Raised to command", command: 15}, drawback: {text: "Proud and touchy", persuade: -15}}
  - {name: "Railroad man", gain: craft, trait: {text: "Not afraid of machines", wits: 10}, drawback: {text: "Half deaf from the engines", watch: -15}}
  - {name: "Blacksmith's apprentice", gain: craft, trait: {text: "Arms like hams", str: 10}, drawback: {text: "Slow afoot", agi: -10}}
  - {name: "Riverboat hand", gain: brawl, trait: {text: "Swims like an otter", end: 10}, drawback: {text: "Gambles away his pay", pres: -10}}
  - {name: "Cowhand", gain: ride, trait: {text: "Horse sense", ride: 15}, drawback: {text: "Kicked by a horse as a boy", end: -10}}
  - {name: "Woodsman", gain: fieldcraft, trait: {text: "Moves quietly in the woods", stealth: 15}, drawback: {text: "Uneasy in towns", pres: -10}}
  - {name: "Street tough from a big city", gain: brawl, trait: {text: "Takes a punch", end: 10}, drawback: {text: "Known to the police", persuade: -15}}
  - {name: "Preacher's son", who: m, gain: persuade, trait: {text: "A voice that carries", pres: 10}, drawback: {text: "Never fired a gun", rifle: -15}}
  - {name: "Telegraph operator", gain: letters, trait: {text: "Quick with his hands", agi: 10}, drawback: {text: "Short-sighted", watch: -15}}
