  - {name: "Volunteer for the cause", gain: persuade, trait: {text: "Hard to frighten", nerve: 10}, drawback: {text: "Never held a weapon", parry: -15}}
  - {name: "Farm girl who cut her hair", who: f, gain: fieldcraft, trait: {text: "Strong back", str: 10}, drawback: {text: "Never been far from home", persuade: -15}}
  - {name: "Mill girl", who: f, gain: craft, trait: {text: "Used to long hours", end: 10}, drawback: {text: "Never fired a gun", rifle: -15}}
  - {name: "Followed her husband into the ranks", who: f, gain: persuade, trait: {text: "Stays by her husband", nerve: 10}, drawback: {text: "Afraid of being found out", pres: -10}}
  - {name: "Ran away from home in boy's clothes", who: f, gain: stealth, trait: {text: "Passes unnoticed", stealth: 15}, drawback: {text: "Never slept rough", fieldcraft: -15}}
  - {name: "Seamstress", who: f, gain: craft, trait: {text: "Nimble fingers", agi: 10}, drawback: {text: "Soft hands", str: -10}}

careers:
  - id: infantry
    name: "Infantryman"
    main: rifle
    second: bayonet
    prefers: [end, agi, nerve, str, wits, pres]
    wound: 20
    wound_weapon: rifle_musket
    kit: {default: none}
    weapon: {default: rifle_musket, frontier: breechloader}
    terms:
      - {to: 20, skill: watch, text: "Stood picket across a river from the enemy."}
      - {to: 40, skill: fieldcraft, text: "Marched thirty miles a day in the summer heat."}
      - {to: 55, skill: craft, text: "Dug rifle pits and breastworks all night."}
      - {to: 70, skill: dodge, text: "Lay in the open under artillery fire."}
      - {to: 85, skill: bayonet, text: "Went over the works in a charge.", wound: true}
      - {to: 100, skill: rifle, text: "Fired from behind a fence until the ammunition ran out.", wound: true}
  - id: sharpshooter
    name: "Sharpshooter or skirmisher"
    main: rifle
    second: stealth
    prefers: [wits, agi, end, nerve, str, pres]
    wound: 15
    wound_weapon: rifle_musket
    kit: {default: none}
    weapon: {default: rifle_musket, frontier: breechloader}
    terms:
      - {to: 20, skill: watch, text: "Watched an enemy battery from a tree for a day."}
      - {to: 40, skill: fieldcraft, text: "Skirmished ahead of the line through woods."}
      - {to: 55, skill: dodge, text: "Moved from cover to cover under fire."}
      - {to: 70, skill: stealth, text: "Crept up on an enemy picket post."}
      - {to: 85, skill: craft, text: "Kept a target rifle working in the rain."}
      - {to: 100, skill: rifle, text: "Duelled with enemy sharpshooters at long range.", wound: true}
  - id: trooper
    name: "Cavalry trooper"
    main: pistol
    second: ride
    prefers: [agi, end, nerve, str, wits, pres]
    wound: 20
    wound_weapon: revolver
    kit: {default: none}
    weapon: {default: revolver}
    mounted: true
    terms:
      - {to: 20, skill: fieldcraft, text: "Raided behind the enemy lines for a week."}
      - {to: 40, skill: watch, text: "Patrolled the roads ahead of the army."}
      - {to: 55, skill: rifle, text: "Fought dismounted with a carbine."}
      - {to: 70, skill: blade, text: "Rode in a sabre charge.", wound: true}
      - {to: 85, skill: stealth, text: "Scouted an enemy column at night."}
      - {to: 100, skill: pistol, text: "Fought a running fight with revolvers.", wound: true}
  - id: gunner
    name: "Artilleryman"
    main: gunnery
    second: craft
    prefers: [wits, str, end, nerve, agi, pres]
    wound: 15
    wound_weapon: artillery_acw
    kit: {default: none}
    weapon: {default: artillery_acw}
    terms:
      - {to: 20, skill: ride, text: "Drove a gun team through the mud."}
      - {to: 40, skill: craft, text: "Cut fuses by lamplight."}
      - {to: 55, skill: letters, text: "Learned the ranges from a gunnery manual."}
      - {to: 70, skill: watch, text: "Duelled with an enemy battery for an afternoon."}
      - {to: 85, skill: brawl, text: "Defended the guns hand to hand.", wound: true}
      - {to: 100, skill: gunnery, text: "Fired double canister into a charging line.", wound: true}
  - id: sergeant
    name: "Sergeant or corporal"
    main: command
    second: rifle
    prefers: [pres, nerve, end, str, agi, wits]
    wound: 20
    wound_weapon: rifle_musket
    kit: {default: none}
    weapon: {default: rifle_musket}
    terms:
      - {to: 20, skill: letters, text: "Kept the company's rolls."}
      - {to: 40, skill: persuade, text: "Talked his men out of deserting."}
      - {to: 55, skill: bayonet, text: "Drilled recruits through a winter camp."}
      - {to: 70, skill: watch, text: "Set the pickets in a hostile country."}
      - {to: 85, skill: parry, text: "Carried the colours when the bearer fell.", wound: true}
      - {to: 100, skill: rifle, text: "Kept the line steady in a firefight.", wound: true}
  - id: officer
    name: "Officer"
    main: command
    second: pistol
    prefers: [pres, nerve, wits, agi, end, str]
    wound: 25
    wound_weapon: rifle_musket
    kit: {default: none}
    weapon: {default: revolver}
    terms:
      - {to: 20, skill: letters, text: "Wrote orders for the regiment."}
      - {to: 40, skill: ride, text: "Carried orders across the field."}
      - {to: 55, skill: blade, text: "Led a charge, sword in hand.", wound: true}
      - {to: 70, skill: persuade, text: "Raised a company from his own county."}
      - {to: 85, skill: pistol, text: "Fought at the head of his men in the woods."}
      - {to: 100, skill: command, text: "Took command when the colonel fell.", wound: true}
  - id: steward
    name: "Surgeon or hospital steward"
    main: leechcraft
    second: craft
    prefers: [wits, agi, nerve, end, pres, str]
    wound: 5
    wound_weapon: rifle_musket
    kit: {default: none}
    weapon: {default: revolver}
    terms:
      - {to: 20, skill: craft, text: "Amputated by lamplight in a field hospital."}
      - {to: 40, skill: letters, text: "Kept the regiment's sick book."}
      - {to: 55, skill: leechcraft, text: "Nursed a camp through measles and fever."}
      - {to: 70, skill: ride, text: "Ran the ambulance wagons back from the front."}
      - {to: 85, skill: persuade, text: "Begged chloroform from another regiment."}
      - {to: 100, skill: watch, text: "Worked at a dressing station under fire.", wound: true}
  - id: scout
    name: "Scout"
    main: fieldcraft
    second: rifle
    prefers: [wits, agi, end, nerve, str, pres]
    wound: 15
    wound_weapon: revolver
    kit: {default: none}
    weapon: {default: rifle_musket}
    terms:
      - {to: 20, skill: stealth, text: "Watched an enemy camp from a ridge for three days."}
      - {to: 40, skill: persuade, text: "Bought news from the country people."}
      - {to: 55, skill: ride, text: "Carried a dispatch through enemy country."}
      - {to: 70, skill: watch, text: "Found water for a column on a dry march."}
      - {to: 85, skill: pistol, text: "Was cornered by a patrol and shot his way out.", wound: true}
      - {to: 100, skill: fieldcraft, text: "Guided a column across country by night."}
  - id: teamster
    name: "Teamster or packer"
    main: ride
    second: craft
    prefers: [end, str, wits, agi, nerve, pres]
    wound: 5
    wound_weapon: revolver
    kit: {default: none}
    weapon: {default: revolver}
    terms:
      - {to: 20, skill: craft, text: "Mended wagons on the road."}
      - {to: 40, skill: fieldcraft, text: "Found grass for the mules on a long march."}
      - {to: 55, skill: persuade, text: "Bargained for forage at a farm."}
      - {to: 70, skill: watch, text: "Guarded the train at night."}
      - {to: 85, skill: brawl, text: "Fought off raiders at the wagons.", wound: true}
      - {to: 100, skill: ride, text: "Brought the train through a flooded ford."}

old_wound:
  - {to: 70, kind: mark, text: "a healed scar"}
  - {to: 100, kind: lasting, text: "a lasting hurt"}
lasting: 5
lasting_from: {head: wits, face: pres, arms: str, legs: agi, torso: end}

followers:
  quality:
    default:  [{to: 30, quality: green}, {to: 80, quality: regular}, {to: 100, quality: veteran}]
    hardened: [{to: 15, quality: green}, {to: 60, quality: regular}, {to: 100, quality: veteran}]
    raw:      [{to: 55, quality: green}, {to: 90, quality: regular}, {to: 100, quality: veteran}]

templates:
  - id: squad
    name: "An infantry squad"
    slots: [[sergeant, 3], [infantry, 2], [infantry, 1], [infantry, 1], [steward, 1]]
    followers: [[infantry, 12]]
  - id: sharpshooters
    name: "A sharpshooter detachment"
    slots: [[officer, 3], [sharpshooter, 2], [sharpshooter, 2], [scout, 1]]
    followers: [[sharpshooter, 8]]
    follower_quality: hardened
  - id: cavalry
    name: "A cavalry patrol"
    slots: [[officer, 3], [trooper, 2], [trooper, 2], [trooper, 1], [scout, 1]]
    followers: [[trooper, 10]]
  - id: section
    name: "A gun section"
    slots: [[gunner, 3], [gunner, 2], [gunner, 1], [teamster, 1], [infantry, 1]]
    followers: [[gunner, 8], [teamster, 2]]
  - id: recruits
    name: "A new company"
    slots: [[officer, 2], [sergeant, 1], [infantry, 1], [infantry, 1], [steward, 1]]
    followers: [[infantry, 16]]
    follower_quality: raw
  - id: escort
    name: "A wagon escort on the frontier"
    slots: [[sergeant, 3], [trooper, 2], [scout, 2], [teamster, 1], [steward, 1]]
    followers: [[trooper, 6], [teamster, 4]]
