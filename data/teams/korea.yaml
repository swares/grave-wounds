# Character generation for the Korean War (1950-1953): the team builder (dist/team.html,
# python3 -m gravewounds team --era korea). Made exactly as the medieval era's (see medieval.yaml
# for the five steps); only the tables differ. Every region takes the Korean War hospital table.
# The Americans of 1950-51 and the Commonwealth wear a steel helmet only; the Americans on the
# outpost line of 1952-53 the M1952 flak vest; the Chinese and North Koreans no armour.
# Rocket launchers and recoilless rifles are fought with Gunnery, like mortars.
# Chinese and Korean names are written family name first, as they are said.
# All of it is written for this game: the tables, events and names are ours (names are common
# period names, plain fact).
