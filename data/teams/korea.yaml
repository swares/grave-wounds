careers:
  - id: rifleman
    name: "Rifleman"
    main: rifle
    second: grenade
    prefers: [end, agi, nerve, str, wits, pres]
    wound: 25
    wound_weapon: rifle_service
    kit: {default: ww2_rifleman, us_1952: vietnam_army, chinese: none, north_korea: none}
