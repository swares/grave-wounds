    terms:
      - {to: 20, skill: watch, text: "Stood watch in a frozen foxhole through a long night."}
      - {to: 40, skill: fieldcraft, text: "Climbed ridge after ridge with a full pack."}
      - {to: 55, skill: dodge, text: "Lay flat while mortar rounds walked across the slope."}
      - {to: 70, skill: stealth, text: "Went out on a night patrol into the valley."}
      - {to: 85, skill: grenade, text: "Fought off a night attack with grenades.", wound: true}
