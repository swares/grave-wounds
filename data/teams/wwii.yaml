    colours: ["#4f5a3a", "#5b5a3a", "#6b6a4a", "#e6e0d2"]
    names: [Robert, James, John, William, Richard, Charles, Donald, George, Joseph, Edward, Thomas, Frank, Harold, Walter, Eugene, Raymond]
    bynames: [Smith, Johnson, Williams, Brown, Jones, Miller, Davis, Martinez, Wilson, Anderson, Nowak, Sullivan]
