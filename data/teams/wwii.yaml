careers:
  - id: rifleman
    name: "Rifleman"
    main: rifle
    second: grenade
    prefers: [end, agi, nerve, str, wits, pres]
    wound: 25
    wound_weapon: rifle_service
    kit: {default: ww2_rifleman}
    weapon: {default: rifle_service}
    terms:
      - {to: 20, skill: watch, text: "Stood guard in a foxhole through a cold night."}
      - {to: 40, skill: fieldcraft, text: "Marched and dug in, and marched again."}
      - {to: 55, skill: dodge, text: "Lay flat through a mortar stonk."}
      - {to: 70, skill: stealth, text: "Went out on a night patrol."}
      - {to: 85, skill: grenade, text: "Cleared houses in a village fight.", wound: true}
      - {to: 100, skill: rifle, text: "Held a hedgerow or a ridge against a counter-attack.", wound: true}
  - id: machine_gunner
    name: "Machine gunner"
    main: mg
    second: craft
    prefers: [wits, end, str, nerve, agi, pres]
    wound: 25
    wound_weapon: rifle_service
    kit: {default: ww2_rifleman}
    weapon: {default: machine_gun}
    terms:
      - {to: 20, skill: craft, text: "Changed a hot barrel in the middle of a fight."}
      - {to: 40, skill: fieldcraft, text: "Carried the gun and the ammunition boxes forward."}
      - {to: 55, skill: watch, text: "Laid the gun on a fixed line at night."}
      - {to: 70, skill: dodge, text: "Moved the gun before the enemy's mortars found it.", wound: true}
      - {to: 85, skill: stealth, text: "Sited the gun to fire along the enemy's line."}
      - {to: 100, skill: mg, text: "Broke up an attack across open ground.", wound: true}
  - id: grenadier
    name: "Grenadier or anti-tank man"
    main: grenade
    second: rifle
    prefers: [str, agi, nerve, end, wits, pres]
    wound: 30
    wound_weapon: explosive_fragment
    kit: {default: ww2_rifleman}
    weapon: {default: rifle_service}
    terms:
      - {to: 20, skill: craft, text: "Learned the rifle grenade and the rocket launcher."}
      - {to: 40, skill: stealth, text: "Stalked a tank through an orchard."}
      - {to: 55, skill: fieldcraft, text: "Carried the rockets up to the line."}
      - {to: 70, skill: dodge, text: "Was caught in the open by a tank's machine gun.", wound: true}
      - {to: 85, skill: grenade, text: "Knocked out a bunker or a tank.", wound: true}
      - {to: 100, skill: trench, text: "Fought hand to hand in a trench."}
  - id: sniper
    name: "Sniper or scout"
    main: rifle
    second: stealth
    prefers: [wits, agi, nerve, end, str, pres]
    wound: 15
    wound_weapon: rifle_service
    kit: {default: ww2_rifleman}
    weapon: {default: rifle_service}
    terms:
      - {to: 20, skill: watch, text: "Watched an enemy position from a ruin for a day."}
      - {to: 40, skill: fieldcraft, text: "Scouted ahead of the company."}
      - {to: 55, skill: stealth, text: "Lay in a hide until dark."}
      - {to: 70, skill: letters, text: "Kept the sniper's log and sketched the enemy's posts."}
      - {to: 85, skill: craft, text: "Kept a scoped rifle zeroed through rain and mud."}
      - {to: 100, skill: rifle, text: "Duelled with an enemy sniper.", wound: true}
  - id: sapper
    name: "Combat engineer or sapper"
    main: craft
    second: grenade
    prefers: [str, end, wits, nerve, agi, pres]
    wound: 25
    wound_weapon: mine_ied
    kit: {default: ww2_rifleman}
    weapon: {default: rifle_service}
    terms:
      - {to: 20, skill: craft, text: "Built a bridge under fire."}
      - {to: 40, skill: watch, text: "Swept a road for mines by hand.", wound: true}
      - {to: 55, skill: drive, text: "Drove a bulldozer up to the line."}
      - {to: 70, skill: letters, text: "Laid a minefield to a plan."}
      - {to: 85, skill: grenade, text: "Blew a gap in a wire belt with a bangalore torpedo.", wound: true}
      - {to: 100, skill: fieldcraft, text: "Cleared booby traps from a captured village."}
  - id: medic
    name: "Medic or stretcher-bearer"
    main: leechcraft
    second: fieldcraft
    prefers: [end, wits, nerve, str, agi, pres]
    wound: 20
    wound_weapon: explosive_fragment
    kit: {default: ww2_rifleman}
    weapon: {default: pistol_smg}
    terms:
      - {to: 20, skill: craft, text: "Worked in a field hospital."}
      - {to: 40, skill: leechcraft, text: "Gave plasma at an aid station."}
      - {to: 55, skill: drive, text: "Drove a jeep ambulance back along a shelled road."}
      - {to: 70, skill: persuade, text: "Talked a shocked man back to his senses."}
      - {to: 85, skill: dodge, text: "Ran out to a wounded man under fire.", wound: true}
      - {to: 100, skill: leechcraft, text: "Kept men alive through a night of shelling.", wound: true}
  - id: radioman
    name: "Radio operator or signaller"
    main: signals
    second: fieldcraft
    prefers: [wits, agi, end, nerve, pres, str]
    wound: 20
    wound_weapon: explosive_fragment
    kit: {default: ww2_rifleman}
    weapon: {default: rifle_service}
    terms:
      - {to: 20, skill: letters, text: "Learned the codes and the call signs."}
      - {to: 40, skill: craft, text: "Repaired a set in the rain."}
      - {to: 55, skill: fieldcraft, text: "Laid a telephone wire up to the forward company."}
      - {to: 70, skill: watch, text: "Listened in on the enemy's net."}
      - {to: 85, skill: dodge, text: "Was spotted by his aerial and shelled.", wound: true}
      - {to: 100, skill: signals, text: "Called in the artillery on an attack."}
  - id: nco
    name: "Corporal or sergeant"
    main: command
    second: pistol
    prefers: [pres, nerve, end, str, agi, wits]
    wound: 25
    wound_weapon: rifle_service
    kit: {default: ww2_rifleman}
    weapon: {default: pistol_smg}
    terms:
      - {to: 20, skill: letters, text: "Kept the squad's roll and its ammunition count."}
      - {to: 40, skill: persuade, text: "Kept a frightened man in his hole."}
      - {to: 55, skill: rifle, text: "Trained replacements behind the line."}
      - {to: 70, skill: watch, text: "Set the night's sentries."}
      - {to: 85, skill: grenade, text: "Led the squad into a house.", wound: true}
      - {to: 100, skill: command, text: "Took over the platoon when its officer fell.", wound: true}
  - id: officer
    name: "Junior officer"
    main: command
    second: pistol
    prefers: [pres, nerve, wits, agi, end, str]
    wound: 30
    wound_weapon: rifle_service
    kit: {default: ww2_rifleman}
    weapon: {default: pistol_smg}
    terms:
      - {to: 20, skill: letters, text: "Read the maps and wrote the orders."}
      - {to: 40, skill: signals, text: "Called down fire on the radio."}
      - {to: 55, skill: stealth, text: "Led a night patrol.", wound: true}
      - {to: 70, skill: persuade, text: "Wrote to the families of the dead."}
      - {to: 85, skill: pistol, text: "Led a platoon attack on a strongpoint.", wound: true}
      - {to: 100, skill: command, text: "Held the company together in a retreat.", wound: true}
  - id: paratrooper
    name: "Paratrooper or commando"
    main: pistol
    second: stealth
    prefers: [agi, nerve, end, str, wits, pres]
    wound: 30
    wound_weapon: rifle_service
    kit: {default: ww2_rifleman}
    weapon: {default: pistol_smg}
    terms:
      - {to: 20, skill: dodge, text: "Made his qualifying jumps."}
      - {to: 40, skill: fieldcraft, text: "Landed scattered at night and found his unit."}
      - {to: 55, skill: trench, text: "Took a sentry with a knife."}
      - {to: 70, skill: grenade, text: "Seized a bridge or a battery in a raid.", wound: true}
      - {to: 85, skill: stealth, text: "Lay up behind the enemy lines for days."}
      - {to: 100, skill: pistol, text: "Held a crossroads until relieved.", wound: true}
  - id: tanker
    name: "Tank crewman"
    main: gunnery
    second: drive
    prefers: [wits, agi, end, nerve, str, pres]
    wound: 20
    wound_weapon: explosive_fragment
    kit: {default: ww2_rifleman}
    weapon: {default: pistol_smg}
    terms:
      - {to: 20, skill: craft, text: "Kept the engine running through a winter."}
      - {to: 40, skill: drive, text: "Drove through a night march without lights."}
      - {to: 55, skill: signals, text: "Worked the tank's radio in an attack."}
      - {to: 70, skill: watch, text: "Watched for anti-tank guns from the turret."}
      - {to: 85, skill: dodge, text: "Bailed out of a burning tank.", wound: true}
      - {to: 100, skill: gunnery, text: "Fought a tank duel at long range."}

old_wound:
  - {to: 70, kind: mark, text: "a healed scar"}
  - {to: 100, kind: lasting, text: "a lasting hurt"}
lasting: 5
lasting_from: {head: wits, face: pres, arms: str, legs: agi, torso: end}

followers:
