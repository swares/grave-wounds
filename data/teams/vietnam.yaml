# Character generation for the Vietnam War (1965-1973): the team builder (dist/team.html,
# python3 -m gravewounds team --era vietnam). Made exactly as the medieval era's (see
# medieval.yaml for the five steps); only the tables differ. Every region takes the Vietnam
# hospital table. The US Army wears the M1 helmet and nylon flak vest, the Marines the Doron
# vest, the ARVN a steel helmet; the Australians and New Zealanders, the North Vietnamese and
# the Viet Cong no armour. RPGs are fought with Grenade, mortars and recoilless rifles with
# Gunnery. Vietnamese names are written family name first.
# Women (docs/team.md): the Viet Cong and the North's army had women under arms in numbers no
# one counted reliably, so a woman is chosen there, never rolled; American, Australian and New
# Zealand servicewomen in Vietnam were nurses and staff, not in these careers.
# All of it is written for this game: the tables, events and names are ours (names are common
# period names, plain fact).
id: vietnam
name: "Vietnam War (1965-1973)"

characteristics:
  - {id: str, name: Strength}
  - {id: agi, name: Agility}
  - {id: end, name: Endurance}
  - {id: wits, name: Wits}
  - {id: nerve, name: Nerve}
  - {id: pres, name: Presence}
