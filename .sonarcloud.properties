# SonarCloud automatic analysis settings.
# index.html and everything in dist/ are generated by build.py from templates/ and data/,
# (data/maps.json is generated by tools/maps), so analysing them only reports the templates' code a second time (as duplication).
sonar.exclusions=index.html,dist/**,data/maps.json
# unit_sizes.mjs is a lookup table of unit names to sizes; its rows all share one shape,
# so CPD reports the table as duplicating itself.
sonar.cpd.exclusions=tools/maps/unit_sizes.mjs
