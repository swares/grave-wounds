# The built pages in a headless browser (Chromium through Playwright): the campaign console over the
# real pages round the whole loop (tools/campaign/loop.py, seeded dice), two roller pages playing a
# fight online over WebRTC (tools/net/twopages.py), the campaign console with a player online
# (tools/net/console.py) and by room codes (tools/net/rooms.py), and the GM's script fighting itself on the roller
# (tools/gm/selfplay.py), the field page's End the battle and Beat history panel (tools/field/beat.py) its plans (tools/field/plans.py), its Run on (tools/field/runon.py), its side view (tools/field/sideview.py), a force's state from the march (tools/field/worn.py), the commander's own choice of stance (tools/field/ownstance.py) and the field map online (tools/net/fieldtwo.py). A few minutes; runs on pull requests and on main when the pages change.
# The pages are tested as built and committed in dist/.
name: browser

on:
  pull_request:
    paths: ["dist/**", "templates/**", "tools/campaign/**", "tools/service/**", "tools/net/**", "tools/gm/**", "tools/field/**", "tools/selfplay/commander.json", "worker/**", ".github/workflows/browser.yml"]
  push:
    branches: [main]
    paths: ["dist/**", "templates/**", "tools/campaign/**", "tools/service/**", "tools/net/**", "tools/gm/**", "tools/field/**", "tools/selfplay/commander.json", "worker/**", ".github/workflows/browser.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: "pip install --only-binary :all: playwright==1.63.0"
      - run: python3 -m playwright install --with-deps chromium
      - name: The campaign console round the loop
        run: python3 tools/campaign/loop.py 1
      - name: Two pages playing a fight online
        run: python3 tools/net/twopages.py
      - name: A player online on the campaign console
        run: python3 tools/net/console.py
      - name: Two commanders on the travel map, a side each
        run: python3 tools/net/commanders.py
      - name: "No GM, one commander hosting"
        run: python3 tools/net/nogm.py
      - name: Players joining by room codes (the room Worker's own code, run locally)
        run: python3 tools/net/rooms.py
      - name: The player's coach (joining by room code, his panels, proposing, his fight)
        run: python3 tools/net/playercoach.py
      - name: The GM's script against itself
        run: python3 tools/gm/selfplay.py
      - name: A side whose leader falls checks morale, once
        run: python3 tools/gm/leaderpage.py
      - name: The field page's End the battle and Beat history panel
        run: python3 tools/field/beat.py
      - name: The field page's Which account? box
        run: python3 tools/field/accounts.py
      - name: The field page's plans (the plan box, the strip, a step starting in the log)
        run: python3 tools/field/plans.py
      - name: The field page's Run on (march orders, where it stops)
        run: python3 tools/field/runon.py
      - name: The field page's side view (what each side sees, where it last saw the enemy)
        run: python3 tools/field/sideview.py
      - name: A force's state from the march, carried into a field battle
        run: python3 tools/field/worn.py
      - name: The commander's own choice of stance
        run: python3 tools/field/ownstance.py
      - name: The field map online (a player's page for a side, by hand and by room code)
        run: python3 tools/net/fieldtwo.py
      - name: A team through a fight on the roller (its force, its followers, a prisoner)
        run: python3 tools/campaign/team.py
      - name: The quick start, played by the coach's words
        run: python3 tools/campaign/quick.py
      - name: The working pages on a phone
        run: python3 tools/campaign/phone.py
      - name: The playtest packet's fight (team.html#playtest)
        run: python3 tools/campaign/playtest.py
      - name: "The king's baggage module's fight on the roller"
        run: python3 tools/campaign/baggage.py
      - name: "The escalade module's fight on the roller"
        run: python3 tools/campaign/escalade.py
      - name: Camp roles and the evening council on the campaign console
        run: python3 tools/campaign/council.py
      - name: The commander on the march, on the travel map and the console
        run: python3 tools/campaign/movedby.py
      - name: The armoury, each era's weapons and armour to print
        run: python3 tools/campaign/armoury.py
      - name: Making a man on paper, and its tables in the period books
        run: python3 tools/campaign/makeaman.py
      - name: The GM's coached first session (the start page's link to campaign.html#gmstart)
        run: python3 tools/campaign/gmstart.py
      - name: A hero's papers and his epilogue in the team builder
        run: python3 tools/campaign/papers.py
      - name: Presence and followers
        run: python3 tools/campaign/followers.py
      - name: Horses on the travel map (hungry horses, remounts at the depot)
        run: python3 tools/campaign/remount.py
      - name: Handing the game to the next GM (GM notes sealed, the old copy marked)
        run: python3 tools/campaign/handover.py
      - name: The players following a handover through their rooms
        run: python3 tools/net/handrooms.py
      - name: A season with the battalion, from the team builder to the roller
        run: python3 tools/service/season.py
      - name: Keep the pictures the tests take
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-pictures
          path: |
            tools/campaign/.cache/*.png
            tools/net/.cache/*.png
          if-no-files-found: ignore
