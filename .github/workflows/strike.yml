# The roller's strike, event log and scripted fighter (templates/strike.js, gamelog.js, fighter.js): thousands of strikes
# checked against gravewounds.engine.roll_hit on the same dice, then the unit tests
# (tools/strike/parity.py runs tools/strike/test.js), and the scripted fighter's choices (tools/gm/test.js). A few seconds; runs on pull requests and on
# main when the rules it checks change.
name: strike

on:
  pull_request:
    paths: ["templates/strike.js", "templates/gamelog.js", "templates/fighter.js", "templates/net.js", "templates/campaign.js", "gravewounds/**", "data/**", "build.py", "tools/strike/**", "tools/gm/**", "tools/net/**", "tools/campaign/**"]
  push:
    branches: [main]
    paths: ["templates/strike.js", "templates/gamelog.js", "templates/fighter.js", "templates/net.js", "templates/campaign.js", "gravewounds/**", "data/**", "build.py", "tools/strike/**", "tools/gm/**", "tools/net/**", "tools/campaign/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: "pip install --only-binary :all: PyYAML==6.0.3 Markdown==3.11 reportlab==5.0.1"
      - run: python3 tools/strike/parity.py 5000 1
      - run: node tools/gm/test.js
      - run: node tools/net/test.mjs
      - run: node tools/campaign/test.js
