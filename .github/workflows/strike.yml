# The roller's strike, event log and scripted fighter (templates/strike.js, gamelog.js, fighter.js): thousands of strikes
# checked against gravewounds.engine.roll_hit on the same dice, then the unit tests
# (tools/strike/parity.py runs tools/strike/test.js), and the scripted fighter's choices (tools/gm/test.js). Also the travel
# map's rules (templates/travelrules.js) against gravewounds/weather.py, travel.py and disease.py, and its day
# (templates/travelday.js) played with no page (tools/travel/parity.py runs tools/travel/test.js and day.js). A few seconds; runs on pull requests and on
# main when the rules it checks change.
name: strike

on:
  pull_request:
    paths: ["templates/strike.js", "templates/gamelog.js", "templates/fighter.js", "templates/net.js", "templates/campaign.js", "templates/travelrules.js", "templates/travelday.js", "templates/ranks.js", "templates/purse.js", "templates/xp.js", "templates/events.js", "templates/camp.js", "templates/measure.js", "templates/lethality.js", "gravewounds/**", "data/**", "build.py", "tools/strike/**", "tools/gm/**", "tools/net/**", "tools/campaign/**", "tools/travel/**", "worker/**", "templates/**", "tools/guide/**", ".github/workflows/strike.yml"]
  push:
    branches: [main]
    paths: ["templates/strike.js", "templates/gamelog.js", "templates/fighter.js", "templates/net.js", "templates/campaign.js", "templates/travelrules.js", "templates/travelday.js", "templates/ranks.js", "templates/purse.js", "templates/xp.js", "templates/events.js", "templates/camp.js", "templates/measure.js", "templates/lethality.js", "gravewounds/**", "data/**", "build.py", "tools/strike/**", "tools/gm/**", "tools/net/**", "tools/campaign/**", "tools/travel/**", "worker/**", "templates/**", "tools/guide/**", ".github/workflows/strike.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: "pip install --only-binary :all: PyYAML==6.0.3 Markdown==3.11 reportlab==5.0.1"
      - run: python3 tools/strike/parity.py 5000 1
      - run: node tools/gm/test.js
      - run: node tools/net/test.mjs
      - run: node tools/net/roomscheck.mjs
      - run: python3 tools/guide/check.py
      - run: node tools/campaign/test.js
      - run: python3 tools/travel/parity.py 300 1
